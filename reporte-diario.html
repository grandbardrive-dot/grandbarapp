<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrandBar Hub — Reporte diario</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  /* Reporte diario (18/11/2026): la planilla diaria de Administración dentro del portal.
     Solo supervisores (Mi equipo) y Fernando (dir-reporte.html la abre con ?embed=1).
     Dos tablas con todos los vendedores por equipo: unidades (vinos y spirits contra el
     objetivo, más sin alcohol, cervezas y café) y clientes con compra con las ventas en pesos.
     Los datos los arma la función reporte-diario. */
  :root{
    --navy:#0d2230; --navy-2:#123043; --cream:#f6f1e8; --card:#ffffff;
    --ink:#1b2a32; --muted:#6d7d85; --line:#e7ded0; --line-2:#ece4d6;
    --green:#2f6f5e; --green-d:#245647; --green-soft:#e8f1ea;
    --gold:#c0912f; --gold-d:#a97c22; --gold-soft:#f7efdc;
    --red:#b4532f; --red-soft:#fbe9e4;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
  .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
  .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
  .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
  .sb-nav{display:flex;flex-direction:column;gap:3px}
  .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
  .sb-nav a:hover{background:var(--navy-2);color:#fff}
  .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
  .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
  .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
  .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
  .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
  .main{flex:1;min-width:0}
  .botnav{display:none}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 90px}
  @media(max-width:820px){
    .sidebar{display:none}
    .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:8px 6px;justify-content:space-around;z-index:30}
    .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
    .botnav a.active{color:var(--gold)} .botnav svg{width:21px;height:21px}
  }
  /* Embebida en otro panel (?embed=1): sin menú propio. */
  .embed .sidebar,.embed .botnav{display:none!important}
  .embed .wrap{padding-bottom:24px}
  .embed .topbar h1{display:none}   /* el título ya lo pone el panel de afuera */

  .topbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px;padding-right:58px}   /* deja lugar a la campanita */
  .topbar h1{font-size:24px;margin:0;font-weight:900;letter-spacing:-.01em}
  .topbar .who{font-size:12.5px;color:var(--muted);margin-top:3px}
  .mes{min-width:240px;flex:0 1 320px}
  .mes .mt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px}
  .mes .mt b{color:var(--ink)}
  .mes .track{height:6px;border-radius:6px;background:#e6dccb;overflow:hidden}
  .mes .fill{height:100%;background:var(--navy);border-radius:6px}

  .leyenda{font-size:12px;color:var(--muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px 16px}
  .leyenda span{display:inline-flex;align-items:center;gap:6px}
  .leyenda i{width:9px;height:9px;border-radius:50%;display:inline-block}

  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;overflow:hidden}
  .card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px 18px 12px;border-bottom:1px solid var(--line-2)}
  .card-h h2{margin:0;font-size:16px;font-weight:800}
  .card-h .per{font-size:12px;color:var(--muted);font-weight:600}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
  #t1{min-width:900px} #t2{min-width:720px}
  th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
  th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbf8f1}
  thead tr.g th{font-size:11px;color:var(--ink);letter-spacing:.08em;border-bottom:1px solid var(--line);text-align:center}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;z-index:1;background:inherit}
  thead th:first-child{background:#fbf8f1;z-index:2}
  tbody tr{background:#fff}
  .ini{border-left:1px solid var(--line)}
  td .cod{color:var(--muted);font-size:11.5px;margin-right:8px}
  td.nom{min-width:210px;font-weight:500}
  td.av{font-weight:700}
  td.av.ok{color:var(--green-d)}
  td.av.bajo{color:var(--red)}
  td.vacio{color:#b3aa9b}
  tr.yo td{background:#fffaf0}
  tr.yo td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
  .vos{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;background:var(--gold);color:#241a06;border-radius:20px;padding:2px 7px;margin-left:8px;vertical-align:1px}
  tr.sub td{background:var(--cream);font-weight:800;border-bottom:1px solid var(--line)}
  tr.sub td:first-child{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
  tr.sub + tr td{border-top:6px solid #fff}
  tr.dist td{background:#ece3d2;font-weight:800;border-bottom:0}
  tr.dist td:first-child small{display:block;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none;margin-top:1px}
  tr.tot td{background:var(--navy);color:#fff;font-weight:800;border-bottom:0}
  tr.tot td.av.ok{color:#9fd9bf} tr.tot td.av.bajo{color:#f2b39b}
  tr.dist td:first-child,tr.tot td:first-child{text-transform:uppercase;font-size:11.5px;letter-spacing:.06em}

  .loading,.error{color:var(--muted);font-size:13.5px;text-align:center;padding:48px 16px}
  .error b{color:var(--ink)}
  /* En el celular, mobile.css le pone relleno a .card y margen a .card-h: acá la tabla va
     de borde a borde de la tarjeta, y la campanita pasa a la barra de arriba. */
  @media(max-width:900px){
    section.card{padding:0 !important}
    section.card .card-h{margin-bottom:0 !important}
    .topbar{padding-right:0}
  }
  @media(max-width:560px){
    .wrap{padding:16px 12px 90px}
    .topbar h1{font-size:21px}
    table{font-size:12.5px}
    th,td{padding:6px 8px}
    td.nom{min-width:150px;max-width:150px;overflow:hidden;text-overflow:ellipsis}
    td .cod{display:none}
  }
</style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">V</div><div><div class="t" id="uName">Vendedor</div><div class="s">Vendedor</div></div></div>
    </div>
  </aside>
  <div class="main">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Reporte diario</h1>
        <div class="who" id="who">Cargando…</div>
      </div>
      <div class="mes" id="mes" hidden>
        <div class="mt"><span id="mesTxt"></span><b id="mesPct"></b></div>
        <div class="track"><div class="fill" id="mesBar" style="width:0"></div></div>
      </div>
    </div>
    <div class="leyenda" id="leyenda" hidden></div>
    <div id="cont"><div class="loading">Armando el reporte…</div></div>
  </div>
  <nav class="botnav bottomnav"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js?v=3"></script>
<script>
  const HUB = { url:'https://xqhyemccbwmzxqzkrtwa.supabase.co', key:'sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc' };
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  if (/[?&]embed=1\b/.test(location.search)) document.documentElement.classList.add('embed');
  let hub, TOKEN = null;

  const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const n = v => v == null ? '—' : Math.round(v).toLocaleString('es-AR');
  const pesos = v => v == null ? '—' : '$ ' + Math.round(v).toLocaleString('es-AR');
  let RITMO = 100;   // % del mes que ya pasó: contra eso se pinta el avance

  // Columnas de cada tabla. `av` = avance (vendido contra objetivo), `ini` = arranca un grupo.
  const T1 = [
    { k:'vinos', ini:true }, { k:'obj_vinos' }, { av:['vinos','obj_vinos'] },
    { k:'spirits', ini:true }, { k:'obj_spirits' }, { av:['spirits','obj_spirits'] },
    { k:'sin_alcohol', ini:true }, { k:'cervezas' }, { k:'cafe' },
  ];
  const T2 = [
    { k:'activos', ini:true }, { k:'obj_ccc' }, { k:'ccc' }, { av:['ccc','obj_ccc'] },
    { k:'total', ini:true, pesos:true },
  ];
  const CAMPOS = ['vinos','obj_vinos','spirits','obj_spirits','sin_alcohol','cervezas','cafe','activos','obj_ccc','ccc','total'];

  // Suma de varias filas. Un objetivo o los activos quedan en blanco solo si faltan en todas.
  function sumar(filas){
    const s = {};
    CAMPOS.forEach(k => {
      const vals = filas.map(f => f[k]).filter(v => v != null);
      s[k] = vals.length ? vals.reduce((a, b) => a + b, 0) : null;
    });
    return s;
  }

  function celda(x, c){
    const cls = c.ini ? 'ini' : '';
    if (c.av) {
      const v = x[c.av[0]], o = x[c.av[1]];
      if (!o) return `<td class="av vacio ${cls}">—</td>`;
      const p = Math.round(v * 100 / o);
      const est = p >= RITMO ? 'ok' : (p < RITMO / 2 ? 'bajo' : '');
      return `<td class="av ${est} ${cls}">${p}%</td>`;
    }
    const v = x[c.k];
    if (v == null) return `<td class="vacio ${cls}">—</td>`;
    return `<td class="${cls}">${c.pesos ? pesos(v) : n(v)}</td>`;
  }

  function fila(x, cols, tipo, etiqueta, propio){
    const yo = tipo === '' && propio && x.codigo === propio;
    const nombre = tipo === ''
      ? `<td class="nom">${x.codigo ? `<span class="cod">${esc(x.codigo)}</span>` : ''}${esc(x.nombre)}${yo ? '<span class="vos">Vos</span>' : ''}</td>`
      : `<td class="nom">${etiqueta}</td>`;
    return `<tr class="${tipo}${yo ? ' yo' : ''}">${nombre}${cols.map(c => celda(x, c)).join('')}</tr>`;
  }

  function cuerpo(d, cols){
    const todas = [];
    let h = '';
    d.grupos.forEach(g => {
      g.filas.forEach(x => { h += fila(x, cols, '', '', d.codigo_propio); todas.push(x); });
      h += fila(sumar(g.filas), cols, 'sub', esc(g.nombre));
    });
    h += fila(sumar(todas.filter(x => x.distribucion)), cols, 'dist', 'Subtotal distribución<small>Equipos ON, OFF y San Luis, Mza Distribución y San Luis Distribución</small>');
    h += fila(sumar(todas), cols, 'tot', 'Total general');
    return h;
  }

  function render(d){
    const [a, m, dia] = d.hasta.split('-').map(Number);
    const diasMes = new Date(a, m, 0).getDate();
    RITMO = Math.round(dia * 100 / diasMes);
    $('who').textContent = `${MESES[m - 1][0].toUpperCase() + MESES[m - 1].slice(1)} ${a} · del 1 al ${dia} · datos de CUBO, se actualizan cada 20 minutos`;
    $('mesTxt').textContent = `Van ${dia} de ${diasMes} días del mes`;
    $('mesPct').textContent = RITMO + '%';
    $('mesBar').style.width = RITMO + '%';
    $('mes').hidden = false;
    $('leyenda').innerHTML = `<span><i style="background:var(--green-d)"></i>Avance al ritmo del mes o mejor (${RITMO}% o más)</span>`
      + `<span><i style="background:var(--red)"></i>Menos de la mitad del ritmo (menos de ${Math.round(RITMO / 2)}%)</span>`;
    $('leyenda').hidden = false;

    $('cont').innerHTML = `
      <section class="card">
        <div class="card-h"><h2>Avance de ventas en unidades</h2><span class="per">Mes en curso</span></div>
        <div class="scroll"><table id="t1">
          <thead>
            <tr class="g"><th></th><th colspan="3" class="ini">Vinos</th><th colspan="3" class="ini">Spirits</th><th colspan="3" class="ini">Seguimiento</th></tr>
            <tr><th>Vendedor</th>
              <th class="ini">Vendidas</th><th>Objetivo</th><th>Avance</th>
              <th class="ini">Vendidas</th><th>Objetivo</th><th>Avance</th>
              <th class="ini">Sin alcohol</th><th>Cervezas</th><th>Café</th></tr>
          </thead>
          <tbody>${cuerpo(d, T1)}</tbody>
        </table></div>
      </section>
      <section class="card">
        <div class="card-h"><h2>Clientes con compra (CCC)</h2><span class="per">Mes en curso</span></div>
        <div class="scroll"><table id="t2">
          <thead>
            <tr class="g"><th></th><th colspan="4" class="ini">Clientes</th><th class="ini">Ventas</th></tr>
            <tr><th>Vendedor</th>
              <th class="ini">Activos</th><th>Objetivo</th><th>Con compra</th><th>Avance</th>
              <th class="ini">En pesos</th></tr>
          </thead>
          <tbody>${cuerpo(d, T2)}</tbody>
        </table></div>
      </section>`;
    if ((d.avisos || []).length) console.warn('reporte-diario:', d.avisos);
  }

  async function cargar(){
    try{
      const r = await fetch('/.netlify/functions/reporte-diario', { headers:{ Authorization:'Bearer ' + TOKEN } });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || ('Error ' + r.status));
      if (!d.grupos || !d.grupos.length) { $('cont').innerHTML = '<div class="error">Todavía no hay vendedores cargados en la planilla de presupuesto.</div>'; $('who').textContent = ''; return; }
      render(d);
    }catch(e){
      $('who').textContent = '';
      $('cont').innerHTML = '<div class="error"><b>No se pudo armar el reporte.</b><br>' + esc(e.message || e) + '</div>';
    }
  }

  (async () => {
    hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }
    TOKEN = session.access_token;
    try{
      const { data:u } = await hub.from('usuarios').select('nombre,rol,es_supervisor').eq('id', session.user.id).maybeSingle();
      if (u && u.nombre && !document.documentElement.classList.contains('embed')) { $('uName').textContent = u.nombre; $('avSb').textContent = (u.nombre.trim()[0] || 'V').toUpperCase(); }
      // Vendedor o tienda: su menú (hub-nav). No se carga para Dirección: hub-nav la manda a su panel.
      const rolU = String((u && u.rol) || '').toLowerCase();
      if ((rolU === 'ventas' || rolU === 'mayorista') && !(u && u.es_supervisor)) {
        const sc = document.createElement('script'); sc.src = 'assets/hub-nav.js?v=9'; document.body.appendChild(sc);
      }
    }catch(e){}
    const lo = $('logout'); if (lo) lo.onclick = async () => { if (confirm('¿Cerrar sesión?')) { try{ await hub.auth.signOut(); }catch(e){} location.href = 'index.html'; } };
    cargar();
  })();
</script>
<script>
  // Adentro del panel de Fernando (?embed=1) la campanita, el menú del usuario y la barra del
  // celular los pone el panel de afuera: acá no se cargan.
  if (!document.documentElement.classList.contains('embed')) {
    ['assets/notif.js?v=6', 'assets/user-menu.js?v=1', 'assets/mobile-nav.js?v=1', '/assets/cuenta-activa.js?v=1'].forEach(function (s) {
      var e = document.createElement('script'); e.src = s; e.async = false; document.body.appendChild(e);
    });
  }
</script>
</body>
</html>
