<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#0d2230">
<title>GrandBar — Stock del depósito</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Administración del stock del depósito (26/10/2026): lo que era admin.html de la app aparte
     grandbar-stock, con el estilo del Portal. Stock de Córdoba (se trae solo cada hora;
     "Sincronizar ahora" o subir el Listado de Stock Básico), la agenda de los lunes (Laura
     asigna proveedores), proveedores excluidos y los conteos que mandan Lucas Porro y Lucas
     Buenanueva (con su Excel; sin mail desde el 26/10, les llega el aviso al Portal). Lo maneja Laura, la encargada del stock (dentro del panel del
     equipo de administración); Brenda lo ve en el suyo (?embed=1) y Diseño y Desarrollo lo
     abren suelto. Datos: función stock. -->
<script>if(/[?&]embed=1(&|$)/.test(location.search))document.documentElement.classList.add('gb-embed');</script>
<link rel="stylesheet" href="assets/kaf.css?v=1">
<link rel="stylesheet" href="assets/stock.css?v=1">
<style>
  .gb-embed .sidebar{display:none}
  .gb-embed .content{padding-top:18px}
</style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Stock del depósito</div>
    <nav class="sb-nav" id="sb-nav">
      <a href="#stock" data-v="stock"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg> Stock del sistema</a>
      <a href="#agenda" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Agenda de los lunes</a>
      <a href="#proveedores" data-v="proveedores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg> Proveedores</a>
      <a href="#conteos" data-v="conteos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg> Conteos recibidos</a>
    </nav>
    <div class="sb-cat">Más</div>
    <nav class="sb-nav">
      <a href="deposito.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Panel del depósito</a>
      <a href="hub.html" id="sb-volver"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Volver a mi panel</a>
    </nav>
    <div class="sb-foot"><div class="sb-user"><div class="av" id="av">A</div><div><div class="t" id="uName">Administración</div><div class="s">Stock del depósito</div></div></div></div>
  </aside>
  <div class="main"><div class="content" id="contenido"><div class="vacio">Cargando…</div></div></div>
</div>
<div class="ov" id="ov"><div class="modal"><button class="cerrar" type="button" aria-label="Cerrar" onclick="cerrarModal()">×</button><div id="ov-c"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="assets/stock-productos.js?v=1"></script>
<script src="assets/stock-comun.js?v=1"></script>
<script>
  const { $, esc, num, SECTOR_LBL, SECTOR_ICO, hoy, isoLocal, fecha, fechaHora, toast, get, post } = STOCK;
  const EMBED = document.documentElement.classList.contains('gb-embed');
  // Embebido en otro panel: sin menú lateral (y sin la barra del celular, que arma mobile-nav con él).
  if (EMBED) document.querySelector('.sidebar').remove();
  let YO = null, VISTA = '', SECTOR = 'vinos', AG = null;
  const vacio = m => `<div class="vacio">${m}</div>`;
  function modal(html) { $('ov-c').innerHTML = html; $('ov').classList.add('open'); }
  function cerrarModal() { $('ov').classList.remove('open'); }
  $('ov').addEventListener('click', e => { if (e.target.id === 'ov') cerrarModal(); });
  const VISTAS = [['stock', 'Stock del sistema'], ['agenda', 'Agenda de los lunes'], ['proveedores', 'Proveedores'], ['conteos', 'Conteos recibidos']];
  // Embebido no hay menú lateral: las secciones van como pestañas arriba.
  const cabeza = (t, p) => (EMBED ? `<div class="tabs" style="margin-bottom:16px">${VISTAS.map(([k, n]) => `<button type="button" class="${k === VISTA ? 'on' : ''}" onclick="location.hash='#${k}'">${n}</button>`).join('')}</div>` : '')
    + `<div class="head"><div><h1>${esc(t)}</h1>${p ? `<p>${p}</p>` : ''}</div></div>`;
  const tabsSector = fn => `<div class="tabs" style="margin-bottom:14px">${['vinos', 'spirits'].map(s => `<button type="button" class="${s === SECTOR ? 'on' : ''}" onclick="SECTOR='${s}';${fn}()">${SECTOR_ICO[s]} ${SECTOR_LBL[s]}</button>`).join('')}</div>`;

  async function ir() {
    VISTA = (location.hash || '#stock').slice(1);
    if (!VISTAS.some(v => v[0] === VISTA)) VISTA = 'stock';
    document.querySelectorAll('#sb-nav a').forEach(a => a.classList.toggle('active', a.dataset.v === VISTA));
    const C = $('contenido');
    try {
      if (VISTA === 'agenda') return await verAgenda();
      if (VISTA === 'proveedores') return await verProveedores();
      if (VISTA === 'conteos') return await verConteos();
      return await verStock();
    } catch (e) { C.innerHTML = cabeza('Stock del depósito', '') + vacio(esc(e.message)); }
  }
  window.addEventListener('hashchange', ir);
  const excluidosDe = s => new Set(((AG && AG.excluidos) || []).filter(x => x.sector === s).map(x => x.proveedor));

  // ── Stock del sistema ──────────────────────────────────────────────────────
  async function verStock() {
    const C = $('contenido');
    C.innerHTML = cabeza('Stock del sistema', 'El stock de Córdoba Software contra el que se comparan los conteos. Se trae solo cada hora, de 8 a 20 hs, de lunes a sábado.') + vacio('Cargando…');
    const e = await get('estado');
    const horas = e.actualizado ? (Date.now() - new Date(e.actualizado).getTime()) / 36e5 : null;
    const dot = horas == null ? 'mal' : horas <= 3 ? 'ok' : horas <= 48 ? 'viejo' : 'mal';
    const ult = (e.corridas || [])[0];
    C.innerHTML = cabeza('Stock del sistema', 'El stock de Córdoba Software contra el que se comparan los conteos. Se trae solo cada hora, de 8 a 20 hs, de lunes a sábado.') +
      `<div class="kpis">
        <div class="kpi"><div class="k">Última actualización</div><div class="v" style="font-size:20px"><span class="estado-dot ${dot}"></span>${e.actualizado ? esc(fechaHora(e.actualizado)) : 'Nunca'}</div><div class="s">${horas == null ? 'Todavía no se cargó el stock' : horas < 1 ? 'Hace menos de una hora' : 'Hace ' + Math.round(horas) + ' h'}</div></div>
        <div class="kpi"><div class="k">Productos</div><div class="v">${num(e.filas)}</div><div class="s">${num(e.conStock)} con stock</div></div>
        <div class="kpi"><div class="k">Última sincronización</div><div class="v" style="font-size:20px">${ult ? esc(fechaHora(ult.inicio)) : '—'}</div><div class="s">${ult ? (ult.ok ? '<span class="chip verde">Anduvo bien</span>' : '<span class="chip rojo">Falló</span> ' + esc(String(ult.detalle || '').slice(0, 120))) : 'Todavía no corrió en el Portal'}</div></div>
      </div>
      <div style="margin:16px 0 6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn gold" id="st-sync" type="button">Sincronizar ahora</button><span class="cuenta" id="st-msg" style="margin:0"></span></div>
      <h2>O subir el Listado de Stock Básico <small>si Córdoba no responde</small></h2>
      <div class="ayuda">El Excel que se exporta de Córdoba Software: código del artículo en la columna A y unidades en la C (desde la fila 5). Se actualizan solo los productos que conoce el depósito.</div>
      <label class="subir" id="st-zona"><input type="file" id="st-file" accept=".xlsx,.xls"><b>Elegir o arrastrar el archivo</b><br><span id="st-nom">Listado de Stock Básico (.xlsx)</span></label>
      <div id="st-res"></div>` +
      ((e.corridas || []).length > 1 ? `<h2>Últimas sincronizaciones</h2>` + e.corridas.map(c => `<div class="fila"><div class="cuerpo"><div class="tit">${esc(fechaHora(c.inicio))}</div>${c.detalle ? `<div class="sub">${esc(String(c.detalle).slice(0, 200))}</div>` : ''}</div><div class="der">${c.ok ? '<span class="chip verde">Bien</span>' : '<span class="chip rojo">Falló</span>'}</div></div>`).join('') : '');
    $('st-sync').onclick = sincronizar;
    const zona = $('st-zona');
    zona.addEventListener('dragover', ev => { ev.preventDefault(); zona.classList.add('encima'); });
    ['dragleave', 'dragend'].forEach(t => zona.addEventListener(t, () => zona.classList.remove('encima')));
    zona.addEventListener('drop', ev => { ev.preventDefault(); zona.classList.remove('encima'); const f = ev.dataTransfer && ev.dataTransfer.files[0]; if (f) subirExcel(f); });
    $('st-file').onchange = () => { const f = $('st-file').files[0]; if (f) subirExcel(f); $('st-file').value = ''; };
  }
  async function sincronizar() {
    const b = $('st-sync'); b.disabled = true; $('st-msg').textContent = 'Conectando con Córdoba…';
    const antes = Date.now();
    try { await post({ accion: 'sincronizar' }); }
    catch (e) { b.disabled = false; $('st-msg').textContent = ''; return toast(e.message, true); }
    // Tarda unos 30 segundos: se espera la corrida nueva.
    for (let i = 0; i < 24; i++) {
      await new Promise(r => setTimeout(r, 5000));
      if (!$('st-msg')) return;
      $('st-msg').textContent = 'Trayendo el stock… (' + ((i + 1) * 5) + ' s)';
      try {
        const e = await get('estado'), c = (e.corridas || [])[0];
        if (c && new Date(c.inicio).getTime() >= antes - 5000 && c.fin) { toast(c.ok ? 'Stock actualizado' : 'La sincronización falló', !c.ok); return verStock(); }
      } catch (e) {}
    }
    b.disabled = false; $('st-msg').textContent = 'Sigue trabajando en segundo plano: volvé a mirar en un rato.';
  }
  function subirExcel(file) {
    $('st-nom').textContent = file.name;
    $('st-res').innerHTML = vacio('Leyendo el archivo…');
    const conocidos = {};
    PRODUCTOS_VINOS.forEach(p => { conocidos[p.sku] = 'vinos'; });
    PRODUCTOS_SPIRITS.forEach(p => { conocidos[p.sku] = 'spirits'; });
    const rd = new FileReader();
    rd.onload = async ev => {
      try {
        const wb = XLSX.read(ev.target.result, { type: 'array' });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
        // Los datos empiezan donde la columna A trae un código (las primeras filas son títulos).
        let ini = 4;
        for (let i = 0; i < Math.min(10, rows.length); i++) { if (String(rows[i][0]).replace(/\D/g, '').length >= 7) { ini = i; break; } }
        const filas = [], noEnc = []; let validas = 0, v = 0, s = 0;
        rows.slice(ini).forEach(r => {
          const d = String(r[0]).trim().replace(/\D/g, ''), sku = d.length === 6 ? d + '00' : d.padStart(8, '0');
          if (!/^\d{8}$/.test(sku)) return;
          validas++;
          const stock = Math.round(parseFloat(String(r[2]).replace(',', '.')) || 0);
          if (conocidos[sku]) { filas.push({ sku, stock }); conocidos[sku] === 'vinos' ? v++ : s++; } else noEnc.push(sku);
        });
        if (!filas.length) { $('st-res').innerHTML = `<div class="aviso rojo">El archivo no trae productos del depósito. ¿Es el Listado de Stock Básico?</div>`; return; }
        $('st-res').innerHTML = vacio('Guardando ' + num(filas.length) + ' productos…');
        const r = await post({ accion: 'subir-stock', filas });
        $('st-res').innerHTML = `<div class="kpis" style="margin-top:12px">
            <div class="kpi"><div class="k">Actualizados</div><div class="v">${num(r.guardados)}</div><div class="s">${num(v)} vinos · ${num(s)} spirits</div></div>
            <div class="kpi"><div class="k">Filas del archivo</div><div class="v">${num(validas)}</div></div>
            <div class="kpi"><div class="k">No encontrados</div><div class="v">${num(noEnc.length)}</div><div class="s">SKUs que no están en el catálogo del depósito</div></div></div>
          ${noEnc.length ? `<details style="margin-top:8px"><summary class="lnk">Ver los SKUs no encontrados</summary><div class="ayuda" style="margin-top:8px;font-family:ui-monospace,monospace;font-size:12px">${esc(noEnc.join('  ·  '))}</div></details>` : ''}`;
        toast('Stock actualizado: ' + num(r.guardados) + ' productos');
      } catch (e) { $('st-res').innerHTML = `<div class="aviso rojo">${esc('No se pudo: ' + e.message)}</div>`; }
    };
    rd.onerror = () => { $('st-res').innerHTML = `<div class="aviso rojo">No se pudo leer el archivo.</div>`; };
    rd.readAsArrayBuffer(file);
  }

  // ── Agenda de los lunes (calendario) ───────────────────────────────────────
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function lunesRango() {
    const out = [], d = new Date(); d.setDate(d.getDate() - 90); d.setHours(12, 0, 0, 0);
    const fin = new Date(); fin.setDate(fin.getDate() + 90);
    while (d.getDay() !== 1) d.setDate(d.getDate() + 1);
    while (d <= fin) { out.push(new Date(d)); d.setDate(d.getDate() + 7); }
    return out;
  }
  // Los proveedores que entran en la agenda: sin los excluidos ni las bodegas inactivas.
  const provsAgenda = s => STOCK.proveedores(s, new Set([...excluidosDe(s)].concat(s === 'vinos' ? [...STOCK.INACTIVAS_VINOS] : [])));
  async function verAgenda() {
    const C = $('contenido');
    const t = 'Agenda de los lunes', p = 'Qué proveedor se cuenta cada lunes. Tocá <b>+</b> para asignar uno a un día (si ya estaba en otro, se mueve) y tocá un proveedor para sacarlo. En verde, los que los chicos marcaron como hechos.';
    if (!AG) { C.innerHTML = cabeza(t, p) + vacio('Cargando…'); AG = await get('agenda'); }
    const hoyS = hoy(), porFecha = {};
    AG.registro.filter(r => r.sector === SECTOR).forEach(r => { (porFecha[r.fecha] = porFecha[r.fecha] || []).push(r); });
    let mes = -1, h = '';
    lunesRango().forEach(d => {
      const f = isoLocal(d);
      if (d.getMonth() !== mes) { mes = d.getMonth(); h += `<div class="cal-mes">${MESES[mes]} ${d.getFullYear()}</div>`; }
      const regs = porFecha[f] || [];
      h += `<div class="cal-fila ${f === hoyS ? 'hoy' : ''} ${f < hoyS ? 'pasado' : ''}"><div class="cal-d">Lun ${d.getDate()} ${MES3[d.getMonth()]}</div>
        <div class="cal-chips">${regs.length ? regs.map(r => `<span class="chip ${r.done ? 'verde' : 'oro'}" data-quitar="${esc(r.proveedor)}" title="Sacar">${esc(r.proveedor)}</span>`).join('') : '<span class="ninguno">Sin proveedores</span>'}</div>
        <button class="btn claro chico" type="button" data-dia="${f}" aria-label="Asignar proveedor">+</button></div>`;
    });
    C.innerHTML = cabeza(t, p) + tabsSector('verAgenda') + h;
    C.querySelectorAll('[data-dia]').forEach(b => b.onclick = () => elegirProveedor(b.dataset.dia));
    C.querySelectorAll('[data-quitar]').forEach(c => c.onclick = () => quitar(c.dataset.quitar));
  }
  async function quitar(prov) {
    if (!confirm('¿Sacar «' + prov + '» de la agenda de ' + SECTOR_LBL[SECTOR] + '?')) return;
    try { await post({ accion: 'agenda-quitar', sector: SECTOR, proveedor: prov }); AG = await get('agenda'); verAgenda(); toast('Sacado de la agenda'); }
    catch (e) { toast(e.message, true); }
  }
  function elegirProveedor(dia) {
    const d = new Date(dia + 'T12:00:00');
    modal(`<div class="mh"><h3>${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]} — lunes ${d.getDate()} de ${MESES[d.getMonth()].toLowerCase()}</h3><div class="sub">Elegí el proveedor que se cuenta ese día.</div></div>
      <div class="mb"><div class="barra"><input type="search" id="mp-q" placeholder="Buscar proveedor…" autocomplete="off"></div><div id="mp-l"></div></div>`);
    const pinta = () => {
      const q = ($('mp-q').value || '').toLowerCase(), regs = AG.registro.filter(r => r.sector === SECTOR);
      const enDia = new Set(regs.filter(r => r.fecha === dia).map(r => r.proveedor)), otro = {};
      regs.filter(r => r.fecha !== dia).forEach(r => { otro[r.proveedor] = r; });
      const l = provsAgenda(SECTOR).filter(p => !q || p.nombre.toLowerCase().includes(q));
      const grupo = (titulo, items, etiqueta) => items.length ? `<div class="sel-grupo">${titulo}</div>` + items.map(p => `<button type="button" class="sel-item ${enDia.has(p.nombre) ? 'on' : ''}" data-p="${esc(p.nombre)}" style="margin-bottom:6px"><span class="nm">${esc(p.nombre)}</span><span class="ct">${etiqueta(p)}</span></button>`).join('') : '';
      $('mp-l').innerHTML = grupo('En este día — tocá para sacarlo', l.filter(p => enDia.has(p.nombre)), p => p.cant + ' ítems')
        + grupo('Sin asignar — tocá para agregarlo', l.filter(p => !enDia.has(p.nombre) && !otro[p.nombre]), p => p.cant + ' ítems')
        + grupo('En otro lunes — tocá para moverlo acá', l.filter(p => !enDia.has(p.nombre) && otro[p.nombre]), p => (otro[p.nombre].done ? 'hecho el ' : 'el ') + fecha(otro[p.nombre].fecha))
        || vacio('Sin resultados.');
    };
    $('mp-q').oninput = pinta;
    $('mp-l').onclick = async e => {
      const b = e.target.closest('[data-p]'); if (!b) return;
      const prov = b.dataset.p, esta = AG.registro.some(r => r.sector === SECTOR && r.fecha === dia && r.proveedor === prov);
      b.disabled = true;
      try {
        await post(esta ? { accion: 'agenda-quitar', sector: SECTOR, proveedor: prov } : { accion: 'agenda-asignar', sector: SECTOR, proveedor: prov, fecha: dia });
        AG = await get('agenda'); pinta(); verAgenda(); toast(esta ? 'Sacado del día' : 'Asignado');
      } catch (err) { toast(err.message, true); b.disabled = false; }
    };
    pinta(); setTimeout(() => $('mp-q') && $('mp-q').focus(), 50);
  }

  // ── Proveedores excluidos ──────────────────────────────────────────────────
  async function verProveedores() {
    const C = $('contenido');
    const t = 'Proveedores', p = 'Los <b>excluidos</b> no salen en la agenda de los lunes ni para contar. Las bodegas inactivas no entran en la agenda pero se pueden contar.';
    if (!AG) { C.innerHTML = cabeza(t, p) + vacio('Cargando…'); AG = await get('agenda'); }
    const exc = excluidosDe(SECTOR), todos = STOCK.proveedores(SECTOR, null);
    C.innerHTML = cabeza(t, p) + tabsSector('verProveedores') +
      `<div class="barra"><input type="search" id="pr-q" placeholder="Buscar proveedor…" autocomplete="off"></div>
      <div class="cuenta" id="pr-n"></div><div id="pr-l"></div>`;
    const pinta = () => {
      const q = ($('pr-q').value || '').toLowerCase();
      $('pr-n').textContent = todos.length + ' proveedores · ' + todos.filter(x => exc.has(x.nombre)).length + ' excluidos';
      $('pr-l').innerHTML = todos.filter(x => !q || x.nombre.toLowerCase().includes(q)).map(x => {
        const fuera = exc.has(x.nombre), inactiva = SECTOR === 'vinos' && STOCK.INACTIVAS_VINOS.has(x.nombre);
        return `<div class="prov-fila ${fuera ? 'fuera' : ''}"><span class="nm">${esc(x.nombre)}${inactiva ? ' <span class="chip gris">Inactiva</span>' : ''}</span><span class="ct">${x.cant} ítems</span>
          <button type="button" class="btn chico ${fuera ? 'rojo' : 'claro'}" data-x="${esc(x.nombre)}">${fuera ? 'Excluido' : 'Activo'}</button></div>`;
      }).join('') || vacio('Sin resultados.');
    };
    $('pr-q').oninput = pinta;
    $('pr-l').onclick = async e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      const prov = b.dataset.x, fuera = exc.has(prov);
      b.disabled = true;
      try { await post({ accion: 'excluir', sector: SECTOR, proveedor: prov, excluido: !fuera }); fuera ? exc.delete(prov) : exc.add(prov); AG = await get('agenda'); pinta(); toast(prov + (fuera ? ' — activo' : ' — excluido')); }
      catch (err) { toast(err.message, true); b.disabled = false; }
    };
    pinta();
  }

  // ── Conteos recibidos ──────────────────────────────────────────────────────
  let FILTRO = '';
  async function verConteos() {
    const C = $('contenido');
    const t = 'Conteos recibidos', p = 'Lo que mandan Lucas Porro (vinos) y Lucas Buenanueva (spirits). Cada conteo trae su Excel con la diferencia contra el stock del sistema.';
    C.innerHTML = cabeza(t, p) + vacio('Cargando…');
    const d = await get('conteos', FILTRO ? { sector: FILTRO } : {});
    const l = d.conteos || [];
    C.innerHTML = cabeza(t, p) +
      `<div class="tabs" style="margin-bottom:14px">${[['', 'Todos'], ['vinos', '🍷 Vinos'], ['spirits', '🥃 Spirits']].map(([k, n]) => `<button type="button" class="${k === FILTRO ? 'on' : ''}" onclick="FILTRO='${k}';verConteos()">${n}</button>`).join('')}</div>` +
      (l.length ? l.map(c => `<div class="fila"><div class="cuerpo"><div class="tit">${SECTOR_ICO[c.sector]} ${esc(fecha(c.fecha))} · ${esc(c.usuario_nombre || '')}</div>
          <div class="sub">${c.contados} de ${c.productos} productos contados · ${num(c.unidades)} unidades<br>${esc((c.proveedores || []).slice(0, 5).join(' · '))}${(c.proveedores || []).length > 5 ? ' y ' + (c.proveedores.length - 5) + ' más' : ''}</div>
          <div class="chips"><span class="chip gris">Llegó ${esc(fechaHora(c.created_at))}</span></div></div>
          <div class="der" style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn claro chico" type="button" onclick="verConteo(${c.id})">Ver</button><button class="btn navy chico" type="button" onclick="bajar(${c.id}, this)">Excel</button></div></div>`).join('')
        : vacio('Todavía no llegó ningún conteo.'));
  }
  async function bajar(id, btn) { btn.disabled = true; try { STOCK.excelDeConteo((await get('conteo', { id })).conteo); } catch (e) { toast(e.message, true); } btn.disabled = false; }
  async function verConteo(id) {
    modal(`<div class="mh"><h3>Conteo</h3></div><div class="mb">${vacio('Cargando…')}</div>`);
    let c; try { c = (await get('conteo', { id })).conteo; } catch (e) { return modal(`<div class="mh"><h3>Conteo</h3></div><div class="mb">${vacio(esc(e.message))}</div>`); }
    const items = c.items || [], dif = p => p.total - (p.stock_sistema + p.promo);
    const contados = items.filter(p => p.total > 0 || p.obs), conDif = contados.filter(p => dif(p) !== 0);
    const fila = p => `<tr><td style="font-family:ui-monospace,monospace;font-size:11.5px;color:var(--muted)">${esc(p.sku)}</td><td>${esc(p.articulo)}${p.obs ? `<br><em style="color:var(--muted)">${esc(p.obs)}</em>` : ''}</td><td class="n">${p.stock_sistema + p.promo}</td><td class="n">${p.total}</td><td class="n" style="font-weight:800;color:${dif(p) < 0 ? 'var(--danger)' : dif(p) > 0 ? 'var(--green)' : 'var(--muted)'}">${dif(p) > 0 ? '+' : ''}${dif(p)}</td></tr>`;
    const obs = Object.entries(c.prov_obs || {});
    modal(`<div class="mh"><h3>${SECTOR_ICO[c.sector]} ${SECTOR_LBL[c.sector]} — ${esc(fecha(c.fecha))}</h3><div class="sub">${esc(c.usuario_nombre || '')} · ${c.contados} de ${c.productos} contados · ${num(c.unidades)} unidades</div></div>
      <div class="mb">
        ${obs.length ? `<div class="bloque" style="margin-top:0"><h4>Observaciones por proveedor</h4>${obs.map(([k, v]) => `<div style="font-size:13.5px;margin-bottom:6px"><b>${esc(k)}:</b> ${esc(v)}</div>`).join('')}</div>` : ''}
        <h2 style="margin-top:14px">Con diferencia <small>${conDif.length} de ${contados.length} contados</small></h2>
        ${conDif.length ? `<div class="tabla-wrap"><table class="tabla"><thead><tr><th>SKU</th><th>Producto</th><th class="n">Sistema</th><th class="n">Contado</th><th class="n">Dif.</th></tr></thead><tbody>${conDif.map(fila).join('')}</tbody></table></div>` : vacio('Todo lo contado coincide con el sistema.')}
        <div class="acts"><button class="btn navy" type="button" onclick="STOCK.excelDeConteo(window._conteo)">Descargar el Excel completo</button></div>
      </div>`);
    window._conteo = c;
  }

  (async () => {
    const { data: { session } } = await STOCK.supa().auth.getSession();
    if (!session) { location.replace('index.html'); return; }
    try { YO = await get('yo'); } catch (e) { $('contenido').innerHTML = vacio(esc(e.message)); return; }
    if (!YO.esAdmin) { location.replace('deposito.html'); return; }
    // Embebido (panel de Laura o de Brenda) no hay menú lateral: esos datos van solo si está.
    if (!EMBED) {
      $('uName').textContent = YO.nombre;
      $('av').textContent = String(YO.nombre || 'A').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
      const VOLVER = { equipo_admin: 'equipo-panel.html#stock', administracion: 'panel-cobranzas.html#stock' };
      $('sb-volver').href = VOLVER[YO.rol] || 'hub.html';
    }
    ir();
  })();
</script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
