<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Pedidos a validar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Pedidos de los boliches a las marcas partner (manual de discos → Acuerdos
       con partners). Los carga el vendedor en la visita; acá el supervisor los
       aprueba o rechaza. Después solo quedan registrados (partner_pedidos, en el
       proyecto del manual). Cada supervisor ve solo los de su equipo. -->
  <style>
    :root{
      --navy:#0d2230; --navy-2:#123043; --cream:#f6f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#6d7d85; --line:#e7ded0; --line-2:#ece4d6;
      --green:#2f6f5e; --green-d:#245647; --green-soft:#e8f1ea;
      --gold:#c0912f; --gold-d:#a97c22; --gold-soft:#f7efdc;
      --danger:#c0603e; --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
    .sb-nav a:hover{background:var(--navy-2);color:#fff}
    .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
    .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
    .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
    .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
    .main{flex:1;min-width:0}
    .content{padding:24px 30px 90px;max-width:1240px;width:100%;margin:0 auto}
    .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px}
    .head h1{font-size:26px;margin:0 0 3px;font-weight:800}
    .head p{margin:0;color:var(--muted);font-size:14px}
    .badge{background:var(--navy);color:#fff;font-size:12px;font-weight:600;padding:7px 13px;border-radius:9px;white-space:nowrap}

    .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
    .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
    .kpi .l{font-size:12px;color:var(--muted)}
    .kpi .v{font-size:25px;font-weight:800;line-height:1.05;margin-top:4px}
    .kpi.gold .v{color:var(--gold-d)} .kpi.green .v{color:var(--green-d)} .kpi.red .v{color:var(--danger)}

    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .tab{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
    .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}

    .plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px;align-items:start}
    .pcard{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
    .pc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .pc-marca{font-weight:800;font-size:16px}
    .pc-cli{font-size:13px;color:var(--muted);margin-top:2px}
    .est{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;white-space:nowrap}
    .est.pendiente{background:var(--gold-soft);color:var(--gold-d)}
    .est.aprobado{background:var(--green-soft);color:var(--green-d)}
    .est.rechazado{background:#fdeae2;color:var(--danger)}
    .pc-nec{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.45}
    .pc-nec small{display:block;font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
    .pc-datos{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .pc-d{font-size:11.5px;color:var(--muted)} .pc-d b{display:block;color:var(--ink);font-size:13.5px;font-weight:700;margin-top:1px}
    .pc-meta{font-size:12px;color:var(--muted)}
    .pc-rev{font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:9px;line-height:1.45}
    .pc-btns{display:flex;gap:8px}
    .btn{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-weight:700;font-size:13.5px;cursor:pointer}
    .btn.ok{background:var(--green);color:#fff}
    .btn.no{background:#fff;border:1.5px solid #e5c1b3;color:var(--danger)}
    .btn:disabled{opacity:.5;cursor:default}

    .loading,.empty{text-align:center;color:var(--muted);padding:40px 20px;grid-column:1/-1}

    .botnav{display:none}
    @media(max-width:820px){
      .sidebar{display:none} .content{padding:18px 15px 80px}
      .kpis{gap:10px} .kpi{padding:12px 13px} .kpi .v{font-size:21px}
      .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:8px 6px;justify-content:space-around;z-index:30}
      .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
      .botnav a.active{color:var(--gold)} .botnav svg{width:21px;height:21px}
    }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">S</div><div><div class="t" id="uName">Supervisor</div><div class="s">Supervisor</div></div></div>
    </div>
  </aside>

  <div class="main">
    <div class="content">
      <div class="head">
        <div><h1>Pedidos a validar 📨</h1><p id="sub">Cargando pedidos…</p></div>
        <div class="badge" id="badge"></div>
      </div>

      <div class="kpis">
        <div class="kpi gold"><div class="l">Pendientes</div><div class="v" id="kPend">—</div></div>
        <div class="kpi green"><div class="l">Aprobados</div><div class="v" id="kOk">—</div></div>
        <div class="kpi red"><div class="l">Rechazados</div><div class="v" id="kNo">—</div></div>
      </div>

      <div class="tabs" id="tabs"></div>
      <div class="plist" id="plist"><div class="loading">Cargando…</div></div>
    </div>
  </div>
</div>

<nav class="botnav">
  <a href="supervisor-equipo.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Equipo</a>
  <a href="supervisor-tareas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>Tareas</a>
  <a href="supervisor-visitas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Visitas</a>
  <a href="supervisor-pedidos.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 14l2 2 4-4"/></svg>Pedidos</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js"></script>
<script>
  const HUB    = { url:"https://xqhyemccbwmzxqzkrtwa.supabase.co", key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc" };
  const MANUAL = { url:"https://fzaxwuuodseyyinveknn.supabase.co", key:"sb_publishable_gvclIOm9A3vCXEDT38O0Ng_HuOGH-Rk" };
  let hub, man, TOKEN=null, NOMBRE_SUP='', PEDIDOS=[], FILTRO='pendiente';

  const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ini = n => (String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'?').toUpperCase();
  const pesos = n => (n==null||n==='') ? '—' : '$'+Number(n).toLocaleString('es-AR');
  const cuando = f => { try{ const d=new Date(f); return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } };
  const ESTADOS = { pendiente:'Pendiente', aprobado:'Aprobado', rechazado:'Rechazado' };

  function render(){
    const n = e => PEDIDOS.filter(p=>p.estado===e).length;
    document.getElementById('kPend').textContent = n('pendiente');
    document.getElementById('kOk').textContent   = n('aprobado');
    document.getElementById('kNo').textContent   = n('rechazado');
    const TABS = [['pendiente','Pendientes'],['aprobado','Aprobados'],['rechazado','Rechazados'],['todos','Todos']];
    document.getElementById('tabs').innerHTML = TABS.map(([k,l])=>
      `<button class="tab ${FILTRO===k?'on':''}" onclick="FILTRO='${k}';render()">${l} · ${k==='todos'?PEDIDOS.length:n(k)}</button>`).join('');
    const lista = FILTRO==='todos' ? PEDIDOS : PEDIDOS.filter(p=>p.estado===FILTRO);
    document.getElementById('plist').innerHTML = lista.length ? lista.map(card).join('')
      : `<div class="empty">${FILTRO==='pendiente' ? 'No hay pedidos esperando tu validación. 🎉' : 'No hay pedidos en esta lista.'}</div>`;
  }

  function card(p){
    const quien = [p.cliente_nombre||'Cliente', p.vendedor_nombre||p.vendedor_codigo].filter(Boolean).map(esc).join(' · ');
    const pie = p.estado==='pendiente'
      ? `<div class="pc-btns">
           <button class="btn ok" data-id="${esc(p.id)}" onclick="resolver(this.dataset.id,'aprobado',this)">✓ Aprobar</button>
           <button class="btn no" data-id="${esc(p.id)}" onclick="resolver(this.dataset.id,'rechazado',this)">✗ Rechazar</button>
         </div>`
      : `<div class="pc-rev">${ESTADOS[p.estado]||esc(p.estado)} por ${esc(p.revisado_por||'—')}${p.revisado_at?' · '+cuando(p.revisado_at):''}${p.nota_supervisor?'<br>💬 '+esc(p.nota_supervisor):''}</div>`;
    return `<div class="pcard">
      <div class="pc-top"><div><div class="pc-marca">${esc(p.marca)}</div><div class="pc-cli">${quien}</div></div>
        <span class="est ${esc(p.estado)}">${ESTADOS[p.estado]||esc(p.estado)}</span></div>
      ${p.necesita?`<div class="pc-nec"><small>Qué necesita el cliente</small>${esc(p.necesita)}</div>`:''}
      <div class="pc-datos">
        <div class="pc-d">Volumen<b>${esc(p.volumen||'—')}</b></div>
        <div class="pc-d">Prefiere<b>${esc(p.preferidas||'—')}</b></div>
        <div class="pc-d">Fee que pide<b>${pesos(p.fee)}</b></div>
        <div class="pc-d">Plata que solicita<b>${pesos(p.plata)}</b></div>
      </div>
      ${p.notas?`<div class="pc-meta">📝 ${esc(p.notas)}</div>`:''}
      <div class="pc-meta">Cargado el ${cuando(p.created_at)}</div>
      ${pie}
    </div>`;
  }

  // Aprobar o rechazar. Solo se toca si sigue pendiente: si otro supervisor lo
  // resolvió antes, no se pisa. Con RLS un update bloqueado vuelve sin filas.
  async function resolver(id, estado, btn){
    const p = PEDIDOS.find(x=>String(x.id)===String(id)); if(!p) return;
    let nota = null;
    if(estado==='rechazado'){
      nota = prompt('¿Por qué lo rechazás? Lo ve el vendedor en la ficha del cliente.', '');
      if(nota===null) return;
    } else if(!confirm(`¿Aprobar el pedido de ${p.cliente_nombre||'este cliente'} a ${p.marca}?`)) return;
    btn.disabled = true;
    const cambios = { estado, nota_supervisor: (nota||'').trim()||null, revisado_por: NOMBRE_SUP||'Supervisor', revisado_at: new Date().toISOString() };
    const { data, error } = await man.from('partner_pedidos').update(cambios).eq('id', id).eq('estado','pendiente').select('*');
    if(error || !data || !data.length){
      btn.disabled = false;
      alert(error ? 'No se pudo guardar: '+error.message : 'Ese pedido ya lo había resuelto otra persona. Actualizo la lista.');
      return cargar();
    }
    Object.assign(p, data[0]);
    render();
  }

  async function cargar(){
    // 1) Equipo del supervisor (el mismo criterio que el resto de las pantallas)
    let equipo=[], canal='', region='';
    try{
      const r = await fetch('/.netlify/functions/supervisor-equipo', { headers:{ Authorization:'Bearer '+TOKEN } });
      const d = await r.json();
      if(!r.ok){ document.getElementById('sub').textContent=d.error||'No autorizado'; document.getElementById('plist').innerHTML='<div class="empty">'+esc(d.error||'No autorizado')+'</div>'; return; }
      equipo=d.equipo||[]; canal=d.canal||''; region=d.region||''; NOMBRE_SUP=d.nombre||'';
    }catch(e){ document.getElementById('sub').textContent='Error de conexión.'; return; }

    const reg = region==='san_luis'?'San Luis':(region==='mendoza'?'Mendoza':'');
    const can = canal==='ambos'?'ambos canales':(canal?canal.toUpperCase()+' Trade':'');
    document.getElementById('badge').textContent = `${can}${reg?' · '+reg:''}`;
    if(NOMBRE_SUP){ document.getElementById('uName').textContent=NOMBRE_SUP; document.getElementById('avSb').textContent=ini(NOMBRE_SUP); }

    const codigos = equipo.map(v=>String(v.codigo));
    if(!codigos.length){ document.getElementById('sub').textContent='Tu equipo no tiene vendedores cargados.'; PEDIDOS=[]; render(); return; }

    // 2) Pedidos de esos vendedores (se cruzan por el id del vendedor en el manual)
    const { data: vends } = await man.from('vendedores').select('id').in('codigo', codigos);
    const ids = (vends||[]).map(v=>v.id);
    if(!ids.length){ document.getElementById('sub').textContent='No encontré a tu equipo en el manual de vendedores.'; PEDIDOS=[]; render(); return; }
    const { data, error } = await man.from('partner_pedidos').select('*').in('vendedor_id', ids)
      .order('created_at',{ascending:false}).limit(500);
    if(error){
      const falta = /partner_pedidos/.test(error.message||'');
      document.getElementById('sub').textContent = falta ? 'Falta crear la tabla de pedidos (manual-disco-v3.sql).' : 'No se pudieron traer los pedidos.';
      PEDIDOS=[]; render(); return;
    }
    PEDIDOS = data||[];
    const pend = PEDIDOS.filter(p=>p.estado==='pendiente').length;
    document.getElementById('sub').textContent = pend
      ? `${pend} pedido${pend!==1?'s':''} de tu equipo esperando tu validación.`
      : 'No hay pedidos pendientes de tu equipo.';
    render();
  }

  (async ()=>{
    hub = supabase.createClient(HUB.url, HUB.key);
    man = supabase.createClient(MANUAL.url, MANUAL.key, { auth:{ persistSession:false } });
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href='index.html'; return; }
    TOKEN = session.access_token;
    document.getElementById('logout').onclick = async ()=>{ if(confirm('¿Cerrar sesión?')){ try{ await hub.auth.signOut(); }catch(e){} location.href='index.html'; } };
    cargar();
  })();
</script>
<script src="assets/notif.js?v=2"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
