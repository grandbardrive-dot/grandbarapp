<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Presentación de ejecuciones · GrandBar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#17110f;--paper:#f4efe9;--card:#fff;--line:#e7ddcf;--mut:#7a6f66;--campari:#C8102E;--aperol:#E8541B;--gold:#b58b2a}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
  .bar .t{font-weight:800;font-size:15px}
  .bar .t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
  .bar .acts{display:flex;gap:8px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink);text-decoration:none}
  .btn.p{background:var(--campari);color:#fff;border-color:var(--campari)}
  .deck{max-width:1040px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:20px}
  .slide{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;aspect-ratio:16/9;display:flex;flex-direction:column;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  /* portada */
  .cover{background:radial-gradient(120% 120% at 15% 10%,#2a1416,#140b0c 70%);color:#fff;justify-content:center;padding:8%}
  .cover .k{color:var(--aperol);font-weight:800;letter-spacing:.2em;text-transform:uppercase;font-size:13px}
  .cover h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(28px,5vw,54px);line-height:1.02;margin:10px 0 6px}
  .cover .sub{color:#d8c9c2;font-size:clamp(13px,1.8vw,18px)}
  .cover .meta{margin-top:auto;display:flex;gap:26px;flex-wrap:wrap;color:#c7b4ac;font-size:13px}
  .cover .meta b{color:#fff;font-size:22px;font-family:Fraunces,serif;display:block}
.cover .meta .gb{margin-left:auto;align-self:flex-end}.cover .meta .gb img{display:block;height:46px;width:auto}
  /* slide de ejecución */
  .ex{flex-direction:row}
  .ex .foto{width:52%;background:#2a1416;flex:none;overflow:hidden}
  .ex .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .ex .foto.ph{display:flex;align-items:center;justify-content:center;color:#7a5b50;font-size:14px}
  .ex .body{flex:1;padding:4.2% 4.6%;display:flex;flex-direction:column;min-width:0}
  .ex .num{color:var(--campari);font-weight:800;font-size:13px;letter-spacing:.04em}
  .ex h2{font-family:Fraunces,serif;font-weight:700;font-size:clamp(19px,2.6vw,30px);line-height:1.05;margin:4px 0 3px}
  .ex .cli{color:var(--mut);font-size:clamp(12px,1.5vw,15px);font-weight:600}
  .ex .desc{margin:11px 0;font-size:clamp(12px,1.5vw,15px);color:#3b322d;line-height:1.5}
  .ex .kpis{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto}
  .kpi{background:#faf3ec;border:1px solid #efe2d2;border-radius:11px;padding:8px 12px;min-width:92px}
  .kpi .v{font-family:Fraunces,serif;font-weight:700;font-size:clamp(16px,2.2vw,24px);color:var(--campari);line-height:1}
  .kpi .l{font-size:10.5px;color:var(--mut);margin-top:3px;line-height:1.2}
  .ex .by{margin-top:10px;font-size:11.5px;color:var(--mut)}
  .tag{display:inline-block;background:#fbe7d9;color:#9a3b12;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px}
  .load{padding:60px 20px;text-align:center;color:var(--mut)}
  @media(max-width:700px){ .slide{aspect-ratio:auto} .ex{flex-direction:column} .ex .foto{width:100%;height:220px} }
  @media print{
    .bar{display:none} body{background:#fff}
    .deck{max-width:none;margin:0;padding:0;gap:0}
    .slide{border:0;border-radius:0;box-shadow:none;aspect-ratio:16/9;width:100%;page-break-after:always;break-after:page}
    @page{size:A4 landscape;margin:0}
  }
</style>
</head>
<body>
<div class="bar">
  <div class="t" id="barTit">Presentación<small id="barSub"></small></div>
  <div class="acts"><a class="btn" id="volver" href="admin-presentaciones.html">‹ Volver</a><button class="btn p" onclick="window.print()">⬇ Descargar PDF</button></div>
</div>
<div class="deck" id="deck"><div class="load">Cargando presentación…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FN='/.netlify/functions/ejecuciones';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let HUBCLI=null;
function hub(){ return HUBCLI=HUBCLI||supabase.createClient('https://xqhyemccbwmzxqzkrtwa.supabase.co','sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc'); }
async function token(){ try{ const {data}=await hub().auth.getSession(); return data&&data.session&&data.session.access_token||null; }catch(e){ return null; } }
const nf=n=>Number(n).toLocaleString('es-AR');
function fmes(p){ const M=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; const [y,m]=String(p||'').split('-'); return (M[(+m||1)-1]||'')+' '+(y||''); }

function kpisDe(r,preg){
  if(!r) return '';
  const chip=(v,l)=>'<div class="kpi"><div class="v">'+esc(v)+'</div><div class="l">'+esc(l)+'</div></div>';
  let h='';
  if(r.copas_normal!=null) h+=chip(nf(r.copas_normal),'copas/sem antes');
  if(r.copas_accion!=null) h+=chip(nf(r.copas_accion),'copas con la acción');
  if(r.uplift_pct!=null) h+=chip((r.uplift_pct>=0?'+':'')+nf(r.uplift_pct)+'%','más que lo normal');
  else if(r.uplift!=null) h+=chip((r.uplift>=0?'+':'')+nf(r.uplift),'copas de más');
  if(r.precio_antes!=null) h+=chip('$'+nf(r.precio_antes),'precio antes');
  if(r.precio!=null) h+=chip('$'+nf(r.precio),'precio con acción');
  if(r.botellas!=null) h+=chip(nf(r.botellas),'botellas compradas');
  return h;
}
function slideEx(it,i,preg){
  const foto=(it.fotos_url&&it.fotos_url[0]);
  const by=it.fuente==='kaf'?'Relevado por KAF':(it.vendedor_nombre?'Ejecutado por '+esc(it.vendedor_nombre):'');
  const tag=it.fuente==='kaf'?'<span class="tag">KAF</span>':'';
  const r=it.resultado||{};
  let desc=r.que_se_hizo?esc(r.que_se_hizo):(it.comentario?esc(it.comentario):'');
  if(r.repetiria) desc+=(desc?' · ':'')+'Repetiría: '+esc(r.repetiria);
  if(r.comentario_cliente) desc+=(desc?'<br>':'')+'“'+esc(r.comentario_cliente)+'”';
  return '<div class="slide ex">'+
    (foto?'<div class="foto"><img src="'+esc(foto)+'" alt="" loading="lazy"></div>':'<div class="foto ph">sin foto</div>')+
    '<div class="body"><div class="num">Ejecución '+(i)+'</div>'+
    '<h2>'+esc(it.tipo_nombre||'Ejecución')+tag+'</h2>'+
    '<div class="cli">'+esc(it.cliente_nombre||'Punto de venta')+'</div>'+
    (desc?'<div class="desc">'+desc+'</div>':'<div class="desc"></div>')+
    '<div class="kpis">'+kpisDe(it.resultado,preg)+'</div>'+
    (by?'<div class="by">'+by+'</div>':'')+
    '</div></div>';
}

async function cargar(){
  const id=new URLSearchParams(location.search).get('id');
  const deck=document.getElementById('deck');
  if(!id){ deck.innerHTML='<div class="load">Falta la presentación.</div>'; return; }
  const tok=await token(); if(!tok){ deck.innerHTML='<div class="load">Entrá con tu cuenta de GrandBar.</div>'; return; }
  let d;
  try{ const r=await fetch(FN+'?vista=presentacion&id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+tok}}); d=await r.json(); if(!r.ok) throw new Error(d.error||'No se pudo cargar.'); }
  catch(e){ deck.innerHTML='<div class="load">'+esc(e.message)+'</div>'; return; }
  const p=d.presentacion, items=p.datos||[], preg=d.preguntas||[];
  document.title=p.titulo+' · GrandBar';
  document.getElementById('barTit').innerHTML=esc(p.titulo)+'<small>'+esc(p.proveedor)+' · '+items.length+' ejecuciones</small>';
  const cover='<div class="slide cover"><div class="k">'+esc(p.proveedor)+' · Ejecuciones</div>'+
    '<h1>'+esc(p.titulo)+'</h1>'+
    '<div class="sub">Resumen de ejecuciones en los puntos de venta · '+esc(fmes(p.periodo))+'</div>'+
    '<div class="meta"><div><b>'+items.length+'</b>ejecuciones</div><div><b>'+new Set(items.map(x=>x.cliente_nombre).filter(Boolean)).size+'</b>puntos de venta</div><div class="gb"><img src="assets/logo-grandbar-claro.png" alt="GrandBar Distribuciones"></div></div></div>';
  deck.innerHTML=cover+(items.length?items.map((it,i)=>slideEx(it,i+1,preg)).join(''):'<div class="load">No hubo ejecuciones en este período.</div>');
}
cargar();
</script>
</body>
</html>
