<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0b1118">
<link rel="manifest" href="/manifest.webmanifest">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrandBar Hub — Apertura Presupuesto</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b1118; --panel:#0d141b; --navy:#0b141c;
    --ink:#eaf1f4; --mut:#9fb2c2; --mut2:#7f93a3;
    --line:#ffffff14; --line2:#ffffff0d; --glass:#ffffff10;
    --teal:#7fe0c6; --teal-d:#2f7d6b; --gold:#e9b44c; --gold-d:#b07b1e;
    --wine:#e58bb0; --wine-d:#8a3a6a; --green:#64d6a6; --red:#ef9a7f;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --disp:'Syne',var(--font); --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  /* sidebar (lo pinta supervisor-nav.js) */
  .sidebar{width:250px;flex:none;background:#0a1017;color:#cfdae2;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh;border-right:1px solid var(--line2)}
  .sb-logo{font-size:21px;font-weight:800;letter-spacing:.3px}.sb-logo small{display:block;font-size:10px;font-weight:600;color:#8fa3ad;letter-spacing:.18em;text-transform:uppercase;margin-top:2px}
  .sb-hub{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7f93a3;margin:16px 4px 2px}
  .sb-nav{display:flex;flex-direction:column;gap:1px;overflow-y:auto;visibility:hidden}
  .sb-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:#b9c7d1;font-size:13.5px;font-weight:600}
  .sb-nav a svg{width:18px;height:18px;flex:none;opacity:.9}
  .sb-nav a:hover{background:#ffffff14;color:#fff}.sb-nav a.active{background:var(--gold);color:#1a1206}
  .sb-foot{margin-top:auto;padding-top:12px}
  .sb-user{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer}.sb-user:hover{background:#ffffff12}
  .sb-user .av{width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1206;display:grid;place-items:center;font-weight:800}
  .sb-user .t{font-size:13.5px;font-weight:700;color:#fff}.sb-user .s{font-size:11px;color:#8fa3ad}

  .main{flex:1;min-width:0;position:relative;overflow:hidden}
  /* auroras de fondo */
  .main::before,.main::after{content:"";position:fixed;width:620px;height:620px;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;pointer-events:none}
  .main::before{background:var(--teal-d);top:-220px;right:-120px}
  .main::after{background:var(--wine-d);bottom:-260px;left:60px}
  .wrap{max-width:1200px;margin:0 auto;padding:26px 30px 100px;position:relative;z-index:1}
  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-family:var(--disp);font-size:28px;margin:0;font-weight:800;letter-spacing:-.5px}
  .sub{color:var(--mut);font-size:13.5px;margin-top:4px}
  .who{font-size:11.5px;color:var(--mut2);text-align:right;font-family:var(--mono);letter-spacing:.04em}
  .bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:20px 0 18px}
  .seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;backdrop-filter:blur(8px)}
  .seg button{border:0;background:transparent;padding:8px 15px;border-radius:999px;font-weight:700;font-size:12.5px;color:var(--mut);cursor:pointer;font-family:inherit;transition:.18s}
  .seg button.on{background:#fff;color:#0b1118}
  .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink);backdrop-filter:blur(8px)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1206}
  .btn.green{background:var(--teal);border-color:var(--teal);color:#06231c}
  .btn:disabled{opacity:.45;cursor:default}

  .team{margin-top:26px}
  .team-h{display:flex;align-items:center;gap:12px;margin:0 2px 14px}
  .team-h h2{font-family:var(--disp);font-size:19px;margin:0;font-weight:800;letter-spacing:-.3px}
  .team-h .line{flex:1;height:1px;background:var(--line)}
  .team-h .pill{font-family:var(--mono);font-size:10.5px;color:var(--teal);border:1px solid #1f3f39;background:#102520;padding:3px 9px;border-radius:7px;letter-spacing:.05em}

  .fam{margin-bottom:22px}
  .fam-h{display:flex;align-items:center;gap:11px;margin:0 2px 12px;flex-wrap:wrap}
  .fam-h .dot{width:12px;height:12px;border-radius:4px}
  .fam.vinos .dot{background:linear-gradient(135deg,var(--wine),var(--wine-d))}
  .fam.esp .dot{background:linear-gradient(135deg,var(--gold),var(--gold-d))}
  .fam-h .nm{font-weight:800;font-size:15px}
  .fam-h .tt{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--mut)}
  .fam-h .tt b{font-family:var(--font);font-weight:800;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
  .fam-h .tp{font-family:var(--font);font-weight:800;font-size:15px;padding:3px 11px;border-radius:999px;font-variant-numeric:tabular-nums}
  .tp.g{background:#12302a;color:var(--teal)} .tp.y{background:#2f2713;color:var(--gold)} .tp.r{background:#331f1a;color:var(--red)} .tp.n{background:#1a232c;color:var(--mut)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:13px}
  .vc{background:linear-gradient(160deg,#ffffff12,#ffffff06);border:1px solid var(--line);border-radius:18px;padding:16px;backdrop-filter:blur(10px);transition:transform .15s,border-color .15s}
  .vc:hover{transform:translateY(-2px);border-color:#ffffff2a}
  .vc .vt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .vc h3{margin:0 0 1px;font-size:15px;font-weight:700}
  .vc .r{font-family:var(--mono);font-size:10.5px;color:var(--mut2)}
  .vc .expand{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;width:26px;height:26px;cursor:pointer;font-size:12px;flex:none;display:grid;place-items:center}
  .vc .expand:hover{background:#ffffff14;color:#fff}
  .rr{display:flex;align-items:center;gap:15px;margin-top:13px}
  .ring{--p:0;--a:var(--gold);--b:var(--gold-d);width:80px;height:80px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:radial-gradient(closest-side,var(--panel) 70%,transparent 71%),conic-gradient(from -90deg,var(--b),var(--a) calc(var(--p)*1%),#17222c 0)}
  .vinos .ring{--a:var(--wine);--b:var(--wine-d)}
  .ring b{font-family:var(--font);font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .ring.nobj{background:radial-gradient(closest-side,var(--panel) 70%,transparent 71%),conic-gradient(#17222c 0)}
  .ring.nobj b{font-size:12px;color:var(--mut2);font-family:var(--font);font-weight:600}
  .vv b{display:block;font-family:var(--font);font-weight:800;font-size:25px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .vv span{display:block;font-size:12px;color:var(--mut);margin-top:2px}
  .vv .obj{display:inline-flex;align-items:center;gap:6px;margin-top:3px}
  .objinput{width:84px;background:#0c141b;border:1px solid var(--gold-d);color:var(--gold);border-radius:8px;padding:5px 8px;font-family:var(--mono);font-size:12.5px;text-align:right}
  .spark{display:flex;gap:5px;align-items:flex-end;height:34px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)}
  .spark .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
  .spark i{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--teal),var(--teal-d));opacity:.5;min-height:3px;transition:height .9s cubic-bezier(.3,.8,.3,1)}
  .vinos .spark i{background:linear-gradient(180deg,var(--wine),var(--wine-d))}
  .spark i.last{opacity:1;background:linear-gradient(180deg,var(--gold),var(--gold-d))}
  .vinos .spark i.last{background:linear-gradient(180deg,var(--wine),#c25c8e)}
  .spark .ml{font-family:var(--mono);font-size:8.5px;color:var(--mut2)}
  .det{margin-top:12px;padding-top:12px;border-top:1px solid var(--line2);display:none}
  .det.open{display:block;animation:fade .2s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .det .mrow{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);font-family:var(--mono);padding:2px 0}
  .det .mrow b{color:var(--ink)}
  .det .th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut2);margin:10px 0 5px}
  .det .trow{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-top:1px solid var(--line2)}
  .det .trow span{color:var(--mut)} .det .trow b{font-variant-numeric:tabular-nums}

  .loading,.empty{padding:50px;text-align:center;color:var(--mut)}
  .savebar{position:sticky;bottom:14px;margin-top:16px;background:#111b24ee;border:1px solid var(--gold-d);border-radius:14px;padding:11px 16px;display:none;align-items:center;gap:12px;backdrop-filter:blur(10px);box-shadow:0 14px 40px #0009}
  .savebar.on{display:flex} .savebar .msg{font-size:13px;font-weight:600;color:var(--gold)}
  .botnav{display:none}
  @media(max-width:820px){
    .sidebar{display:none}.wrap{padding:18px 14px 90px}
    .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#0a1017;padding:6px 4px;justify-content:space-around;z-index:40;border-top:1px solid var(--line2)}
    .botnav a{display:flex;flex-direction:column;align-items:center;gap:2px;color:#b9c7d1;font-size:10px;font-weight:600;padding:4px 8px}
    .botnav a svg{width:20px;height:20px}.botnav a.active{color:var(--gold)}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">S</div><div><div class="t" id="uName">Supervisor</div><div class="s">Supervisor</div></div></div>
    </div>
  </aside>
  <div class="main">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1>Apertura de Presupuesto</h1>
        <div class="sub" id="sub">Cargando…</div>
      </div>
      <div class="who" id="who"></div>
    </div>
    <div class="bar">
      <div class="seg" id="segEq"></div>
      <div class="seg" id="segFam">
        <button data-f="both" class="on">Ambas</button>
        <button data-f="VINOS">Vinos</button>
        <button data-f="ESP">Espirituosas</button>
      </div>
      <div class="spacer"></div>
      <button class="btn gold" id="btnEdit" style="display:none">✏️ Editar objetivos</button>
    </div>
    <div id="cont"><div class="loading">Cargando el reporte…</div></div>
    <div class="savebar" id="savebar">
      <div class="msg" id="saveMsg">Cambiaste objetivos sin guardar.</div>
      <div class="spacer"></div>
      <button class="btn" id="btnCancel">Cancelar</button>
      <button class="btn green" id="btnSave">Guardar objetivos</button>
    </div>
  </div>
  <nav class="botnav bottomnav"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js?v=4"></script>
<script>
  const HUB = { url:'https://xqhyemccbwmzxqzkrtwa.supabase.co', key:'sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nf = n => (Number(n)||0).toLocaleString('es-AR');
  let hub, TOKEN, DATA=null, EQSEL='ON', FAMSEL='both', EDIT=false, DIRTY={};

  const cls = (p,obj) => !obj?'n':(p>=100?'g':(p>=70?'y':'r'));

  function render(){
    const d = DATA; if(!d) return;
    $('#sub').innerHTML = 'Mes actual <b>'+esc(d.mesActualLabel)+'</b> · base '+d.meses.filter(m=>m.base).map(m=>esc(m.label.slice(5))).join(' · ')+' · al día';
    $('#who').textContent = d.puedeEditar ? 'PODÉS CARGAR OBJETIVOS' : 'SOLO LECTURA';
    $('#btnEdit').style.display = d.puedeEditar ? '' : 'none';
    const segEq=$('#segEq');
    const eqs=[{k:'ON',n:'ON'},{k:'OFF',n:'OFF'},{k:'SL',n:'San Luis'},{k:'MAYOR',n:'Mayorista'},{k:'ALL',n:'Todos'}];
    segEq.innerHTML=eqs.map(e=>'<button data-eq="'+e.k+'" class="'+(e.k===EQSEL?'on':'')+'">'+e.n+'</button>').join('');

    const equipos = EQSEL==='ALL' ? d.equipos : d.equipos.filter(e=>e.equipo===EQSEL);
    let html='';
    for(const eq of equipos){
      html += '<div class="team"><div class="team-h"><h2>'+esc(eq.nombre)+'</h2><span class="line"></span><span class="pill">'+esc(d.mesActualLabel)+'</span></div>';
      for(const fam of eq.familias){
        if(FAMSEL!=='both' && FAMSEL!==fam.familia) continue;
        html += famBlock(eq, fam, d.meses);
      }
      html += '</div>';
    }
    if(!html) html='<div class="empty">No hay ventas para este corte.</div>';
    $('#cont').innerHTML = html;
    bind();
    requestAnimationFrame(()=>document.querySelectorAll('.spark i[data-h]').forEach(i=>{ i.style.height=i.dataset.h+'%'; }));
  }

  function famBlock(eq, fam, meses){
    const famcls = fam.familia==='VINOS'?'vinos':'esp';
    const baseCols = meses.filter(m=>m.base);
    const actual = meses.find(m=>!m.base);
    const tcl = cls(fam.pct, fam.totObjetivo);
    let h = '<div class="fam '+famcls+'"><div class="fam-h"><span class="dot"></span><span class="nm">'+esc(fam.nombre)+'</span>'
      + '<div class="tt"><span>Avance <b>'+nf(fam.totActual)+'</b></span><span>de '+nf(fam.totObjetivo)+'</span>'
      + '<span class="tp '+tcl+'">'+(fam.totObjetivo?fam.pct+'%':'sin obj.')+'</span></div></div><div class="grid">';
    for(const v of fam.vendedores){
      const p=v.pct, hasObj=v.objetivo>0;
      const vals=v.meses.concat(); const mx=Math.max(1,...vals,v.actual);
      const objHtml = (EDIT && DATA.puedeEditar)
        ? '<span class="obj"><input class="objinput" type="number" min="0" value="'+(v.objetivo||0)+'" data-vcod="'+v.vcod+'" data-fam="'+fam.familia+'"></span>'
        : '<span class="vv-obj" style="font-size:12px;color:var(--mut)">de '+nf(v.objetivo)+' obj.</span>';
      // spark: base months + avance
      let spark=''; baseCols.forEach((m,i)=>{ spark+='<div class="col"><i data-h="'+Math.round(6+88*v.meses[i]/mx)+'"></i><span class="ml">'+esc(m.label.slice(5,8))+'</span></div>'; });
      spark+='<div class="col"><i class="last" data-h="'+Math.round(6+88*v.actual/mx)+'"></i><span class="ml">'+esc((actual?actual.label.slice(5,8):'Act'))+'</span></div>';
      // detalle (meses + tipos)
      let det='<div class="det" data-det="'+v.vcod+'">';
      baseCols.forEach((m,i)=>{ det+='<div class="mrow"><span>'+esc(m.label)+'</span><b>'+nf(v.meses[i])+'</b></div>'; });
      det+='<div class="mrow"><span>'+esc(actual?actual.label:'Avance')+'</span><b>'+nf(v.actual)+'</b></div>';
      if(v.tipos&&v.tipos.length){ det+='<div class="th">Por tipo de cliente</div>';
        for(const t of v.tipos) det+='<div class="trow"><span>'+esc(t.tipo)+'</span><b class="num">'+nf(t.actual)+'</b></div>';
      }
      det+='</div>';
      const ring = hasObj ? '<div class="ring" style="--p:'+Math.min(100,p)+'"><b>'+p+'%</b></div>'
                          : '<div class="ring nobj"><b>sin obj.</b></div>';
      h += '<div class="vc"><div class="vt"><div><h3>'+esc(v.nombre||('Vend. '+v.vcod))+'</h3><div class="r">'+esc(eq.equipo)+' · '+esc(v.vcod.padStart(3,'0'))+'</div></div>'
        + '<button class="expand" data-x="'+v.vcod+'">+</button></div>'
        + '<div class="rr">'+ring+'<div class="vv"><b class="num">'+nf(v.actual)+'</b><span>botellas</span><div class="obj">'+objHtml+'</div></div></div>'
        + '<div class="spark">'+spark+'</div>'+det+'</div>';
    }
    h += '</div></div>';
    return h;
  }

  function bind(){
    document.querySelectorAll('.expand').forEach(b=>{
      b.onclick=()=>{ const x=b.getAttribute('data-x'); const d=b.closest('.vc').querySelector('.det');
        const open=d.classList.toggle('open'); b.textContent=open?'−':'+'; };
    });
    document.querySelectorAll('.objinput').forEach(inp=>{
      inp.oninput=()=>{ DIRTY[inp.dataset.vcod+'|'+inp.dataset.fam]=Number(inp.value)||0;
        $('#savebar').classList.add('on'); $('#saveMsg').textContent=Object.keys(DIRTY).length+' objetivo(s) sin guardar'; };
    });
  }

  function setEdit(on){ EDIT=on; DIRTY={}; $('#savebar').classList.remove('on');
    $('#btnEdit').textContent=on?'Cerrar edición':'✏️ Editar objetivos'; $('#btnEdit').classList.toggle('green',on); render(); }

  async function guardar(){
    const items=Object.keys(DIRTY).map(k=>({vcod:k.split('|')[0],familia:k.split('|')[1],objetivo:DIRTY[k]}));
    if(!items.length){ setEdit(false); return; }
    $('#btnSave').disabled=true; $('#btnSave').textContent='Guardando…';
    try{
      const r=await fetch('/.netlify/functions/apertura-presupuesto',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'guardar',mes:DATA.mesActual,items})});
      const res=await r.json(); if(!r.ok) throw new Error(res.error||('Error '+r.status));
      for(const it of items){ for(const eq of DATA.equipos){ for(const fam of eq.familias){ if(fam.familia!==it.familia) continue;
        const v=fam.vendedores.find(x=>x.vcod===it.vcod); if(v){ v.objetivo=it.objetivo; v.pct=v.objetivo?Math.round(100*v.actual/v.objetivo):0; }
        fam.totObjetivo=fam.vendedores.reduce((s,x)=>s+(x.objetivo||0),0); fam.pct=fam.totObjetivo?Math.round(100*fam.totActual/fam.totObjetivo):0;
      }}}
      setEdit(false);
    }catch(e){ alert('No se pudo guardar: '+(e.message||e)); }
    $('#btnSave').disabled=false; $('#btnSave').textContent='Guardar objetivos';
  }

  async function cargar(){
    try{
      const r=await fetch('/.netlify/functions/apertura-presupuesto',{headers:{Authorization:'Bearer '+TOKEN}});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||('Error '+r.status));
      DATA=d; render();
    }catch(e){ $('#cont').innerHTML='<div class="empty">No se pudo cargar el reporte.<br>'+esc(e.message||e)+'</div>'; }
  }

  document.addEventListener('click',e=>{
    const be=e.target.closest('#segEq button'); if(be){ EQSEL=be.dataset.eq; render(); return; }
    const bf=e.target.closest('#segFam button'); if(bf){ FAMSEL=bf.dataset.f; document.querySelectorAll('#segFam button').forEach(x=>x.classList.toggle('on',x===bf)); render(); return; }
  });
  $('#btnEdit').onclick=()=>setEdit(!EDIT);
  $('#btnCancel').onclick=()=>setEdit(false);
  $('#btnSave').onclick=guardar;

  (async ()=>{
    hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href='index.html'; return; }
    TOKEN = session.access_token;
    try{
      const { data:u } = await hub.from('usuarios').select('nombre,rol,es_supervisor').eq('id',session.user.id).maybeSingle();
      if(u&&u.nombre){ $('#uName').textContent=u.nombre; $('#avSb').textContent=(u.nombre.trim()[0]||'S').toUpperCase(); }
    }catch(e){}
    const lo=$('#logout'); if(lo) lo.onclick=async()=>{ if(confirm('¿Cerrar sesión?')){ try{await hub.auth.signOut();}catch(e){} location.href='index.html'; } };
    cargar();
  })();
</script>
