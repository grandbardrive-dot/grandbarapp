<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2230">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>GrandBar Hub — Curso de Vendedores</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line2:#eee7d8;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--danger:#c0603e;--danger-s:#fbe9e4;--navy:#0d2230;--blue:#3f6f9c;--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box} body{margin:0;font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  .top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .top a.back{color:#cdd9e0;text-decoration:none;font-size:22px;line-height:1}
  .top h1{font-size:16px;margin:0;font-weight:800}.top .sub{font-size:11px;color:#8fa3ad}
  .wrap{max-width:760px;margin:0 auto;padding:16px 14px 70px}
  .hero{background:linear-gradient(160deg,#123246,#0d2230);color:#fff;border-radius:16px;padding:18px 18px 20px;margin-bottom:16px}
  .hero h2{margin:0 0 4px;font-size:19px;font-weight:800}
  .hero p{margin:0;font-size:13px;color:#b9c9d3;max-width:56ch}
  .pbar{height:9px;background:rgba(255,255,255,.15);border-radius:20px;margin-top:14px;overflow:hidden}
  .pbar span{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
  .pmeta{display:flex;justify-content:space-between;font-size:12px;color:#cdd9e0;margin-top:8px}
  .badge-lim{display:inline-flex;align-items:center;gap:6px;background:rgba(192,145,47,.18);border:1px solid rgba(192,145,47,.5);color:#f0d79a;border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;margin-top:12px}
  .mod{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .mod-h{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer;user-select:none}
  .mod-em{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:20px;background:var(--cream);border:1px solid var(--line);border-radius:11px}
  .mod-t{flex:1;min-width:0}
  .mod-t .n{font-weight:800;font-size:15.5px}
  .mod-t .s{font-size:12px;color:var(--muted)}
  .chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .chip.no{background:#eef1f3;color:#6a7a82}.chip.curso{background:var(--gold-s);color:var(--gold-d)}.chip.ok{background:var(--green-s);color:var(--green-d)}
  .mod-arrow{color:var(--muted);font-size:14px;transition:transform .2s}
  .mod.open .mod-arrow{transform:rotate(90deg)}
  .mod-body{display:none;padding:0 15px 16px;border-top:1px solid var(--line2)}
  .mod.open .mod-body{display:block}
  .lec{padding:13px 0;border-bottom:1px solid var(--line2)}
  .lec:last-child{border-bottom:0}
  .lec-h{display:flex;align-items:flex-start;gap:10px}
  .lec-em{font-size:16px;line-height:1.3}
  .lec-n{font-weight:700;font-size:14px}
  .lec-inc{font-size:11.5px;color:var(--muted);margin-top:1px}
  .lec-p{font-size:13px;color:#4a5860;margin:7px 0 0;line-height:1.5}
  .lec-ej{font-size:12.5px;color:#6a5312;background:var(--gold-s);border:1px solid #ecdcb2;border-radius:9px;padding:8px 11px;margin:8px 0 0;line-height:1.5}
  .lec-ej b{color:#7c5713}
  .cert{background:linear-gradient(160deg,#fff,#faf4e6);border:2px solid var(--gold);border-radius:16px;padding:26px 20px;margin-bottom:18px;text-align:center}
  .cert-seal{width:56px;height:56px;margin:0 auto 12px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:28px;box-shadow:0 6px 18px rgba(47,143,110,.3)}
  .cert-k{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-d)}
  .cert-name{font-size:22px;font-weight:800;margin:6px 0 2px}
  .cert-txt{font-size:13.5px;color:var(--muted);max-width:44ch;margin:0 auto}
  .cert-date{font-size:12px;color:var(--muted);margin:10px 0 14px}
  @media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;border:none} .cert button{display:none}}
  .lec-chk{margin-top:9px}
  .btn{border:0;border-radius:10px;padding:9px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
  .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
  .btn.ok{background:var(--green-s);border:1.5px solid #bfe0d0;color:var(--green-d)}
  .btn.gold{background:var(--gold);color:#241a06;width:100%;padding:13px;font-size:14px}
  .btn.gold:disabled{opacity:.5;cursor:not-allowed}
  .ejemplo{background:var(--gold-s);border:1px solid #e7d3a1;border-radius:12px;padding:12px 14px;margin:14px 0;font-size:13px;color:#6a5312;line-height:1.5}
  .ejemplo b{color:#7c5713}
  .quiz{margin-top:8px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px}
  .quiz h4{margin:0 0 4px;font-size:14px}
  .quiz .lock{font-size:12px;color:var(--muted);margin:0 0 12px}
  .q{margin-bottom:14px}.q p{margin:0 0 8px;font-size:13.5px;font-weight:600}
  .opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;margin-bottom:6px;cursor:pointer;font-size:13px;background:#fff}
  .opt input{accent-color:var(--gold)}
  .opt.sel{border-color:var(--gold);background:var(--gold-s)}
  .qres{border-radius:11px;padding:12px 14px;font-size:13.5px;font-weight:600;margin-top:6px}
  .qres.ok{background:var(--green-s);color:var(--green-d)}.qres.no{background:var(--danger-s);color:var(--danger)}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 16px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
  .toast.show{opacity:1}.toast.err{background:var(--danger)}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="inicio.html">‹</a>
    <div><h1>Curso de Vendedores</h1><div class="sub" id="sub">Cargando…</div></div>
  </div>
  <div class="wrap">
    <div class="hero">
      <h2 id="heroT">Tu formación GrandBar</h2>
      <p id="heroP">Aprendé a usar el manual de tu canal de punta a punta. Cada módulo es un rubro; al final rendís un quiz corto.</p>
      <div class="pbar"><span id="pbar"></span></div>
      <div class="pmeta"><span id="pmetaL">—</span><span id="pmetaR"></span></div>
      <div id="limWrap"></div>
    </div>
    <div id="mods"><div class="empty">Cargando tu curso…</div></div>
  </div>
  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script>
const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
const FN='/.netlify/functions/curso';
let hub, TOKEN, CURSO=null, DONE=new Set(), MODAP={};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);}

function recomputar(){
  DONE=new Set(); MODAP={};
  (CURSO.progreso||[]).forEach(p=>{
    if(p.tipo==='leccion') DONE.add(p.rubro+'|'+p.leccion);
    if(p.tipo==='modulo') MODAP[p.rubro]={nota:p.nota,aprobado:p.aprobado};
  });
}
function moduloCompleto(m){ return m.lecciones.every(l=>DONE.has(m.rubro+'|'+l.codigo)); }
function estadoMod(m){
  if(MODAP[m.rubro] && MODAP[m.rubro].aprobado) return ['ok','✓ Aprobado '+MODAP[m.rubro].nota+'%'];
  const hechas=m.lecciones.filter(l=>DONE.has(m.rubro+'|'+l.codigo)).length;
  if(hechas===0) return ['no','No empezado'];
  return ['curso', hechas+'/'+m.lecciones.length+' lecciones'];
}

function pintar(){
  recomputar();
  const mods=CURSO.modulos||[];
  const aprob=mods.filter(m=>MODAP[m.rubro] && MODAP[m.rubro].aprobado).length;
  const pct=mods.length?Math.round(aprob/mods.length*100):0;
  $('pbar').style.width=pct+'%';
  $('pmetaL').textContent=aprob+' de '+mods.length+' módulos aprobados';
  $('pmetaR').textContent=pct+'%';
  const canalLbl = CURSO.canal==='off'?'OFF Trade':CURSO.canal==='ambos'?'ambos canales':'ON Trade';
  $('sub').textContent=(CURSO.nombre||'Vendedor')+' · '+canalLbl;
  $('heroP').textContent='Aprendé a usar el manual de '+canalLbl+' de punta a punta. Cada módulo es un rubro; al final rendís un quiz (necesitás '+CURSO.nota_minima+'% para aprobar).';
  if(CURSO.fecha_limite){
    const f=new Date(CURSO.fecha_limite+'T12:00:00');
    const txt=f.toLocaleDateString('es-AR',{day:'numeric',month:'long'});
    $('limWrap').innerHTML='<span class="badge-lim">📅 Fecha límite: '+txt+'</span>';
  } else $('limWrap').innerHTML='';

  if(!mods.length){ $('mods').innerHTML='<div class="empty">Todavía no hay curso disponible para tu canal.</div>'; return; }
  const completo = aprob===mods.length;
  let certHtml='';
  if(completo){
    const hoy=new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
    certHtml=`<div class="cert"><div class="cert-seal">✓</div>
      <div class="cert-k">Certificado de finalización</div>
      <div class="cert-name">${esc(CURSO.nombre||'Vendedor')}</div>
      <div class="cert-txt">completó el Curso de Vendedores GrandBar — ${canalLbl} · ${mods.length} módulos aprobados</div>
      <div class="cert-date">${hoy}</div>
      <button class="btn ghost" onclick="window.print()">🖨️ Imprimir / guardar</button></div>`;
  }
  $('mods').innerHTML=certHtml+mods.map((m,mi)=>{
    const [cls,txt]=estadoMod(m);
    const lecs=m.lecciones.map(l=>{
      const done=DONE.has(m.rubro+'|'+l.codigo);
      const inc=l.incluye&&l.incluye.length?`<div class="lec-inc">Incluye: ${l.incluye.map(esc).join(' · ')}</div>`:'';
      const p=l.intro?`<p class="lec-p">${esc(l.intro)}</p>`:'';
      const ej=l.ejemplo?`<p class="lec-ej">💡 <b>En la visita:</b> ${esc(l.ejemplo)}</p>`:'';
      return `<div class="lec"><div class="lec-h"><div class="lec-em">${l.icono||'📄'}</div>
        <div style="flex:1"><div class="lec-n">${esc(l.nombre)}</div>${inc}${p}${ej}
        <div class="lec-chk">${done
          ? '<button class="btn ok" disabled>✓ Leída</button>'
          : `<button class="btn ghost" onclick="marcarLeida('${m.rubro}','${l.codigo}',this)">Marcar como leída</button>`}</div>
        </div></div></div>`;
    }).join('');
    const ejemplo=m.ejemplo?`<div class="ejemplo"><b>💡 Ejemplo de visita.</b> ${esc(m.ejemplo)}</div>`:'';
    return `<div class="mod${mi===0?' open':''}" id="mod-${m.rubro}">
      <div class="mod-h" onclick="toggleMod('${m.rubro}')">
        <div class="mod-em">${m.emoji}</div>
        <div class="mod-t"><div class="n">${esc(m.label)}</div><div class="s">${m.lecciones.length} lecciones · quiz de ${m.quiz.length} preguntas</div></div>
        <span class="chip ${cls}">${txt}</span><span class="mod-arrow">▶</span>
      </div>
      <div class="mod-body">
        ${lecs}
        ${ejemplo}
        ${renderQuiz(m)}
      </div>
    </div>`;
  }).join('');
}

function renderQuiz(m){
  const ap=MODAP[m.rubro];
  if(ap && ap.aprobado) return `<div class="quiz"><div class="qres ok">✓ Módulo aprobado con ${ap.nota}%. ¡Bien ahí!</div></div>`;
  const listo=moduloCompleto(m);
  const qs=m.quiz.map((q,qi)=>`<div class="q" data-qi="${qi}"><p>${qi+1}. ${esc(q.q)}</p>
    ${q.o.map((op,oi)=>`<label class="opt"><input type="radio" name="q-${m.rubro}-${qi}" value="${oi}" onchange="selOpt(this)">${esc(op)}</label>`).join('')}</div>`).join('');
  return `<div class="quiz" id="quiz-${m.rubro}">
    <h4>📝 Quiz del módulo</h4>
    <p class="lock">${listo?'Respondé para aprobar el módulo (mínimo '+CURSO.nota_minima+'%).':'🔒 Primero marcá todas las lecciones como leídas para habilitar el quiz.'}</p>
    ${listo?qs+`<button class="btn gold" onclick="enviarQuiz('${m.rubro}')">Enviar respuestas</button><div id="qout-${m.rubro}"></div>`:''}
  </div>`;
}

function toggleMod(r){ $('mod-'+r).classList.toggle('open'); }
function selOpt(inp){ inp.closest('.q').querySelectorAll('.opt').forEach(o=>o.classList.remove('sel')); inp.closest('.opt').classList.add('sel'); }

async function marcarLeida(rubro,leccion,btn){
  btn.disabled=true;
  try{
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'leccion',rubro,leccion})});
    if(!r.ok) throw new Error();
    CURSO.progreso.push({rubro,leccion,tipo:'leccion'});
    const open=[...document.querySelectorAll('.mod.open')].map(e=>e.id.replace('mod-',''));
    pintar(); open.forEach(r=>{const el=$('mod-'+r); if(el) el.classList.add('open');});
  }catch(e){ btn.disabled=false; toast('No se pudo guardar',true); }
}

async function enviarQuiz(rubro){
  const m=CURSO.modulos.find(x=>x.rubro===rubro);
  const respuestas=m.quiz.map((q,qi)=>{ const sel=document.querySelector(`input[name="q-${rubro}-${qi}"]:checked`); return sel?Number(sel.value):-1; });
  if(respuestas.some(r=>r<0)){ toast('Respondé todas las preguntas',true); return; }
  try{
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'quiz',rubro,respuestas})});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
    const out=$('qout-'+rubro);
    if(d.aprobado){
      CURSO.progreso=CURSO.progreso.filter(p=>!(p.rubro===rubro&&p.tipo==='modulo'));
      CURSO.progreso.push({rubro,tipo:'modulo',nota:d.nota,aprobado:true});
      toast('¡Aprobaste '+m.label+' con '+d.nota+'%! 🎉');
      const open=[...document.querySelectorAll('.mod.open')].map(e=>e.id.replace('mod-',''));
      pintar(); open.forEach(r=>{const el=$('mod-'+r); if(el) el.classList.add('open');});
    } else {
      out.innerHTML=`<div class="qres no">Sacaste ${d.nota}% (${d.correctas}/${d.total}). Necesitás ${d.nota_minima}%. Repasá las lecciones y volvé a intentar.</div>`;
    }
  }catch(e){ toast(e.message||'No se pudo enviar',true); }
}

window.toggleMod=toggleMod; window.selOpt=selOpt; window.marcarLeida=marcarLeida; window.enviarQuiz=enviarQuiz;

(async()=>{
  hub=supabase.createClient(HUB.url,HUB.key);
  const {data:{session}}=await hub.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  TOKEN=session.access_token;
  try{
    const r=await fetch(FN,{headers:{Authorization:'Bearer '+TOKEN}});
    CURSO=await r.json();
    if(!r.ok) throw new Error(CURSO.error||'Error');
    pintar();
  }catch(e){ $('mods').innerHTML='<div class="empty">No se pudo cargar el curso.<br>'+esc(e.message||'')+'</div>'; }
})();
</script>
<script src="assets/notif.js?v=2"></script>
<script src="assets/hub-nav.js?v=3"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
<script src="/assets/minuta-fab.js?v=2"></script>
</body>
</html>
