<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2230">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>GrandBar Hub — Curso del equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line2:#eee7d8;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--danger:#c0603e;--amber:#c99a2e;--amber-s:#f8efd6;--navy:#0d2230;--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  .top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .top a.back{color:#cdd9e0;text-decoration:none;font-size:22px;line-height:1}.top h1{font-size:16px;margin:0;font-weight:800}.top .sub{font-size:11px;color:#8fa3ad}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .kpi{flex:1;min-width:150px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
  .lim{font-size:12.5px;color:var(--gold-d);background:var(--gold-s);border:1px solid #e7d3a1;border-radius:10px;padding:9px 13px;margin-bottom:16px;font-weight:600;display:inline-block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line2)}
  .row:last-child{border-bottom:0}
  .av{width:38px;height:38px;flex:none;border-radius:10px;background:var(--gold-s);color:var(--gold-d);display:grid;place-items:center;font-weight:800;font-size:14px}
  .who{flex:1;min-width:0}.who .n{font-weight:700;font-size:14.5px}.who .m{font-size:11.5px;color:var(--muted)}
  .prog{flex:1.2;min-width:120px;max-width:220px}
  .bar{height:8px;background:#eee7d8;border-radius:20px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}
  .prog .t{font-size:11px;color:var(--muted);margin-top:4px}
  .chip{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .chip.ok{background:var(--green-s);color:var(--green-d)}.chip.mid{background:var(--amber-s);color:#8a6a1e}.chip.no{background:#f2e3de;color:var(--danger)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px}
  @media(max-width:560px){.prog{display:none}}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="supervisor-equipo.html">‹</a>
    <div><h1>Curso del equipo</h1><div class="sub" id="sub">Cargando…</div></div>
  </div>
  <div class="wrap">
    <div class="kpis">
      <div class="kpi"><div class="l">Vendedores</div><div class="v" id="kTot">—</div></div>
      <div class="kpi"><div class="l">Completaron</div><div class="v" id="kOk" style="color:var(--green-d)">—</div></div>
      <div class="kpi"><div class="l">Sin empezar</div><div class="v" id="kNo" style="color:var(--danger)">—</div></div>
    </div>
    <div id="limWrap"></div>
    <div class="card" id="list"><div class="empty">Cargando…</div></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script>
const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ini=n=>(n||'').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'V';
const hace=iso=>{if(!iso)return'—';const d=Math.floor((Date.now()-new Date(iso).getTime())/86400000);return d<=0?'hoy':d===1?'ayer':'hace '+d+' días';};

(async()=>{
  const hub=supabase.createClient(HUB.url,HUB.key);
  const {data:{session}}=await hub.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  try{
    const r=await fetch('/.netlify/functions/curso?vista=equipo',{headers:{Authorization:'Bearer '+session.access_token}});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
    const eq=d.equipo||[];
    $('sub').textContent=eq.length+' vendedores · nota mínima '+d.nota_minima+'%';
    $('kTot').textContent=eq.length;
    $('kOk').textContent=eq.filter(v=>v.completo).length;
    $('kNo').textContent=eq.filter(v=>v.aprobados===0).length;
    if(d.fecha_limite){const f=new Date(d.fecha_limite+'T12:00:00');$('limWrap').innerHTML='<div class="lim">📅 Fecha límite del curso: '+f.toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'})+'</div>';}
    if(!eq.length){ $('list').innerHTML='<div class="empty">No encontré vendedores en tu equipo.</div>'; return; }
    $('list').innerHTML=eq.map(v=>{
      const pct=v.total?Math.round(v.aprobados/v.total*100):0;
      const chip=v.completo?'<span class="chip ok">✓ Completo</span>':v.aprobados>0?'<span class="chip mid">En curso</span>':'<span class="chip no">Sin empezar</span>';
      return `<div class="row">
        <div class="av">${ini(v.nombre)}</div>
        <div class="who"><div class="n">${esc(v.nombre)}</div><div class="m">Cód. ${esc(v.codigo)} · ${v.canal==='off'?'OFF':v.canal==='ambos'?'ON+OFF':'ON'} · ${hace(v.ultima)}</div></div>
        <div class="prog"><div class="bar"><span style="width:${pct}%"></span></div><div class="t">${v.aprobados}/${v.total} módulos</div></div>
        ${chip}
      </div>`;
    }).join('');
  }catch(e){ $('list').innerHTML='<div class="empty">No se pudo cargar.<br>'+esc(e.message||'')+'</div>'; }
})();
</script>
<script src="assets/notif.js?v=2"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="/assets/minuta-fab.js?v=2"></script>
</body>
</html>
