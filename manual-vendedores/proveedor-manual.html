<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2230">
<title>GrandBar — Manual (Proveedor)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line2:#eee7d8;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--navy:#0d2230;--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  .top{background:var(--navy);color:#fff;padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
  .top a.back{color:#cdd9e0;text-decoration:none;font-size:22px;line-height:1}.top h1{font-size:16px;margin:0;font-weight:800}.top .sub{font-size:11px;color:#8fa3ad}
  .wrap{max-width:820px;margin:0 auto;padding:18px 14px 70px}
  .hint{background:var(--gold-s);border:1px solid #e7d3a1;border-radius:11px;padding:11px 13px;font-size:13px;color:#6a5312;margin-bottom:16px}
  .rubros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px 16px;cursor:pointer;text-align:center;transition:box-shadow .15s,border-color .15s}
  .rcard:hover{box-shadow:0 5px 20px rgba(13,34,48,.1);border-color:var(--gold)}
  .rcard .em{font-size:32px}.rcard .n{font-weight:800;font-size:15px;margin-top:8px}.rcard .c{font-size:12px;color:var(--muted);margin-top:2px}
  .rcard .dot{display:inline-block;margin-top:8px;font-size:11px;font-weight:700;color:var(--gold-d);background:var(--gold-s);border-radius:20px;padding:3px 9px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--gold-d);font:inherit;font-weight:700;font-size:13.5px;cursor:pointer;padding:0;margin-bottom:12px}
  .rhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .rhead .em{font-size:30px}.rhead .n{font-size:22px;font-weight:800}
  .sec{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 15px;margin-bottom:10px;display:flex;align-items:center;gap:13px}
  .sec .em{width:40px;height:40px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--cream);border:1px solid var(--line);border-radius:11px}
  .sec .info{flex:1;min-width:0}
  .sec .nm{font-weight:800;font-size:15px}
  .sec .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .sec .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .b{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .b.otros{background:#fdecec;color:#b04a34}.b.mia{background:var(--green-s);color:var(--green-d)}
  .prop-btn{border:0;background:var(--gold);color:#241a06;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}
  .ov{display:none;position:fixed;inset:0;background:rgba(13,34,48,.5);z-index:30;align-items:flex-end;justify-content:center}
  .ov.open{display:flex}
  .sheet{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
  .sheet h3{margin:0 0 3px;font-size:17px}.sheet .ss{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .tipo-chip{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:20px;background:var(--gold-s);color:var(--gold-d);margin-bottom:12px}
  label{display:block;font-size:12px;font-weight:700;color:#5a6870;margin:12px 0 5px}
  input,textarea,select{width:100%;border:1.5px solid #e0d8c8;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;outline:none;background:#fff}
  input:focus,textarea:focus,select:focus{border-color:var(--gold)}
  textarea{min-height:80px;resize:vertical}
  .row2{display:flex;gap:10px}.row2>div{flex:1}
  .btn{width:100%;margin-top:16px;border:0;border-radius:11px;background:var(--gold);color:#241a06;font:inherit;font-weight:800;font-size:15px;padding:13px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
  .toast.show{opacity:1}.toast.err{background:#c0603e}
  .empty{text-align:center;color:var(--muted);padding:30px}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="proveedor.html">‹</a>
    <div><h1>Manual de vendedores</h1><div class="sub">Proponé acciones por rubro</div></div>
  </div>
  <div class="wrap">
    <div class="hint">Elegí un rubro, después la sección, y tocá <b>Proponer acción</b>. Tu propuesta le llega a GrandBar para revisarla.</div>
    <div id="view"><div class="empty">Cargando…</div></div>
  </div>

  <!-- Modal proponer -->
  <div class="ov" id="ov">
    <div class="sheet">
      <h3 id="ovT">Proponer acción</h3>
      <div class="ss" id="ovS">—</div>
      <div id="subWrap"></div>
      <span class="tipo-chip" id="ovTipo" hidden></span>
      <div id="ovBody"></div>
      <button class="btn" id="f-btn" onclick="enviar()">Enviar propuesta</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="_config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RUBRO={restaurante:['🍽️','Restaurante'],bar:['🍸','Bar'],vinoteca:['🍷','Vinoteca'],autoservicio:['🏪','Autoservicio'],tienda_bebidas:['🏬','Tienda de Bebidas'],hotel:['🏨','Hotel'],disco:['💿','Disco'],evento:['🎉','Evento'],mayorista:['📦','Mayorista']};
const ORDEN=['restaurante','bar','vinoteca','autoservicio','tienda_bebidas','hotel','disco','evento','mayorista'];
const rLbl=r=>(RUBRO[r]?RUBRO[r][1]:r), rEm=r=>(RUBRO[r]?RUBRO[r][0]:'📘');
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2600);}

// El proveedor entra por el MISMO login del Hub (index.html) con rol 'proveedor'.
const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
let hub, PROV=null;
let SECS=[], MADRES={}, HIJAS={}, PROPS={};   // por canal
let curCanal=null, curSec=null;

(async()=>{
  hub=supabase.createClient(HUB.url,HUB.key);
  const {data:{session}}=await hub.auth.getSession();
  if(!session){ location.replace('../index.html'); return; }
  const {data:perfil}=await hub.from('usuarios').select('nombre,rol,empresa').eq('id',session.user.id).maybeSingle();
  if(!perfil || perfil.rol!=='proveedor'){ location.replace('../index.html'); return; }
  PROV={empresa: perfil.empresa || perfil.nombre, nombre: perfil.nombre};
  try{
    const [{data:secs},{data:props}]=await Promise.all([
      sb.from('checklist_secciones').select('id,canal,codigo,nombre,icono,orden,parent_id').eq('zona','mendoza').eq('activa',true).order('orden'),
      sb.from('propuestas_acciones').select('rubro,seccion,autor_empresa,estado').in('estado',['pendiente','aprobada'])
    ]);
    SECS=secs||[];
    // agrupar madres/hijas por canal
    SECS.forEach(s=>{
      if(!s.parent_id){ (MADRES[s.canal]=MADRES[s.canal]||[]).push(s); }
    });
    SECS.forEach(s=>{ if(s.parent_id){ (HIJAS[s.parent_id]=HIJAS[s.parent_id]||[]).push(s); } });
    // conteo de propuestas por canal|seccion
    (props||[]).forEach(p=>{
      const k=p.rubro+'|'+p.seccion; PROPS[k]=PROPS[k]||{otras:new Set(),mia:false};
      if((p.autor_empresa||'')===PROV.empresa) PROPS[k].mia=true;
      else if(p.autor_empresa) PROPS[k].otras.add(p.autor_empresa);
    });
    const qp=new URLSearchParams(location.search);
    if(qp.get('rubro') && MADRES[qp.get('rubro')]){ verRubro(qp.get('rubro'), qp.get('seccion')||null); }
    else verRubros();
  }catch(e){ $('view').innerHTML='<div class="empty">No se pudo cargar el manual.</div>'; }
})();

function verRubros(){
  curCanal=null;
  const canales=ORDEN.filter(c=>MADRES[c] && MADRES[c].length);
  $('view').innerHTML='<div class="rubros">'+canales.map(c=>{
    const n=MADRES[c].length;
    return `<div class="rcard" onclick="verRubro('${c}')"><div class="em">${rEm(c)}</div><div class="n">${esc(rLbl(c))}</div><div class="c">${n} secciones</div></div>`;
  }).join('')+'</div>';
}

function verRubro(canal, abrirSeccion){
  curCanal=canal;
  const madres=(MADRES[canal]||[]).slice().sort((a,b)=>a.orden-b.orden);
  $('view').innerHTML=`<button class="back-btn" onclick="verRubros()">‹ Todos los rubros</button>
    <div class="rhead"><div class="em">${rEm(canal)}</div><div class="n">${esc(rLbl(canal))}</div></div>`+
    madres.map(m=>{
      const k=canal+'|'+m.nombre; const info=PROPS[k]||{otras:new Set(),mia:false};
      const badges=[];
      if(info.mia) badges.push('<span class="b mia">✓ Ya propusiste</span>');
      if(info.otras.size) badges.push(`<span class="b otros">👀 ${info.otras.size} de otros</span>`);
      return `<div class="sec"><div class="em">${m.icono||'📄'}</div>
        <div class="info"><div class="nm">${esc(m.nombre)}</div>
          <div class="meta">${(HIJAS[m.id]||[]).length?((HIJAS[m.id]||[]).length+' subsecciones'):'Sección'}</div>
          ${badges.length?`<div class="badges">${badges.join('')}</div>`:''}
        </div>
        <button class="prop-btn" onclick="abrir('${m.id}')">Proponer acción</button>
      </div>`;
    }).join('');
  if(abrirSeccion){
    const m=madres.find(x=>x.nombre===abrirSeccion); if(m) abrir(m.id);
  }
}

// ── Tipo de sección → qué formulario abrir (igual criterio que el manual) ──
const MIX_COD=new Set(['oportunidades_en_carta']);
const VC_COD=new Set(['vino_por_copa','vino_por_copa_de_bienvenid']);
function tipoDe(sec){
  const c=String(sec.codigo||''), n=String(sec.nombre||'');
  if(MIX_COD.has(c) || /mix\s*ideal/i.test(n)) return 'mix_ideal';
  if(VC_COD.has(c) || /vino\s+por\s+copa/i.test(n) || /copa\s+de\s+bienvenida/i.test(n)) return 'vino_copa';
  return 'accion';
}
const TIPO_LBL={mix_ideal:'✨ Mix Ideal',vino_copa:'🍷 Vino por Copa',accion:''};

function formBody(tipo){
  if(tipo==='mix_ideal') return `
    <label for="f-nombre">Nombre del mix *</label><input id="f-nombre" placeholder="Ej: Mix Previa Campari">
    <label for="f-nivel">Nivel (opcional)</label><input id="f-nivel" placeholder="Ej: Básico / Alta gama">
    <label for="f-cont">Productos que incluye *</label><textarea id="f-cont" placeholder="Un producto por línea. Ej:&#10;1 Aperol&#10;1 Campari&#10;1 Espumante"></textarea>
    <label for="f-precio">Precio del combo (opcional)</label><input id="f-precio" type="number" min="0" placeholder="Ej: 85000">
    <label for="f-nota">Nota para el vendedor (opcional)</label><input id="f-nota" placeholder="Ej: ideal para bares que arman previa">`;
  if(tipo==='vino_copa') return `
    <label for="f-nombre">Nombre del vino *</label><input id="f-nombre" placeholder="Ej: Alma Mora Malbec">
    <label for="f-cond">Condición especial *</label><textarea id="f-cond" placeholder="Ej: 1+1 en la primera compra para copa de la casa"></textarea>
    <label for="f-precio">Precio de la botella (opcional)</label><input id="f-precio" type="number" min="0" placeholder="Ej: 8000">
    <label for="f-nota">Nota para el vendedor (opcional)</label><input id="f-nota" placeholder="Ej: buena rotación, copa accesible">`;
  return `
    <label for="f-tit">Título de la acción *</label><input id="f-tit" placeholder="Ej: 6+2 en línea Salentein">
    <label for="f-cond">Condición (opcional)</label><input id="f-cond" placeholder="Ej: 1+1 · 3+1 · 20% OFF">
    <label for="f-desc">Descripción / argumento</label><textarea id="f-desc" placeholder="Contá de qué se trata, en qué ayuda al vendedor, etc."></textarea>
    <div class="row2"><div><label for="f-vd">Vigencia desde</label><input id="f-vd" type="date"></div><div><label for="f-vh">Vigencia hasta</label><input id="f-vh" type="date"></div></div>`;
}

let curMadre=null, curTipo='accion';
function abrir(madreId){
  const m=SECS.find(s=>s.id===madreId); if(!m) return;
  curSec=m; curMadre=m;
  $('ovS').textContent=rLbl(curCanal)+' › '+m.nombre;
  const hijas=HIJAS[m.id]||[];
  $('subWrap').innerHTML = hijas.length
    ? `<label for="f-sub">Subsección</label><select id="f-sub" onchange="cambiarSub()"><option value="">— General (toda la sección) —</option>${hijas.map(h=>`<option value="${esc(h.nombre)}">${esc(h.nombre)}</option>`).join('')}</select>`
    : '';
  cambiarSub();
  $('ov').classList.add('open');
}
// El formulario se arma según la SUBSECCIÓN elegida (ej. "Mix Ideal" abre el form de mix).
function cambiarSub(){
  const subName=($('f-sub')&&$('f-sub').value)||'';
  curTipo=tipoDe(subName ? {nombre:subName,codigo:''} : curMadre);
  $('ovT').textContent = curTipo==='mix_ideal'?'Proponer Mix Ideal' : curTipo==='vino_copa'?'Proponer Vino por Copa' : 'Proponer acción';
  const chip=$('ovTipo'); if(TIPO_LBL[curTipo]){ chip.textContent=TIPO_LBL[curTipo]; chip.hidden=false; } else chip.hidden=true;
  $('ovBody').innerHTML=formBody(curTipo);
}
window.cambiarSub=cambiarSub;
$('ov').addEventListener('click',e=>{ if(e.target.id==='ov') $('ov').classList.remove('open'); });

async function enviar(){
  const val=id=>{const e=$(id);return e?e.value.trim():'';};
  const sub=($('f-sub')&&$('f-sub').value)||null;
  let titulo, condicion=null, descripcion=null, vd=null, vh=null, payload={};
  if(curTipo==='mix_ideal'){
    titulo=val('f-nombre'); if(!titulo){ toast('Poné el nombre del mix',true); return; }
    const cont=val('f-cont'); if(!cont){ toast('Cargá los productos del mix',true); return; }
    payload={nombre:titulo,nivel:val('f-nivel')||null,contenido:cont,precio:val('f-precio')||null,nota:val('f-nota')||null};
    descripcion=cont;
  } else if(curTipo==='vino_copa'){
    titulo=val('f-nombre'); if(!titulo){ toast('Poné el nombre del vino',true); return; }
    const cond=val('f-cond'); if(!cond){ toast('Poné la condición especial',true); return; }
    payload={nombre:titulo,proveedor:PROV.empresa,condicion:cond,precio:val('f-precio')||null,nota:val('f-nota')||null};
    condicion=cond;
  } else {
    titulo=val('f-tit'); if(!titulo){ toast('Poné un título',true); return; }
    condicion=val('f-cond')||null; descripcion=val('f-desc')||null; vd=val('f-vd')||null; vh=val('f-vh')||null;
  }
  const row={
    rubro:curCanal, seccion:curSec.nombre, subseccion:sub, titulo, condicion, descripcion,
    vigencia_desde:vd, vigencia_hasta:vh, adjuntos:[], autor_nombre:PROV.empresa, autor_rol:'proveedor',
    autor_empresa:PROV.empresa, estado:'pendiente', tipo:curTipo, payload
  };
  $('f-btn').disabled=true; $('f-btn').textContent='Enviando…';
  try{
    const { error }=await sb.from('propuestas_acciones').insert(row);
    if(error) throw error;
    const k=curCanal+'|'+curSec.nombre; PROPS[k]=PROPS[k]||{otras:new Set(),mia:false}; PROPS[k].mia=true;
    $('ov').classList.remove('open');
    toast('✅ Propuesta enviada a GrandBar');
    verRubro(curCanal);
  }catch(e){ toast('No se pudo enviar: '+(e.message||''),true); }
  finally{ $('f-btn').disabled=false; $('f-btn').textContent='Enviar propuesta'; }
}
window.verRubros=verRubros; window.verRubro=verRubro; window.abrir=abrir; window.enviar=enviar;
</script>
</body>
</html>
