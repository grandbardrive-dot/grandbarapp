<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrandBar — Mis reportes</title>
<style>
  /* Mis reportes dentro del panel comercial (30/09/2026). Es la misma función que
     /mis-reportes.html (reportes para Dirección), pero sin salir del panel. */
  :root{
    --navy:#1F447F; --navy-d:#16305a; --navy-dd:#0f2340;
    --gold:#CBB86A; --gold-d:#B08D2E;
    --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#FBF9F5;
    --ink:#1F1B16; --ink2:#5f574c; --ink3:#9a9187;
    --line:rgba(31,68,127,.10); --line-2:rgba(31,68,127,.16);
    --green:#2D6A4F; --green-bg:#E7F1EC;
    --red:#C0392B;  --red-bg:#FBEAE7;
    --amber:#9A6B0E; --amber-bg:#FaF0DA;
    --shadow:0 1px 2px rgba(31,68,127,.05), 0 14px 34px rgba(31,68,127,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  @media (max-width:820px){ .layout{grid-template-columns:1fr} .sidebar{display:none} }

  /* Sidebar */
  .sidebar{background:linear-gradient(185deg,var(--navy),var(--navy-d) 62%,var(--navy-dd));color:#fff;display:flex;flex-direction:column;padding:0 0 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-logo{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
  .sb-logo img{height:38px;object-fit:contain}
  .sb-collapse{background:rgba(255,255,255,.08);border:none;color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .sb-collapse svg{width:16px;height:16px}
  .sb-nav{display:flex;flex-direction:column;gap:3px;padding:16px 12px}
  .sb-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:rgba(255,255,255,.72);cursor:pointer;transition:background .15s,color .15s;background:none;border:none;font-family:inherit;text-align:left;width:100%}
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .sb-item.active{background:rgba(255,255,255,.12);color:#fff}
  .sb-item.active .sb-ico{color:var(--gold)}
  .sb-ico{width:20px;height:20px;flex:none;color:rgba(255,255,255,.6)}
  .sb-item.active .sb-txt-main{font-weight:700}
  .sb-txt-main{font-size:14px;line-height:1.15}
  .sb-txt-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
  .sb-spacer{flex:1}

  /* Topbar */
  .topbar{background:var(--navy);border-bottom:3px solid var(--gold);height:70px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 70px 0 26px;position:relative}
  .tb-user{display:flex;align-items:center;gap:11px;cursor:pointer;padding:6px 8px;border-radius:11px;transition:background .15s}
  .tb-user:hover{background:rgba(255,255,255,.08)}
  .tb-ava{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--navy-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
  .tb-user-info{text-align:right;line-height:1.2}
  .tb-user-name{font-size:14px;font-weight:700;color:#fff}
  .tb-user-role{font-size:11px;color:rgba(255,255,255,.6)}
  .menu{position:absolute;top:64px;right:70px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.16);padding:6px;display:none;z-index:50;min-width:180px}
  .menu.open{display:block}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left}
  .menu button:hover{background:var(--surface2)}

  /* Contenido */
  .content{padding:28px 30px 60px;max-width:980px}
  .page-title{font-size:clamp(24px,3vw,31px);font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:12px}
  .page-title .ico{width:44px;height:44px;border-radius:12px;background:rgba(31,68,127,.09);color:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}
  .page-title .ico svg{width:24px;height:24px}
  .page-sub{color:var(--ink2);font-size:14.5px;margin-top:8px;max-width:64ch;line-height:1.5}
  .cols{display:grid;grid-template-columns:400px 1fr;gap:18px;margin-top:24px;align-items:start}
  @media (max-width:960px){ .cols{grid-template-columns:1fr} }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .card-h{font-size:16px;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:4px}
  .card-h .dot{width:9px;height:9px;border-radius:3px;background:var(--gold)}
  .card-sub{font-size:12.5px;color:var(--ink3);margin-bottom:16px}
  .fg{margin-bottom:14px}
  .fg label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.03em;color:var(--ink2);margin-bottom:6px}
  .fg input,.fg select,.fg textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line-2);border-radius:10px;font-size:14px;font-family:inherit;background:var(--surface);color:var(--ink);outline:none}
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--navy)}
  .fg textarea{resize:vertical;min-height:140px}
  .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .btn-guardar{width:100%;background:linear-gradient(160deg,var(--navy),var(--navy-d));color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
  .btn-guardar:disabled{opacity:.6}
  .form-msg{font-size:12.5px;text-align:center;margin-top:10px;font-weight:700;min-height:16px}
  .list-title{font-size:16px;font-weight:800;margin-bottom:10px}
  .rep{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:11px}
  .rep .h{display:flex;align-items:flex-start;gap:8px;margin-bottom:4px}
  .rep .ti{font-weight:800;font-size:15px;flex:1}
  .rep .me{font-size:12px;color:var(--ink3);margin-bottom:8px}
  .rep .co{font-size:13px;white-space:pre-wrap;color:var(--ink2);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;line-height:1.45}
  .rep .lk{font-size:12.5px;font-weight:700;color:var(--navy);text-decoration:underline}
  .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .b-pend{background:var(--surface2);color:var(--ink3);border:1px solid var(--line-2)} .b-aprob{background:var(--green-bg);color:var(--green)} .b-rech{background:var(--red-bg);color:var(--red)} .b-rev{background:var(--amber-bg);color:var(--amber)}
  .devo{border-left:3px solid var(--gold);background:#FBF6E6;border-radius:0 10px 10px 0;padding:9px 12px;font-size:12.5px;margin-top:6px;line-height:1.45}
  .devo b{color:var(--gold-d)}
  .del{display:block;margin-top:8px;background:none;border:0;color:var(--ink3);font-size:12px;cursor:pointer;text-decoration:underline;font-family:inherit;padding:0}
  .del:hover{color:var(--red)}
  .empty{padding:34px;text-align:center;color:var(--ink3);background:var(--surface);border:1px dashed var(--line-2);border-radius:14px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-logo">
      <button class="sb-collapse" onclick="location.href='admin-comercial.html'" title="Volver al inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <img src="GrandBar%20logotipo%20con%20sombra-05%20%282%29.png" alt="GrandBar Distribuciones">
    </div>
    <nav class="sb-nav"></nav>
    <div class="sb-spacer"></div>
  </aside>

  <div>
    <header class="topbar">
      <div class="tb-user" onclick="toggleMenu(event)">
        <div class="tb-ava" id="tb-ava">L</div>
        <div class="tb-user-info"><div class="tb-user-name" id="tb-nombre">Luciana</div><div class="tb-user-role">Gestora Comercial</div></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.6)" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="menu" id="perfil-menu"><button onclick="cerrarSesion()">🚪 Cerrar sesión</button></div>
    </header>

    <main class="content">
      <div class="page-title"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/></svg></span>Mis reportes</div>
      <div class="page-sub" id="sub">Los reportes que le mandás a Dirección. Cuando los revisen, acá ves si los aprobaron o si piden cambios.</div>

      <div class="cols">
        <div class="card">
          <div class="card-h"><span class="dot"></span>Nuevo reporte</div>
          <div class="card-sub">Se manda a Dirección apenas lo enviás.</div>
          <div class="fg"><label for="titulo">Título</label><input id="titulo" placeholder="Ej: Plan 11T Peñaflor — septiembre" maxlength="120"></div>
          <div class="fg-row">
            <div class="fg"><label for="tipo">Tipo</label><select id="tipo"><option value="diario">Diario</option><option value="semanal">Semanal</option><option value="mensual">Mensual</option><option value="puntual">Puntual</option></select></div>
            <div class="fg"><label for="periodo">Período</label><input id="periodo" placeholder="Ej: 18/08 o Semana 18-24"></div>
          </div>
          <div class="fg"><label for="contenido">Reporte</label><textarea id="contenido" placeholder="Qué se hizo, números, novedades, pendientes…"></textarea></div>
          <div class="fg"><label for="enlace">Enlace (opcional)</label><input id="enlace" placeholder="Link a Drive / PDF / planilla"></div>
          <button class="btn-guardar" id="enviar" type="button">Enviar a Dirección</button>
          <div class="form-msg" id="msg"></div>
        </div>
        <div>
          <div class="list-title">Enviados</div>
          <div id="lista"><div class="empty">Cargando…</div></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const HUB = { url:'https://xqhyemccbwmzxqzkrtwa.supabase.co', key:'sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc' };
  const FN = '/.netlify/functions/reportes';
  let TOKEN = null;
  const $ = id => document.getElementById(id);
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const linkOk = u => /^https?:\/\//i.test(String(u||'')) ? u : '';
  const BADGE = { pendiente:['b-pend','Pendiente'], aprobado:['b-aprob','Aprobado'], rechazado:['b-rech','Rechazado'], revision:['b-rev','Pide cambios'] };
  const msg = (t, color) => { $('msg').style.color = color || 'var(--ink2)'; $('msg').textContent = t; };

  async function cargar(){
    try{
      const r = await fetch(FN, { headers:{ Authorization:'Bearer '+TOKEN } });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || 'error '+r.status);
      const L = $('lista'), reps = d.reportes || [];
      if(!reps.length){ L.innerHTML = '<div class="empty">Todavía no mandaste reportes.</div>'; return; }
      L.innerHTML = reps.map(x => {
        const bd = BADGE[x.estado] || BADGE.pendiente;
        const fecha = new Date(x.created_at).toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit'});
        const lk = linkOk(x.enlace);
        return `<div class="rep">
          <div class="h"><span class="ti">${esc(x.titulo)}</span><span class="badge ${bd[0]}">${bd[1]}</span></div>
          <div class="me">${esc(x.area||'')}${x.area?' · ':''}${esc(x.tipo)}${x.periodo?' · '+esc(x.periodo):''} · ${fecha}</div>
          ${x.contenido?`<div class="co">${esc(x.contenido)}</div>`:''}
          ${lk?`<a class="lk" href="${esc(lk)}" target="_blank" rel="noopener">Ver enlace</a>`:''}
          ${x.devolucion?`<div class="devo"><b>Devolución de Dirección:</b><br>${esc(x.devolucion)}</div>`:''}
          ${x.estado==='pendiente'?`<button class="del" data-del="${esc(x.id)}" type="button">Eliminar</button>`:''}
        </div>`;
      }).join('');
      L.querySelectorAll('[data-del]').forEach(b => b.onclick = () => borrar(b.dataset.del));
    }catch(e){ $('lista').innerHTML = '<div class="empty">No se pudieron leer tus reportes: '+esc(e.message)+'</div>'; }
  }

  async function borrar(id){
    if(!confirm('¿Eliminar este reporte? Todavía no lo revisaron.')) return;
    try{
      const r = await fetch(FN, { method:'POST', headers:{ Authorization:'Bearer '+TOKEN, 'Content-Type':'application/json' }, body:JSON.stringify({ accion:'borrar', id }) });
      if(!r.ok){ const d = await r.json().catch(()=>({})); throw new Error(d.error || 'error '+r.status); }
    }catch(e){ alert('No se pudo eliminar: '+e.message); }
    cargar();
  }

  $('enviar').onclick = async () => {
    const titulo = $('titulo').value.trim(), contenido = $('contenido').value.trim(), enlace = $('enlace').value.trim();
    if(!titulo) return msg('Poné un título.', 'var(--red)');
    if(!contenido && !enlace) return msg('Escribí el reporte o pegá un enlace.', 'var(--red)');
    $('enviar').disabled = true; msg('Enviando…');
    try{
      const body = { accion:'crear', titulo, tipo:$('tipo').value, periodo:$('periodo').value.trim(), contenido, enlace };
      const r = await fetch(FN, { method:'POST', headers:{ Authorization:'Bearer '+TOKEN, 'Content-Type':'application/json' }, body:JSON.stringify(body) });
      const d = await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error || 'error '+r.status);
      ['titulo','periodo','contenido','enlace'].forEach(k => $(k).value = '');
      msg('Enviado a Dirección.', 'var(--green)');
      cargar();
    }catch(e){ msg('No se pudo enviar: '+e.message, 'var(--red)'); }
    finally{ $('enviar').disabled = false; }
  };

  function toggleMenu(ev){ ev.stopPropagation(); $('perfil-menu').classList.toggle('open'); }
  document.addEventListener('click', () => $('perfil-menu').classList.remove('open'));
  function cerrarSesion(){
    sessionStorage.removeItem('admin_auth'); sessionStorage.removeItem('admin_perfil');
    try{
      localStorage.removeItem('gb_demo');
      Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k));
    }catch(e){}
    location.href = '/index.html';
  }

  (async () => {
    const hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href = '/index.html'; return; }
    TOKEN = session.access_token;
    const { data:u } = await hub.from('usuarios').select('nombre').eq('id', session.user.id).maybeSingle();
    if(u && u.nombre){
      $('tb-nombre').textContent = u.nombre.trim().split(/\s+/)[0];
      $('tb-ava').textContent = u.nombre.trim().charAt(0).toUpperCase();
    }
    cargar();
  })();
</script>
<script src="/assets/minuta-fab.js?v=2"></script>
<script src="_comercial-nav.js?v=5"></script>
</body>
</html>
