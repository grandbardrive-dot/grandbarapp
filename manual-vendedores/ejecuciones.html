<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Ejecuciones · GrandBar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --navy:#1F447F; --navy-d:#16305a; --navy-dd:#0b1d38; --gold:#CBB86A; --gold-2:#e4cf8f; --gold-d:#9c7d26;
    --bg:#F3EFE7; --surface:#fff; --surface2:#FBF9F5; --ink:#1b1712; --ink2:#5f574c; --ink3:#9a9187;
    --line:#ece5d6; --green:#2D6A4F; --green-bg:#E7F1EC; --red:#C0392B; --red-bg:#FBEAE7; --amber:#9A6B0E; --amber-bg:#FAF0DA;
    --shadow:0 1px 2px rgba(20,30,50,.04),0 10px 26px rgba(20,30,50,.07);
    --font:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --disp:'Fraunces',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
  .phone{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:46px}
  /* header */
  .hd{position:relative;overflow:hidden;background:linear-gradient(168deg,#24508f,var(--navy-dd));color:#fff;padding:16px 18px 20px;border-bottom:2px solid var(--gold)}
  .hd::before{content:"";position:absolute;top:-90px;right:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(203,184,106,.32),transparent 70%)}
  .hd>*{position:relative}
  .hd .top{display:flex;align-items:center;gap:9px;font-size:12px;color:rgba(255,255,255,.62);letter-spacing:.02em}
  .hd .back{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;padding:5px 10px;font-size:12px;cursor:pointer;text-decoration:none}
  .hd h1{font-family:var(--disp);font-weight:600;font-size:25px;letter-spacing:.2px;margin:11px 0 3px}
  .hd p{font-size:12.5px;color:rgba(255,255,255,.74);max-width:44ch;line-height:1.5}
  /* billetera */
  .wal{margin:15px 0 2px;background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1px solid rgba(203,184,106,.5);border-radius:16px;padding:13px 15px;display:flex;align-items:center;gap:13px}
  .wal .wcoin{flex:none;width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,var(--gold-2),var(--gold-d));display:flex;align-items:center;justify-content:center;font-size:23px;box-shadow:0 4px 12px rgba(203,184,106,.35)}
  .wal .wmain{flex:1;min-width:0}
  .wal .l{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--gold-2)}
  .wal .pts{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1.05;color:#fff;font-variant-numeric:tabular-nums}
  .wal .pts small{font-family:var(--font);font-size:12.5px;font-weight:600;color:rgba(255,255,255,.65)}
  .wal .eq{text-align:right;flex:none}
  .wal .eq .m{font-family:var(--disp);font-size:21px;font-weight:700;color:var(--gold-2);font-variant-numeric:tabular-nums}
  .wal .eq .s{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:2px}
  /* tabs segmentadas */
  .tabbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px 6px}
  .tabs{display:flex;gap:3px;padding:4px;background:#e7dfcf;border-radius:13px}
  .tab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:12.5px;font-weight:700;color:var(--ink2);background:transparent;border:0;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s}
  .tab.on{background:var(--surface);color:var(--navy);box-shadow:0 2px 7px rgba(20,30,50,.1)}
  .wrap{padding:4px 14px 0}
  .sec{display:none}.sec.on{display:block;animation:fade .34s ease}
  @keyframes fade{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.sec.on{animation:none}}
  /* card catálogo */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 14px;margin-bottom:13px;box-shadow:var(--shadow)}
  .card .r1{display:flex;align-items:center;gap:12px}
  .ico{flex:none;width:50px;height:50px;border-radius:14px;background:linear-gradient(145deg,#eaf0f8,#dce6f3);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:inset 0 0 0 1px rgba(31,68,127,.08)}
  .ti{flex:1;min-width:0}.ti b{font-size:15.5px;font-weight:800;display:block;color:var(--ink);letter-spacing:-.1px}.ti small{font-size:12px;color:var(--ink2);display:block;margin-top:1px}
  .pts-badge{flex:none;background:linear-gradient(140deg,var(--gold-2),var(--gold-d));color:#3a2d06;font-weight:800;font-size:15px;border-radius:12px;padding:6px 11px;white-space:nowrap;text-align:center;box-shadow:0 3px 8px rgba(203,184,106,.3);line-height:1}
  .pts-badge .star{display:block;font-size:10px;opacity:.85;margin-bottom:2px}
  .pts-badge small{font-weight:700;font-size:8.5px;display:block;letter-spacing:.07em;margin-top:2px}
  .acts{display:flex;gap:8px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
  .btn{flex:1;border-radius:11px;padding:11px;font:inherit;font-size:13px;font-weight:800;cursor:pointer;border:1px solid var(--navy);display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#fff;color:var(--navy)}.btn.ghost:hover{background:var(--surface2)}
  .btn.solid{background:linear-gradient(145deg,#2a5aa2,var(--navy-d));color:#fff;border-color:var(--navy-d)}.btn.solid:hover{filter:brightness(1.06)}
  .btn:disabled{opacity:.55;cursor:default}
  /* mis ejecuciones */
  .ev{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:11px 12px;margin-bottom:11px;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow)}
  .ev .ph{flex:none;width:56px;height:56px;border-radius:12px;background:#dfe6ef center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#9bb0c9;font-size:19px;overflow:hidden}
  .ev .ph img{width:100%;height:100%;object-fit:cover}
  .ev .in{flex:1;min-width:0}.ev .in b{font-size:14px;font-weight:800;display:block}.ev .in small{font-size:11.5px;color:var(--ink2);display:block;margin-top:1px}
  .st{font-size:10.5px;font-weight:800;border-radius:999px;padding:4px 10px;white-space:nowrap;letter-spacing:.02em}
  .st.ap{background:var(--green-bg);color:var(--green)}.st.pe{background:var(--amber-bg);color:var(--amber)}.st.re{background:var(--red-bg);color:var(--red)}
  .ev .pp{font-family:var(--disp);font-weight:700;color:var(--gold-d);font-size:15px;text-align:right;margin-top:5px}
  /* cómo funciona */
  .step{display:flex;gap:13px;margin-bottom:15px}
  .step:last-child{margin-bottom:0}
  .step .n{flex:none;width:30px;height:30px;border-radius:50%;background:linear-gradient(140deg,var(--gold-2),var(--gold-d));color:#3a2d06;font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px}
  .step .t b{font-size:14px}.step .t p{font-size:12.5px;color:var(--ink2);margin-top:1px}
  .mnote{background:var(--amber-bg);border:1px solid rgba(154,107,14,.22);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#6b4e0c;margin-bottom:10px}
  .empty{text-align:center;color:var(--ink3);font-size:13.5px;padding:40px 16px;line-height:1.55}
  .ov{position:fixed;inset:0;background:rgba(15,35,64,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .ov[hidden]{display:none}
  .md{background:var(--bg);width:100%;max-width:480px;max-height:93vh;overflow:auto;border-radius:18px 18px 0 0}
  @media(min-width:600px){.ov{align-items:center}.md{border-radius:18px}}
  .mh{background:var(--navy);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
  .mh b{font-size:15.5px}.mh .x{background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;border-radius:9px;font-size:16px;cursor:pointer}
  .mb{padding:15px 16px 20px}
  .exh{border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px;background:var(--surface)}
  .exh .cap{display:flex;align-items:center;gap:7px;padding:9px 13px;font-weight:800;font-size:14px;color:#fff}
  .exh.si .cap{background:var(--green)}.exh.no .cap{background:var(--red)}
  .exh .ph{width:100%;max-height:170px;object-fit:cover;display:block;background:#e7ecf2}
  .exh ul{list-style:none;padding:10px 13px}
  .exh li{display:flex;gap:8px;font-size:12.8px;padding:4px 0;align-items:flex-start}
  .exh li .ic{flex:none;font-weight:900}.exh.si li .ic{color:var(--green)}.exh.no li .ic{color:var(--red)}
  .lb{font-size:12.5px;font-weight:800;color:#1b2a32;margin:8px 0 5px;display:block}
  .in{width:100%;border:1.5px solid #dfe3e6;border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:var(--surface);box-sizing:border-box}
  textarea.in{min-height:58px;resize:vertical}
  .fotos{display:flex;gap:8px;flex-wrap:wrap}
  .f{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:#eee}
  .f img{width:100%;height:100%;object-fit:cover}
  .f button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;cursor:pointer}
  .add{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed #b9c3cc;border-radius:11px;padding:13px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer}
  .msg{font-size:13px;color:var(--red);min-height:1px;margin-top:6px}
  .mfoot{position:sticky;bottom:0;background:var(--bg);padding:12px 16px 16px;border-top:1px solid var(--line)}
  .load{text-align:center;padding:50px 10px;color:var(--ink3);font-size:14px}
</style>
</head>
<body>
<div class="phone" id="app"><div class="load">Cargando…</div></div>

<!-- MODAL MANUAL -->
<div class="ov" id="ovMan" hidden><div class="md">
  <div class="mh"><b id="manTit">Manual</b><button class="x" onclick="cerrar('ovMan')">✕</button></div>
  <div class="mb" id="manBody"></div>
  <div class="mfoot"><button class="btn solid" style="width:100%" id="manCargar">📷 Cargar esta ejecución</button></div>
</div></div>

<!-- MODAL CARGA -->
<div class="ov" id="ovCar" hidden><div class="md">
  <div class="mh"><b id="carTit">Cargar ejecución</b><button class="x" onclick="cerrar('ovCar')">✕</button></div>
  <div class="mb">
    <div class="card" style="margin-bottom:12px;padding:11px 13px"><div style="display:flex;justify-content:space-between;align-items:center"><div><b id="carNom" style="font-size:14px"></b><br><small id="carDesc" style="color:var(--ink2);font-size:12px"></small></div><span class="pts-badge" id="carPts"></span></div></div>
    <label class="lb">Fotos del punto de venta <small style="font-weight:500;color:#8a929a">(hasta 3)</small></label>
    <div class="fotos" id="carFotos"></div>
    <label class="add" id="carAdd" style="margin-top:8px"><input type="file" accept="image/*" multiple id="carFile" hidden>📷 Agregar foto</label>
    <label class="lb" for="carCli" id="carCliLb">Cliente <small style="font-weight:500;color:#8a929a">(opcional)</small></label>
    <input class="in" id="carCli" list="carCliList" placeholder="Nombre o código del cliente">
    <datalist id="carCliList"></datalist>
    <div id="carQuest"></div>
    <label class="lb" for="carCom">Comentario <small style="font-weight:500;color:#8a929a">(opcional)</small></label>
    <textarea class="in" id="carCom" maxlength="500" placeholder="Qué se ve en la foto…"></textarea>
    <div class="msg" id="carMsg"></div>
  </div>
  <div class="mfoot"><button class="btn solid" style="width:100%" id="carOk">Enviar ejecución</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FN='/.netlify/functions/ejecuciones';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let HUBCLI=null, DATA=null, FOTOS=[], ACTUAL=null, CARTERA=[];
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
if(EMBED) document.documentElement.style.background='transparent';
function hub(){ return HUBCLI=HUBCLI||supabase.createClient('https://xqhyemccbwmzxqzkrtwa.supabase.co','sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc'); }
async function token(){ try{ const {data}=await hub().auth.getSession(); return data&&data.session&&data.session.access_token||null; }catch(e){ return null; } }
function abrir(id){ document.getElementById(id).hidden=false; document.body.style.overflow='hidden'; }
function cerrar(id){ document.getElementById(id).hidden=true; document.body.style.overflow=''; }
function money(n){ return '$'+Math.round(n).toLocaleString('es-AR'); }

async function cargar(){
  const tok=await token();
  if(!tok){ document.getElementById('app').innerHTML='<div class="load">Para ver tus ejecuciones, entrá al manual desde el Portal (portalgrandbar.com) con tu cuenta.</div>'; return; }
  try{
    const r=await fetch(FN+'?vista=vendedor',{headers:{Authorization:'Bearer '+tok}});
    DATA=await r.json();
    if(!r.ok) throw new Error(DATA.error||'No se pudo cargar.');
  }catch(e){ document.getElementById('app').innerHTML='<div class="load">'+esc(e.message)+'</div>'; return; }
  pintar();
  cargarCartera();
}

function pintar(){
  const c=DATA.config||{valor_punto:100};
  const prov='Campari';
  const pts=(DATA.puntos||{})[prov]||0;
  const tipos=DATA.tipos||[];
  const KAF=!!DATA.esKaf;
  const app=document.getElementById('app');
  const walHTML = KAF ? '' :
     '<div class="wal"><div class="wcoin">🏆</div><div class="wmain"><div class="l">Tus puntos '+esc(prov)+'</div><div class="pts">'+pts+'<small> pts</small></div></div>'+
       '<div class="eq"><div class="m">'+money(pts*c.valor_punto)+'</div><div class="s">1 pto = '+money(c.valor_punto)+(c.nota?' · '+esc(c.nota):'')+'</div></div></div>';
  app.innerHTML=
   '<div class="hd"><div class="top">'+(EMBED?'':'<a class="back" href="'+(KAF?'/kaf.html':'clientes.html')+'">‹ Volver</a>')+'<span>'+(KAF?'KAF · Ejecuciones':'Manual del vendedor · Ejecuciones')+'</span></div>'+
     '<h1>Ejecuciones '+esc(prov)+'</h1>'+
     '<p>'+(KAF?'Entrá al punto de venta, sacá la foto de la ejecución y cargá el resultado (cuestionario al cliente).':'Armá exhibiciones bien logradas, sacá la foto y sumá puntos. Los puntos se transforman en plata.')+'</p>'+
     walHTML+
   '</div>'+
   '<div class="tabbar"><div class="tabs"><button class="tab on" data-t="cat">Catálogo</button><button class="tab" data-t="mis">Mis ejecuciones</button><button class="tab" data-t="como">Cómo funciona</button></div></div>'+
   '<div class="wrap">'+
     '<div class="sec on" id="cat">'+(tipos.length?tipos.map(cardTipo).join(''):'<div class="empty">Todavía no hay ejecuciones cargadas.</div>')+'</div>'+
     '<div class="sec" id="mis">'+misHTML()+'</div>'+
     '<div class="sec" id="como">'+comoHTML()+'</div>'+
   '</div>';
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    app.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    app.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); document.getElementById(t.dataset.t).classList.add('on'); window.scrollTo(0,0);
  });
  app.querySelectorAll('[data-man]').forEach(b=>b.onclick=()=>verManual(b.dataset.man));
  app.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>abrirCarga(b.dataset.car));
}
function tipoPorId(id){ return (DATA.tipos||[]).find(t=>t.id===id); }
function cardTipo(t){
  const badge=DATA.esKaf?'':'<div class="pts-badge"><span class="star">★</span>'+(t.puntos||0)+'<small>PTS</small></div>';
  return '<div class="card"><div class="r1"><div class="ico">'+esc(t.icono||'📦')+'</div>'+
    '<div class="ti"><b>'+esc(t.nombre)+'</b><small>'+esc(t.descripcion||'')+'</small></div>'+
    badge+'</div>'+
    '<div class="acts"><button class="btn ghost" data-man="'+t.id+'">📘 Ver manual</button><button class="btn solid" data-car="'+t.id+'">📷 Cargar ejecución</button></div></div>';
}
function misHTML(){
  const m=DATA.mias||[];
  if(!m.length) return '<div class="empty">Todavía no cargaste ninguna ejecución. Elegí una del catálogo y sumá tus primeros puntos.</div>';
  const KAF=!!DATA.esKaf;
  return m.map(e=>{
    const st=KAF?['ap','Cargada']:e.estado==='aprobada'?['ap','Aprobada']:e.estado==='rehacer'?['re','Rehacer']:e.estado==='rechazada'?['re','No aprobada']:['pe','Pendiente'];
    const foto=(e.fotos_url&&e.fotos_url[0])?'<img src="'+esc(e.fotos_url[0])+'" alt="">':'📷';
    const sub=(e.cliente_nombre?esc(e.cliente_nombre):'Sin cliente')+' · '+fcorta(e.created_at)+(!KAF&&e.estado!=='pendiente'&&e.validacion_comentario?' · '+esc(e.validacion_comentario):'');
    return '<div class="ev"><div class="ph">'+foto+'</div><div class="in"><b>'+esc(e.tipo_nombre||'Ejecución')+'</b><small>'+sub+'</small></div>'+
      '<div style="text-align:right"><span class="st '+st[0]+'">'+st[1]+'</span>'+(!KAF&&e.estado==='aprobada'?'<div class="pp">+'+(e.puntos||0)+'</div>':'')+'</div></div>';
  }).join('');
}
function comoHTML(){
  if(DATA.esKaf) return '<div class="card"><div class="step"><div class="n">1</div><div class="t"><b>Entrá al punto de venta</b><p>Elegí la ejecución y mirá el manual "Esto sí / Esto no".</p></div></div>'+
    '<div class="step"><div class="n">2</div><div class="t"><b>Sacá la foto de la ejecución</b><p>De frente, con buena luz. Hasta 3 fotos.</p></div></div>'+
    '<div class="step"><div class="n">3</div><div class="t"><b>Cargá el resultado</b><p>Preguntale al cliente las copas vendidas con/sin acción, el precio, etc.</p></div></div>'+
    '<div class="step" style="margin-bottom:0"><div class="n">4</div><div class="t"><b>Entra a la presentación del mes</b><p>Todo lo que cargás se junta en el deck de Campari que arma GrandBar.</p></div></div></div>';
  return '<div class="card"><div class="step"><div class="n">1</div><div class="t"><b>Elegí la ejecución</b><p>Mirá el manual "Esto sí / Esto no" para dejarla bien lograda.</p></div></div>'+
    '<div class="step"><div class="n">2</div><div class="t"><b>Sacá la foto en el cliente</b><p>De frente, con buena luz. Hasta 3 fotos.</p></div></div>'+
    '<div class="step"><div class="n">3</div><div class="t"><b>Juan Pablo (Trade) la valida</b><p>Si cumple el estándar, suma los puntos. Si no, te pide rehacerla.</p></div></div>'+
    '<div class="step" style="margin-bottom:0"><div class="n">4</div><div class="t"><b>Los puntos se vuelven plata</b><p>Acumulás por proveedor y los cobrás según la tabla del mes.</p></div></div></div>';
}
function fcorta(f){ if(!f) return ''; const p=String(f).slice(0,10).split('-'); return p[2]+'/'+p[1]; }

function verManual(id){
  const t=tipoPorId(id); if(!t) return; ACTUAL=t;
  document.getElementById('manTit').textContent=t.nombre+' · '+(t.puntos||0)+' pts';
  const si=(t.manual_si||[]), no=(t.manual_no||[]);
  let h='';
  if(t.manual_objetivo) h+='<div class="mnote">Objetivo: '+esc(t.manual_objetivo)+'</div>';
  h+='<div class="exh si"><div class="cap"><span>✓</span> Esto SÍ</div>'+(t.foto_si?'<img class="ph" src="'+esc(t.foto_si)+'" alt="ejemplo bueno">':'')+'<ul>'+(si.length?si.map(x=>'<li><span class="ic">✓</span> '+esc(x)+'</li>').join(''):'<li style="color:#8a929a">Sin reglas cargadas aún.</li>')+'</ul></div>';
  h+='<div class="exh no"><div class="cap"><span>✕</span> Esto NO</div>'+(t.foto_no?'<img class="ph" src="'+esc(t.foto_no)+'" alt="ejemplo malo">':'')+'<ul>'+(no.length?no.map(x=>'<li><span class="ic">✕</span> '+esc(x)+'</li>').join(''):'<li style="color:#8a929a">Sin reglas cargadas aún.</li>')+'</ul></div>';
  document.getElementById('manBody').innerHTML=h;
  document.getElementById('manCargar').onclick=()=>{ cerrar('ovMan'); abrirCarga(id); };
  abrir('ovMan');
}

function abrirCarga(id){
  const t=tipoPorId(id); if(!t) return; ACTUAL=t; FOTOS=[];
  document.getElementById('carTit').textContent='Cargar ejecución';
  document.getElementById('carNom').textContent=t.nombre;
  document.getElementById('carDesc').textContent=t.descripcion||'';
  document.getElementById('carPts').innerHTML=(t.puntos||0)+'<small>PTS</small>';
  document.getElementById('carCli').value=''; document.getElementById('carCom').value=''; document.getElementById('carMsg').textContent='';
  const KAF=!!DATA.esKaf;
  document.getElementById('carCliLb').innerHTML='Punto de venta '+(KAF?'<small style="font-weight:500;color:#c0392b">(obligatorio)</small>':'<small style="font-weight:500;color:#8a929a">(opcional)</small>');
  const q=document.getElementById('carQuest');
  const preg=DATA.preguntas||[];
  if(preg.length){
    let html='<div style="background:#f6f3ee;border-radius:11px;padding:11px 12px;margin-top:8px">'+
      '<div style="font-weight:800;font-size:12.5px;color:#1b2a32">Datos de la ejecución <small style="font-weight:500;color:#8a929a">(preguntale al cliente)</small></div>';
    let sec='';
    preg.forEach(p=>{
      if(p.seccion && p.seccion!==sec){ sec=p.seccion; html+='<div style="font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin:12px 0 0">'+esc(sec)+'</div>'; }
      html+='<label class="lb" style="margin-top:6px" for="q_'+p.k+'">'+esc(p.t)+'</label><input class="in" id="q_'+p.k+'" '+(p.tipo==='num'?'type="number" inputmode="decimal" min="0"':'maxlength="'+(p.max||200)+'"')+'>';
    });
    html+='</div>';
    q.innerHTML=html;
  } else q.innerHTML='';
  pintarFotos(); abrir('ovCar');
}

function comprimir(file){
  return new Promise((ok,ko)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); let q=.82, d=c.toDataURL('image/jpeg',q);
      while(d.length>1200000&&q>.4){ q-=.1; d=c.toDataURL('image/jpeg',q); } ok(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error('No se pudo leer esa foto.')); }; img.src=url; });
}
async function sumarFotos(files){
  const l=Array.prototype.slice.call(files||[]);
  for(let i=0;i<l.length&&FOTOS.length<3;i++){ try{ FOTOS.push(await comprimir(l[i])); }catch(e){ document.getElementById('carMsg').textContent=e.message; } }
  pintarFotos();
}
function pintarFotos(){
  const box=document.getElementById('carFotos');
  box.innerHTML=FOTOS.map((d,i)=>'<div class="f"><img src="'+d+'"><button type="button" data-q="'+i+'">✕</button></div>').join('');
  box.querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>{ FOTOS.splice(+b.dataset.q,1); pintarFotos(); });
  document.getElementById('carAdd').style.display=FOTOS.length>=3?'none':'flex';
}

async function enviar(){
  const msg=document.getElementById('carMsg'), btn=document.getElementById('carOk');
  if(!ACTUAL) return;
  const KAF=!!DATA.esKaf;
  if(!FOTOS.length){ msg.textContent='Sumá al menos una foto.'; return; }
  const cli=document.getElementById('carCli').value.trim();
  if(KAF && !cli){ msg.textContent='Elegí el punto de venta.'; return; }
  let resultado=null;
  if((DATA.preguntas||[]).length){ resultado={}; DATA.preguntas.forEach(p=>{ const v=(document.getElementById('q_'+p.k)||{}).value; if(v!=null&&String(v).trim()!=='') resultado[p.k]=v; }); if(!Object.keys(resultado).length) resultado=null; }
  btn.disabled=true; const t0=btn.textContent; btn.textContent='Enviando…'; msg.textContent='';
  try{
    const tok=await token(); if(!tok) throw new Error('Tu sesión venció. Entrá de nuevo desde el Portal.');
    const m=CARTERA.find(c=>c.label===cli||c.codigo===cli);
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({accion:'cargar',tipo_id:ACTUAL.id,fotos:FOTOS,
        cliente_codigo:m?m.codigo:(/^[\w-]{1,20}$/.test(cli)?cli:null), cliente_nombre:m?null:(cli||null),
        comentario:document.getElementById('carCom').value.trim()||null, resultado})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'No se pudo enviar.');
    cerrar('ovCar');
    await cargar();
    alert(KAF?'📷 Ejecución registrada. Va a la presentación del mes de Campari.':'📷 Ejecución enviada. Le llegó a Juan Pablo (Trade) para validar. Cuando la apruebe, sumás los puntos.');
  }catch(e){ msg.textContent=e.message||String(e); }
  finally{ btn.disabled=false; btn.textContent=t0; }
}

async function cargarCartera(){
  try{
    let v=null; try{ v=JSON.parse(sessionStorage.getItem('vendedor')||'null'); }catch(e){}
    const vid=v&&v.id; if(!vid) return;
    const man=supabase.createClient('https://fzaxwuuodseyyinveknn.supabase.co','sb_publishable_gvclIOm9A3vCXEDT38O0Ng_HuOGH-Rk',{auth:{persistSession:false}});
    const {data}=await man.from('clientes').select('codigo_cliente,nombre').eq('vendedor_id',vid).limit(1500);
    CARTERA=(data||[]).map(c=>({codigo:String(c.codigo_cliente),label:c.nombre||String(c.codigo_cliente)}));
    const dl=document.getElementById('carCliList');
    if(dl) dl.innerHTML=CARTERA.slice(0,1200).map(c=>'<option value="'+esc(c.label)+'">'+esc(c.codigo)+'</option>').join('');
  }catch(e){}
}

document.getElementById('carFile').addEventListener('change',e=>{ sumarFotos(e.target.files); e.target.value=''; });
document.getElementById('carOk').addEventListener('click',enviar);
document.querySelectorAll('.ov').forEach(ov=>ov.addEventListener('click',e=>{ if(e.target===ov) cerrar(ov.id); }));
cargar();
</script>
