<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141210">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>Ejecuciones · GrandBar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Permanent+Marker&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{--ink:#141210;--paper:#ece6da;--paper2:#f3eee4;--red:#e01a1a;--red-d:#b00f0f;--mut:#6b6459;--mut2:#9a927f;--tape:rgba(214,198,150,.55);--amber:#9A6B0E;--amber-bg:#f6ecd4}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#d8d2c6;line-height:1.45;-webkit-font-smoothing:antialiased}
  svg{display:block}
  .app{max-width:1120px;margin:0 auto;min-height:100vh;position:relative;background:var(--paper);background-image:linear-gradient(rgba(0,0,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:24px 24px;box-shadow:0 0 60px rgba(0,0,0,.14);overflow:hidden;padding-bottom:40px}
  .lbl{font-family:'Permanent Marker',cursive;color:var(--red)}
  /* franja halftone */
  .strip{position:relative;background:var(--ink);color:var(--paper);padding:16px 20px 18px;overflow:hidden}
  .strip::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.1px,transparent 1.3px);background-size:7px 7px;opacity:.5;pointer-events:none}
  .strip>*{position:relative}
  .kick{font-size:10.5px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;color:#b9b2a3}
  .bk{background:rgba(255,255,255,.14);border:0;color:var(--paper);font:inherit;font-weight:800;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
  .huge{font-family:'Archivo',sans-serif;font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-1.5px}
  .mark{position:relative;display:inline-block;color:#fff;z-index:1}
  .mark::before{content:"";position:absolute;left:-5px;right:-5px;top:12%;bottom:8%;background:var(--red);transform:rotate(-1.4deg) skewX(-6deg);z-index:-1}
  .tape{position:absolute;width:74px;height:22px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:3}
  .star{position:absolute;color:var(--ink);font-size:20px;z-index:4;pointer-events:none}
  /* ===== PROVEEDORES ===== */
  .cover{padding:22px 20px 6px}
  .cover .eyebrow{font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .cover h1{font-family:'Archivo';font-weight:900;font-size:clamp(46px,13vw,76px);line-height:.82;text-transform:uppercase;letter-spacing:-2.5px;margin-top:8px}
  .cover .sc{font-family:'Permanent Marker',cursive;color:var(--red);font-size:16px;transform:rotate(-3deg);display:inline-block;margin:12px 0 0 6px}
  .provs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px 16px;padding:18px 20px 6px}
  @media(max-width:520px){.provs{grid-template-columns:1fr 1fr;gap:16px 13px;padding:16px}}
  .prov{position:relative;background:#fff;border:1px solid #d9d2c3;box-shadow:0 8px 18px rgba(0,0,0,.14);cursor:pointer;transition:transform .12s}
  .prov:nth-child(4n+1){transform:rotate(-1.4deg)}.prov:nth-child(4n+2){transform:rotate(1.3deg)}
  .prov:nth-child(4n+3){transform:rotate(.8deg)}.prov:nth-child(4n){transform:rotate(-1deg)}
  .prov:hover{transform:rotate(0) translateY(-2px)}
  .prov .logo{height:104px;display:flex;align-items:center;justify-content:center;padding:16px;border-bottom:1px solid #eee}
  .prov .logo img{max-width:100%;max-height:100%;object-fit:contain}
  .prov .logo .mono{font-family:'Archivo';font-weight:900;font-size:26px;text-transform:uppercase}
  .prov .cap{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;gap:8px}
  .prov .cap b{font-family:'Archivo';font-weight:800;font-size:13.5px;text-transform:uppercase;line-height:1}
  .prov .cap small{display:block;font-weight:600;font-size:10px;color:var(--mut);text-transform:none;margin-top:2px}
  .prov .go{background:var(--red);color:#fff;font-family:'Archivo';font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;white-space:nowrap}
  .prov.soon{opacity:.52;filter:grayscale(.5);cursor:default}.prov.soon .go{background:var(--ink)}
  /* ===== CATÁLOGO ===== */
  .chd h1{font-family:'Archivo';font-weight:900;font-size:clamp(30px,8vw,46px);text-transform:uppercase;line-height:.86;letter-spacing:-1.3px;margin-top:8px}
  .chd p{font-size:12.5px;color:#cfc7b6;margin-top:10px;max-width:52ch}
  .wal{margin:16px 20px 0;background:#fff;border:1.5px dashed #b9b1a0;box-shadow:0 8px 18px rgba(0,0,0,.1);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;transform:rotate(-.5deg)}
  .wal .l{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .wal .big{font-family:'Archivo';font-weight:900;font-size:42px;line-height:.8}
  .wal .big small{font-family:'Inter';font-size:12px;font-weight:700;color:var(--mut)}
  .wal .eq{text-align:right}
  .wal .eq .m{font-family:'Archivo';font-weight:900;font-size:28px;color:var(--red)}
  .wal .eq .s{font-size:9px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;margin-top:2px}
  .tabs{display:flex;gap:9px;flex-wrap:wrap;padding:18px 20px 2px;position:sticky;top:0;z-index:6}
  .tab{font-family:'Archivo';font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:8px 13px;border:2px solid var(--ink);background:var(--paper2);cursor:pointer}
  .tab:nth-child(odd){transform:rotate(-1.2deg)}.tab:nth-child(even){transform:rotate(1deg)}
  .tab.on{background:var(--ink);color:var(--paper)}
  .sec{display:none;padding:16px 20px 36px}.sec.on{display:block}
  @media(max-width:520px){.sec{padding:14px 16px 32px}}
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:34px 30px;padding-top:10px}
  @media(max-width:520px){.cgrid{grid-template-columns:1fr;gap:34px}}
  /* card ejecución = recorte polaroid pegado al tablero */
  .card{position:relative;background:#fff;padding:9px 9px 0;border:1px solid #e3dccb;box-shadow:0 12px 26px rgba(0,0,0,.18)}
  .card:nth-child(3n+1){transform:rotate(-2deg)}.card:nth-child(3n+2){transform:rotate(1.5deg)}.card:nth-child(3n){transform:rotate(-.7deg)}
  .card::before,.card::after{content:"";position:absolute;top:-11px;width:70px;height:23px;background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.12);z-index:5}
  .card::before{left:16px;transform:rotate(-5deg)}
  .card::after{right:16px;transform:rotate(4.5deg)}
  .card .photo{position:relative;height:186px;overflow:hidden;background:var(--ink)}
  .card .photo img{width:100%;height:100%;object-fit:cover;filter:contrast(1.05) saturate(1.05)}
  .card .photo.nofoto{display:flex;align-items:center;justify-content:center}
  .card .photo.nofoto::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.13) 1.1px,transparent 1.3px);background-size:8px 8px}
  .card .photo.nofoto .big{position:relative;font-family:'Archivo';font-weight:900;font-size:38px;color:var(--paper);text-transform:uppercase;letter-spacing:-1px;opacity:.92}
  .card .cat{position:absolute;top:10px;left:-5px;background:#fff;color:var(--red);border:1.5px solid var(--ink);font-family:'Permanent Marker',cursive;font-size:13px;padding:2px 10px;transform:rotate(-2.5deg);z-index:3;box-shadow:1px 2px 0 rgba(0,0,0,.15)}
  .card .stamp{position:absolute;right:10px;bottom:-20px;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-9deg);box-shadow:0 6px 14px rgba(0,0,0,.28);border:2px solid #fff;z-index:3}
  .card .stamp b{font-family:'Archivo';font-weight:900;font-size:24px;line-height:.8}
  .card .stamp span{font-size:7.5px;font-weight:800;letter-spacing:.1em}
  .card .bd{padding:18px 7px 12px;position:relative}
  .card h3{font-family:'Archivo';font-weight:900;font-size:21px;text-transform:uppercase;line-height:.92;letter-spacing:-.5px;max-width:76%}
  .card .d{font-size:12.5px;color:var(--mut);margin-top:7px}
  .card .scrib{position:absolute;right:4px;top:-2px;font-family:'Permanent Marker',cursive;color:var(--red);font-size:12.5px;transform:rotate(-7deg);max-width:86px;text-align:center;line-height:1.05}
  .card .acts{display:flex;margin:4px -9px 0;border-top:2px solid var(--ink)}
  .card .acts button{flex:1;font-family:'Archivo';font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;padding:13px;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;background:#fff}
  .card .acts .man{border-right:2px solid var(--ink)}
  .card .acts .car{background:var(--red);color:#fff}
  .card .acts svg{width:15px;height:15px}
  /* mis ejecuciones */
  .ev{position:relative;background:#fff;border:1px solid #d9d2c3;box-shadow:0 8px 18px rgba(0,0,0,.12);display:flex;align-items:stretch;margin-bottom:16px}
  .ev:nth-child(odd){transform:rotate(-.4deg)}.ev:nth-child(even){transform:rotate(.4deg)}
  .ev .ph{flex:none;width:80px;background:var(--ink) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#6c6456;border-right:3px solid var(--ink);overflow:hidden}
  .ev .ph img{width:100%;height:100%;object-fit:cover}
  .ev .in{flex:1;min-width:0;padding:11px 13px;display:flex;flex-direction:column;justify-content:center}
  .ev .in b{font-family:'Archivo';font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:-.1px}
  .ev .in small{font-size:11.5px;color:var(--mut);margin-top:2px}
  .ev .rt{flex:none;padding:11px 13px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:5px}
  .st{font-family:'Archivo';font-size:10px;font-weight:800;padding:4px 9px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;border:1.5px solid}
  .st.ap{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .st.pe{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
  .st.re{background:var(--red);color:#fff;border-color:var(--red)}
  .ev .pp{font-family:'Archivo';font-weight:900;color:var(--red);font-size:22px;line-height:.8}
  /* cómo funciona */
  .steps{background:#fff;border:1px solid #d9d2c3;box-shadow:0 8px 18px rgba(0,0,0,.1)}
  .step{display:flex;gap:14px;padding:15px;border-bottom:2px solid var(--ink)}
  .step:last-child{border-bottom:0}
  .step .n{flex:none;width:36px;height:36px;background:var(--red);color:#fff;font-family:'Archivo';font-weight:900;font-size:19px;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg)}
  .step .t b{font-family:'Archivo';font-weight:800;font-size:14px;text-transform:uppercase;letter-spacing:-.1px}.step .t p{font-size:12.5px;color:var(--mut);margin-top:2px}
  .mnote{background:var(--amber-bg);border:2px solid var(--ink);padding:12px 14px;font-size:12.5px;color:#6b4e0c;margin-top:16px}
  .empty{text-align:center;color:var(--mut);font-size:13.5px;padding:40px 16px;line-height:1.55;border:2px dashed #c3bba9;background:rgba(255,255,255,.4)}
  .load{text-align:center;padding:60px 16px;color:var(--mut);font-size:14px;font-weight:700}
  /* ===== MODALES ===== */
  .ov{position:fixed;inset:0;background:rgba(20,18,16,.62);display:flex;align-items:flex-end;justify-content:center;z-index:50}
  .ov[hidden]{display:none}
  .md{background:var(--paper);width:100%;max-width:540px;max-height:93vh;overflow:auto;border:2px solid var(--ink);border-bottom:0}
  @media(min-width:600px){.ov{align-items:center}.md{border-bottom:2px solid var(--ink)}}
  .mh{position:sticky;top:0;z-index:2;background:var(--ink);color:var(--paper);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
  .mh::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1.1px,transparent 1.3px);background-size:7px 7px;opacity:.5}
  .mh b{position:relative;font-family:'Archivo';font-weight:900;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
  .mh .x{position:relative;background:var(--red);border:0;color:#fff;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3}
  .mh .x svg{width:18px;height:18px;pointer-events:none}
  .mb{padding:15px 16px 20px}
  .exh{border:2px solid var(--ink);margin-bottom:14px;background:#fff}
  .exh .cap{display:flex;align-items:center;gap:8px;padding:9px 13px;font-family:'Archivo';font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--paper)}
  .exh.si .cap{background:var(--ink)}.exh.no .cap{background:var(--red)}
  .exh .ph{width:100%;max-height:180px;object-fit:cover;display:block;border-bottom:2px solid var(--ink)}
  .exh ul{list-style:none;padding:11px 14px}
  .exh li{display:flex;gap:9px;font-size:13px;padding:4px 0;align-items:flex-start;color:var(--ink)}
  .exh li .ic{flex:none;font-weight:900}.exh.si li .ic{color:var(--ink)}.exh.no li .ic{color:var(--red)}
  .lb{font-family:'Archivo';font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:12px 0 5px;display:block}
  .lb small{font-family:'Inter';font-weight:500;color:var(--mut2);text-transform:none;letter-spacing:0}
  .in{width:100%;border:1.5px solid #cdc4b0;padding:11px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink);transition:border-color .15s}
  .in:focus{outline:0;border-color:var(--red)}
  textarea.in{min-height:58px;resize:vertical}
  .carbox{border:1.5px solid #ddd5c2;background:#fff;padding:12px 13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .carbox b{font-family:'Archivo';font-weight:900;font-size:15.5px;text-transform:uppercase;line-height:1.02;display:block}
  .carbox small{color:var(--mut);font-size:12px}
  .minipts{flex:none;background:var(--red);color:#fff;font-family:'Archivo';font-weight:900;font-size:12.5px;border-radius:999px;padding:6px 12px;white-space:nowrap;letter-spacing:.02em}
  .qbox{border:1.5px solid #ddd5c2;background:#faf7ef;padding:12px 13px;margin-top:10px}
  .qbox .qt{font-family:'Archivo';font-weight:700;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
  .qsec{font-family:'Archivo';font-weight:800;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:13px 0 0;border-top:1px solid #e3dbc8;padding-top:9px}
  .fotos{display:flex;gap:8px;flex-wrap:wrap}
  .f{position:relative;width:84px;height:84px;overflow:hidden;border:2px solid var(--ink)}
  .f img{width:100%;height:100%;object-fit:cover}
  .f button{position:absolute;top:0;right:0;width:24px;height:24px;border:0;background:var(--ink);color:#fff;font-size:13px;cursor:pointer}
  .add{display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px dashed #c3b9a2;padding:14px;font-family:'Archivo';font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);cursor:pointer;background:#fff}
  .add:hover{border-color:var(--red);color:var(--red)}
  .add svg{width:16px;height:16px}
  .msg{font-size:13px;color:var(--red);font-weight:700;min-height:1px;margin-top:8px}
  .mfoot{position:sticky;bottom:0;background:var(--paper);padding:12px 16px 16px;border-top:2px solid var(--ink)}
  .bigbtn{width:100%;background:var(--red);color:#fff;border:0;font-family:'Archivo';font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:.06em;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .bigbtn svg{width:17px;height:17px}
  .bigbtn:disabled{opacity:.55;cursor:default}
</style>
</head>
<body>
<div class="app" id="app"><div class="load">Cargando…</div></div>

<!-- MODAL MANUAL -->
<div class="ov" id="ovMan" hidden><div class="md">
  <div class="mh"><b id="manTit">Manual</b><button class="x" data-cerrar="ovMan" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="mb" id="manBody"></div>
  <div class="mfoot"><button class="bigbtn" id="manCargar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.2"/></svg>Cargar esta ejecución</button></div>
</div></div>

<!-- MODAL CARGA -->
<div class="ov" id="ovCar" hidden><div class="md">
  <div class="mh"><b id="carTit">Cargar ejecución</b><button class="x" data-cerrar="ovCar" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="mb">
    <div class="carbox">
      <div><b id="carNom"></b><small id="carDesc"></small></div>
      <span class="minipts" id="carPts"></span>
    </div>
    <label class="lb">Fotos del punto de venta <small>(hasta 3)</small></label>
    <div class="fotos" id="carFotos"></div>
    <label class="add" id="carAdd" style="margin-top:8px"><input type="file" accept="image/*" multiple id="carFile" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.2"/></svg>Agregar foto</label>
    <label class="lb" for="carCli" id="carCliLb">Punto de venta</label>
    <input class="in" id="carCli" list="carCliList" placeholder="Nombre o código del cliente">
    <datalist id="carCliList"></datalist>
    <div id="carQuest"></div>
    <label class="lb" for="carCom">Comentario <small>(opcional)</small></label>
    <textarea class="in" id="carCom" maxlength="500" placeholder="Qué se ve en la foto…"></textarea>
    <div class="msg" id="carMsg"></div>
  </div>
  <div class="mfoot"><button class="bigbtn" id="carOk">Enviar ejecución</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FN='/.netlify/functions/ejecuciones';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EMBED=new URLSearchParams(location.search).get('embed')==='1';
let HUBCLI=null, DATA=null, FOTOS=[], ACTUAL=null, CARTERA=[], PROV=null, ESKAF=false;
const IC={
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 8h3l1.5-2h9L18 8h3v11H3z"/><circle cx="12" cy="13" r="3.2"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5h9a2 2 0 012 2v12H6a2 2 0 00-2 2z"/><path d="M20 5h-3a2 2 0 00-2 2v12a2 2 0 012-2h3z"/></svg>'
};
function hub(){ return HUBCLI=HUBCLI||supabase.createClient('https://xqhyemccbwmzxqzkrtwa.supabase.co','sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc'); }
async function token(){ try{ const {data}=await hub().auth.getSession(); return data&&data.session&&data.session.access_token||null; }catch(e){ return null; } }
function abrir(id){ document.getElementById(id).hidden=false; document.body.style.overflow='hidden'; }
function cerrar(id){ document.getElementById(id).hidden=true; document.body.style.overflow=''; }
function money(n){ return '$'+Math.round(n).toLocaleString('es-AR'); }
function fcorta(f){ if(!f) return ''; const p=String(f).slice(0,10).split('-'); return p[2]+'/'+p[1]; }
const COMING=[
 {proveedor:'Pernod Ricard',logo:'https://fzaxwuuodseyyinveknn.supabase.co/storage/v1/object/public/Activaciones/proveedores/1785239741013-3840.png'},
 {proveedor:'Grupo Peñaflor',logo:'https://fzaxwuuodseyyinveknn.supabase.co/storage/v1/object/public/Activaciones/proveedores/1785252078237-916.png'},
 {proveedor:'Diageo',logo:'https://fzaxwuuodseyyinveknn.supabase.co/storage/v1/object/public/Activaciones/proveedores/1785258345219-5671.png'}
];

// ===== PANTALLA PROVEEDORES =====
async function cargarProveedores(){
  const tok=await token();
  if(!tok){ document.getElementById('app').innerHTML='<div class="load">Para ver las ejecuciones, entrá al manual desde el Portal (portalgrandbar.com) con tu cuenta.</div>'; return; }
  let d;
  try{ const r=await fetch(FN+'?vista=proveedores',{headers:{Authorization:'Bearer '+tok}}); d=await r.json(); if(!r.ok) throw new Error(d.error||'No se pudo cargar.'); }
  catch(e){ document.getElementById('app').innerHTML='<div class="load">'+esc(e.message)+'</div>'; return; }
  ESKAF=!!d.esKaf;
  const activos=d.proveedores||[];
  const activNombres=activos.map(p=>p.proveedor.toLowerCase());
  const soon=COMING.filter(c=>!activNombres.includes(c.proveedor.toLowerCase()));
  const logoHTML=p=>p.logo?'<img src="'+esc(p.logo)+'" alt="'+esc(p.proveedor)+'">':'<span class="mono">'+esc(p.proveedor)+'</span>';
  const app=document.getElementById('app');
  app.innerHTML=
   '<div class="cover">'+(EMBED?'':'<button class="bk" id="bkPanel" style="background:rgba(0,0,0,.08);color:var(--ink);margin-bottom:10px">&larr; Volver</button><br>')+
     '<div class="eyebrow">'+(ESKAF?'KAF · Ejecuciones':'Manual del vendedor')+'</div>'+
     '<h1>Ejecu<span style="color:var(--red)">·</span>ciones</h1>'+
     '<div class="sc">elegí la marca &rarr;</div></div>'+
   '<div class="provs">'+
     activos.map(p=>'<div class="prov" data-prov="'+esc(p.proveedor)+'"><span class="tape" style="top:-10px;left:50%;margin-left:-37px;transform:rotate(-3deg)"></span><div class="logo">'+logoHTML(p)+'</div><div class="cap"><b>'+esc(p.proveedor)+'<small>'+p.tipos+' ejecucion'+(p.tipos===1?'':'es')+'</small></b><span class="go">Entrar</span></div></div>').join('')+
     soon.map(p=>'<div class="prov soon"><div class="logo">'+logoHTML(p)+'</div><div class="cap"><b>'+esc(p.proveedor)+'<small>&nbsp;</small></b><span class="go">Pronto</span></div></div>').join('')+
     '<span class="star" style="top:2px;right:14px;transform:rotate(12deg)">✦</span>'+
   '</div>';
  app.querySelectorAll('[data-prov]').forEach(c=>c.onclick=()=>abrirProveedor(c.dataset.prov));
  const bp=document.getElementById('bkPanel'); if(bp) bp.onclick=()=>location.href=(ESKAF?'/kaf.html':'/inicio.html');
}
function abrirProveedor(prov){ PROV=prov; document.getElementById('app').innerHTML='<div class="load">Cargando '+esc(prov)+'…</div>'; cargarCatalogo(); }

// ===== CATÁLOGO =====
async function cargarCatalogo(){
  const tok=await token(); if(!tok){ cargarProveedores(); return; }
  try{
    const r=await fetch(FN+'?vista=vendedor&proveedor='+encodeURIComponent(PROV),{headers:{Authorization:'Bearer '+tok}});
    DATA=await r.json(); if(!r.ok) throw new Error(DATA.error||'No se pudo cargar.');
  }catch(e){ document.getElementById('app').innerHTML='<div class="load">'+esc(e.message)+'</div>'; return; }
  ESKAF=!!DATA.esKaf;
  pintarCatalogo(); cargarCartera();
}
function pintarCatalogo(){
  const c=DATA.config||{valor_punto:100}; const prov=PROV||'Campari';
  const pts=(DATA.puntos||{})[prov]||0; const tipos=DATA.tipos||[];
  const wal=ESKAF?'':
   '<div class="wal"><div><div class="l">Tus puntos '+esc(prov)+'</div><div class="big">'+pts+' <small>pts</small></div></div>'+
     '<div class="eq"><div class="m">'+money(pts*c.valor_punto)+'</div><div class="s">1 pto = '+money(c.valor_punto)+(c.nota?' · '+esc(c.nota):'')+'</div></div></div>';
  const app=document.getElementById('app');
  app.innerHTML=
   '<div class="strip chd"><button class="bk" id="bkProv">&larr; Proveedores</button><div class="kick">'+(ESKAF?'KAF · Ejecuciones':'Manual del vendedor')+'</div>'+
     '<h1>Ejecuciones<br><span class="mark">'+esc(prov)+'</span></h1>'+
     '<p>'+(ESKAF?'Entrá al punto de venta, sacá la foto y cargá el resultado del cliente.':'Armá exhibiciones bien logradas, sacá la foto y sumá puntos. Los puntos se transforman en plata.')+'</p></div>'+
   wal+
   '<div class="tabs"><button class="tab on" data-t="cat">Catálogo</button><button class="tab" data-t="mis">Mis ejecuciones</button><button class="tab" data-t="como">Cómo funciona</button></div>'+
   '<div class="sec on" id="cat"><div class="cgrid">'+(tipos.length?tipos.map(cardTipo).join(''):'<div class="empty">Todavía no hay ejecuciones cargadas para este proveedor.</div>')+'</div></div>'+
   '<div class="sec" id="mis">'+misHTML()+'</div>'+
   '<div class="sec" id="como">'+comoHTML()+'</div>';
  document.getElementById('bkProv').onclick=cargarProveedores;
  app.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    app.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    app.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));
    t.classList.add('on'); document.getElementById(t.dataset.t).classList.add('on');
  });
  app.querySelectorAll('[data-man]').forEach(b=>b.onclick=()=>verManual(b.dataset.man));
  app.querySelectorAll('[data-car]').forEach(b=>b.onclick=()=>abrirCarga(b.dataset.car));
}
function tipoPorId(id){ return (DATA.tipos||[]).find(t=>t.id===id); }
const SCRIB={'Exhibición':'¡bien grande!','Barra':'a la vista','Pizarra':'que se lea','Puntera':'solo la línea','Cooler':'cargada'};
function cardTipo(t){
  const stamp=ESKAF?'':'<div class="stamp"><b>'+(t.puntos||0)+'</b><span>PTS</span></div>';
  const cat='<span class="cat">'+esc((t.categoria||'Ejecución').toLowerCase())+'</span>';
  const foto=t.foto_si?'<div class="photo">'+cat+'<img src="'+esc(t.foto_si)+'" alt="">'+stamp+'</div>'
    :'<div class="photo nofoto">'+cat+'<span class="big">'+esc(t.categoria||'Campari')+'</span>'+stamp+'</div>';
  return '<div class="card">'+foto+
    '<div class="bd"><h3>'+esc(t.nombre)+'</h3><div class="d">'+esc(t.descripcion||'')+'</div></div>'+
    '<div class="acts"><button class="man" data-man="'+t.id+'">'+IC.book+'Manual</button><button class="car" data-car="'+t.id+'">'+IC.cam+'Cargar</button></div></div>';
}
function misHTML(){
  const m=DATA.mias||[];
  if(!m.length) return '<div class="empty">Todavía no cargaste ninguna ejecución. Elegí una del catálogo y '+(ESKAF?'cargá el relevamiento.':'sumá tus primeros puntos.')+'</div>';
  return m.map(e=>{
    const st=ESKAF?['ap','Cargada']:e.estado==='aprobada'?['ap','Aprobada']:e.estado==='rehacer'?['re','Rehacer']:e.estado==='rechazada'?['re','No aprobada']:['pe','Pendiente'];
    const foto=(e.fotos_url&&e.fotos_url[0])?'<img src="'+esc(e.fotos_url[0])+'" alt="">':IC.cam;
    const sub=(e.cliente_nombre?esc(e.cliente_nombre):'Sin cliente')+' · '+fcorta(e.created_at)+(!ESKAF&&e.estado!=='pendiente'&&e.validacion_comentario?' · '+esc(e.validacion_comentario):'');
    return '<div class="ev"><div class="ph">'+foto+'</div><div class="in"><b>'+esc(e.tipo_nombre||'Ejecución')+'</b><small>'+sub+'</small></div>'+
      '<div class="rt"><span class="st '+st[0]+'">'+st[1]+'</span>'+(!ESKAF&&e.estado==='aprobada'?'<span class="pp">+'+(e.puntos||0)+'</span>':'')+'</div></div>';
  }).join('');
}
function comoHTML(){
  const s=ESKAF?[
    ['Entrá al punto de venta','Elegí la ejecución y mirá el manual Esto sí / Esto no.'],
    ['Sacá la foto','De frente, con buena luz. Hasta 3 fotos.'],
    ['Cargá el resultado','Preguntale al cliente las copas con y sin acción, el precio, etc.'],
    ['Va a la presentación','Todo lo que cargás se junta en el deck del mes de la marca.']
  ]:[
    ['Elegí la ejecución','Mirá el manual Esto sí / Esto no para dejarla bien lograda.'],
    ['Sacá la foto en el cliente','De frente, con buena luz. Hasta 3 fotos.'],
    ['Trade la valida','Si cumple el estándar, suma los puntos. Si no, te pide rehacerla.'],
    ['Los puntos se vuelven plata','Acumulás por proveedor y los cobrás según la tabla del mes.']
  ];
  return '<div class="steps">'+s.map((x,i)=>'<div class="step"><div class="n">'+(i+1)+'</div><div class="t"><b>'+esc(x[0])+'</b><p>'+esc(x[1])+'</p></div></div>').join('')+'</div>';
}

function verManual(id){
  const t=tipoPorId(id); if(!t) return; ACTUAL=t;
  document.getElementById('manTit').textContent=t.nombre+(ESKAF?'':' · '+(t.puntos||0)+' pts');
  const si=(t.manual_si||[]), no=(t.manual_no||[]);
  let h='';
  if(t.manual_objetivo) h+='<div class="mnote" style="margin:0 0 14px">Objetivo: '+esc(t.manual_objetivo)+'</div>';
  h+='<div class="exh si"><div class="cap"><span>✓</span> Esto SÍ</div>'+(t.foto_si?'<img class="ph" src="'+esc(t.foto_si)+'" alt="">':'')+'<ul>'+(si.length?si.map(x=>'<li><span class="ic">✓</span> '+esc(x)+'</li>').join(''):'<li style="color:var(--mut2)">Sin reglas cargadas aún.</li>')+'</ul></div>';
  h+='<div class="exh no"><div class="cap"><span>✕</span> Esto NO</div>'+(t.foto_no?'<img class="ph" src="'+esc(t.foto_no)+'" alt="">':'')+'<ul>'+(no.length?no.map(x=>'<li><span class="ic">✕</span> '+esc(x)+'</li>').join(''):'<li style="color:var(--mut2)">Sin reglas cargadas aún.</li>')+'</ul></div>';
  document.getElementById('manBody').innerHTML=h;
  document.getElementById('manCargar').onclick=()=>{ cerrar('ovMan'); abrirCarga(id); };
  abrir('ovMan');
}

function abrirCarga(id){
  const t=tipoPorId(id); if(!t) return; ACTUAL=t; FOTOS=[];
  document.getElementById('carNom').textContent=t.nombre;
  document.getElementById('carDesc').textContent=t.descripcion||'';
  const pill=document.getElementById('carPts'); if(ESKAF){ pill.style.display='none'; } else { pill.style.display=''; pill.textContent=(t.puntos||0)+' pts'; }
  document.getElementById('carCli').value=''; document.getElementById('carCom').value=''; document.getElementById('carMsg').textContent='';
  document.getElementById('carCliLb').innerHTML='Punto de venta '+(ESKAF?'<small style="color:var(--red)">(obligatorio)</small>':'<small>(opcional)</small>');
  const q=document.getElementById('carQuest'); const preg=DATA.preguntas||[];
  if(preg.length){
    let html='<div class="qbox"><div class="qt">Datos de la ejecución <small style="font-weight:600;color:var(--mut2)">(preguntale al cliente)</small></div>';
    let sec='';
    preg.forEach(p=>{
      if(p.seccion&&p.seccion!==sec){ sec=p.seccion; html+='<div class="qsec">'+esc(sec)+'</div>'; }
      html+='<label class="lb" style="margin-top:7px" for="q_'+p.k+'">'+esc(p.t)+'</label><input class="in" id="q_'+p.k+'" '+(p.tipo==='num'?'type="number" inputmode="decimal" min="0"':'maxlength="'+(p.max||200)+'"')+'>';
    });
    html+='</div>'; q.innerHTML=html;
  } else q.innerHTML='';
  pintarFotos(); abrir('ovCar');
}
function comprimir(file){
  return new Promise((ok,ko)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const s=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url); let q=.82, d=cv.toDataURL('image/jpeg',q);
      while(d.length>1200000&&q>.4){ q-=.1; d=cv.toDataURL('image/jpeg',q); } ok(d); };
    img.onerror=()=>{ URL.revokeObjectURL(url); ko(new Error('No se pudo leer esa foto.')); }; img.src=url; });
}
async function sumarFotos(files){
  const l=Array.prototype.slice.call(files||[]);
  for(let i=0;i<l.length&&FOTOS.length<3;i++){ try{ FOTOS.push(await comprimir(l[i])); }catch(e){ document.getElementById('carMsg').textContent=e.message; } }
  pintarFotos();
}
function pintarFotos(){
  const box=document.getElementById('carFotos');
  box.innerHTML=FOTOS.map((d,i)=>'<div class="f"><img src="'+d+'"><button type="button" data-q="'+i+'">✕</button></div>').join('');
  box.querySelectorAll('button[data-q]').forEach(b=>b.onclick=()=>{ FOTOS.splice(+b.dataset.q,1); pintarFotos(); });
  document.getElementById('carAdd').style.display=FOTOS.length>=3?'none':'flex';
}
async function enviar(){
  const msg=document.getElementById('carMsg'), btn=document.getElementById('carOk');
  if(!ACTUAL) return;
  if(!FOTOS.length){ msg.textContent='Sumá al menos una foto.'; return; }
  const cli=document.getElementById('carCli').value.trim();
  if(ESKAF && !cli){ msg.textContent='Elegí el punto de venta.'; return; }
  let resultado=null;
  if((DATA.preguntas||[]).length){ resultado={}; DATA.preguntas.forEach(p=>{ const v=(document.getElementById('q_'+p.k)||{}).value; if(v!=null&&String(v).trim()!=='') resultado[p.k]=v; }); if(!Object.keys(resultado).length) resultado=null; }
  btn.disabled=true; const t0=btn.textContent; btn.textContent='Enviando…'; msg.textContent='';
  try{
    const tok=await token(); if(!tok) throw new Error('Tu sesión venció. Entrá de nuevo desde el Portal.');
    const m=CARTERA.find(c=>c.label===cli||c.codigo===cli);
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},
      body:JSON.stringify({accion:'cargar',tipo_id:ACTUAL.id,fotos:FOTOS,
        cliente_codigo:m?m.codigo:(/^[\w-]{1,20}$/.test(cli)?cli:null), cliente_nombre:m?null:(cli||null),
        comentario:document.getElementById('carCom').value.trim()||null, resultado})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error||'No se pudo enviar.');
    cerrar('ovCar'); await cargarCatalogo();
    alert(ESKAF?'Ejecución registrada. Va a la presentación del mes.':'Ejecución enviada. Le llegó a Trade para validar. Cuando la apruebe, sumás los puntos.');
  }catch(e){ msg.textContent=e.message||String(e); }
  finally{ btn.disabled=false; btn.textContent=t0; }
}
async function cargarCartera(){
  try{
    let v=null; try{ v=JSON.parse(sessionStorage.getItem('vendedor')||'null'); }catch(e){}
    const vid=v&&v.id; if(!vid) return;
    const man=supabase.createClient('https://fzaxwuuodseyyinveknn.supabase.co','sb_publishable_gvclIOm9A3vCXEDT38O0Ng_HuOGH-Rk',{auth:{persistSession:false}});
    const {data}=await man.from('clientes').select('codigo_cliente,nombre').eq('vendedor_id',vid).limit(1500);
    CARTERA=(data||[]).map(c=>({codigo:String(c.codigo_cliente),label:c.nombre||String(c.codigo_cliente)}));
    const dl=document.getElementById('carCliList');
    if(dl) dl.innerHTML=CARTERA.slice(0,1200).map(c=>'<option value="'+esc(c.label)+'">'+esc(c.codigo)+'</option>').join('');
  }catch(e){}
}
document.getElementById('carFile').addEventListener('change',e=>{ sumarFotos(e.target.files); e.target.value=''; });
document.getElementById('carOk').addEventListener('click',enviar);
document.addEventListener('click',e=>{
  const x=e.target.closest&&e.target.closest('.ov .x'); if(x){ const ov=x.closest('.ov'); if(ov){ cerrar(ov.id); } return; }
  const ov=e.target.closest&&e.target.closest('.ov'); if(ov && e.target===ov) cerrar(ov.id);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ document.querySelectorAll('.ov:not([hidden])').forEach(ov=>cerrar(ov.id)); } });
cargarProveedores();
</script>
