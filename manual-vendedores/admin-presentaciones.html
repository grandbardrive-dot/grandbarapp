<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#0d2230">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrandBar — Presentaciones de ejecuciones</title>
<style>
  :root{--navy:#1F447F;--navy-d:#16305a;--navy-dd:#0f2340;--gold:#CBB86A;--gold-d:#B08D2E;
    --bg:#F4F1EA;--surface:#FFFFFF;--surface2:#FBF9F5;--ink:#1F1B16;--ink2:#5f574c;--ink3:#9a9187;
    --line:rgba(31,68,127,.12);--line-2:rgba(31,68,127,.16);--green:#2D6A4F;--green-bg:#E7F1EC;--red:#C0392B;--campari:#C8102E}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .layout{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  @media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{display:none}}
  .sidebar{background:linear-gradient(185deg,var(--navy),var(--navy-d) 62%,var(--navy-dd));color:#fff;display:flex;flex-direction:column;padding:0 0 18px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sb-logo{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:12px}
  .sb-logo img{display:block;width:150px;max-width:100%;height:auto}
  .sb-collapse{background:rgba(255,255,255,.08);border:none;color:#fff;width:30px;height:30px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
  .sb-collapse svg{width:16px;height:16px}
  .sb-nav{display:flex;flex-direction:column;gap:3px;padding:12px}
  .sb-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:rgba(255,255,255,.72);cursor:pointer;background:none;border:none;font-family:inherit;text-align:left;width:100%;text-decoration:none}
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .sb-item.active{background:rgba(255,255,255,.12);color:#fff}
  .sb-item.active .sb-ico{color:var(--gold)}
  .sb-ico{width:20px;height:20px;flex:none;color:rgba(255,255,255,.6)}
  .sb-txt-main{font-size:14px;line-height:1.15}.sb-txt-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
  .topbar{background:var(--navy);border-bottom:3px solid var(--gold);height:66px;display:flex;align-items:center;justify-content:flex-end;gap:18px;padding:0 26px;position:relative}
  .tb-user{display:flex;align-items:center;gap:11px;cursor:pointer;padding:6px 8px;border-radius:11px}
  .tb-user:hover{background:rgba(255,255,255,.08)}
  .tb-ava{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy-d);display:flex;align-items:center;justify-content:center;font-weight:800}
  .tb-user-info{text-align:right;line-height:1.2}
  .tb-user-name{font-size:14px;font-weight:700;color:#fff}.tb-user-role{font-size:11px;color:rgba(255,255,255,.6)}
  .menu{position:absolute;top:60px;right:26px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.16);padding:6px;display:none;z-index:50;min-width:180px}
  .menu.open{display:block}
  .menu button{display:flex;gap:10px;width:100%;background:none;border:none;padding:10px 12px;border-radius:8px;font-size:13.5px;color:var(--ink);cursor:pointer;font-family:inherit;text-align:left}
  .menu button:hover{background:var(--surface2)}
  .content{padding:26px 30px 60px;max-width:1000px}
  .head h1{font-size:24px;font-weight:800}
  .head p{color:var(--ink2);font-size:14px;margin-top:4px;max-width:66ch;line-height:1.5}
  .gen{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:18px 0 20px}
  .gen .f{display:flex;flex-direction:column;gap:5px}
  .gen label{font-size:12px;font-weight:700;color:var(--ink2)}
  .gen input,.gen select{border:1.5px solid var(--line-2);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
  .btn{border:0;border-radius:11px;padding:12px 18px;font:inherit;font-weight:800;font-size:14px;cursor:pointer}
  .btn.gold{background:var(--gold);color:#241a06}.btn.gold:disabled{opacity:.6;cursor:default}
  .btn.navy{background:var(--navy);color:#fff}.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
  .btn.claro{background:#fff;color:var(--ink);border:1px solid var(--line-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
  .pcard .tt{font-weight:800;font-size:16px}
  .pcard .meta{font-size:12.5px;color:var(--ink2)}
  .pcard .big{font-family:Georgia,serif;font-size:30px;font-weight:700;color:var(--campari);line-height:1;margin:6px 0 2px}
  .pcard .acts{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
  .empty{text-align:center;color:var(--ink3);padding:36px;font-size:14px}
  .msg{font-size:13px;margin-left:4px}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-logo"><button class="sb-collapse" onclick="location.href='admin-comercial.html'" title="Inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><img src="logo-grandbar-claro.png" alt="GrandBar Distribuciones"></div>
    <nav class="sb-nav"></nav>
  </aside>
  <div>
    <header class="topbar">
      <div class="tb-user" onclick="toggleMenu(event)"><div class="tb-ava" id="tb-ava">G</div><div class="tb-user-info"><div class="tb-user-name" id="tb-nombre">GrandBar</div><div class="tb-user-role">Comercial</div></div></div>
      <div class="menu" id="perfil-menu"><button onclick="cerrarSesion()">🚪 Cerrar sesión</button></div>
    </header>
    <div class="content">
      <div class="head">
        <h1>Presentaciones de ejecuciones</h1>
        <p>Generá el deck del mes de Campari juntando todo lo que cargaron los vendedores y el KAF: una página por ejecución, con foto y resultados. Las presentaciones generadas quedan guardadas acá.</p>
      </div>
      <div class="gen">
        <div class="f"><label for="prov">Proveedor</label><select id="prov"><option value="Campari">Campari</option></select></div>
        <div class="f"><label for="periodo">Mes</label><input type="month" id="periodo"></div>
        <button class="btn gold" id="gen">✨ Generar presentación de este mes</button>
        <span class="msg" id="msg"></span>
      </div>
      <div class="grid" id="lista"><div class="empty">Cargando…</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const FN='/.netlify/functions/ejecuciones';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let HUBCLI=null;
function hub(){ return HUBCLI=HUBCLI||supabase.createClient('https://xqhyemccbwmzxqzkrtwa.supabase.co','sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc'); }
async function token(){ try{ const {data}=await hub().auth.getSession(); return data&&data.session&&data.session.access_token||null; }catch(e){ return null; } }
function toggleMenu(ev){ ev.stopPropagation(); $('perfil-menu').classList.toggle('open'); }
document.addEventListener('click',()=>$('perfil-menu').classList.remove('open'));
function cerrarSesion(){ try{ Object.keys(localStorage).filter(k=>/^sb-.*-auth-token/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} location.href='/index.html'; }
function fmes(p){ const M=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']; const [y,m]=String(p||'').split('-'); return (M[(+m||1)-1]||'')+' '+(y||''); }
function fcorta(f){ if(!f) return ''; const p=String(f).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

async function cargarLista(){
  const tok=await token(); if(!tok){ $('lista').innerHTML='<div class="empty">Entrá con tu cuenta de GrandBar.</div>'; return; }
  let d;
  try{ const r=await fetch(FN+'?vista=presentaciones',{headers:{Authorization:'Bearer '+tok}}); d=await r.json(); if(!r.ok) throw new Error(d.error||'No se pudo cargar.'); }
  catch(e){ $('lista').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; return; }
  const l=d.presentaciones||[];
  $('lista').innerHTML = l.length ? l.map(p=>
    '<div class="pcard"><div class="tt">'+esc(p.titulo)+'</div>'+
    '<div class="meta">'+esc(p.proveedor)+' · '+esc(fmes(p.periodo))+'</div>'+
    '<div class="big">'+(p.total||0)+'</div><div class="meta">ejecuciones · generada '+fcorta(p.created_at)+(p.generado_por?' por '+esc(p.generado_por):'')+'</div>'+
    '<div class="acts"><a class="btn navy sm" href="/presentacion.html?id='+esc(p.id)+'" target="_blank">Ver / PDF</a>'+
    '<button class="btn claro sm" data-del="'+esc(p.id)+'">Borrar</button></div></div>'
  ).join('') : '<div class="empty">Todavía no generaste ninguna presentación. Elegí el mes y tocá "Generar presentación de este mes".</div>';
  $('lista').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>borrar(b.dataset.del));
}
async function borrar(id){
  if(!confirm('¿Borrar esta presentación guardada?')) return;
  const tok=await token();
  try{ const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({accion:'pres_borrar',id})}); if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.error||'No se pudo borrar.'); } cargarLista(); }
  catch(e){ alert(e.message); }
}
$('gen').onclick=async()=>{
  const btn=$('gen'), msg=$('msg'); btn.disabled=true; const t0=btn.textContent; btn.textContent='Generando…'; msg.textContent='';
  try{
    const tok=await token(); if(!tok) throw new Error('Entrá de nuevo.');
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({accion:'pres_generar',proveedor:$('prov').value,periodo:$('periodo').value||undefined})});
    const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'No se pudo generar.');
    msg.style.color='var(--green)'; msg.textContent='Lista: '+(d.presentacion.total||0)+' ejecuciones.';
    await cargarLista();
    if(d.presentacion&&d.presentacion.id) window.open('/presentacion.html?id='+d.presentacion.id,'_blank');
  }catch(e){ msg.style.color='var(--red)'; msg.textContent=e.message; }
  finally{ btn.disabled=false; btn.textContent=t0; }
};
(async()=>{
  const d=new Date(); $('periodo').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  try{ const {data:{session}}=await hub().auth.getSession(); if(session){ const {data:u}=await hub().from('usuarios').select('nombre').eq('id',session.user.id).maybeSingle(); if(u&&u.nombre){ $('tb-nombre').textContent=u.nombre.trim().split(/\s+/)[0]; $('tb-ava').textContent=u.nombre.trim().charAt(0).toUpperCase(); } } }catch(e){}
  cargarLista();
})();
</script>
<script src="_comercial-nav.js?v=11"></script>
</body>
</html>
