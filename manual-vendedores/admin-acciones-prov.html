<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GrandBar — Acciones mensuales de proveedores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f5f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line2:#eee7d8;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--danger:#c0603e;--danger-s:#fbe9e4;--amber:#c99a2e;--amber-s:#f8efd6;--navy:#0d2230;--blue:#3f6f9c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .top{background:var(--navy);color:#fff;padding:16px 22px;display:flex;align-items:center;gap:14px}
  .top .back{color:#cdd9df;text-decoration:none;font-size:13px;font-weight:600}
  .top h1{font-size:17px;margin:0}
  .wrap{max-width:820px;margin:0 auto;padding:22px 16px 60px}
  .sub{font-size:13.5px;color:var(--muted);margin:0 0 18px;line-height:1.5}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chipf{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .chipf.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .card .h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .card .emp{font-weight:800;font-size:15.5px;color:var(--navy)}
  .card .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .est{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .est.pendiente{background:#eef1f3;color:#5a6b73}.est.aprobada{background:var(--green-s);color:var(--green-d)}.est.cambios{background:var(--amber-s);color:#8a6a1e}.est.descartada{background:var(--danger-s);color:var(--danger)}
  .obs{font-size:13px;color:#555;background:var(--gold-s);border:1px solid #ecdcb2;border-radius:10px;padding:9px 12px;margin:11px 0}
  .obs b{color:#6b4e13}
  .nota{font-size:12.5px;color:#8a6a1e;background:var(--amber-s);border:1px solid #ecdcb2;border-radius:8px;padding:8px 11px;margin:9px 0}
  .acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
  .btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:9px 15px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);text-decoration:none}
  .btn.file{border-color:var(--blue);color:var(--blue)}
  .btn.ok{background:var(--green);border-color:var(--green);color:#fff}
  .btn.cam{background:var(--amber-s);border-color:#ecdcb2;color:#8a6a1e}
  .btn.no:hover{border-color:var(--danger);color:var(--danger)}
  .btn[disabled]{opacity:.5;cursor:default}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:12px}
  .msg{font-size:13px;font-weight:600;margin:0 0 12px;display:none}
  .msg.ok{color:var(--green-d);display:block}.msg.err{color:var(--danger);display:block}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="admin-comercial.html">‹ Volver</a>
    <h1>📤 Acciones mensuales de proveedores</h1>
  </div>
  <div class="wrap">
    <p class="sub">Los proveedores suben su plan de acciones del mes desde su portal. Revisalos acá: abrí el archivo, y aprobá o pedí cambios. El proveedor ve el estado y tu comentario en su panel.</p>
    <div class="msg" id="msg"></div>
    <div class="filtros" id="filtros"></div>
    <div id="list"><div class="empty">Cargando…</div></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="_config.js"></script>
<script>
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
  const ESTADOS=[['pendiente','Pendientes'],['cambios','Con cambios'],['aprobada','Aprobadas'],['descartada','Descartadas'],['','Todas']];
  let filtro='pendiente', ROWS=[];

  function aviso(t,ok){ const m=$('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); if(t) setTimeout(()=>{m.className='msg';},5000); }

  function pintarFiltros(){
    const cuenta=e=>ROWS.filter(r=>e===''?true:r.estado===e).length;
    $('filtros').innerHTML=ESTADOS.map(([v,l])=>`<button class="chipf ${filtro===v?'on':''}" onclick="setFiltro('${v}')">${l} ${cuenta(v)}</button>`).join('');
  }
  function setFiltro(v){ filtro=v; pintarFiltros(); render(); }
  window.setFiltro=setFiltro;

  function fmt(v){ const d=new Date(v); return isNaN(d)?'—':d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' · '+d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }

  function render(){
    const rows=ROWS.filter(r=>filtro===''?true:r.estado===filtro);
    const cont=$('list');
    if(!rows.length){ cont.innerHTML=`<div class="empty">No hay acciones ${filtro?('('+ (ESTADOS.find(e=>e[0]===filtro)||['',''])[1].toLowerCase()+')'):''} por ahora.</div>`; return; }
    cont.innerHTML=rows.map(r=>{
      const estTxt={pendiente:'⏳ Pendiente',aprobada:'✓ Aprobada',cambios:'✎ Cambios pedidos',descartada:'✕ Descartada'}[r.estado]||r.estado;
      const obs=r.observaciones?`<div class="obs"><b>Observaciones del proveedor:</b> ${esc(r.observaciones)}</div>`:'';
      const nota=r.nota_revision?`<div class="nota">📝 Le pediste: ${esc(r.nota_revision)}</div>`:'';
      const acciones = r.estado==='aprobada' ? ''
        : `<div class="acts">
             <a class="btn file" href="${esc(r.archivo_url)}" target="_blank" rel="noopener">📎 Abrir archivo</a>
             <button class="btn ok"  onclick="decidir('${r.id}','aprobada',this)">✓ Aprobar</button>
             <button class="btn cam" onclick="pedirCambios('${r.id}')">✎ Pedir cambios</button>
             <button class="btn no"  onclick="decidir('${r.id}','descartada',this)">Descartar</button>
           </div>`;
      const verArchivo = r.estado==='aprobada' ? `<div class="acts"><a class="btn file" href="${esc(r.archivo_url)}" target="_blank" rel="noopener">📎 Abrir archivo</a></div>`:'';
      return `<div class="card">
        <div class="h">
          <div><div class="emp">${esc(r.proveedor_empresa)}</div>
            <div class="meta">📎 ${esc(r.archivo_nombre||'archivo')} · cargado el ${fmt(r.created_at)}</div></div>
          <span class="est ${r.estado}">${estTxt}</span>
        </div>
        ${obs}${nota}${acciones}${verArchivo}
      </div>`;
    }).join('');
  }

  async function cargar(){
    try{
      const { data, error }=await sb.from('acciones_prov_mensuales').select('*').order('created_at',{ascending:false});
      if(error) throw error;
      ROWS=data||[]; pintarFiltros(); render();
    }catch(e){ $('list').innerHTML='<div class="empty">No se pudo cargar: '+esc(e.message||e)+'</div>'; }
  }

  async function decidir(id,estado,btn){
    if(estado==='descartada' && !confirm('¿Descartar esta carga del proveedor?')) return;
    if(btn) btn.disabled=true;
    const { error }=await sb.from('acciones_prov_mensuales').update({estado,revisado_at:new Date().toISOString()}).eq('id',id);
    if(error){ aviso('No se pudo guardar: '+error.message); if(btn) btn.disabled=false; return; }
    aviso(estado==='aprobada'?'Aprobada ✓':'Descartada',true);
    cargar();
  }
  window.decidir=decidir;

  async function pedirCambios(id){
    const nota=prompt('¿Qué cambios le pedís al proveedor?');
    if(nota===null) return;
    const { error }=await sb.from('acciones_prov_mensuales').update({estado:'cambios',nota_revision:nota.trim()||null,revisado_at:new Date().toISOString()}).eq('id',id);
    if(error){ aviso('No se pudo guardar: '+error.message); return; }
    aviso('Le pediste cambios al proveedor ✎',true); cargar();
  }
  window.pedirCambios=pedirCambios;

  // Gate liviano: tiene que haber sesión del Hub (cualquier usuario logueado).
  (async()=>{
    try{
      const hub=supabase.createClient(HUB.url,HUB.key);
      const {data:{session}}=await hub.auth.getSession();
      if(!session){ location.replace('../index.html'); return; }
    }catch(e){}
    cargar();
  })();
</script>
</body>
</html>
