<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrandBar — Catálogo clientes</title>
<style>
  :root{
    --navy:#1F447F; --navy-d:#16305a; --navy-dd:#0f2340; --gold:#CBB86A;
    --bg:#F4F1EA; --surface:#FFFFFF; --surface2:#FBF9F5; --ink:#1F1B16; --ink2:#5f574c; --ink3:#9a9187;
    --line:rgba(31,68,127,.10); --line-2:rgba(31,68,127,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .layout{display:grid;grid-template-columns:236px 1fr;height:100vh}
  @media (max-width:820px){ .layout{grid-template-columns:1fr} .sidebar{display:none} }

  .sidebar{background:linear-gradient(185deg,var(--navy),var(--navy-d) 62%,var(--navy-dd));color:#fff;display:flex;flex-direction:column;padding:0 0 18px;height:100vh;overflow:auto}
  .sb-logo{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)} .sb-logo img{height:38px;object-fit:contain}
  .sb-nav{display:flex;flex-direction:column;gap:3px;padding:16px 12px}
  .sb-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;color:rgba(255,255,255,.72);cursor:pointer;background:none;border:none;font-family:inherit;text-align:left;width:100%}
  .sb-item:hover{background:rgba(255,255,255,.07);color:#fff}
  .sb-item.active{background:rgba(255,255,255,.12);color:#fff} .sb-item.active .sb-ico{color:var(--gold)} .sb-item.active .sb-txt-main{font-weight:700}
  .sb-ico{width:20px;height:20px;flex:none;color:rgba(255,255,255,.6)} .sb-txt-main{font-size:14px} .sb-txt-sub{font-size:11px;color:rgba(255,255,255,.45);margin-top:1px}
  .sb-label{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--gold);text-transform:uppercase;padding:16px 20px 8px}
  .sb-spacer{flex:1}

  .rightcol{display:flex;flex-direction:column;height:100vh;min-width:0}
  .topbar{background:var(--navy);border-bottom:3px solid var(--gold);height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;flex:none}
  .tb-title{color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px}
  .tb-title svg{width:20px;height:20px;color:var(--gold)}
  .tb-actions{display:flex;align-items:center;gap:12px}
  .tb-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tb-btn svg{width:14px;height:14px}
  .tb-user{display:flex;align-items:center;gap:10px} .tb-ava{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--navy-d);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .tb-user-name{font-size:13.5px;font-weight:700;color:#fff;text-align:right} .tb-user-role{font-size:10.5px;color:rgba(255,255,255,.6);text-align:right}

  .frame-wrap{flex:1;position:relative;background:var(--surface2)}
  iframe{width:100%;height:100%;border:none;display:block;background:#fff}
  .loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink3);font-size:14px;pointer-events:none}
  .spin{width:34px;height:34px;border:3px solid var(--line-2);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sb-logo"><img src="GrandBar%20logotipo%20con%20sombra-05%20%282%29.png" alt="GrandBar"></div>
    <nav class="sb-nav">
      <a class="sb-item" href="admin-comercial.html"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7M5 10v9h14v-9" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="sb-txt-main">Inicio</div></div></a>
      <a class="sb-item" href="admin-campanias.html"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M4 12h16M4 19h10" stroke-linecap="round"/></svg><div><div class="sb-txt-main">Campañas</div><div class="sb-txt-sub">Acciones comerciales</div></div></a>
      <a class="sb-item" href="admin-catalogo.html"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7l8-4 8 4-8 4z" stroke-linejoin="round"/><path d="M4 7v10l8 4 8-4V7" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="sb-txt-main">Catálogo</div><div class="sb-txt-sub">Proveedores y productos</div></div></a>
      <a class="sb-item active" href="admin-catalogo-clientes.html"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2zM20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2z" stroke-linejoin="round"/></svg><div><div class="sb-txt-main">Catálogo clientes</div><div class="sb-txt-sub">Catálogo público de acciones</div></div></a>
      <a class="sb-item" href="admin-resultados.html"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke-linecap="round"/></svg><div><div class="sb-txt-main">Resultados</div><div class="sb-txt-sub">Desempeño de campañas</div></div></a>
      <a class="sb-item" href="admin-campanias.html?estado=borrador"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h7l5 5v13H7z" stroke-linejoin="round"/><path d="M14 3v5h5" stroke-linecap="round"/></svg><div><div class="sb-txt-main">Borradores</div><div class="sb-txt-sub">En edición</div></div></a>
    </nav>
    <div class="sb-label">Ayuda</div>
    <nav class="sb-nav" style="padding-top:0">
      <button class="sb-item" onclick="alert('Guías y tutoriales — próximamente.')"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7v.4" stroke-linecap="round"/><circle cx="12" cy="17" r=".6" fill="currentColor" stroke="none"/></svg><div><div class="sb-txt-main">Guías y tutoriales</div></div></button>
      <button class="sb-item" onclick="alert('Soporte: escribí al equipo de GrandBar.')"><svg class="sb-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 13a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-1v-6h3M4 13v4a2 2 0 0 0 2 2h1v-6H4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><div class="sb-txt-main">Soporte</div></div></button>
    </nav>
    <div class="sb-spacer"></div>
  </aside>

  <div class="rightcol">
    <header class="topbar">
      <div class="tb-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2zM20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2z" stroke-linejoin="round"/></svg>Catálogo clientes</div>
      <div class="tb-actions">
        <button class="tb-btn" onclick="document.getElementById('cat-frame').src=document.getElementById('cat-frame').src">↻ Recargar</button>
        <a class="tb-btn" href="https://catalogosgrandbar.netlify.app/admin.html" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round"/></svg>Pantalla completa</a>
        <div class="tb-user"><div class="tb-ava">L</div><div><div class="tb-user-name">Luciana</div><div class="tb-user-role">Gestora Comercial</div></div></div>
      </div>
    </header>
    <div class="frame-wrap">
      <div class="loading" id="loading"><div class="spin"></div>Abriendo el catálogo de clientes…</div>
      <iframe id="cat-frame" src="https://catalogosgrandbar.netlify.app/admin.html" onload="document.getElementById('loading').style.display='none'" title="Catálogo clientes"></iframe>
    </div>
  </div>
</div>
<script src="_admin-sidebar.js"></script>
<script>window.addEventListener('load',function(){window.hacerSidebarResponsive&&hacerSidebarResponsive()})</script>
<script>
  sessionStorage.setItem('admin_auth','1'); if(!sessionStorage.getItem('admin_perfil')) sessionStorage.setItem('admin_perfil','comercial');
  // Si el iframe no carga en 6s, mostrar aviso con enlace de respaldo.
  setTimeout(()=>{ const l=document.getElementById('loading'); if(l && l.style.display!=='none'){ l.innerHTML='El catálogo tarda en abrir. <a href="https://catalogosgrandbar.netlify.app/admin.html" target="_blank" rel="noopener" style="color:var(--navy);font-weight:700;text-decoration:underline">Abrilo en una pestaña nueva</a>.'; l.style.pointerEvents='auto'; } }, 6000);
</script>
</body>
</html>
