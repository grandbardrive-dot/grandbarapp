<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2238">
<link rel="manifest" href="/manifest.webmanifest">
<title>GrandBar — Cobranzas</title>
<link rel="stylesheet" href="assets/panel-admin.css">
<style>
  .cb-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:24px}
  .cb-card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:16px;
    padding:20px;cursor:pointer;text-align:left;font-family:inherit;width:100%;transition:transform .12s,box-shadow .12s}
  .cb-card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(13,34,56,.10)}
  .cb-card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--gold-soft)}
  .cb-card h3{margin:13px 0 0;font-size:15px;letter-spacing:-.01em;text-transform:uppercase;color:var(--navy)}
  .cb-card p{margin:6px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
  .cb-chip{display:inline-block;margin-top:12px;font-size:11.5px;font-weight:800;border-radius:20px;padding:4px 11px;
    background:rgba(13,34,56,.07);color:var(--navy)}
  .cb-chip.ok{background:var(--green-soft);color:var(--green)}
  .cb-chip.alerta{background:var(--red-soft);color:var(--red)}

  .cb-volver{display:inline-flex;align-items:center;gap:7px;background:none;border:none;font-family:inherit;
    font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;padding:0;margin-bottom:10px}
  .cb-tabla{width:100%;border-collapse:collapse;margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .cb-tabla th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
    padding:12px 14px;border-bottom:1px solid var(--line);font-weight:800}
  .cb-tabla td{padding:12px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px;vertical-align:top}
  .cb-tabla tr:last-child td{border-bottom:0}
  .num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
  .rojo{color:var(--red);font-weight:700}
  .cb-paginado{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .cb-b{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);
    border-radius:10px;padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;
    font-family:inherit;white-space:nowrap;text-decoration:none}
  .cb-b:hover{border-color:var(--navy)}
  .cb-b.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .cb-b.ok:hover{border-color:var(--green);color:var(--green)}
  .cb-b.danger:hover{border-color:var(--red);color:var(--red)}
  .cb-b[disabled]{opacity:.45;cursor:default}
  .pd-acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .pd-detalle{font-size:13.5px;margin-top:9px;line-height:1.5}
  .pd-cuando{margin-left:auto;font-size:11.5px;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<b>Bar</b></div>
    <div class="sb-sub">Distribuciones</div>
    <div class="sb-rol">Cobranzas</div>
    <div class="sb-sub" id="cob-quien" style="color:#dfe7ec;font-size:13px;letter-spacing:0;text-transform:none;padding-top:2px"></div>
    <nav class="sb-nav" id="cob-nav"></nav>
    <div class="sb-spacer"></div>
    <a class="sb-item" href="hub.html"><span class="i">←</span> Volver al Hub</a>
    <div class="sb-pie">Los datos salen del sistema de cuenta corriente. Se leen desde el servidor: la llave nunca pasa por el navegador.</div>
  </aside>

  <main class="main">
    <div id="cob"><div class="pv-vacio">Cargando…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/cobranzas.js?v=3"></script>
<script>montarCobranzas();</script>
</body>
</html>
