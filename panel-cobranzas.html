<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2238">
<link rel="manifest" href="/manifest.webmanifest">
<title>GrandBar — Cobranzas</title>
<link rel="stylesheet" href="assets/panel-admin.css">
<link rel="stylesheet" href="assets/cobranzas.css">
<style>
  /* Todo en el mismo panel (06/10/2026): agenda del equipo, mi agenda y mis reportes
     se abren acá adentro, con este mismo menú. */
  .sb-grupo{padding:14px 12px 4px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
  .sidebar{overflow-y:auto}
  .cob-marco{display:block;width:100%;height:calc(100vh - 60px);border:0;background:transparent}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<b>Bar</b></div>
    <div class="sb-sub">Distribuciones</div>
    <div class="sb-rol">Cobranzas</div>
    <div class="sb-sub" id="cob-quien" style="color:#dfe7ec;font-size:13px;letter-spacing:0;text-transform:none;padding-top:2px"></div>
    <nav class="sb-nav" id="cob-nav"></nav>
    <div class="sb-spacer"></div>
    <button type="button" class="sb-item" id="cob-soporte" style="background:none;border:0;font:inherit;text-align:left;cursor:pointer"><span class="i">💬</span> Soporte</button>
    <button type="button" class="sb-item" id="cob-salir" style="background:none;border:0;font:inherit;text-align:left;cursor:pointer"><span class="i">↩</span> Cerrar sesión</button>
    <div class="sb-pie">Los datos salen del sistema de cuenta corriente. Se leen desde el servidor: la llave nunca pasa por el navegador.</div>
  </aside>

  <main class="main">
    <div id="cob"><div class="pv-vacio">Cargando…</div></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/cobranzas.js?v=13"></script>
<script src="assets/equipo-admin.js?v=3"></script>
<script>
  // Lo que se suma al menú de Cobranzas: se abre adentro del panel, sin cambiar de pantalla.
  // Brenda (administración) y Mónica (tesorería) trabajan todo desde acá (06/10/2026).
  const cobMarco = (src, titulo) => { cq('cob').innerHTML = `<iframe class="cob-marco" src="${src}" title="${titulo}"></iframe>`; };
  window.COB_HASH = true;
  window.COB_EXTRA = [
    { id:'revision',      ico:'💳', n:'Revisión de cobranzas', roles:['tesoreria'], arriba:true, abrir: () => cobMarco('/cobranzas-tesoreria.html?embed=1', 'Revisión de cobranzas') },
    { id:'agenda-equipo', ico:'📅', n:'Agenda del equipo', abrir: () => eqAgenda() },
    { id:'mi-agenda',     ico:'🗓️', n:'Mi agenda',         abrir: () => cobMarco('/mi-agenda.html?embed=1', 'Mi agenda') },
    { id:'reportes',      ico:'📊', n:'Mis reportes', roles:['administracion'], abrir: () => cobMarco('/mis-reportes.html?embed=1', 'Mis reportes') },
  ];
  // Mónica arranca en la Revisión de cobranzas, que es su trabajo de todos los días.
  window.COB_INICIO = { tesoreria: 'revision' };
  document.getElementById('cob-salir').addEventListener('click', async ev => {
    ev.currentTarget.disabled = true;
    try { localStorage.removeItem('gb_nav_rol'); localStorage.removeItem('gb_es_sup'); } catch (e) {}
    await GBAuth.signOut();
  });
  document.getElementById('cob-soporte').addEventListener('click', () => {
    if (window.abrirSoporteWA) window.abrirSoporteWA(); else alert('Escribinos al WhatsApp de soporte: +54 9 261 245-2651');
  });
</script>
<script src="assets/soporte.js?v=1"></script>
<script src="assets/notif.js?v=3"></script>
<script>
  // Dirección usa su propia vista de Cobranzas (dir-cobranzas.html): supervisa sin
  // ver las conversaciones de WhatsApp ni de reclamos.
  (async function () {
    const s = await GBAuth.getSession();
    if (s && ["direccion", "admin", "duenio"].includes(String(s.role || "").toLowerCase())) { location.replace("dir-cobranzas.html"); return; }
    montarCobranzas();
  })();
</script>
<script src="/assets/minuta-fab.js?v=2"></script>
<script src="/assets/cuenta-activa.js?v=1"></script>
</body>
</html>
