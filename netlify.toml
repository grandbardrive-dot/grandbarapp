# Deploy de GrandBar Hub en Netlify
# Sitio estático: la raíz del proyecto es lo que se publica.
[build]
  publish = "."
  # Funciones serverless del manual de vendedores (IA de fotos y sugerencias).
  functions = "manual-vendedores/netlify/functions"

# El código y los datos de las funciones NO se publican como archivos sueltos
# (las funciones se llaman por /.netlify/functions/…). Incluye _datos/ con
# ventas por cliente del tablero de Luciana.
[[redirects]]
  from = "/manual-vendedores/netlify/*"
  to = "/404"
  status = 404
  force = true

# La app entra por el login (index.html) automáticamente.
[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

# Recordatorios de reunión: revisa cada 15 min y manda los avisos push (un día
# antes / una hora antes). Ver manual-vendedores/netlify/functions/push-cron.js
[functions."push-cron"]
  schedule = "*/15 * * * *"

# Clientes del manual al día con CUBO: cada hora trae los nuevos y corrige
# nombre, rubro y vendedor. CUBO no avisa cambios, así que se le pregunta seguido.
# Ver manual-vendedores/netlify/functions/sync-clientes-cron.js
[functions."sync-clientes-cron"]
  schedule = "0 * * * *"

# Master de artículos (stock real) del ERP → productos_grandbar, para que el
# SCANNER DE CARTA cruce contra lo que de verdad tenemos y esté al día. 1×/día
# (09:00 UTC ≈ 06:00 ART). Dispara la background sync-productos-background.
# Ver manual-vendedores/netlify/functions/sync-productos-cron.js
[functions."sync-productos-cron"]
  schedule = "0 9 * * *"

# AGENTE "Cazador de clientes": cada mañana (10:00 UTC ≈ 07:00 ART) busca
# prospectos nuevos (Google Places + Instagram por hashtags), descarta los que
# ya son clientes (Aikon + cuentas_cubo), los puntúa con IA y los deja en la
# tabla `prospectos` para el panel de supervisores (prospectos.html).
# Dispara la background cazar-clientes-background.
# Ver manual-vendedores/netlify/functions/cazar-clientes-cron.js
[functions."cazar-clientes-cron"]
  schedule = "0 10 * * *"

# VENTAS del ERP → ventas_articulos / ventas_cliente, AUTOMÁTICO. Cada 20 min
# dispara sync-ventas-background, que baja los días que falten (primero ayer,
# después rellena hasta VENTAS_DESDE) leyendo las DOS empresas del ERP (9999 + 0001).
# Ver manual-vendedores/netlify/functions/sync-ventas-cron.js
[functions."sync-ventas-cron"]
  schedule = "5,25,45 * * * *"

# RECLAMOS por zona: cada 10 min mira si un cliente abrió un reclamo o escribió en uno
# y se lo avisa a la administración de su zona (Romina, San Luis): campanita + celular.
# Ver manual-vendedores/netlify/functions/reclamos-avisos-cron.js
[functions."reclamos-avisos-cron"]
  schedule = "*/10 * * * *"

# NOTAS DE CRÉDITO del ERP → tabla notas_credito, linkeadas a su factura. Una vez al día
# dispara sync-ncr-background para los últimos días (las NCR nuevas aparecen al otro día).
# Ver manual-vendedores/netlify/functions/sync-ncr-cron.js
[functions."sync-ncr-cron"]
  schedule = "35 9 * * *"

# FACTURAS EMITIDAS del ERP (pagadas o no) → tabla comprobantes_venta (03/11/2026). Cada 30 min
# dispara sync-comprobantes-background: relee la última semana y completa la historia desde 2025.
# Ver manual-vendedores/netlify/functions/sync-comprobantes-cron.js
[functions."sync-comprobantes-cron"]
  schedule = "12,42 * * * *"

# LUGARES LIBRES del manual: los días hábiles, cada 10 min de 9 a 19 (12 a 21 UTC), les
# avisa a los proveedores del portal, por la campanita y el celular, si aparecieron
# lugares del manual de vendedores sin ninguna acción que todavía no conocían
# ("sé el primero"). Como mucho un aviso por día a cada uno; de noche no manda nada.
# Ver manual-vendedores/netlify/functions/lugares-libres-cron.js
[functions."lugares-libres-cron"]
  schedule = "*/10 12-21 * * 1-5"

# STOCK DEL DEPÓSITO: cada hora de 8 a 20 hs de Argentina (11 a 23 UTC), lunes a sábado,
# trae el stock de Córdoba a stock_sistema (antes lo hacía la app aparte grandbar-stock).
# Ver manual-vendedores/netlify/functions/stock-sync-cron.js
[functions."stock-sync-cron"]
  schedule = "0 11-23 * * 1-6"

# INCENTIVO PERNOD RICARD Q4: cada mañana (06:10 ART = 09:10 UTC) recalcula el avance
# (clientes con compra por marca×canal) leyendo el ERP (empresa 3333) y escribe el snapshot
# que muestra la sección Incentivos. Dispara incentivo-pernod-background (trabajo pesado).
# Requiere credenciales del ERP para la empresa 3333 (AIKON_* o CS_*) en las env vars.
# Ver manual-vendedores/netlify/functions/incentivo-pernod-cron.js
[functions."incentivo-pernod-cron"]
  schedule = "10 9 * * *"

# INCENTIVO PEÑAFLOR: cada mañana (06:20 ART = 09:20 UTC) recalcula el avance (Volumen por
# línea + Clientes con compra por canal), asignado por cartera vigente, leyendo las ventas que
# ya sincronizan (no llama al ERP) y escribe el snapshot que muestra la sección Incentivos.
# El objetivo por vendedor está en las tablas penaflor_obj_* (se carga 1×/mes).
# Ver manual-vendedores/netlify/functions/penaflor-cron.js
[functions."penaflor-cron"]
  schedule = "20 9 * * *"

# INCENTIVO SÉPTIMA: cada mañana (06:25 ART = 09:25 UTC) recalcula los clientes con compra de
# las líneas Séptima (Oct–Nov) por cartera vigente, desde las ventas ya sincronizadas, y escribe
# el snapshot 'SEPTIMA'. Objetivo/premio en septima_objetivo, líneas en septima_articulos.
# Ver manual-vendedores/netlify/functions/septima-cron.js
[functions."septima-cron"]
  schedule = "25 9 * * *"

# CLUB CAMPARI: cada mañana (06:30 ART = 09:30 UTC) recalcula el avance del plan Cobertura de
# Campari (clientes con compra por marca, ventana Oct–Nov de club_campari_config) desde las ventas
# ya sincronizadas y lo escribe en cobertura_productos. Solo las marcas mapeadas en
# club_campari_marcas (Aperol/Campari/Cynar; Skyy Inf y Others cuando Luciana defina).
# Ver manual-vendedores/netlify/functions/club-campari-cron.js
[functions."club-campari-cron"]
  schedule = "30 9 * * *"

# RECIBOS del ERP → planillas de rendición (16/11/2026). De lunes a sábado, cada 15 min de
# 8 a 20 (11 a 23 UTC), trae los recibos nuevos y completa solo el N° de recibo de cada
# fila (antes Moni lo escribía a mano en Observaciones). El panel también la dispara al
# abrir una planilla. Ver manual-vendedores/netlify/functions/recibos-erp-background.js
[functions."recibos-erp-cron"]
  schedule = "*/15 11-23 * * 1-6"

# COMPROBANTES DE VENDEDORES por WhatsApp (16/11/2026). Los vendedores reenvían los
# comprobantes al WhatsApp de GrandBar (en vez del grupo): de lunes a sábado, cada 2 min
# de 8 a 20, la IA los lee y los engancha a la fila de su planilla. Si no hay nada nuevo
# no hace nada. Ver manual-vendedores/netlify/functions/comprobantes-wa-background.js
[functions."comprobantes-wa-cron"]
  schedule = "*/2 11-23 * * 1-6"
