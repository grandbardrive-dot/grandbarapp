# Deploy de GrandBar Hub en Netlify
# Sitio estático: la raíz del proyecto es lo que se publica.
[build]
  publish = "."
  # Funciones serverless del manual de vendedores (IA de fotos y sugerencias).
  functions = "manual-vendedores/netlify/functions"

# La app entra por el login (index.html) automáticamente.
[[redirects]]
  from = "/hub"
  to = "/hub.html"
  status = 200

# Recordatorios de reunión: revisa cada 15 min y manda los avisos push (un día
# antes / una hora antes). Ver manual-vendedores/netlify/functions/push-cron.js
[functions."push-cron"]
  schedule = "*/15 * * * *"

# Clientes del manual al día con CUBO: cada hora trae los nuevos y corrige
# nombre, rubro y vendedor. CUBO no avisa cambios, así que se le pregunta seguido.
# Ver manual-vendedores/netlify/functions/sync-clientes-cron.js
[functions."sync-clientes-cron"]
  schedule = "0 * * * *"

# Master de artículos (stock real) del ERP → productos_grandbar, para que el
# SCANNER DE CARTA cruce contra lo que de verdad tenemos y esté al día. 1×/día
# (09:00 UTC ≈ 06:00 ART). Dispara la background sync-productos-background.
# Ver manual-vendedores/netlify/functions/sync-productos-cron.js
[functions."sync-productos-cron"]
  schedule = "0 9 * * *"

# AGENTE "Cazador de clientes": cada mañana (10:00 UTC ≈ 07:00 ART) busca
# prospectos nuevos (Google Places + Instagram por hashtags), descarta los que
# ya son clientes (Aikon + cuentas_cubo), los puntúa con IA y los deja en la
# tabla `prospectos` para el panel de supervisores (prospectos.html).
# Dispara la background cazar-clientes-background.
# Ver manual-vendedores/netlify/functions/cazar-clientes-cron.js
[functions."cazar-clientes-cron"]
  schedule = "0 10 * * *"

# VENTAS del ERP → ventas_articulos / ventas_cliente, AUTOMÁTICO. Cada hora
# dispara sync-ventas-background, que baja los días que falten (primero ayer,
# después rellena hasta VENTAS_DESDE) leyendo las DOS empresas del ERP (9999 + 0001).
# Ver manual-vendedores/netlify/functions/sync-ventas-cron.js
[functions."sync-ventas-cron"]
  schedule = "5 * * * *"
