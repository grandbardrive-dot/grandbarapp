<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0d2238; --navy-2:#14304c; --cream:#f5f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#7a8891; --line:#e9e3d6; --line-2:#efe9dc;
      --gold:#c9a13b; --gold-d:#a9852a; --gold-soft:#f7efda;
      --green:#2f6f5e; --green-soft:#e7f1ea; --green-d:#245647;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500;background:none;border:0;cursor:pointer;font-family:inherit;text-align:left;width:100%}
    .sb-nav button:hover{background:var(--navy-2);color:#fff}
    .sb-nav button.active{background:var(--gold);color:#2a2007;font-weight:600}
    .sb-nav .dotc{width:9px;height:9px;border-radius:50%;flex:none}
    .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
    .sb-support{display:flex;align-items:center;gap:11px;background:var(--navy-2);border-radius:12px;padding:12px}
    .sb-support .t{font-size:13px;font-weight:600}.sb-support .s{font-size:11px;color:#9db0ba}
    .sb-user{display:flex;align-items:center;gap:11px;padding:8px 10px;background:var(--navy-2);border-radius:12px;cursor:pointer}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:var(--gold)}
    .sb-user .out{margin-left:auto;color:#9db0ba}

    .main{flex:1;min-width:0}
    .topbar{display:flex;align-items:center;gap:16px;padding:16px 30px;background:var(--card);border-bottom:1px solid var(--line)}
    .topbar .burger{display:none;background:none;border:0;cursor:pointer;color:var(--ink)}
    .search{display:flex;align-items:center;gap:9px;background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:9px 16px;min-width:260px;color:var(--muted)}
    .search input{border:0;background:transparent;outline:none;font:inherit;font-size:14px;width:100%;color:var(--ink)}
    .topbar .spacer{flex:1}
    .bell{position:relative;color:var(--muted)}
    .bell .dot{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#fff;font-size:10px;font-weight:700;border-radius:50%;width:16px;height:16px;display:grid;place-items:center}

    .content{padding:28px 30px 60px;max-width:1200px;margin:0 auto}
    .hero h1{font-size:26px;margin:0 0 4px;font-weight:800}
    .hero p{margin:0 0 26px;color:var(--muted);font-size:15px}

    .section-title{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:30px 0 14px}
    .section-title::after{content:"";flex:1;height:1px;background:var(--line)}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
    .card{position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;color:inherit;min-height:150px;transition:transform .15s,border-color .15s,box-shadow .15s}
    .card:hover{transform:translateY(-3px);border-color:var(--gold);box-shadow:0 18px 40px -26px rgba(0,0,0,.35)}
    .card .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--gold-soft);margin-bottom:14px}
    .card h3{margin:0 0 5px;font-size:16px;font-weight:700}
    .card p{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
    .card .tag{align-self:flex-start;margin-top:auto;padding-top:14px}
    .card .tag span{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;background:var(--green-soft);color:var(--green-d)}
    .card .tag span.soon{background:#eef1f3;color:var(--muted)}
    .card.is-soon{opacity:.65}
    .card.is-soon:hover{transform:none;border-color:var(--line);box-shadow:none}
    .card .arrow{position:absolute;top:20px;right:18px;color:#c3c9cc;transition:color .15s,transform .15s}
    .card:hover .arrow{color:var(--gold-d);transform:translateX(2px)}
    .empty{text-align:center;color:var(--muted);padding:60px 20px;border:1px dashed var(--line);border-radius:16px}
    .foot{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px}

    @media(max-width:820px){
      .sidebar{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
      .sidebar.open{transform:translateX(0)}
      .topbar .burger{display:block}
      .search{display:none}
      .content{padding:18px 16px 60px}
    }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <div class="sb-support"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7fd8bf" stroke-width="2"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="14" width="4" height="6" rx="1"/><rect x="18" y="14" width="4" height="6" rx="1"/></svg><div><div class="t">Soporte</div><div class="s">Estamos para ayudarte</div></div></div>
      <div class="sb-user" id="userChip" title="Cerrar sesión">
        <div class="av" id="avatar">GB</div>
        <div><div class="t" id="uName">—</div><div class="s" id="uRole">—</div></div>
        <span class="out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12H3M9 6l-6 6 6 6M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></svg></span>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="burger" onclick="document.getElementById('sidebar').classList.toggle('open')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="search" placeholder="Buscar herramienta…" autocomplete="off"/></label>
      <div class="spacer"></div>
      <div class="bell"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot">2</span></div>
    </header>
    <div class="content">
      <div class="hero">
        <h1 id="hero">Hola 👋</h1>
        <p id="heroSub">Elegí una herramienta para empezar.</p>
      </div>
      <div id="cont"></div>
      <footer class="foot"><span>© 2026 GrandBar Distribuciones · GrandBar Hub</span><span>Uso interno</span></footer>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/apps.js"></script>
<script>
  const ROLE_LABEL = { admin:"Administrador", ventas:"Ventas", marketing:"Marketing", diseno:"Diseño", desarrollo:"Desarrollo", administracion:"Administración", compras:"Compras", mayorista:"Mayorista", deposito:"Depósito", reportes:"Reportes", cliente:"Cliente", direccion:"Dirección" };
  const AREA_DOT = { ventas:"#2f6f5e", marketing:"#6b5bd0", compras:"#c9a13b", deposito:"#2f5f8f", administracion:"#d0603e", reportes:"#0d2238", copiloto:"#2f6f5e", sistema:"#a9852a" };
  const firstName = n => (n||"").trim().split(/\s+/)[0] || "";
  const initials = n => (n||"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "GB";

  let currentRole="compras", currentUser="Equipo GrandBar", currentArea="all", query="";

  // Diseño y Desarrollo (Josefina y Nahuel) ven exactamente lo mismo, y ven todo:
  // mantienen el sistema entero, así que necesitan entrar a cualquier herramienta.
  const ROLES_TOTALES = ['admin', 'diseno', 'desarrollo'];
  const visible = a => ROLES_TOTALES.includes(currentRole) || a.roles.includes("*") || a.roles.includes(currentRole);
  function urlForRole(a){ return (a.urlByRole && a.urlByRole[currentRole]) ? a.urlByRole[currentRole] : a.url; }

  function apps(){
    return APPS.filter(a => visible(a) && (currentArea==="all"||a.area===currentArea) &&
      (query===""||(a.name+" "+a.desc).toLowerCase().includes(query.toLowerCase())));
  }
  function areasDelRol(){ return Object.keys(AREAS).filter(k => APPS.some(a=>visible(a)&&a.area===k)); }

  function renderNav(){
    const nav = document.getElementById("nav");
    const areas = ["all", ...areasDelRol()];
    nav.innerHTML = areas.map(k=>{
      const label = k==="all" ? "Todo" : AREAS[k];
      const dot = k==="all" ? "" : `<span class="dotc" style="background:${AREA_DOT[k]||'#889'}"></span>`;
      return `<button class="${currentArea===k?'active':''}" data-area="${k}">${dot||'<svg style="width:18px;height:18px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>'} ${label}</button>`;
    }).join("");
    nav.querySelectorAll("button").forEach(b=> b.onclick = ()=>{ currentArea=b.dataset.area; render(); });
  }

  function cardHTML(a){
    const soon = a.status==="soon";
    const target = urlForRole(a);
    const href = soon || target==="#" ? "#" : target;
    const external = href.startsWith("http") ? ' target="_blank" rel="noopener"' : "";
    const tag = soon ? '<span class="soon">Próximamente</span>' : (target==="#" ? '<span class="soon">Sin conectar</span>' : '<span>Activo</span>');
    return `<a class="card ${soon?'is-soon':''}" href="${href}"${external}>
      <div class="ico">${a.icon}</div><h3>${a.name}</h3><p>${a.desc}</p>
      <div class="tag">${tag}</div>
      <span class="arrow"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>`;
  }

  function render(){
    renderNav();
    const list = apps();
    const cont = document.getElementById("cont");
    if(!list.length){ cont.innerHTML = `<div class="empty">No hay herramientas para mostrar con este filtro.</div>`; return; }
    const grupos = currentArea==="all" ? Object.keys(AREAS) : [currentArea];
    let html="";
    for(const g of grupos){
      const inG = list.filter(a=>a.area===g);
      if(!inG.length) continue;
      html += `<div class="section-title">${AREAS[g]}</div><div class="grid">${inG.map(cardHTML).join("")}</div>`;
    }
    cont.innerHTML = html;
  }

  document.getElementById("search").addEventListener("input", e=>{ query=e.target.value; render(); });
  document.getElementById("userChip").addEventListener("click", ()=>{ if(GBAuth.configured){ if(confirm("¿Cerrar sesión?")) GBAuth.signOut(); } });

  (async function init(){
    const s = await GBAuth.requireAuth();
    if(!s) return;
    currentRole = s.role || "compras";
    currentUser = s.nombre || "Equipo GrandBar";
    document.getElementById("uName").textContent = currentUser;
    document.getElementById("uRole").textContent = ROLE_LABEL[currentRole] || currentRole;
    document.getElementById("avatar").textContent = initials(currentUser);
    document.getElementById("hero").innerHTML = "Hola, " + firstName(currentUser) + " 👋";
    render();
  })();
</script>
<script src="assets/notif.js?v=2"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
