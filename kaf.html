<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<title>GrandBar — Panel KAF</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Panel del KAF (19/10/2026): representante de una marca en la calle (Facu Llaver,
     Campari). Lo arma Juan Pablo Sepúlveda desde trade-kaf.html: marca, secciones y
     objetivos. Datos: función kaf (assets/kaf-comun.js). -->
<link rel="stylesheet" href="assets/kaf.css?v=1">
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub" id="sb-marca">KAF</div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-cat">Lo mío</div>
    <nav class="sb-nav">
      <a href="#agenda" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Mi agenda</a>
      <button type="button" data-soporte><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Soporte</button>
    </nav>
    <div class="sb-foot"><div class="sb-user" id="logout"><div class="av" id="av">K</div><div><div class="t" id="uName">KAF</div><div class="s" id="uRol">KAF</div></div></div></div>
  </aside>
  <div class="main"><div class="content" id="contenido">
    <div class="vacio">Cargando…</div>
  </div></div>
</div>
<div class="carro" id="carro"><span id="carro-t"></span><button class="btn gold chico" id="carro-ver" type="button">Ver pedido</button></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/kaf-comun.js?v=1"></script>
<script>
  const { K, $, esc, num, fecha, hora, toast, get, post, secc, ventana, cerrar, picker } = KAF;
  const ICO = {
    inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
    clientes: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    visitas: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
    nuevos: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/>',
    evidencia: '<rect x="3" y="6" width="18" height="14" rx="2"/><circle cx="12" cy="13" r="3.5"/><path d="M9 6l1.5-2h3L15 6"/>',
    perfect_serve: '<path d="M8 22h8M12 15v7M5 3h14l-7 12z"/>',
    perfect_store: '<path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/>',
    capacitacion: '<path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
    materiales: '<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5M12 22V12"/>',
    presupuesto: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>',
  };
  const svg = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICO[k] || ''}</svg>`;
  let NOMBRE = '', INI = null, VISTA = '';

  function pintarMenu() {
    const items = [{ k: 'inicio', t: 'Inicio' }].concat((K.secciones || []).filter(s => s.on));
    $('sb-nav').innerHTML = items.map(s => `<a href="#${s.k}" data-v="${s.k}">${svg(s.k)} ${esc(s.t)}</a>`).join('');
    marcarMenu();
  }
  function marcarMenu() { document.querySelectorAll('.sb-nav a[data-v]').forEach(a => a.classList.toggle('active', a.dataset.v === VISTA)); }
  function cabeza(t, p) { return `<div class="head"><div><h1>${esc(t)}</h1>${p ? `<p>${p}</p>` : ''}</div></div>`; }

  async function ir() {
    const v = (location.hash || '#inicio').slice(1).split('?')[0];
    VISTA = v; marcarMenu();
    document.body.classList.remove('gb-drawer-open');
    const C = $('contenido');
    C.parentElement.style.padding = '';
    pintarCarro();
    if (v === 'agenda') { C.innerHTML = '<iframe class="marco" src="/mi-agenda.html?embed=1" title="Mi agenda"></iframe>'; return; }
    const S = secc(v);
    if (v !== 'inicio' && K.secciones.length && !S) { location.replace('#inicio'); return; }
    if (v === 'inicio') {
      const P = K.perfil;
      C.innerHTML = cabeza('Hola, ' + (NOMBRE.split(' ')[0] || ''), P ? `${esc(P.marca)} · ${esc((P.tipos || []).map(t => KAF.TIPO[t] || t).join(', '))}${P.region ? ' de ' + (P.region === 'san_luis' ? 'San Luis' : 'Mendoza') : ''}` : '') + '<div id="vista"></div>';
      INI = await KAF.renderInicio($('vista'));
      return;
    }
    const titulo = S ? S.t : v;
    const ayuda = S && S.ayuda && !KAF.REG[v] ? `<div class="ayuda">${esc(S.ayuda)}</div>` : '';
    if (v === 'clientes') { C.innerHTML = cabeza(titulo, 'Tus clientes con su vendedor, lo que compran de la marca y las oportunidades. Tocá uno para marcar la visita.') + ayuda + '<div id="vista"></div>'; KAF.renderClientes($('vista')); return; }
    if (v === 'visitas') { C.innerHTML = cabeza(titulo, 'Las visitas que marcaste, día por día. Juan Pablo las ve igual que vos.') + ayuda + '<div id="vista"></div>'; KAF.renderVisitas($('vista')); return; }
    if (v === 'nuevos') { C.innerHTML = cabeza(titulo, 'Clientes que empezaron a comprar este mes, con los datos de CUBO.') + ayuda + '<div id="vista"></div>'; KAF.renderNuevos($('vista')); return; }
    if (KAF.REG[v]) { C.innerHTML = cabeza(titulo, esc(KAF.REG[v].d)) + '<div id="vista"></div>'; KAF.renderRegistros($('vista'), v); return; }
    if (v === 'materiales') { C.innerHTML = cabeza(titulo, 'Elegí los materiales, sumalos al pedido y se lo mandás a Andrea (facturación) para que emita el remito.') + ayuda + '<div id="vista"></div>'; materiales($('vista')); return; }
    location.replace('#inicio');
  }
  window.addEventListener('hashchange', ir);
  K.alCambiar = () => { if (['inicio', 'visitas', 'nuevos'].includes(VISTA) || KAF.REG[VISTA]) ir(); };

  // ── Materiales: catálogo + sumador → pedido a Andrea ─────────────────────
  let MATS = null, PEST = 'catalogo', SOLO_MARCA = null, CARRO = { items: [], cliente: null, nota: '' };
  try { const g = JSON.parse(localStorage.getItem('kaf_carro_v1') || 'null'); if (g && Array.isArray(g.items)) CARRO = g; } catch (e) {}
  const guardarCarro = () => { try { localStorage.setItem('kaf_carro_v1', JSON.stringify(CARRO)); } catch (e) {} pintarCarro(); };
  function pintarCarro() {
    const n = CARRO.items.reduce((s, i) => s + (i.cantidad || 0), 0);
    $('carro').classList.toggle('on', !!CARRO.items.length && VISTA === 'materiales');
    $('carro-t').textContent = CARRO.items.length + (CARRO.items.length === 1 ? ' material' : ' materiales') + ' · ' + n + ' unidades';
  }
  function sumar(m, cant) {
    const i = CARRO.items.find(x => x.id === m.id);
    if (i) i.cantidad = Math.max(0, i.cantidad + cant); else if (cant > 0) CARRO.items.push({ id: m.id, nombre: m.nombre, cantidad: cant });
    CARRO.items = CARRO.items.filter(x => x.cantidad > 0);
    guardarCarro();
  }
  K.alPedirMateriales = cli => { CARRO.cliente = cli; guardarCarro(); if (location.hash !== '#materiales') location.hash = '#materiales'; else ir(); toast('Elegí los materiales para ' + cli.n); };

  async function materiales(el) {
    el.innerHTML = `<div class="barra"><div class="tabs" id="km-tabs"><button data-p="catalogo" class="${PEST === 'catalogo' ? 'on' : ''}">Catálogo</button><button data-p="pedidos" class="${PEST === 'pedidos' ? 'on' : ''}">Mis pedidos</button></div></div><div id="km"></div>`;
    el.querySelector('#km-tabs').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; PEST = b.dataset.p; materiales(el); };
    const box = el.querySelector('#km');
    if (PEST === 'pedidos') {
      box.innerHTML = '<div class="vacio">Cargando…</div>';
      try { const d = await get('pedidos'); box.innerHTML = (d.pedidos || []).length ? d.pedidos.map(p => KAF.pedidoHtml(p, false)).join('') : '<div class="vacio">Todavía no hiciste pedidos de materiales.</div>'; }
      catch (e) { box.innerHTML = `<div class="vacio">${esc(e.message)}</div>`; }
      return;
    }
    box.innerHTML = '<div class="vacio">Cargando el catálogo…</div>';
    if (!MATS) { try { MATS = (await get('materiales')).materiales || []; } catch (e) { box.innerHTML = `<div class="vacio">${esc(e.message)}</div>`; return; } }
    const marca = String((K.perfil || {}).marca || '').toLowerCase();
    const deMarca = m => marca && (m.proveedor + ' ' + m.marca + ' ' + m.nombre).toLowerCase().includes(marca);
    if (SOLO_MARCA === null) SOLO_MARCA = MATS.some(deMarca);
    const cats = [...new Set(MATS.map(m => m.categoria).filter(Boolean))].sort();
    box.innerHTML = `<div class="barra">
        ${marca ? `<label class="opciones" style="margin:0"><label><input type="checkbox" id="km-marca" ${SOLO_MARCA ? 'checked' : ''}> Solo ${esc(K.perfil.marca)}</label></label>` : ''}
        ${cats.length ? `<select id="km-cat"><option value="">Todas las categorías</option>${cats.map(c => `<option>${esc(c)}</option>`).join('')}</select>` : ''}
        <input type="search" id="km-q" placeholder="Buscar material…" autocomplete="off">
        <button class="btn claro chico" id="km-otro" type="button">Pedir algo que no está</button>
      </div><div class="cuenta" id="km-cuenta"></div><div class="grid-mat" id="km-grid"></div>`;
    const pinta = () => {
      const q = (box.querySelector('#km-q').value || '').trim().toLowerCase(), cat = box.querySelector('#km-cat') ? box.querySelector('#km-cat').value : '';
      const l = MATS.filter(m => (!SOLO_MARCA || deMarca(m)) && (!cat || m.categoria === cat) && (!q || (m.nombre + ' ' + m.marca + ' ' + m.proveedor + ' ' + m.descripcion).toLowerCase().includes(q)));
      box.querySelector('#km-cuenta').textContent = l.length + (l.length === 1 ? ' material' : ' materiales') + ' con stock en el depósito';
      box.querySelector('#km-grid').innerHTML = !l.length ? `<div class="vacio" style="grid-column:1/-1">${SOLO_MARCA ? 'No hay materiales de ' + esc(K.perfil.marca) + ' cargados en el catálogo. Sacá el filtro para ver todos, o pedí lo que necesitás con "Pedir algo que no está".' : 'No hay materiales con ese filtro.'}</div>`
        : l.map(m => { const en = CARRO.items.find(x => x.id === m.id); return `<div class="mat">
          <div class="img">${m.foto ? `<img src="${esc(m.foto)}" alt="" loading="lazy">` : 'Sin foto'}</div>
          <div class="in"><div class="nom">${esc(m.nombre)}</div><div class="meta">${esc([m.marca || m.proveedor, m.categoria].filter(Boolean).join(' · '))}</div><div class="meta">Stock: <b style="color:var(--ink)">${num(m.stock)}</b>${m.unidad ? ' ' + esc(m.unidad) : ''}</div></div>
          <div class="pie">${en ? `<div class="cant"><button type="button" data-m="${esc(m.id)}" data-d="-1">−</button><input value="${en.cantidad}" data-mi="${esc(m.id)}" inputmode="numeric"><button type="button" data-m="${esc(m.id)}" data-d="1">+</button></div>` : `<button class="btn navy chico" type="button" data-m="${esc(m.id)}" data-d="1">Sumar al pedido</button>`}</div>
        </div>`; }).join('');
    };
    const mk = box.querySelector('#km-marca'); if (mk) mk.onchange = () => { SOLO_MARCA = mk.checked; pinta(); };
    const kc = box.querySelector('#km-cat'); if (kc) kc.onchange = pinta;
    box.querySelector('#km-q').oninput = pinta;
    box.querySelector('#km-grid').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; const m = MATS.find(x => x.id === b.dataset.m); sumar(m, Number(b.dataset.d)); pinta(); };
    box.querySelector('#km-grid').onchange = e => { const i = e.target.closest('[data-mi]'); if (!i) return; const it = CARRO.items.find(x => x.id === i.dataset.mi); if (it) { it.cantidad = Math.max(0, Math.round(Number(i.value) || 0)); CARRO.items = CARRO.items.filter(x => x.cantidad > 0); guardarCarro(); pinta(); } };
    box.querySelector('#km-otro').onclick = () => verPedido(true);
    pinta();
  }

  function verPedido(conOtro) {
    const mb = ventana('Tu pedido de materiales', 'Le llega a Andrea (facturación) para emitir el remito.');
    const pinta = () => {
      mb.innerHTML = `${CARRO.items.length ? CARRO.items.map((i, n) => `<div class="fila"><div class="cuerpo"><div class="tit">${esc(i.nombre)}</div>${i.id ? '' : '<div class="sub">Fuera del catálogo</div>'}</div>
          <div class="cant"><button type="button" data-i="${n}" data-d="-1">−</button><input value="${i.cantidad}" data-ii="${n}" inputmode="numeric"><button type="button" data-i="${n}" data-d="1">+</button></div></div>`).join('') : '<div class="vacio">Todavía no sumaste materiales.</div>'}
        <div class="bloque"><h4>Algo que no está en el catálogo</h4><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="kp-otro" maxlength="160" placeholder="Ej. Copas Aperol balón" style="flex:1;min-width:180px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px"><input id="kp-otro-n" inputmode="numeric" value="1" style="width:70px;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px"><button class="btn claro" type="button" id="kp-otro-ok">Agregar</button></div></div>
        <div class="bloque"><h4>Para qué cliente (opcional)</h4><div id="kp-cli"></div></div>
        <label class="campo" style="margin-top:12px"><span>Nota para Andrea</span><textarea id="kp-nota" maxlength="1000" placeholder="Para cuándo lo necesitás, a dónde va…">${esc(CARRO.nota || '')}</textarea></label>
        <div class="msg" id="kp-msg"></div>
        <div class="acts"><button class="btn claro" type="button" id="kp-vaciar">Vaciar</button><button class="btn ok" type="button" id="kp-ok" ${CARRO.items.length ? '' : 'disabled'}>Enviar a Andrea</button></div>`;
      picker(mb.querySelector('#kp-cli'), CARRO.cliente, true, sel => { CARRO.cliente = sel; guardarCarro(); });
      if (conOtro) { mb.querySelector('#kp-otro').focus(); conOtro = false; }
    };
    pinta();
    mb.onclick = async e => {
      const b = e.target.closest('[data-i]');
      if (b) { const it = CARRO.items[Number(b.dataset.i)]; it.cantidad = Math.max(0, it.cantidad + Number(b.dataset.d)); CARRO.items = CARRO.items.filter(x => x.cantidad > 0); CARRO.nota = mb.querySelector('#kp-nota').value; guardarCarro(); pinta(); return; }
      if (e.target.closest('#kp-otro-ok')) {
        const n = mb.querySelector('#kp-otro').value.trim(), c = Math.max(1, Math.round(Number(mb.querySelector('#kp-otro-n').value) || 1));
        if (!n) { mb.querySelector('#kp-otro').focus(); return; }
        CARRO.items.push({ id: null, nombre: n, cantidad: c }); CARRO.nota = mb.querySelector('#kp-nota').value; guardarCarro(); pinta(); return;
      }
      if (e.target.closest('#kp-vaciar')) { if (!confirm('¿Vaciar el pedido?')) return; CARRO = { items: [], cliente: null, nota: '' }; guardarCarro(); pinta(); return; }
      const ok = e.target.closest('#kp-ok');
      if (ok) {
        ok.disabled = true; ok.textContent = 'Enviando…';
        try {
          const r = await post({ accion: 'pedido', items: CARRO.items, codigo: CARRO.cliente ? CARRO.cliente.c : null, nota: mb.querySelector('#kp-nota').value.trim() });
          CARRO = { items: [], cliente: null, nota: '' }; guardarCarro();
          const m = r.mail || {};
          const href = 'mailto:' + String(m.para || '').replace(/[^\w.@+-]/g, '') + '?subject=' + encodeURIComponent(m.asunto || '') + '&body=' + encodeURIComponent(m.cuerpo || '');
          mb.innerHTML = `<div class="aviso" style="background:var(--green-s);border-color:#b9d6c9;color:var(--green-d)">${r.avisoAndrea ? '<b>Listo.</b> El pedido le llegó a Andrea a su panel del Portal (Pedidos de materiales), con aviso en la campanita.' : '<b>El pedido quedó guardado</b>, pero no encontramos el usuario de Andrea en el Portal: mandale el mail.'} Cuando emita el remito te avisa acá.</div>
            <p style="font-size:14px;line-height:1.55">¿Querés mandárselo también por mail? Se abre tu correo con el pedido escrito: solo tenés que tocar Enviar.</p>
            <div class="acts"><button class="btn claro" type="button" id="kp-cerrar">Cerrar</button><a class="btn navy" href="${esc(href)}">Mandar también por mail</a></div>`;
          mb.querySelector('#kp-cerrar').onclick = () => { cerrar(); PEST = 'pedidos'; ir(); };
        } catch (er) { mb.querySelector('#kp-msg').textContent = er.message; ok.disabled = false; ok.textContent = 'Enviar a Andrea'; }
      }
    };
    mb.onchange = e => { const i = e.target.closest('[data-ii]'); if (!i) return; const it = CARRO.items[Number(i.dataset.ii)]; it.cantidad = Math.max(0, Math.round(Number(i.value) || 0)); CARRO.items = CARRO.items.filter(x => x.cantidad > 0); guardarCarro(); pinta(); };
    cerrar.despues = () => { if (VISTA === 'materiales') ir(); };
  }
  $('carro-ver').onclick = () => verPedido(false);

  (async () => {
    const { data: { session } } = await KAF.supa().auth.getSession();
    if (!session) { location.href = 'index.html'; return; }
    const { data: u } = await KAF.supa().from('usuarios').select('nombre,rol').eq('id', session.user.id).maybeSingle();
    const rol = String((u && u.rol) || '').toLowerCase();
    // Trade Marketing y quienes mantienen el sistema miran los KAF desde su tablero.
    if (['torneo', 'desarrollo', 'diseno'].includes(rol)) { location.replace('trade-kaf.html'); return; }
    if (rol !== 'kaf') { location.replace('hub.html'); return; }
    NOMBRE = (u && u.nombre) || '';
    if (NOMBRE) { $('uName').textContent = NOMBRE; $('av').textContent = NOMBRE.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
    // Perfil y secciones (las arma Trade Marketing).
    try {
      const d = await get('inicio');
      K.perfil = d.perfil; K.secciones = d.secciones || [];
      $('sb-marca').textContent = d.perfil ? 'KAF ' + d.perfil.marca : 'KAF';
      $('uRol').textContent = d.perfil ? 'KAF ' + d.perfil.marca : 'KAF';
    } catch (e) { toast(e.message, true); }
    pintarMenu();
    ir();
  })();
  document.querySelector('[data-soporte]').addEventListener('click', () => {
    if (window.abrirSoporteWA) window.abrirSoporteWA(); else alert('Escribinos al WhatsApp de soporte: +54 9 261 245-2651');
  });
</script>
<script src="assets/notif.js?v=3"></script>
<script src="assets/soporte.js?v=1"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
<script src="/assets/minuta-fab.js?v=3"></script>
<script src="/assets/cuenta-activa.js?v=1"></script>
</body>
</html>
