<style>
  .kpis5{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
  .grid-a{display:grid;grid-template-columns:1fr 320px;gap:16px;margin-bottom:16px}
  .wtabs{display:flex;gap:6px;background:var(--cream);border-radius:9px;padding:3px}
  .wtabs span{padding:5px 14px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}.wtabs span.on{background:var(--card);color:var(--ink)}
  .board{overflow-x:auto}
  .brow{display:grid;grid-template-columns:150px repeat(7,minmax(96px,1fr));gap:6px;margin-bottom:6px}
  .bhead{font-size:10.5px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
  .bhead b{display:block;font-size:14px;color:var(--ink)} .bhead.on b{color:var(--gold-d)}
  .vc{display:flex;gap:8px;align-items:center;padding:6px}
  .vc .av{width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:800;flex:none}
  .vc .nm{font-size:11.5px;font-weight:700;line-height:1.2} .vc .ss{font-size:9.5px;color:var(--muted)}
  .ev{border-radius:8px;padding:5px 6px;font-size:9.5px;border-left:3px solid var(--green);background:var(--green-soft)}
  .ev .tm{font-weight:800} .ev .ty{font-weight:700} .ev .lo{color:var(--muted)}
  .ev.reu{border-color:var(--orange);background:var(--orange-soft)} .ev.seg{border-color:var(--purple);background:var(--purple-soft)} .ev.rep{border-color:#9aa;background:#f0f0f0}
  .ev.none{background:none;border:0;color:#ccc;text-align:center}
  .mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;text-align:center}
  .mcal .h{color:var(--muted);font-weight:700;font-size:9.5px;padding:2px} .mcal .d{padding:5px 0;border-radius:6px} .mcal .d.on{background:var(--navy);color:#fff;font-weight:800} .mcal .d.mut{color:#ccc}
  .tk .row{display:flex;gap:9px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .tk .row:last-of-type{border-bottom:0} .tk .nm{font-size:12px;font-weight:700} .tk .ss{font-size:10.5px;color:var(--muted)}
  .prox .row{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .prox .row:last-child{border-bottom:0} .prox .tm{font-size:10.5px;color:var(--muted);white-space:nowrap;width:74px}
  .prox .nm{font-size:12px;font-weight:700} .prox .lo{font-size:10.5px;color:var(--muted)}
  .cmp .row{display:flex;align-items:center;gap:10px;padding:7px 0} .cmp .nm{width:130px;font-size:12px;font-weight:600}
  .cmp .track{flex:1;height:7px;background:#eee7d8;border-radius:4px;overflow:hidden}.cmp .track>i{display:block;height:100%} .cmp .pc{width:36px;text-align:right;font-weight:800;font-size:12px}
  @media(max-width:1150px){ .kpis5{grid-template-columns:1fr 1fr} .grid-a{grid-template-columns:1fr} }
</style>

<body>
<div class="app">
  <aside class="sb" id="dsb"></aside>
  <div class="main"><div class="wrap">

    <div class="dhead">
      <span class="ic" style="background:var(--purple-soft);color:var(--purple)"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>

      <span class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16l-6 8v6l-4-2v-4z"/></svg> Filtros</span>
      <div class="ic-btn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span class="dot">3</span></div>
      <button class="acc" id="btnReunion" style="background:var(--navy);color:#fff"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> Programar reunión</button>

        <div class="agcal-head"><button class="agnav" id="agPrev">‹</button><span class="agmes" id="agMes">—</span><button class="agnav" id="agNext">›</button></div>

<div id="rov" style="display:none;position:fixed;inset:0;background:rgba(13,34,48,.55);z-index:50;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><b style="font-size:16px;flex:1">Programar reunión</b><button id="rX" style="background:none;border:0;font-size:20px;cursor:pointer;color:#6d7d85">×</button></div>
    <label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:8px 0 4px">Usuario</label>
    <select id="rUser" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:10px;font:inherit"><option value="">Cargando usuarios…</option></select>
    <label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Título</label>
    <input id="rTit" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:10px;font:inherit" placeholder="Ej: Revisión de objetivos del mes" maxlength="120">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
      <div><label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Fecha</label><input id="rFecha" type="date" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:9px;font:inherit"></div>
      <div><label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Hora</label><input id="rHora" type="time" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:9px;font:inherit"></div>
      <div><label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Tipo</label><select id="rTipo" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:9px;font:inherit"><option value="reunion">Reunión</option><option value="llamada">Llamada</option><option value="visita">Visita</option><option value="capacitacion">Capacitación</option></select></div>
    </div>
    <label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Lugar (opcional)</label>
    <input id="rLugar" style="width:100%;border:1px solid #e7ded0;border-radius:10px;padding:10px;font:inherit" placeholder="Oficina Central / Videollamada…">
    <label style="display:block;font-size:12px;font-weight:700;color:#6d7d85;margin:10px 0 4px">Detalle (opcional)</label>
    <textarea id="rDet" style="width:100%;min-height:70px;border:1px solid #e7ded0;border-radius:10px;padding:10px;font:inherit"></textarea>
    <button class="acc" id="rGuardar" style="background:var(--gold);color:#241a06;border:0;border-radius:11px;padding:12px;font:inherit;font-weight:800;width:100%;margin-top:14px;cursor:pointer">Programar y avisar al usuario</button>
    <div id="rMsg" style="font-size:12.5px;font-weight:700;margin-top:8px;min-height:16px"></div>
  </div>
</div>

<!-- Modal MINUTA (Dirección) -->
<div id="dmov" style="display:none;position:fixed;inset:0;background:rgba(13,34,48,.55);z-index:55;align-items:center;justify-content:center;padding:16px">
  <div style="background:#fff;border-radius:16px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:20px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:2px"><b id="dmTit" style="font-size:16px;flex:1">Minuta</b><button onclick="cerrarMin()" style="background:none;border:0;font-size:20px;cursor:pointer;color:#6d7d85">×</button></div>
    <div id="dmMeta" style="font-size:12px;color:#6d7d85;margin-bottom:12px"></div>
    <div id="miaMount"></div>
    <div style="margin-bottom:13px"><label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">📝 Temas que se hablaron</label><div id="dmTemas"></div><button type="button" class="min-add" onclick="minAdd('temas')">+ Agregar tema</button></div>
    <div style="margin-bottom:13px"><label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">⏭️ Pendientes para la próxima</label><div id="dmPend"></div><button type="button" class="min-add" onclick="minAdd('pend')">+ Agregar pendiente</button></div>
    <div style="margin-bottom:6px"><label style="display:block;font-weight:700;font-size:13px;margin-bottom:6px">Notas / acuerdos</label><textarea id="dmNotas" maxlength="2000" style="width:100%;min-height:64px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px"></textarea></div>
    <button id="dmSave" onclick="guardarMinuta()" style="background:#2f8f6e;color:#fff;border:0;border-radius:11px;padding:13px;font:inherit;font-weight:800;font-size:15px;width:100%;margin-top:12px;cursor:pointer">✔ Guardar minuta</button>
  </div>
</div>

<style>
  .min-add{background:none;border:1px dashed var(--line);border-radius:9px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;color:#256f54;cursor:pointer;width:100%;margin-top:4px}
  .min-row{display:flex;gap:8px;align-items:center;margin-bottom:7px}
  .min-row input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:14px}
  .min-row .del{background:#fbe9e4;color:#c0603e;border:0;border-radius:8px;width:34px;height:38px;font-size:18px;cursor:pointer;flex:none}
  .agcal-head{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 12px}
  .agmes{font-weight:800;font-size:15px;text-transform:capitalize}
  .agnav{background:var(--card);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:16px;font-weight:700;color:var(--ink)}
  .agnav:hover{border-color:var(--gold)}
  .agcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .agdow{text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);padding-bottom:2px}
  .agcell{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:13.5px;font-weight:600}
  .agcell:hover{border-color:var(--gold)}
  .agcell.empty{border:0;cursor:default;background:none}
  .agcell.today{border-color:var(--gold);color:var(--gold-d)}
  .agcell.sel{background:var(--navy);color:#fff;border-color:var(--navy)}
  .agcell.has::after{content:"";position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#6b5bd0}
  .agcell.sel.has::after{background:#fff}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
(function(){
  const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
  const FN='/.netlify/functions/reuniones';
  let TOKEN=null;
  const $=id=>document.getElementById(id);
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const estBadge={programada:['tag tr','Programada'],confirmada:['tag ok','Confirmada'],realizada:['tag ok','Realizada'],cancelada:['tag','Cancelada'],rechazada:['tag alto','No asiste']};
  let LISTA_REU=[], _minReu=null, calRef=new Date(), selDia=null, _minTranscript='';
  const _bs='font:inherit;font-weight:700;font-size:11.5px;cursor:pointer;border-radius:8px;padding:6px 11px';
  function minBtns(id, tieneMin){
    if(!tieneMin) return '<button data-min="'+id+'" style="background:#eef3f7;color:#2c5a80;border:1px solid #cfe0ec;'+_bs+'">📝 Hacer minuta</button>';
    return '<button data-vmin="'+id+'" style="background:#eef3f7;color:#2c5a80;border:1px solid #cfe0ec;'+_bs+'">📋 Ver minuta</button>'
      +'<button data-vres="'+id+'" style="background:#efeaf9;color:#5a3fbf;border:1px solid #d9cff3;'+_bs+'">✨ Ver resumen</button>'
      +'<button data-min="'+id+'" style="background:none;color:#6d7d85;border:1px solid #e7ded0;'+_bs+'">✏️ Editar</button>';
  }
  function _findReu(id){ return LISTA_REU.find(r=>String(r.id)===String(id)); }
  function verMin(id){ const x=_findReu(id); if(x&&window.verMinutaHTML) window.verMinutaHTML(x); }
  function verRes(id){ const x=_findReu(id); if(x&&window.verResumen) window.verResumen(x,(html)=>guardarResumen(id,html)); }
  async function guardarResumen(id,html){ try{ await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'resumen',id,resumen_html:html})}); const x=_findReu(id); if(x){ x.minuta=x.minuta||{}; x.minuta.resumen_html=html; } }catch(e){} }
  function wireMinBtns(cont){ cont.querySelectorAll('[data-vmin]').forEach(b=>b.onclick=()=>verMin(b.dataset.vmin)); cont.querySelectorAll('[data-vres]').forEach(b=>b.onclick=()=>verRes(b.dataset.vres)); }
  const pad=n=>String(n).padStart(2,'0');
  const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const DOWL=['L','M','M','J','V','S','D'];

  function renderCalendario(){
    const y=calRef.getFullYear(), m=calRef.getMonth();
    $('agMes').textContent=MESES[m]+' '+y;
    const primer=(new Date(y,m,1).getDay()+6)%7; // Lunes=0
    const dias=new Date(y,m+1,0).getDate();
    const hoyISO=isoOf(new Date());
    const conReu={}; LISTA_REU.forEach(x=>{ if(x.estado!=='cancelada') conReu[x.fecha]=true; });
    let html=DOWL.map(d=>`<div class="agdow">${d}</div>`).join('');
    for(let i=0;i<primer;i++) html+='<div class="agcell empty"></div>';
    for(let d=1;d<=dias;d++){ const f=y+'-'+pad(m+1)+'-'+pad(d); const cls=['agcell']; if(f===hoyISO)cls.push('today'); if(f===selDia)cls.push('sel'); if(conReu[f])cls.push('has'); html+=`<div class="${cls.join(' ')}" data-f="${f}">${d}</div>`; }
    $('miAgendaCal').innerHTML=html;
    $('miAgendaCal').querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{ selDia=c.dataset.f; renderCalendario(); renderDiaSel(); });
  }
  function renderDiaSel(){
    const box=$('miAgendaDia');
    if(!selDia){ box.innerHTML='<div style="color:#6d7d85;font-size:12.5px;text-align:center;padding:10px 0">Tocá un día para ver tus reuniones.</div>'; return; }
    const fl=new Date(selDia+'T00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});
    const rows=LISTA_REU.filter(x=>x.fecha===selDia && x.estado!=='cancelada').sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
    let html=`<div style="font-weight:800;font-size:12.5px;color:#a97c22;text-transform:capitalize;margin-bottom:8px">${fl}</div>`;
    if(!rows.length){ html+='<div style="color:#6d7d85;font-size:12.5px;padding:6px 0">No hay reuniones este día.</div>'; box.innerHTML=html; return; }
    html+=rows.map(x=>{const b=estBadge[x.estado]||estBadge.programada;
      const tieneMin=x.minuta&&((x.minuta.temas&&x.minuta.temas.length)||(x.minuta.pendientes&&x.minuta.pendientes.length)||x.minuta.notas);
      return `<div style="display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-left:4px solid #6b5bd0;border-radius:11px;margin-bottom:8px">
        <div style="min-width:44px;text-align:center"><div style="font-weight:800;font-size:13px">${x.hora?esc(x.hora.slice(0,5)):'—'}</div></div>
        <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:13.5px">${esc(x.titulo)}</div>
          <div style="font-size:11.5px;color:#6d7d85">👤 ${esc(x.destinatario||'—')}${x.lugar?' · '+esc(x.lugar):''}</div>
          ${(x.estado==='rechazada'&&x.respuesta)?'<div style="font-size:11px;color:#c0603e;font-weight:600">No asiste: '+esc(x.respuesta)+'</div>':''}
          <div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">
            ${minBtns(x.id,tieneMin)}
            <button data-del="${x.id}" style="background:none;border:1px solid #e7cfc6;color:#c0603e;border-radius:8px;padding:6px 11px;font:inherit;font-weight:700;font-size:11.5px;cursor:pointer">Cancelar</button>
          </div></div>
        <span class="${b[0]}">${b[1]}</span></div>`;
    }).join('');
    box.innerHTML=html;
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{ if(!confirm('¿Borrar esta reunión?'))return; await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'borrar',id:b.dataset.del})}); cargarLista(); });
    box.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>abrirMinuta(b.dataset.min));
    wireMinBtns(box);
  }

  function abrir(){ $('rov').style.display='flex'; $('rMsg').textContent=''; }
  function cerrar(){ $('rov').style.display='none'; }

  async function cargarUsuarios(){
    try{
      const r=await fetch(FN+'?usuarios=1',{headers:{Authorization:'Bearer '+TOKEN}});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
      $('rUser').innerHTML='<option value="">— Elegí un usuario —</option>'+d.usuarios.map(u=>`<option value="${u.id}">${esc(u.nombre||u.email)}${u.canal?' ('+esc(u.canal)+')':''}</option>`).join('');
    }catch(e){ $('rUser').innerHTML='<option value="">Error: '+esc(e.message)+'</option>'; }
  }

  async function cargarLista(){
    try{
      const r=await fetch(FN+'?admin=1',{headers:{Authorization:'Bearer '+TOKEN}});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
      LISTA_REU=(d.reuniones||[]);
      if(!selDia){ const hoyISO=isoOf(new Date()); selDia = LISTA_REU.some(x=>x.fecha===hoyISO && x.estado!=='cancelada') ? hoyISO : (LISTA_REU.filter(x=>x.fecha>=hoyISO && x.estado!=='cancelada').sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)))[0]||{}).fecha || hoyISO; if(selDia){ const [Y,M]=selDia.split('-').map(Number); calRef=new Date(Y,M-1,1); } }
      renderCalendario(); renderDiaSel(); renderMinutasDir();
    }catch(e){ $('miAgendaCal').innerHTML='<div style="color:#c0603e;font-size:12px;padding:12px 0;text-align:center">'+esc(e.message)+'</div>'; }
  }

  function renderMinutasDir(){
    const con=LISTA_REU.filter(x=>x.minuta&&((x.minuta.temas&&x.minuta.temas.length)||(x.minuta.pendientes&&x.minuta.pendientes.length)||x.minuta.notas)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    const card=$('reuMinutasCard'), box=$('reuMinutas');
    if(!con.length){ card.style.display='none'; return; }
    card.style.display='block';
    box.innerHTML=con.slice(0,20).map(x=>{const f=new Date(x.fecha+'T00:00').toLocaleDateString('es-AR',{day:'2-digit',month:'short'});const m=x.minuta||{};const nt=(m.temas||[]).length,np=(m.pendientes||[]).length;
      return `<div data-min="${x.id}" style="cursor:pointer;display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2)"><div style="min-width:40px;text-align:center;font-weight:800;font-size:12px">${f}</div><div style="flex:1"><div style="font-weight:700;font-size:12.5px">${esc(x.titulo)}</div><div style="font-size:11px;color:#6d7d85">${esc(x.destinatario||'')} · ${nt} tema(s)${np?' · '+np+' pend.':''}</div></div><span style="color:#2c5a80;font-size:14px">›</span></div>`;
    }).join('');
    box.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>verMin(b.dataset.min));
  }

  function minRowHtml(v){ return `<div class="min-row"><input type="text" value="${esc(v||'')}" placeholder="Escribí acá…"><button type="button" class="del" onclick="this.parentElement.remove()">×</button></div>`; }
  function minAdd(which,v){ const box=$(which==='temas'?'dmTemas':'dmPend'); box.insertAdjacentHTML('beforeend',minRowHtml(v)); if(v===undefined||v===''){ const ins=box.querySelectorAll('input'); if(ins.length) ins[ins.length-1].focus(); } }
  function _minVals(id){ return [...$(id).querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean); }
  function abrirMinuta(id){
    const x=LISTA_REU.find(r=>String(r.id)===String(id)); if(!x) return; _minReu=x; _minTranscript=(x.minuta&&x.minuta.transcript)||'';
    $('dmTit').textContent='Minuta · '+x.titulo;
    $('dmMeta').textContent=(x.destinatario?x.destinatario+' · ':'')+new Date(x.fecha+'T00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})+(x.hora?' · '+String(x.hora).slice(0,5)+' hs':'');
    $('dmTemas').innerHTML=''; $('dmPend').innerHTML='';
    const m=x.minuta||{};
    (m.temas&&m.temas.length?m.temas:['']).forEach(t=>minAdd('temas',t));
    (m.pendientes&&m.pendientes.length?m.pendientes:['']).forEach(t=>minAdd('pend',t));
    $('dmNotas').value=m.notas||'';
    $('dmSave').disabled=false; $('dmSave').textContent='✔ Guardar minuta';
    $('dmov').style.display='flex';
    if(window.mountMinutaIA) window.mountMinutaIA($('miaMount'), fillMinutaIA);
  }
  function fillMinutaIA(m,transcript){
    if(m.temas&&m.temas.length){ $('dmTemas').innerHTML=''; m.temas.forEach(t=>minAdd('temas',t)); }
    if(m.pendientes&&m.pendientes.length){ $('dmPend').innerHTML=''; m.pendientes.forEach(t=>minAdd('pend',t)); }
    if(m.notas){ const n=$('dmNotas'); n.value=(n.value.trim()?n.value.trim()+'\n':'')+m.notas; }
    if(transcript) _minTranscript=transcript;
  }
  function cerrarMin(){ $('dmov').style.display='none'; }
  async function guardarMinuta(){
    if(!_minReu) return;
    const temas=_minVals('dmTemas'), pend=_minVals('dmPend'), notas=$('dmNotas').value.trim();
    if(!temas.length&&!pend.length&&!notas){ alert('Cargá al menos un tema.'); return; }
    const btn=$('dmSave'); btn.disabled=true; btn.textContent='Guardando…';
    try{
      const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'minuta',id:_minReu.id,temas,pendientes:pend,notas,transcript:_minTranscript||undefined})});
      const d=await r.json(); if(!r.ok||!d.ok){ alert(d.error||'No se pudo guardar'); btn.disabled=false; btn.textContent='✔ Guardar minuta'; return; }
      _minReu.minuta={temas,pendientes:pend,notas:notas||null,transcript:_minTranscript||(_minReu.minuta&&_minReu.minuta.transcript)||null,resumen_html:(_minReu.minuta&&_minReu.minuta.resumen_html)||null}; _minReu.estado='realizada';
      cerrarMin(); cargarLista();
    }catch(e){ alert('Error de conexión'); btn.disabled=false; btn.textContent='✔ Guardar minuta'; }
  }

  window.minAdd=minAdd; window.cerrarMin=cerrarMin; window.guardarMinuta=guardarMinuta; window.abrirMinuta=abrirMinuta; window.verMin=verMin; window.verRes=verRes;

  $('rGuardar').onclick=async()=>{
    const usuario_id=$('rUser').value, titulo=$('rTit').value.trim();
    if(!usuario_id){ $('rMsg').style.color='#c0603e'; $('rMsg').textContent='Elegí un usuario.'; return; }
    if(!titulo){ $('rMsg').style.color='#c0603e'; $('rMsg').textContent='Poné un título.'; return; }
    if(!$('rFecha').value){ $('rMsg').style.color='#c0603e'; $('rMsg').textContent='Elegí la fecha.'; return; }
    $('rGuardar').disabled=true; $('rMsg').style.color='#6d7d85'; $('rMsg').textContent='Programando…';
    try{
      const body={accion:'crear',usuario_id,titulo,tipo:$('rTipo').value,fecha:$('rFecha').value,hora:$('rHora').value||null,lugar:$('rLugar').value.trim(),detalle:$('rDet').value.trim()};
      const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
      $('rTit').value='';$('rLugar').value='';$('rDet').value='';
      $('rMsg').style.color='#256f54'; $('rMsg').textContent='✓ Programada. Al usuario le aparece en su agenda.';
      cargarLista(); setTimeout(cerrar,900);
    }catch(e){ $('rMsg').style.color='#c0603e'; $('rMsg').textContent=e.message; }
    finally{ $('rGuardar').disabled=false; }
  };

  $('btnReunion').onclick=abrir; var b2=$('btnReunion2'); if(b2) b2.onclick=abrir; var b3=$('btnReunion3'); if(b3) b3.onclick=abrir;
  $('agPrev').onclick=()=>{ calRef=new Date(calRef.getFullYear(),calRef.getMonth()-1,1); renderCalendario(); };
  $('agNext').onclick=()=>{ calRef=new Date(calRef.getFullYear(),calRef.getMonth()+1,1); renderCalendario(); };
  $('rX').onclick=cerrar; $('rov').addEventListener('click',e=>{if(e.target.id==='rov')cerrar();});

  (async()=>{
    const hub=supabase.createClient(HUB.url,HUB.key);
    const {data:{session}}=await hub.auth.getSession();
    if(!session) return; TOKEN=session.access_token;
    cargarUsuarios(); cargarLista();
  })();
})();
</script>
