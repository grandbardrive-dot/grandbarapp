<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<title>GrandBar — Depósito</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<!-- Depósito (26/10/2026): el conteo de stock que antes era la app aparte grandbar-stock,
     ahora en el Portal y con su estilo. Lucas Porro cuenta Vinos y Lucas Buenanueva
     Spirits y Gaseosas (rol deposito; el sector va en usuarios.canal). Eligen proveedores
     y líneas, cargan Depo 1 + Local + Depo 2 por SKU y lo envían: se guarda, sale el mail
     con el Excel y le llega el aviso a administración. También la agenda de los lunes.
     Administración lo maneja en deposito-admin.html. Datos: función stock (assets/stock-comun.js). -->
<link rel="stylesheet" href="assets/kaf.css?v=1">
<link rel="stylesheet" href="assets/stock.css?v=1">
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub" id="sb-sector">Depósito</div>
    <nav class="sb-nav" id="sb-nav">
      <a href="#inicio" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg> Inicio</a>
      <a href="#conteo" data-v="conteo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg> Contar stock</a>
      <a href="#agenda" data-v="agenda"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Agenda de los lunes</a>
      <a href="#historial" data-v="historial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg> Mis conteos</a>
    </nav>
    <div class="sb-cat" id="sb-admin-cat" style="display:none">Administración</div>
    <nav class="sb-nav" id="sb-admin" style="display:none">
      <a href="deposito-admin.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Administración del stock</a>
    </nav>
    <div class="sb-cat">Lo mío</div>
    <nav class="sb-nav">
      <button type="button" data-soporte><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Soporte</button>
    </nav>
    <div class="sb-foot"><div class="sb-user" id="logout"><div class="av" id="av">D</div><div><div class="t" id="uName">Depósito</div><div class="s" id="uRol">Depósito</div></div></div></div>
  </aside>
  <div class="main"><div class="content" id="contenido">
    <div class="vacio">Cargando…</div>
  </div></div>
</div>
<div class="ov" id="ov"><div class="modal"><button class="cerrar" type="button" aria-label="Cerrar" onclick="cerrarModal()">×</button><div id="ov-c"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="assets/stock-productos.js?v=1"></script>
<script src="assets/stock-comun.js?v=1"></script>
<script>
  const { $, esc, num, SECTOR_LBL, SECTOR_ICO, hoy, fecha, fechaHora, diaLargo, toast, get, post } = STOCK;
  let YO = null, SECTOR = null, AG = null, STK = null, VISTA = '';
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
  // En este celular: la selección del conteo en curso y lo cargado sin enviar (por sector).
  const K_SEL = () => 'gb_stock_sel_' + SECTOR, K_DRAFT = () => 'gb_stock_draft_' + SECTOR, K_VEL = 'gb_stock_vel';
  const primerNombre = n => String(n || '').trim().split(/\s+/)[0] || '';
  const cabeza = (t, p) => `<div class="head"><div><h1>${esc(t)}</h1>${p ? `<p>${p}</p>` : ''}</div></div>`;
  const vacio = m => `<div class="vacio">${m}</div>`;
  function modal(html) { $('ov-c').innerHTML = html; $('ov').classList.add('open'); }
  function cerrarModal() { $('ov').classList.remove('open'); }
  $('ov').addEventListener('click', e => { if (e.target.id === 'ov') cerrarModal(); });

  async function cargarAgenda() { AG = await get('agenda'); return AG; }
  async function cargarStock() { STK = await get('stock'); return STK; }
  const excluidos = () => new Set(((AG && AG.excluidos) || []).filter(x => x.sector === SECTOR).map(x => x.proveedor));
  const ciclo = () => ((AG && AG.ciclos) || []).find(c => c.sector === SECTOR) || null;
  const vel = () => lsGet(K_VEL, 45);
  const calcAgenda = () => STOCK.agenda({ sector: SECTOR, registro: AG.registro, excluidos: excluidos(), ciclo: ciclo(), segPorItem: vel() });

  // ── Navegación ─────────────────────────────────────────────────────────────
  function marcarMenu() { document.querySelectorAll('.sb-nav a[data-v]').forEach(a => a.classList.toggle('active', a.dataset.v === VISTA)); }
  async function ir() {
    VISTA = (location.hash || '#inicio').slice(1) || 'inicio';
    marcarMenu();
    const C = $('contenido');
    if (!SECTOR) return elegirSector(C);
    try {
      if (VISTA === 'conteo') return await verConteo(C);
      if (VISTA === 'agenda') return await verAgenda(C);
      if (VISTA === 'historial') return await verHistorial(C);
      VISTA = 'inicio'; marcarMenu();
      await verInicio(C);
    } catch (e) { C.innerHTML = vacio(esc(e.message || 'No se pudo cargar.')); }
  }
  window.addEventListener('hashchange', ir);

  // Elegir el sector: los chicos una sola vez (queda en su usuario); administración, cuando quiera.
  function elegirSector(C) {
    C.innerHTML = cabeza('¿Qué contás?', YO.esDepo ? 'Elegilo una vez: queda guardado en tu usuario.' : 'Elegí qué sector querés ver.') +
      `<div class="kaf-cards">${['vinos', 'spirits'].map(s => `<button class="kaf-card" type="button" data-s="${s}"><b>${SECTOR_ICO[s]} ${SECTOR_LBL[s]}</b><span>${s === 'vinos' ? 'Bodegas y vinos' : 'Spirits, aperitivos y gaseosas'}</span></button>`).join('')}</div>`;
    C.querySelectorAll('[data-s]').forEach(b => b.onclick = async () => {
      const s = b.dataset.s;
      if (YO.esDepo && !YO.esAdmin) { try { await post({ accion: 'mi-sector', sector: s }); } catch (e) { return toast(e.message, true); } }
      else lsSet('gb_stock_sector_ver', s);
      ponerSector(s); ir();
    });
  }
  function ponerSector(s) {
    SECTOR = s; AG = null;
    $('sb-sector').textContent = SECTOR_ICO[s] + ' ' + SECTOR_LBL[s];
    document.title = 'GrandBar — Depósito · ' + SECTOR_LBL[s];
  }
  // Administración puede pasar de un sector al otro desde el inicio.
  const cambioSector = () => YO.esAdmin
    ? `<div class="tabs" style="margin-bottom:14px">${['vinos', 'spirits'].map(s => `<button type="button" class="${s === SECTOR ? 'on' : ''}" onclick="lsSet('gb_stock_sector_ver','${s}');ponerSector('${s}');ir()">${SECTOR_ICO[s]} ${SECTOR_LBL[s]}</button>`).join('')}</div>` : '';

  // ── Inicio ─────────────────────────────────────────────────────────────────
  async function verInicio(C) {
    C.innerHTML = cabeza('Hola, ' + primerNombre(YO.nombre), SECTOR_ICO[SECTOR] + ' ' + SECTOR_LBL[SECTOR] + ' · ' + diaLargo(hoy())) + cambioSector() + vacio('Cargando…');
    const [ , , cs] = await Promise.all([cargarAgenda(), STK || cargarStock(), get('conteos')]);
    const a = calcAgenda(), prox = a.sesiones[0], ult = (cs.conteos || [])[0];
    const draft = lsGet(K_DRAFT(), null), nDraft = draft ? Object.keys(draft.values || {}).length : 0;
    const pct = a.total ? Math.round(a.hechos.length / a.total * 100) : 0;
    C.innerHTML = cabeza('Hola, ' + primerNombre(YO.nombre), SECTOR_ICO[SECTOR] + ' ' + SECTOR_LBL[SECTOR] + ' · ' + diaLargo(hoy())) + cambioSector() +
      (nDraft ? `<div class="aviso">Tenés un conteo sin enviar en este celular: <b>${nDraft} producto${nDraft === 1 ? '' : 's'} cargado${nDraft === 1 ? '' : 's'}</b>. <button class="lnk" onclick="location.hash='#conteo'">Seguir contando</button></div>` : '') +
      `<div class="kpis">
        <div class="kpi"><div class="k">Próximo lunes</div><div class="v" style="font-size:20px">${prox ? esc(diaLargo(prox.fecha)) : '—'}</div><div class="s">${prox ? prox.provs.length + ' proveedor' + (prox.provs.length === 1 ? '' : 'es') + ' · ' + STOCK.horas(prox.min) + (prox.asignada ? ' · lo asignó administración' : '') : 'No queda nada por contar en este ciclo'}</div></div>
        <div class="kpi"><div class="k">Ciclo de proveedores</div><div class="v">${a.hechos.length} <small>de ${a.total}</small></div><div class="prog ${pct === 100 ? 'ok' : ''}"><i style="width:${pct}%"></i></div><div class="s">${a.sesiones.length} lunes por delante</div></div>
        <div class="kpi"><div class="k">Último conteo</div><div class="v" style="font-size:20px">${ult ? esc(fecha(ult.fecha)) : '—'}</div><div class="s">${ult ? ult.contados + ' de ' + ult.productos + ' productos · ' + num(ult.unidades) + ' unidades' : 'Todavía no enviaste conteos'}</div></div>
        <div class="kpi"><div class="k">Stock del sistema</div><div class="v" style="font-size:20px">${STK && STK.actualizado ? esc(fechaHora(STK.actualizado)) : '—'}</div><div class="s">${STK && STK.filas ? 'Se trae de Córdoba cada hora' : 'Todavía no se cargó del sistema'}</div></div>
      </div>
      <div style="margin:16px 0 4px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn gold" onclick="nuevoConteo()">Empezar un conteo</button>
        <button class="btn claro" onclick="location.hash='#agenda'">Ver la agenda</button>
      </div>` +
      (prox ? `<h2>Para el ${esc(diaLargo(prox.fecha).toLowerCase())} <small>${prox.provs.length} proveedor${prox.provs.length === 1 ? '' : 'es'}</small></h2>
        ${prox.provs.map(p => `<div class="fila"><div class="cuerpo"><div class="tit">${esc(p.name)}</div><div class="sub">${p.count} productos · ${STOCK.horas(p.minEst)} aprox.</div></div></div>`).join('')}
        <div style="margin-top:10px"><button class="btn navy" onclick="contarEstos(window._prox)">Contar estos proveedores</button></div>` : '');
    window._prox = prox ? prox.provs.map(p => p.name) : [];
  }

  // ── Conteo: proveedores → líneas → planilla ─────────────────────────────────
  let SEL = null, DRAFT = null, Q = '', LISTA = [], SKUS = new Set();
  const leerSel = () => (SEL = lsGet(K_SEL(), null) || { paso: 'proveedores', proveedores: [], lineas: [] });
  const guardarSel = () => lsSet(K_SEL(), SEL);
  function nuevoConteo() { SEL = { paso: 'proveedores', proveedores: [], lineas: [] }; guardarSel(); location.hash = '#conteo'; if (VISTA === 'conteo') ir(); }
  function contarEstos(provs) { SEL = { paso: 'lineas', proveedores: provs, lineas: [], todas: true }; guardarSel(); location.hash = '#conteo'; if (VISTA === 'conteo') ir(); }

  async function verConteo(C) {
    leerSel();
    if (!AG) await cargarAgenda();
    if (SEL.paso === 'form' && SEL.proveedores.length) return verPlanilla(C);
    if (SEL.paso === 'lineas' && SEL.proveedores.length) return verLineas(C);
    return verProveedores(C);
  }

  function verProveedores(C) {
    const lista = STOCK.proveedores(SECTOR, excluidos()), elegidos = new Set(SEL.proveedores);
    C.innerHTML = cabeza('Contar stock', `${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]} · Paso 1 de 3: elegí los proveedores que vas a contar.`) +
      `<div class="barra"><input type="search" id="pv-q" placeholder="Buscar proveedor…" autocomplete="off">
        <button class="btn claro chico" id="pv-todos" type="button">Elegir todos</button><button class="btn claro chico" id="pv-limpiar" type="button">Limpiar</button></div>
      <div class="sel-lista" id="pv-lista"></div>
      <div class="sel-pie"><div class="cuenta" id="pv-n"></div><button class="btn gold grande" id="pv-seguir" type="button">Continuar</button></div>`;
    const pinta = () => {
      const q = ($('pv-q').value || '').trim().toLowerCase();
      $('pv-lista').innerHTML = lista.filter(p => !q || p.nombre.toLowerCase().includes(q)).map(p =>
        `<button type="button" class="sel-item ${elegidos.has(p.nombre) ? 'on' : ''}" data-p="${esc(p.nombre)}"><span class="ck">${elegidos.has(p.nombre) ? '✓' : ''}</span><span class="nm">${esc(p.nombre)}</span><span class="ct">${p.cant} SKU${p.cant === 1 ? '' : 's'}</span></button>`).join('') || vacio('Sin resultados.');
      const n = elegidos.size;
      $('pv-n').innerHTML = n ? `<b>${n}</b> proveedor${n === 1 ? '' : 'es'} elegido${n === 1 ? '' : 's'}` : 'Ningún proveedor elegido';
      $('pv-seguir').disabled = !n;
      $('pv-seguir').textContent = n ? `Continuar con ${n} proveedor${n === 1 ? '' : 'es'}` : 'Continuar';
    };
    $('pv-lista').onclick = e => { const b = e.target.closest('[data-p]'); if (!b) return; const p = b.dataset.p; elegidos.has(p) ? elegidos.delete(p) : elegidos.add(p); pinta(); };
    $('pv-q').oninput = pinta;
    $('pv-todos').onclick = () => { lista.forEach(p => elegidos.add(p.nombre)); pinta(); };
    $('pv-limpiar').onclick = () => { elegidos.clear(); pinta(); };
    $('pv-seguir').onclick = () => { SEL = { paso: 'lineas', proveedores: [...elegidos].sort((a, b) => a.localeCompare(b, 'es')), lineas: [], todas: false }; guardarSel(); verLineas(C); };
    pinta();
  }

  function verLineas(C) {
    const prods = STOCK.productos(SECTOR).filter(p => SEL.proveedores.includes(p.proveedor));
    const lineas = STOCK.lineas(prods);
    // Como en la app de stock: con un proveedor o pocas líneas, arrancan todas elegidas.
    let elegidas = new Set(SEL.lineas.length ? SEL.lineas : (SEL.todas || SEL.proveedores.length === 1 || lineas.length <= 8 ? lineas.map(l => l.prefijo) : []));
    const varios = new Set(lineas.map(l => l.proveedor)).size > 1;
    C.innerHTML = cabeza('Contar stock', `${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]} · Paso 2 de 3: elegí las líneas.`) +
      `<div class="barra"><button class="btn claro chico" id="ln-volver" type="button">‹ Cambiar proveedores</button>
        <button class="btn claro chico" id="ln-todas" type="button">Elegir todas</button><button class="btn claro chico" id="ln-limpiar" type="button">Limpiar</button></div>
      <div id="ln-lista"></div>
      <div class="sel-pie"><div class="cuenta" id="ln-n"></div><button class="btn gold grande" id="ln-seguir" type="button">Comenzar conteo</button></div>`;
    const pinta = () => {
      let prov = null, h = '';
      lineas.forEach(l => {
        if (varios && l.proveedor !== prov) { prov = l.proveedor; h += `<div class="sel-grupo">${esc(prov)}</div>`; }
        h += `<button type="button" class="sel-item ${elegidas.has(l.prefijo) ? 'on' : ''}" data-l="${l.prefijo}" style="margin-bottom:6px"><span class="ck">${elegidas.has(l.prefijo) ? '✓' : ''}</span><span class="nm">${esc(l.nombre)}</span><span class="ct">${l.cant} SKU${l.cant === 1 ? '' : 's'}</span></button>`;
      });
      $('ln-lista').innerHTML = h || vacio('Estos proveedores no tienen productos para contar.');
      const n = elegidas.size, skus = lineas.filter(l => elegidas.has(l.prefijo)).reduce((s, l) => s + l.cant, 0);
      $('ln-n').innerHTML = n ? `<b>${n}</b> línea${n === 1 ? '' : 's'} · ${skus} productos` : 'Ninguna línea elegida';
      $('ln-seguir').disabled = !n;
    };
    $('ln-lista').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; const l = b.dataset.l; elegidas.has(l) ? elegidas.delete(l) : elegidas.add(l); pinta(); };
    $('ln-volver').onclick = () => { SEL.paso = 'proveedores'; guardarSel(); verProveedores(C); };
    $('ln-todas').onclick = () => { elegidas = new Set(lineas.map(l => l.prefijo)); pinta(); };
    $('ln-limpiar').onclick = () => { elegidas.clear(); pinta(); };
    $('ln-seguir').onclick = () => { SEL.paso = 'form'; SEL.lineas = [...elegidas].sort(); guardarSel(); Q = ''; verPlanilla(C); };
    pinta();
  }

  // Los productos de la selección (con los "Promo …", que se usan para el stock del Excel).
  const delConteo = () => STOCK.productos(SECTOR).filter(p => SEL.proveedores.includes(p.proveedor) && (!SEL.lineas.length || SEL.lineas.includes(p.sku.slice(0, 6))));
  const aContar = () => delConteo().filter(p => !STOCK.esPromo(p));

  function verPlanilla(C) {
    DRAFT = lsGet(K_DRAFT(), null) || { values: {}, provObs: {} };
    DRAFT.values = DRAFT.values || {}; DRAFT.provObs = DRAFT.provObs || {};
    const lista = LISTA = aContar();
    SKUS = new Set(lista.map(p => p.sku));
    C.innerHTML = `<div class="cf-head">
        <div class="cf-top"><div><h1>${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]}</h1>
          <div class="sub">${SEL.proveedores.length <= 3 ? esc(SEL.proveedores.join(' · ')) : SEL.proveedores.length + ' proveedores'} · <button class="lnk" id="cf-cambiar">cambiar</button></div></div>
          <label class="cf-fecha">Fecha <input type="date" id="cf-fecha" value="${esc(DRAFT.fecha || hoy())}" max="${hoy()}"></label></div>
        <div class="cf-buscar"><input type="search" id="cf-q" placeholder="Buscar artículo, proveedor o SKU…" autocomplete="off" value="${esc(Q)}"><button type="button" id="cf-x" aria-label="Borrar búsqueda">✕</button></div>
        <div class="cf-prog"><span><b id="cf-n">0</b> de ${lista.length} cargados</span><span id="cf-pct">0%</span></div>
        <div class="prog"><i id="cf-bar" style="width:0"></i></div>
      </div>
      <div id="cf-lista"></div>
      <div style="height:90px"></div>
      <div class="cf-pie"><button class="btn gold grande" id="cf-enviar" type="button">Enviar conteo</button></div>`;
    $('cf-cambiar').onclick = () => { SEL.paso = 'lineas'; guardarSel(); verLineas(C); };
    $('cf-fecha').onchange = () => { DRAFT.fecha = $('cf-fecha').value; guardar(); };
    let t = null;
    $('cf-q').oninput = () => { clearTimeout(t); t = setTimeout(() => { Q = $('cf-q').value.trim(); pintarFilas(); }, 200); };
    $('cf-x').onclick = () => { $('cf-q').value = ''; Q = ''; pintarFilas(); };
    $('cf-enviar').onclick = confirmarEnvio;
    const box = $('cf-lista');
    box.addEventListener('input', e => {
      const el = e.target, fila = el.closest('[data-sku]');
      if (fila && el.dataset.f) { cambiar(fila.dataset.sku, el.dataset.f, el.value, fila); return; }
      if (el.dataset.prov !== undefined) {
        const v = el.value.trim(); if (v) DRAFT.provObs[el.dataset.prov] = v; else delete DRAFT.provObs[el.dataset.prov];
        el.classList.toggle('si', !!v); guardar();
      }
    });
    box.addEventListener('click', e => {
      const b = e.target.closest('[data-obs]'); if (!b) return;
      const ta = b.closest('[data-sku]').querySelector('.cf-obs'); ta.classList.toggle('oculto'); if (!ta.classList.contains('oculto')) ta.focus();
    });
    box.addEventListener('focusin', e => { if (e.target.matches('.cf-ctrl input')) e.target.select(); });
    pintarFilas(); progreso();
  }
  function filaHtml(p) {
    const v = DRAFT.values[p.sku] || {}, d1 = v.depo1 ?? '', lo = v.local ?? '', d2 = v.depo2 ?? '', obs = v.obs || '';
    const tot = (parseInt(d1) || 0) + (parseInt(lo) || 0) + (parseInt(d2) || 0);
    const campo = (k, l, val) => `<label><span>${l}</span><input type="number" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" data-f="${k}" value="${esc(val)}" aria-label="${l} de ${esc(p.articulo)}"></label>`;
    return `<div class="cf-fila ${d1 !== '' || lo !== '' || d2 !== '' ? 'con' : ''}" data-sku="${esc(p.sku)}">
      <div class="cf-main"><div class="cf-info"><b>${esc(p.articulo)}</b><span>${esc(p.sku)}${Q ? ' · ' + esc(p.proveedor) : ''}</span></div>
        <div class="cf-ctrl">${campo('depo1', 'Depo 1', d1)}${campo('local', 'Local', lo)}${campo('depo2', 'Depo 2', d2)}
          <div class="cf-tot"><span>Total</span><b>${tot > 0 ? tot : '—'}</b></div>
          <button type="button" class="cf-obs-b ${obs ? 'si' : ''}" data-obs aria-label="Observaciones">${obs ? '✎' : '+'}</button></div></div>
      <textarea class="cf-obs ${obs ? '' : 'oculto'}" data-f="obs" rows="2" placeholder="Observaciones…">${esc(obs)}</textarea></div>`;
  }
  function pintarFilas() {
    const lista = LISTA, q = Q.toLowerCase();
    const box = $('cf-lista');
    if (q) {
      const l = lista.filter(p => p.articulo.toLowerCase().includes(q) || p.proveedor.toLowerCase().includes(q) || p.sku.includes(q));
      box.innerHTML = l.length ? `<div class="cuenta" style="margin:10px 2px">${l.length} resultado${l.length === 1 ? '' : 's'}</div>` + l.map(filaHtml).join('') : vacio('Sin resultados para «' + esc(Q) + '».');
      return;
    }
    // Agrupado por proveedor, con la observación general de cada uno al pie.
    const grupos = new Map();
    lista.forEach(p => { const k = p.proveedor || '(Sin proveedor)'; if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(p); });
    box.innerHTML = [...grupos.entries()].map(([prov, items]) => `<div class="cf-grupo">${esc(prov)}</div>` + items.map(filaHtml).join('') +
      `<textarea class="cf-provobs ${DRAFT.provObs[prov] ? 'si' : ''}" data-prov="${esc(prov)}" rows="2" placeholder="Observación general de ${esc(prov)}…">${esc(DRAFT.provObs[prov] || '')}</textarea>`).join('') || vacio('No hay productos para contar.');
  }
  function cambiar(sku, campo, val, fila) {
    const v = DRAFT.values[sku] || (DRAFT.values[sku] = { depo1: '', local: '', depo2: '', obs: '' });
    v[campo] = campo === 'obs' ? val : String(val).trim();
    const hay = v.depo1 !== '' || v.local !== '' || v.depo2 !== '';
    if (!hay && !v.obs) delete DRAFT.values[sku];
    fila.classList.toggle('con', hay);
    if (campo === 'obs') { const b = fila.querySelector('[data-obs]'); b.textContent = val ? '✎' : '+'; b.classList.toggle('si', !!val); }
    else { const t = (parseInt(v.depo1) || 0) + (parseInt(v.local) || 0) + (parseInt(v.depo2) || 0); fila.querySelector('.cf-tot b').textContent = t > 0 ? t : '—'; }
    guardar(); progreso();
  }
  function guardar() { lsSet(K_DRAFT(), DRAFT); }
  function progreso() {
    const total = LISTA.length, n = Object.keys(DRAFT.values).filter(s => SKUS.has(s)).length;
    const pct = total ? Math.round(n / total * 100) : 0;
    if ($('cf-n')) { $('cf-n').textContent = n; $('cf-pct').textContent = pct + '%'; $('cf-bar').style.width = Math.min(pct, 100) + '%'; }
  }

  function confirmarEnvio() {
    const filas0 = STOCK.filas(delConteo(), DRAFT.values, {}, false);
    const contados = filas0.filter(p => p.total > 0 || p.obs).length, unidades = filas0.reduce((s, p) => s + p.total, 0);
    const f = $('cf-fecha').value || hoy();
    modal(`<div class="mh"><h3>Enviar el conteo</h3><div class="sub">${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]} · ${esc(fecha(f))}</div></div>
      <div class="mb">
        <div class="kpis" style="grid-template-columns:1fr 1fr"><div class="kpi"><div class="k">Contados</div><div class="v">${contados} <small>de ${filas0.length}</small></div></div><div class="kpi"><div class="k">Unidades</div><div class="v">${num(unidades)}</div></div></div>
        <p style="font-size:13.5px;color:var(--muted);line-height:1.5;margin:14px 0 6px">Va el Excel por mail a administración (Brenda, Laura, Andrea, Luciana y Josefina) y les llega el aviso al Portal. Los productos sin cargar salen con 0 y su diferencia contra el sistema.</p>
        <label class="opciones" style="margin-top:10px"><label><input type="checkbox" id="en-agenda" checked> Marcar en la agenda como hechos: ${esc(SEL.proveedores.length <= 3 ? SEL.proveedores.join(', ') : SEL.proveedores.length + ' proveedores')}</label></label>
        <div class="msg" id="en-msg"></div>
        <div class="acts"><button class="btn claro" type="button" onclick="cerrarModal()">Seguir contando</button><button class="btn gold" id="en-ok" type="button">Enviar</button></div>
      </div>`);
    $('en-ok').onclick = enviar;
  }

  async function enviar() {
    const btn = $('en-ok'); btn.disabled = true; btn.textContent = 'Enviando…'; $('en-msg').textContent = '';
    const f = $('cf-fecha').value || hoy();
    let x = null;
    try {
      // El stock del sistema, fresco al momento de enviar.
      try { await cargarStock(); } catch (e) { /* si no hay conexión, el que ya estaba */ }
      const todos = STOCK.filas(delConteo(), DRAFT.values, (STK && STK.stock) || {}, !!(STK && STK.filas));
      try { x = STOCK.excel({ sector: SECTOR, usuario: YO.nombre, fecha: f, proveedores: SEL.proveedores, todos, provObs: DRAFT.provObs }); } catch (e) { console.warn('excel', e); }
      const r = await post({ accion: 'conteo', sector: SECTOR, fecha: f, proveedores: SEL.proveedores, lineas: SEL.lineas, items: todos, prov_obs: DRAFT.provObs, excel_base64: x ? x.base64 : null });
      if ($('en-agenda') && $('en-agenda').checked) {
        for (const p of SEL.proveedores) { try { await post({ accion: 'agenda-hecho', sector: SECTOR, proveedor: p, hecho: true }); } catch (e) {} }
        AG = null;
      }
      lsDel(K_DRAFT()); lsDel(K_SEL()); SEL = null; DRAFT = null;
      window._ultimoExcel = x;
      modal(`<div class="mh"><h3>✓ Conteo enviado</h3><div class="sub">${SECTOR_LBL[SECTOR]} · ${esc(fecha(f))}</div></div><div class="mb">
        ${r.mail_ok ? '<p style="margin:0 0 10px">Se guardó y salió el mail con el Excel a administración.</p>'
          : `<div class="aviso">Se guardó y administración ya lo ve en el Portal, pero <b>el mail no salió</b>${r.mail_error ? ': ' + esc(r.mail_error) : '.'}</div>`}
        <div class="acts"><button class="btn claro" type="button" ${x ? '' : 'disabled'} onclick="STOCK.descargar(window._ultimoExcel.base64, window._ultimoExcel.nombre)">Descargar Excel</button>
          <button class="btn gold" type="button" onclick="cerrarModal();location.hash='#inicio'">Listo</button></div></div>`);
    } catch (e) {
      btn.disabled = false; btn.textContent = 'Reintentar';
      $('en-msg').innerHTML = esc('No se pudo enviar: ' + e.message) + (x ? ' · <button class="lnk" type="button" id="en-xl">Descargar el Excel igual</button>' : '') + '<br>Lo cargado sigue guardado en este celular.';
      if (x && $('en-xl')) $('en-xl').onclick = () => STOCK.descargar(x.base64, x.nombre);
    }
  }

  // ── Agenda de los lunes ────────────────────────────────────────────────────
  async function verAgenda(C) {
    if (!AG) { C.innerHTML = cabeza('Agenda de los lunes', '') + vacio('Cargando…'); await cargarAgenda(); }
    const a = calcAgenda(), hechos = new Set(a.hechos.map(p => p.name));
    const pct = a.total ? Math.round(a.hechos.length / a.total * 100) : 0, v = vel();
    const ses = (s, i) => {
      const listo = s.provs.every(p => hechos.has(p.name)), fill = Math.min(s.min / STOCK.SESION_MIN * 100, 100);
      return `<div class="ses ${i === 0 ? 'prox abierta' : ''}" id="ses-${i}">
        <div class="ses-h" onclick="this.parentElement.classList.toggle('abierta')"><div class="ses-n">${String(i + 1).padStart(2, '0')}</div>
          <div class="ses-i"><b>${esc(diaLargo(s.fecha))}</b><span>${s.provs.length} proveedor${s.provs.length === 1 ? '' : 'es'} · ${STOCK.horas(s.min)}${s.min > STOCK.SESION_MIN ? ' · pasa las 3 horas' : ''}</span></div>
          ${i === 0 ? '<span class="chip oro">Próximo</span>' : ''}${s.asignada ? '<span class="chip">Asignado</span>' : ''}${listo ? '<span class="chip verde">Hecho</span>' : ''}</div>
        <div class="ses-b"><div class="carga"><i class="${s.min >= STOCK.SESION_MIN * .9 ? 'lleno' : ''}" style="width:${fill}%"></i></div>
          ${s.provs.map(p => provFila(p, hechos.has(p.name))).join('')}
          <div style="margin-top:10px"><button class="btn navy chico" type="button" onclick="contarEstos(window._ses[${i}])">Contar estos proveedores</button></div></div></div>`;
    };
    window._ses = a.sesiones.map(s => s.provs.map(p => p.name));
    C.innerHTML = cabeza('Agenda de los lunes', `${SECTOR_ICO[SECTOR]} ${SECTOR_LBL[SECTOR]} · Los lunes de 9 a 12 se cuentan los proveedores. Lo que asigna administración va primero; el resto se reparte solo.`) + cambioSector() +
      `<div class="kpis">
        <div class="kpi"><div class="k">Proveedores</div><div class="v">${a.total}</div></div>
        <div class="kpi"><div class="k">Hechos</div><div class="v">${a.hechos.length}</div><div class="prog ${pct === 100 ? 'ok' : ''}"><i style="width:${pct}%"></i></div></div>
        <div class="kpi"><div class="k">Lunes que faltan</div><div class="v">${a.sesiones.length}</div><div class="s">${a.sesiones.length ? 'unos ' + (a.sesiones.length / 4.33).toFixed(1).replace('.', ',') + ' meses' : 'Ciclo completo'}</div></div>
      </div>
      <div class="barra" style="margin-top:14px"><span class="ag-vel">Ritmo de conteo:</span>
        <div class="tabs">${[[30, 'Rápido · 30 s'], [45, 'Normal · 45 s'], [60, 'Lento · 1 min']].map(([s, l]) => `<button type="button" class="${s === v ? 'on' : ''}" onclick="lsSet(K_VEL,${s});ir()">${l}</button>`).join('')}</div>
        <button class="btn rojo chico" type="button" onclick="reiniciar()">Reiniciar el ciclo</button></div>` +
      (a.sesiones.length ? a.sesiones.map(ses).join('') : vacio('¡Ciclo completo! Todos los proveedores están hechos. Reiniciá el ciclo para empezar de nuevo.')) +
      (a.hechos.length ? `<h2>Hechos en este ciclo <small>${a.hechos.length}</small></h2><div class="ses"><div class="ses-h" onclick="this.parentElement.classList.toggle('abierta')"><div class="ses-n">✓</div><div class="ses-i"><b>Proveedores ya contados</b><span>Tocá para ver. Si alguno se marcó por error, destildalo.</span></div></div>
        <div class="ses-b">${a.hechos.map(p => provFila(p, true)).join('')}</div></div>` : '');
  }
  function provFila(p, hecho) {
    return `<div class="ag-prov ${hecho ? 'hecho' : ''}"><span class="nm">${esc(p.name)}</span><span class="mt">${p.count} ítems · ${STOCK.horas(p.minEst)}</span>
      <button type="button" class="ag-ck" data-marcar="${esc(p.name)}" data-hecho="${hecho ? '' : '1'}" aria-label="Marcar ${esc(p.name)}">${hecho ? '✓' : ''}</button></div>`;
  }
  // Tildar / destildar un proveedor (botón de la agenda).
  $('contenido').addEventListener('click', e => { const b = e.target.closest('[data-marcar]'); if (b && VISTA === 'agenda') { b.disabled = true; marcar(b.dataset.marcar, !!b.dataset.hecho); } });
  async function marcar(prov, hecho) {
    try { await post({ accion: 'agenda-hecho', sector: SECTOR, proveedor: prov, hecho }); await cargarAgenda(); verAgenda($('contenido')); toast(hecho ? 'Marcado como hecho' : 'Desmarcado'); }
    catch (e) { toast(e.message, true); }
  }
  async function reiniciar() {
    if (!confirm('¿Reiniciar el ciclo de ' + SECTOR_LBL[SECTOR] + '? Todos los proveedores vuelven a quedar por contar. El historial no se borra.')) return;
    try { await post({ accion: 'agenda-reiniciar', sector: SECTOR }); await cargarAgenda(); verAgenda($('contenido')); toast('Ciclo reiniciado'); }
    catch (e) { toast(e.message, true); }
  }

  // ── Mis conteos ────────────────────────────────────────────────────────────
  async function verHistorial(C) {
    C.innerHTML = cabeza('Mis conteos', `Los conteos de ${SECTOR_LBL[SECTOR]} que se enviaron, con su Excel.`) + cambioSector() + vacio('Cargando…');
    const d = await get('conteos', { sector: SECTOR });
    const l = d.conteos || [];
    C.innerHTML = cabeza('Mis conteos', `Los conteos de ${SECTOR_LBL[SECTOR]} que se enviaron, con su Excel.`) + cambioSector() +
      (l.length ? l.map(c => `<div class="fila"><div class="cuerpo"><div class="tit">${esc(fecha(c.fecha))} · ${esc(c.usuario_nombre || '')}</div>
          <div class="sub">${c.contados} de ${c.productos} productos contados · ${num(c.unidades)} unidades<br>${esc((c.proveedores || []).slice(0, 4).join(' · '))}${(c.proveedores || []).length > 4 ? ' y ' + ((c.proveedores.length) - 4) + ' más' : ''}</div>
          <div class="chips">${c.mail_ok ? '<span class="chip verde">Mail enviado</span>' : '<span class="chip ambar">Sin mail</span>'}<span class="chip gris">Enviado ${esc(fechaHora(c.created_at))}</span></div></div>
          <div class="der"><button class="btn claro chico" type="button" onclick="bajarExcel(${c.id}, this)">Excel</button></div></div>`).join('')
        : vacio('Todavía no hay conteos enviados de este sector.'));
  }
  async function bajarExcel(id, btn) {
    btn.disabled = true;
    try { const d = await get('conteo', { id }); STOCK.excelDeConteo(d.conteo); } catch (e) { toast(e.message, true); }
    btn.disabled = false;
  }

  // ── Arranque ───────────────────────────────────────────────────────────────
  (async () => {
    const { data: { session } } = await STOCK.supa().auth.getSession();
    if (!session) { location.replace('index.html'); return; }
    try { YO = await get('yo'); }
    catch (e) { $('contenido').innerHTML = vacio(esc(e.message)); return; }
    $('uName').textContent = YO.nombre;
    $('uRol').textContent = YO.esDepo ? 'Depósito' : 'Administración';
    $('av').textContent = String(YO.nombre || 'D').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    if (YO.esAdmin) { $('sb-admin').style.display = ''; $('sb-admin-cat').style.display = ''; }
    const s = YO.sector || (YO.esAdmin ? lsGet('gb_stock_sector_ver', null) : null);
    if (s) ponerSector(s);
    ir();
  })();
  document.querySelector('[data-soporte]').addEventListener('click', () => {
    if (window.abrirSoporteWA) window.abrirSoporteWA(); else alert('Escribinos al WhatsApp de soporte: +54 9 261 245-2651');
  });
</script>
<script src="assets/notif.js?v=3"></script>
<script src="assets/soporte.js?v=1"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
