<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0d2230; --navy-2:#123043; --cream:#f6f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#6d7d85; --line:#e7ded0; --line-2:#ece4d6;
      --green:#2f6f5e; --green-d:#245647; --green-soft:#e8f1ea;
      --gold:#c0912f; --gold-d:#a97c22; --gold-soft:#f7efdc;
      --danger:#c0603e; --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
    .sb-nav a:hover{background:var(--navy-2);color:#fff}
    .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
    .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
    .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
    .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
    .main{flex:1;min-width:0;display:flex;flex-direction:column}
    .content{padding:24px 30px 90px;max-width:820px;width:100%;margin:0 auto}
    .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
    .head h1{font-size:26px;margin:0 0 3px;font-weight:800}
    .head p{margin:0;color:var(--muted);font-size:14px}

    /* CTA supervisor */
    .sup-cta{display:none;align-items:center;gap:13px;background:var(--navy);color:#fff;border-radius:14px;padding:16px 18px;margin-bottom:18px;cursor:pointer}
    .sup-cta .ci{width:42px;height:42px;border-radius:11px;background:var(--gold);color:var(--navy);display:grid;place-items:center;flex:none}
    .sup-cta .t{font-weight:700;font-size:15px}.sup-cta .s{font-size:12.5px;color:#b9c6cd}
    .sup-cta .go{margin-left:auto;color:var(--gold)}

    /* Progreso */
    .prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;gap:16px}
    .prog .num{font-size:26px;font-weight:800;line-height:1}
    .prog .lbl{font-size:13px;color:var(--muted)}
    .bar{flex:1;height:10px;background:#eee7d8;border-radius:6px;overflow:hidden}
    .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--green-d));width:0;transition:width .4s}

    /* Lista */
    .tlist{display:flex;flex-direction:column;gap:10px}
    .t-item{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px 16px;cursor:pointer;transition:border-color .15s}
    .t-item:hover{border-color:var(--gold)}
    .t-item.done{background:#f4f8f5;border-color:#cfe6d8}
    .t-check{width:26px;height:26px;border-radius:50%;border:2.5px solid #cbb98f;flex:none;display:grid;place-items:center;margin-top:1px;transition:all .15s}
    .t-item.done .t-check{background:var(--green);border-color:var(--green)}
    .t-check svg{width:15px;height:15px;color:#fff;opacity:0}
    .t-item.done .t-check svg{opacity:1}
    .t-body{flex:1;min-width:0}
    .t-title{font-weight:700;font-size:15px}
    .t-item.done .t-title{color:var(--muted);text-decoration:line-through}
    .t-desc{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45;white-space:pre-wrap}
    .t-chip{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--gold-soft);color:var(--gold-d);margin-top:8px;display:inline-block}
    .t-chip.hoy{background:#fdeae2;color:var(--danger)}
    .empty{text-align:center;color:var(--muted);padding:50px 20px}
    .empty .big{font-size:40px;margin-bottom:8px}
    .msg{background:#fdeae2;color:#8a3b22;border-radius:12px;padding:14px 16px;font-size:13.5px;display:none}

    .botnav{display:none}
    @media(max-width:820px){
      .sidebar{display:none}
      .content{padding:18px 16px 80px}
      .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);border-top:1px solid #16384c;padding:8px 6px;justify-content:space-around;z-index:40}
      .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
      .botnav a.active{color:var(--gold)}
      .botnav svg{width:21px;height:21px}
    }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=1">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">V</div><div><div class="t" id="uName">Vendedor</div><div class="s">Vendedor</div></div></div>
    </div>
  </aside>

  <div class="main">
    <div class="content">
      <div class="head">
        <div>
          <h1 id="h1t">Tareas del día ✅</h1>
          <p id="sub">Estas son tus tareas de hoy. Tildá cada una cuando la termines.</p>
        </div>
        <button id="btnNueva" onclick="abrirNueva()" style="display:none;background:var(--green);color:#fff;border:0;border-radius:11px;padding:11px 17px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap">+ Nueva tarea</button>
      </div>

      <div class="msg" id="msg"></div>

      <div class="prog" id="prog" style="display:none">
        <div><div class="num"><span id="pgDone">0</span>/<span id="pgTot">0</span></div><div class="lbl">completadas hoy</div></div>
        <div class="bar"><i id="pgBar"></i></div>
      </div>

      <div class="tlist" id="tlist"></div>
    </div>
  </div>
</div>

<nav class="botnav">
  <a href="inicio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
  <a href="clientes-hub.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Clientes</a>
  <a href="tareas.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>Tareas</a>
  <a href="agenda.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Agenda</a>
</nav>

<!-- Modal: nueva tarea personal (supervisor) -->
<div id="ovN" style="position:fixed;inset:0;background:rgba(13,34,48,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px">
  <div style="background:#fff;border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px">
      <h3 style="margin:0;font-size:18px;font-weight:800">Nueva tarea propia</h3>
      <button onclick="cerrarNueva()" style="background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px">✕</button>
    </div>
    <div style="padding:0 20px 8px">
      <div style="margin-bottom:15px"><label style="display:block;font-weight:700;font-size:13.5px;margin-bottom:6px">¿Qué tenés que hacer?</label>
        <input id="nTit" maxlength="120" placeholder="Ej: Revisar exhibición en 5 bares" oninput="valN()" style="width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:14.5px;background:#fdfbf7"></div>
      <div style="margin-bottom:15px"><label style="display:block;font-weight:700;font-size:13.5px;margin-bottom:6px">Detalle <span style="font-weight:500;color:var(--muted)">(opcional)</span></label>
        <textarea id="nDesc" maxlength="500" placeholder="Cómo, dónde, con qué objetivo…" style="width:100%;min-height:70px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:14.5px;background:#fdfbf7"></textarea></div>
      <div style="margin-bottom:15px"><label style="display:block;font-weight:700;font-size:13.5px;margin-bottom:6px">¿Cuándo?</label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
          <div id="nFDia" onclick="setFrecN('diaria')" style="border:2px solid var(--gold);background:var(--gold-soft);color:var(--gold-d);border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:13px">🔁 Todos los días</div>
          <div id="nFPun" onclick="setFrecN('puntual')" style="border:2px solid var(--line);border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)">📌 Un día puntual</div>
        </div>
        <input type="date" id="nFecha" onchange="valN()" style="display:none;margin-top:10px;width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:14.5px;background:#fdfbf7"></div>
    </div>
    <div style="padding:12px 20px 20px">
      <button id="nSave" onclick="guardarPersonal()" disabled style="width:100%;background:var(--green);color:#fff;border:0;border-radius:11px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supervisor-nav.js"></script>
<script>
  const HUB = { url:"https://xqhyemccbwmzxqzkrtwa.supabase.co", key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc" };
  let hub, TOKEN=null, TAREAS=[], ES_SUP=false, frecN='diaria';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function render(){
    const cont = document.getElementById('tlist');
    if(!TAREAS.length){
      document.getElementById('prog').style.display='none';
      cont.innerHTML = ES_SUP
        ? '<div class="empty"><div class="big">📝</div><b>Todavía no cargaste ninguna tarea propia</b><div style="font-size:13px;margin-top:4px">Tocá <b>+ Nueva tarea</b> para agregar tus responsabilidades del día.</div></div>'
        : '<div class="empty"><div class="big">🎉</div><b>No tenés tareas para hoy</b><div style="font-size:13px;margin-top:4px">Cuando tu supervisor cargue tareas, van a aparecer acá.</div></div>';
      return;
    }
    const done = TAREAS.filter(t=>t.completada).length;
    document.getElementById('prog').style.display='flex';
    document.getElementById('pgDone').textContent = done;
    document.getElementById('pgTot').textContent = TAREAS.length;
    document.getElementById('pgBar').style.width = Math.round(done/TAREAS.length*100)+'%';
    cont.innerHTML = TAREAS.map(t=>`
      <div class="t-item ${t.completada?'done':''}" onclick="toggle('${t.id}')">
        <div class="t-check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></div>
        <div class="t-body">
          <div class="t-title">${esc(t.titulo)}</div>
          ${t.descripcion?`<div class="t-desc">${esc(t.descripcion)}</div>`:''}
          <span class="t-chip ${t.frecuencia==='puntual'?'hoy':''}">${t.frecuencia==='puntual'?'Solo hoy':'Todos los días'}</span>
        </div>
      </div>`).join('');
  }

  async function toggle(id){
    const t = TAREAS.find(x=>x.id===id); if(!t) return;
    const nuevo = !t.completada; t.completada = nuevo; render(); // optimista
    const accion = ES_SUP ? (nuevo?'completar-personal':'descompletar-personal') : (nuevo?'completar':'descompletar');
    try{
      const r = await fetch('/.netlify/functions/tareas', { method:'POST', headers:{ Authorization:'Bearer '+TOKEN, 'Content-Type':'application/json' }, body: JSON.stringify({ accion, id }) });
      if(!r.ok){ t.completada = !nuevo; render(); }
    }catch(e){ t.completada = !nuevo; render(); }
  }

  // --- Crear tarea propia (supervisor) ---
  function abrirNueva(){ document.getElementById('nTit').value=''; document.getElementById('nDesc').value=''; document.getElementById('nFecha').value=''; setFrecN('diaria'); valN(); document.getElementById('ovN').style.display='flex'; }
  function cerrarNueva(){ document.getElementById('ovN').style.display='none'; }
  function setFrecN(f){ frecN=f;
    document.getElementById('nFDia').style.cssText = 'border:2px solid '+(f==='diaria'?'var(--gold);background:var(--gold-soft);color:var(--gold-d)':'var(--line);color:var(--muted)')+';border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:13px';
    document.getElementById('nFPun').style.cssText = 'border:2px solid '+(f==='puntual'?'var(--gold);background:var(--gold-soft);color:var(--gold-d)':'var(--line);color:var(--muted)')+';border-radius:10px;padding:11px;text-align:center;cursor:pointer;font-weight:700;font-size:13px';
    document.getElementById('nFecha').style.display = f==='puntual'?'block':'none'; valN();
  }
  function valN(){ const ok = document.getElementById('nTit').value.trim().length>2 && (frecN==='diaria' || document.getElementById('nFecha').value); document.getElementById('nSave').disabled=!ok; }
  async function guardarPersonal(){
    const btn=document.getElementById('nSave'); btn.disabled=true;
    const body={ accion:'crear-personal', titulo:document.getElementById('nTit').value.trim(), descripcion:document.getElementById('nDesc').value.trim()||null, frecuencia:frecN, fecha: frecN==='puntual'?document.getElementById('nFecha').value:null };
    try{
      const r=await fetch('/.netlify/functions/tareas',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json(); if(!r.ok){ alert(d.error||'No pude guardar'); btn.disabled=false; return; }
      cerrarNueva(); cargar();
    }catch(e){ alert('Error de conexión'); btn.disabled=false; }
  }

  async function cargar(){
    try{
      const r = await fetch('/.netlify/functions/tareas' + (ES_SUP?'?vista=personales':''), { headers:{ Authorization:'Bearer '+TOKEN } });
      const d = await r.json();
      if(!r.ok){ document.getElementById('msg').style.display='block'; document.getElementById('msg').textContent = d.error||'No pude cargar las tareas.'; return; }
      TAREAS = d.tareas||[]; render();
    }catch(e){ document.getElementById('msg').style.display='block'; document.getElementById('msg').textContent='Error de conexión.'; }
  }

  (async ()=>{
    hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href='index.html'; return; }
    TOKEN = session.access_token;
    // Perfil (nombre + supervisor)
    const { data:u } = await hub.from('usuarios').select('nombre,es_supervisor').eq('id', session.user.id).maybeSingle();
    if(u){
      if(u.nombre){ document.getElementById('uName').textContent=u.nombre; const in0=u.nombre.trim()[0]||'V'; document.getElementById('avSb').textContent=in0.toUpperCase(); }
      if(u.es_supervisor){
        ES_SUP = true;
        document.getElementById('h1t').textContent = 'Mis tareas ✅';
        document.getElementById('sub').textContent = 'Tus tareas y responsabilidades del día. Cargalas y tildá cuando las cumplas.';
        document.getElementById('btnNueva').style.display = 'inline-flex';
      }
    }
    // Cerrar sesión: lo maneja assets/hub-nav.js (menú del usuario, igual en todas las páginas).
    cargar();
  })();
</script>
<script src="assets/notif.js?v=2"></script>
<script src="assets/hub-nav.js?v=3"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
