<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>GrandBar Hub — Prospectos</title>

<style>
  :root{--cream:#f5f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line2:#eee7d8;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--danger:#c0603e;--danger-s:#fbe9e4;--amber:#c99a2e;--amber-s:#f8efd6;--blue:#3f6f9c;--blue-s:#e6eef6;--navy:#0d2230;--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box} body{margin:0;font-family:var(--font);background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
  .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
  .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
  .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
  .sb-nav{display:flex;flex-direction:column;gap:3px}
  .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
  .sb-nav a:hover{background:#14304c;color:#fff}
  .sb-nav a.active{background:var(--gold);color:#2a2007;font-weight:600}
  .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
  .sb-foot{margin-top:auto;padding-top:16px}
  .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
  .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
  .main{flex:1;min-width:0}
  .wrap{max-width:820px;margin:0 auto;padding:26px 24px 60px}
  .head h1{font-size:24px;margin:0 0 4px;font-weight:800}
  .head p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .tabsf{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px}
  .tabsf button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
  .tabsf button.on{background:var(--gold-s);border-color:var(--gold);color:var(--gold-d)}
  .card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:12px}
  .h{display:flex;align-items:center;gap:9px;margin-bottom:5px}
  .nm{font-weight:800;font-size:15px;flex:1}
  .score{font-size:13px;font-weight:800;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .sc-hi{background:var(--green-s);color:var(--green-d)} .sc-mid{background:var(--amber-s);color:var(--gold-d)} .sc-lo{background:#eef0f1;color:#6b7b83}
  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:20px;white-space:nowrap}
  .b-nuevo{background:var(--blue-s);color:var(--blue)} .b-cont{background:var(--amber-s);color:var(--gold-d)} .b-int{background:var(--green-s);color:var(--green-d)} .b-vis{background:#e9e3f6;color:#6a4fb0} .b-desc{background:#eef0f1;color:#6b7b83} .b-yac{background:#eef0f1;color:#6b7b83}
  .src{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px}
  .src-g{background:#eaf1fb;color:#3a6aa8} .src-i{background:#fdeaf3;color:#c43b86}
  .meta{font-size:12px;color:var(--muted);margin-bottom:6px}
  .motivo{font-size:12.5px;color:var(--ink);background:var(--gold-s);border-radius:9px;padding:7px 10px;margin-bottom:9px}
  .msg{font-size:13px;background:var(--cream);border-radius:10px;padding:9px 11px;margin-bottom:9px;white-space:pre-wrap;position:relative}
  .msg .lbl{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
  .contact{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .cbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:8px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;background:#fff}
  .cbtn.wa{background:#e8f6ee;border-color:#bfe0cd;color:#1f7a4d}
  .cbtn.ig{background:#fdeaf3;border-color:#f3c3dc;color:#c43b86}
  .acts{display:flex;gap:7px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}
  .btn.g{background:var(--green);color:#fff;border-color:var(--green)} .btn.a{background:#fff;color:var(--gold-d);border-color:#e7d3a1} .btn.r{background:#fff;color:var(--danger);border-color:#e7cfc6}
  .nota{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:12.5px;margin-top:8px}
  .empty{text-align:center;color:var(--muted);font-size:13px;padding:30px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
  .toast.show{opacity:1}.toast.err{background:var(--danger)}
</style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
<script>try{var v=localStorage.getItem('gb_es_sup'),t=JSON.parse(localStorage.getItem('sb-xqhyemccbwmzxqzkrtwa-auth-token')||'null'),u=t&&(t.user||(t.currentSession||{}).user);if(v&&u&&v===u.id)document.documentElement.classList.add('gb-sup')}catch(e){}</script>
<style>.gb-sup .sb-nav{visibility:hidden}</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot"><div class="sb-user"><div class="av" id="av">S</div><div><div class="t" id="uName">Supervisor</div><div class="s">Supervisor</div></div></div></div>
  </aside>
  <div class="main">
    <div class="wrap">
      <div class="head"><h1>🧭 Prospectos</h1><p id="sub">Clientes nuevos que encontró el agente — revisá, contactá y marcá el resultado</p></div>
      <div class="tabsf" id="tabs">
        <button data-f="nuevo" class="on">Nuevos</button>
        <button data-f="">Todos</button>
        <button data-f="interesado">Interesados</button>
        <button data-f="visita">A visitar</button>
        <button data-f="contactado">Contactados</button>
        <button data-f="descartado">Descartados</button>
      </div>
      <div id="lista"><div class="empty">Cargando…</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js"></script>
<script src="assets/notif.js?v=2"></script>
<script>
const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
const FN='/.netlify/functions/prospectos';
let hub, TOKEN, DATA=[], filtro='nuevo';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const soloNum=s=>String(s||'').replace(/[^0-9]/g,'');
const badge={nuevo:['b-nuevo','Nuevo'],contactado:['b-cont','Contactado'],interesado:['b-int','Interesado'],visita:['b-vis','A visitar'],descartado:['b-desc','Descartado'],ya_cliente:['b-yac','Ya cliente']};
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2400);}

// WhatsApp AR: 54 + 9 + número nacional (sin 0 ni 15). Si no parece móvil, igual arma el link y el supervisor corrige.
function waLink(p,msg){
  let d=soloNum(p); if(!d) return '';
  d=d.replace(/^0/,''); d=d.replace(/^54/,''); d=d.replace(/^9/,'');
  d='549'+d;
  return 'https://wa.me/'+d+(msg?('?text='+encodeURIComponent(msg)):'');
}
async function copiar(txt){ try{ await navigator.clipboard.writeText(txt||''); toast('Mensaje copiado ✓'); }catch(e){ toast('No pude copiar',true); } }

function scoreCls(s){ return s>=70?'sc-hi':s>=40?'sc-mid':'sc-lo'; }

function pinta(){
  const arr=DATA.filter(p=>!filtro||p.estado===filtro);
  if(!arr.length){ $('lista').innerHTML='<div class="empty">No hay prospectos'+(filtro?' en este estado':'')+' por ahora.</div>'; return; }
  $('lista').innerHTML=arr.map(p=>{
    const b=badge[p.estado]||badge.nuevo;
    const tel=soloNum(p.telefono);
    const wa=tel?waLink(p.telefono,p.mensaje_wsp):'';
    const metaBits=[p.zona,p.canal&&p.canal.toUpperCase(),p.tipo,(p.rating?('★ '+p.rating+(p.reviews?(' ('+p.reviews+')'):'')):'')].filter(Boolean).join(' · ');
    return `<div class="card">
      <div class="h">
        <span class="src ${p.fuente==='instagram'?'src-i':'src-g'}">${p.fuente==='instagram'?'IG':'Maps'}</span>
        <span class="nm">${esc(p.nombre||'Sin nombre')}</span>
        ${p.score!=null?`<span class="score ${scoreCls(p.score)}">${p.score}</span>`:''}
        <span class="badge ${b[0]}">${b[1]}</span>
      </div>
      ${metaBits?`<div class="meta">${esc(metaBits)}</div>`:''}
      ${p.direccion?`<div class="meta">📍 ${esc(p.direccion)}</div>`:''}
      ${p.score_motivo?`<div class="motivo">💡 ${esc(p.score_motivo)}</div>`:''}
      ${wa&&p.mensaje_wsp?`<div class="msg"><span class="lbl">Mensaje WhatsApp (sugerido)</span>${esc(p.mensaje_wsp)}</div>`:''}
      ${p.mensaje_ig&&(!wa||p.fuente==='instagram')?`<div class="msg"><span class="lbl">Mensaje Instagram (sugerido)</span>${esc(p.mensaje_ig)}</div>`:''}
      <div class="contact">
        ${wa?`<a class="cbtn wa" href="${wa}" target="_blank" rel="noopener">💬 Abrir WhatsApp</a>`:''}
        ${tel?`<a class="cbtn" href="tel:${tel}">📞 ${esc(p.telefono)}</a>`:''}
        ${p.instagram_url?`<a class="cbtn ig" href="${esc(p.instagram_url)}" target="_blank" rel="noopener">📷 Instagram</a>`:''}
        ${p.mensaje_ig?`<button class="cbtn ig" data-cp="${p.id}">📋 Copiar msj IG</button>`:''}
        ${p.maps_url?`<a class="cbtn" href="${esc(p.maps_url)}" target="_blank" rel="noopener">🗺️ Maps</a>`:''}
        ${p.website?`<a class="cbtn" href="${esc(p.website)}" target="_blank" rel="noopener">🌐 Web</a>`:''}
      </div>
      <div class="acts">
        ${p.estado!=='contactado'?`<button class="btn a" data-est="contactado" data-id="${p.id}">Contactado</button>`:''}
        ${p.estado!=='interesado'?`<button class="btn g" data-est="interesado" data-id="${p.id}">⭐ Interesado</button>`:''}
        ${p.estado!=='visita'?`<button class="btn" data-est="visita" data-id="${p.id}">Agendar visita</button>`:''}
        ${p.estado!=='descartado'?`<button class="btn r" data-est="descartado" data-id="${p.id}">Descartar</button>`:''}
        ${p.estado!=='ya_cliente'?`<button class="btn" data-est="ya_cliente" data-id="${p.id}">Ya es cliente</button>`:''}
      </div>
      <input class="nota" data-nota="${p.id}" placeholder="Nota / seguimiento…" value="${esc(p.notas||'')}">
    </div>`;
  }).join('');
  $('lista').querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>setEstado(b.dataset.id,b.dataset.est));
  $('lista').querySelectorAll('[data-nota]').forEach(inp=>inp.onchange=()=>setEstado(inp.dataset.nota,(DATA.find(x=>x.id===inp.dataset.nota)||{}).estado||'contactado',inp.value));
  $('lista').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copiar((DATA.find(x=>x.id===b.dataset.cp)||{}).mensaje_ig));
}
async function setEstado(id,estado,nota){
  if(nota===undefined){ const el=$('lista').querySelector('[data-nota="'+id+'"]'); nota=el?el.value:undefined; }
  try{
    const r=await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'estado',id,estado,nota})});
    if(!r.ok) throw new Error();
    const p=DATA.find(x=>x.id===id); if(p){ p.estado=estado; if(nota!==undefined) p.notas=nota; } pinta(); toast('Actualizado ✓');
  }catch(e){ toast('No se pudo',true); }
}
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); filtro=b.dataset.f; pinta(); });

async function cargar(){
  try{
    const r=await fetch(FN,{headers:{Authorization:'Bearer '+TOKEN}});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
    DATA=d.prospectos||[]; pinta();
  }catch(e){ $('lista').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
(async()=>{
  hub=supabase.createClient(HUB.url,HUB.key);
  const {data:{session}}=await hub.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  TOKEN=session.access_token;
  const {data:u}=await hub.from('usuarios').select('nombre').eq('id',session.user.id).maybeSingle();
  if(u&&u.nombre){ $('uName').textContent=u.nombre; $('av').textContent=u.nombre.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
  cargar();
})();
</script>
<script src="assets/hub-nav.js?v=7"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
<script src="/assets/minuta-fab.js?v=2"></script>
<script src="/assets/cuenta-activa.js?v=1"></script>
</body>
</html>
