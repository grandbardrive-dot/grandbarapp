<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrandBar Hub — Incentivos</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0d2230; --navy-2:#123043; --cream:#f6f1e8; --card:#ffffff;
    --ink:#1b2a32; --muted:#6d7d85; --line:#e7ded0; --line-2:#ece4d6;
    --green:#2f6f5e; --green-d:#245647; --green-soft:#e8f1ea;
    --gold:#c0912f; --gold-d:#a97c22; --gold-soft:#f7efdc;
    --red:#c0603e; --red-soft:#fbe9e4;
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
  .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
  .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
  .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
  .sb-nav{display:flex;flex-direction:column;gap:3px}
  .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
  .sb-nav a:hover{background:var(--navy-2);color:#fff}
  .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
  .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
  .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
  .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
  .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
  .main{flex:1;min-width:0}
  .botnav{display:none}
  .wrap{max-width:820px;margin:0 auto;padding:22px 18px 90px}
  @media(max-width:820px){
    .sidebar{display:none}
    .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:8px 6px;justify-content:space-around;z-index:30}
    .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
    .botnav a.active{color:var(--gold)} .botnav svg{width:21px;height:21px}
  }
  .topbar{margin-bottom:16px}
  .topbar h1{font-size:24px;margin:0;font-weight:900;letter-spacing:-.01em}
  .topbar .who{font-size:12.5px;color:var(--muted);margin-top:3px}

  .intro{background:var(--navy);color:#eaf1f4;border-radius:16px;padding:16px 18px;margin-bottom:18px;font-size:13.5px;line-height:1.5}
  .intro b{color:#fff}

  /* Tarjeta de plan */
  .plan{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0;margin-bottom:18px;overflow:hidden}
  .plan .ph{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line-2);background:linear-gradient(180deg,#fff, #fdfaf3)}
  .plan .logo{width:46px;height:46px;border-radius:12px;background:var(--gold-soft);color:var(--gold-d);display:grid;place-items:center;font-weight:900;font-size:17px;flex:none}
  .plan .pt{font-weight:900;font-size:18px;line-height:1.1}
  .plan .ps{font-size:12.5px;color:var(--muted);margin-top:3px}
  .plan .body{padding:18px 20px}

  .hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
  .ring{position:relative;width:132px;height:132px;flex:none}
  .ring .pctT{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .ring .pctT .big{font-size:30px;font-weight:900;line-height:1}
  .ring .pctT .lbl{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
  .heroR{flex:1;min-width:190px;display:flex;flex-direction:column;gap:10px}
  .stat{display:flex;align-items:baseline;gap:8px}
  .stat .n{font-size:22px;font-weight:900;line-height:1}
  .stat .l{font-size:12.5px;color:var(--muted)}
  .obj{font-size:12.5px;color:var(--muted);background:var(--cream);border-radius:9px;padding:9px 11px;line-height:1.4}
  .obj b{color:var(--ink)}

  .secT{font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 12px}

  .bar{margin-bottom:13px}
  .bar .bt{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px}
  .bar .bt .nm{font-weight:700}
  .bar .bt .vl{font-size:12.5px;color:var(--muted)} .bar .bt .vl b{color:var(--ink);font-weight:800}
  .track{height:11px;border-radius:7px;background:#eee7d8;overflow:hidden}
  .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--gold),var(--gold-d));transition:width .5s}
  .fill.lo{background:linear-gradient(90deg,#d98b63,var(--red))}
  .fill.hi{background:linear-gradient(90deg,#49a07f,var(--green-d))}

  /* Vendedores */
  .vrow{border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden}
  .vhead{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;background:#fff}
  .vhead:hover{background:#fdfaf3}
  .vhead .vn{font-weight:800;font-size:14.5px;flex:1;min-width:0}
  .vhead .vmeta{font-size:12px;color:var(--muted)}
  .vpct{font-weight:900;font-size:16px;width:46px;text-align:right}
  .vmini{width:70px;flex:none}
  .chev{width:16px;height:16px;color:var(--muted);transition:transform .2s;flex:none}
  .vrow.open .chev{transform:rotate(90deg)}
  .vbody{display:none;padding:4px 15px 14px;border-top:1px solid var(--line-2);background:#fcfaf5}
  .vrow.open .vbody{display:block}
  .cli{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-2)}
  .cli:last-child{border-bottom:0}
  .cli .cn{font-size:13.5px;font-weight:600;flex:1;min-width:0}
  .cli .cn small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
  .chip{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
  .chip.si{background:var(--green-soft);color:var(--green-d)}
  .chip.no{background:#f0eadf;color:#a79a86;text-decoration:line-through}
  .cfull{font-size:11px;font-weight:800;color:var(--green-d);white-space:nowrap}

  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:13.5px;background:#fff;border:1px dashed var(--line);border-radius:14px}
  .loading{color:var(--muted);font-size:13px;text-align:center;padding:40px}

  /* Grid de tarjetas (proveedores / planes) */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .tcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left;font-family:inherit;transition:box-shadow .15s,border-color .15s,transform .1s;display:flex;flex-direction:column;gap:12px;min-height:150px}
  .tcard:hover{box-shadow:0 10px 26px -14px rgba(13,34,48,.3);border-color:var(--gold);transform:translateY(-1px)}
  .tcard .th{display:flex;align-items:center;gap:12px}
  .tcard .logo{width:48px;height:48px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:19px;color:#fff;flex:none}
  .tcard .nm{font-weight:900;font-size:17px;line-height:1.1}
  .tcard .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .tcard .foot{margin-top:auto;display:flex;align-items:center;gap:8px}
  .mini-ring{width:40px;height:40px;flex:none}
  .tcard .pctbig{font-weight:900;font-size:20px}
  .tcard .pl{font-size:12px;color:var(--muted)}
  .tcard .go{margin-left:auto;color:var(--gold-d);font-weight:800;font-size:13px}
  .badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:20px;padding:3px 10px}

  .back{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 13px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:14px}
  .back:hover{border-color:var(--gold)}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .crumb b{color:var(--ink)}
</style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">S</div><div><div class="t" id="uName">Supervisor</div><div class="s">Supervisor</div></div></div>
    </div>
  </aside>
  <div class="main">
  <div class="wrap">
    <div class="topbar">
      <h1>🎯 Incentivos</h1>
      <div class="who" id="who">Cargando…</div>
    </div>
    <div class="intro">Acá ves <b>cómo va tu equipo en los planes de los proveedores</b>, en tiempo real contra el objetivo. Cada plan muestra tus vendedores y los clientes de tu cartera. Empezamos con el <b>Plan Campari 5T</b>.</div>
    <div id="cont"><div class="loading">Cargando los planes…</div></div>
  </div>
  <nav class="botnav"></nav>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js?v=2"></script>
<script>
  const HUB = { url:'https://xqhyemccbwmzxqzkrtwa.supabase.co', key:'sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc' };
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let hub, TOKEN=null;

  const clasePct = p => p>=66?'hi':(p<=33?'lo':'');
  const nClientes = n => n + (n===1?' cliente':' clientes');

  function ring(pct){
    const R=56, C=2*Math.PI*R, off=C*(1-pct/100);
    const col = pct>=66?'var(--green-d)':(pct<=33?'var(--red)':'var(--gold-d)');
    return `<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="#eee7d8" stroke-width="13"/>
        <circle cx="66" cy="66" r="${R}" fill="none" stroke="${col}" stroke-width="13" stroke-linecap="round"
          stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 66 66)"/>
      </svg><div class="pctT"><div class="big">${pct}%</div><div class="lbl">cobertura</div></div></div>`;
  }

  function barra(nm, si, tot, pct){
    return `<div class="bar"><div class="bt"><span class="nm">${esc(nm)}</span><span class="vl"><b>${si}</b>/${tot} · ${pct}%</span></div>
      <div class="track"><div class="fill ${clasePct(pct)}" style="width:${pct}%"></div></div></div>`;
  }

  let DATA=null;
  const provOf = id => (DATA.proveedores||[]).find(x=>x.id===id);

  function miniRing(pct){
    const R=16,C=2*Math.PI*R,off=C*(1-pct/100);
    const col=pct>=66?'var(--green-d)':(pct<=33?'var(--red)':'var(--gold-d)');
    return `<svg class="mini-ring" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${R}" fill="none" stroke="#eee7d8" stroke-width="5"/><circle cx="20" cy="20" r="${R}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 20 20)"/></svg>`;
  }
  function provPct(prov){ let si=0,tot=0; (prov.planes||[]).forEach(p=>{si+=p.casillerosSi||0; tot+=p.casillerosTot||0;}); return tot?Math.round(100*si/tot):0; }

  function planDetailHTML(p){
    if(!p.universo){
      return `<div class="plan"><div class="body"><div class="empty">Ningún cliente ${DATA.alcance==='todo'?'':'de tu equipo '}está en este plan todavía.</div></div></div>`;
    }
    const marcas = (p.porMarca||[]).map(m=>barra(m.n, m.si, m.tot, m.pct)).join('');
    const vends = (p.porVendedor||[]).map(v=>{
      const cls = clasePct(v.pct);
      const clientes = p.clientes.filter(c=>c.vendedor===v.codigo).map(c=>{
        const chips = p.marcas.map(m=>`<span class="chip ${c.marcas[m.k]?'si':'no'}">${esc(m.n)}</span>`).join('');
        const full = c.faltan.length===0;
        return `<div class="cli"><div class="cn">${esc(c.nombre)}<small>#${esc(c.codigo)}${full?'':' · faltan '+c.faltan.length}</small></div>
          ${full?'<span class="cfull">✓ Completo</span>':`<div class="chips">${chips}</div>`}</div>`;
      }).join('');
      return `<div class="vrow"><div class="vhead" onclick="this.parentNode.classList.toggle('open')">
          <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
          <div class="vn">${esc(v.nombre)}<div class="vmeta">${nClientes(v.clientes)} en el plan · ${v.completos} completos</div></div>
          <div class="vmini"><div class="track"><div class="fill ${cls}" style="width:${v.pct}%"></div></div></div>
          <div class="vpct">${v.pct}%</div></div>
        <div class="vbody">${clientes}</div></div>`;
    }).join('');
    return `<div class="plan"><div class="body">
        <div class="hero">${ring(p.pct)}<div class="heroR">
            <div class="stat"><span class="n">${p.universo}</span><span class="l">clientes en el plan</span></div>
            <div class="stat"><span class="n">${p.completos}</span><span class="l">con las 6 marcas completas</span></div>
            <div class="obj">🎯 <b>Objetivo:</b> que cada cliente tenga las <b>6 marcas</b> (${p.casillerosSi} de ${p.casillerosTot} colocaciones hechas).</div>
        </div></div>
        <div class="secT">Por marca</div>${marcas}
        <div class="secT">Por vendedor <span style="font-weight:600;text-transform:none;letter-spacing:0;color:var(--muted)">· tocá para ver sus clientes</span></div>${vends}
      </div></div>`;
  }

  function provCard(prov){
    const pct=provPct(prov), n=(prov.planes||[]).length;
    return `<button class="tcard" onclick="irProv('${esc(prov.id)}')">
      <div class="th"><div class="logo" style="background:${esc(prov.color||'#0d2230')}">${esc(prov.nombre[0])}</div>
        <div><div class="nm">${esc(prov.nombre)}</div><div class="sub">${n} ${n===1?'plan':'planes'}</div></div></div>
      <div class="foot">${miniRing(pct)}<div><div class="pctbig">${pct}%</div><div class="pl">cobertura</div></div><span class="go">Ver planes ›</span></div>
    </button>`;
  }
  function planCard(prov,p){
    const sub = p.universo? `${p.universo} clientes · ${p.completos} completos` : 'sin clientes en el plan';
    return `<button class="tcard" onclick="irPlan('${esc(prov.id)}','${esc(p.id)}')">
      <div class="th"><div class="logo" style="background:${esc(prov.color||'#0d2230')}">${esc(prov.nombre[0])}</div>
        <div><div class="nm">${esc(p.nombre)}</div><div class="sub">${esc(prov.nombre)}</div></div></div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.4">${esc(p.detalle)}</div>
      <div class="foot">${miniRing(p.pct||0)}<div><div class="pctbig">${p.pct||0}%</div><div class="pl">${esc(sub)}</div></div><span class="go">Ver ›</span></div>
    </button>`;
  }

  function irHome(){ location.hash=''; }
  function irProv(id){ location.hash='#'+encodeURIComponent(id); }
  function irPlan(pid,plid){ location.hash='#'+encodeURIComponent(pid)+'/'+encodeURIComponent(plid); }
  window.irHome=irHome; window.irProv=irProv; window.irPlan=irPlan;
  window.addEventListener('hashchange', renderView);

  function setHeader(d){
    const reg=d.region==='san_luis'?'San Luis':(d.region==='mendoza'?'Mendoza':'');
    const can=d.canal==='ambos'?'ambos canales':(d.canal?String(d.canal).toUpperCase()+' Trade':'');
    const ambito=d.alcance==='todo'?'Vista general · toda la empresa':[reg,can].filter(Boolean).join(' · ');
    $('#who').textContent=[d.nombre,ambito].filter(Boolean).join(' — ')||'Tu equipo';
  }

  function renderView(){
    if(!DATA) return;
    const provs=DATA.proveedores||[]; const cont=$('#cont');
    if(!provs.length){ cont.innerHTML='<div class="empty">Todavía no hay planes cargados. Pronto vamos a ir sumando los planes de los proveedores.</div>'; return; }
    const parts=(location.hash||'').replace(/^#/,'').split('/').filter(Boolean);
    const prov=parts[0]?provOf(decodeURIComponent(parts[0])):null;
    if(prov && parts[1]){
      const p=(prov.planes||[]).find(x=>x.id===decodeURIComponent(parts[1]));
      if(p){ cont.innerHTML=`<button class="back" onclick="irProv('${esc(prov.id)}')">‹ ${esc(prov.nombre)}</button>
          <div class="crumb">Incentivos › <b>${esc(prov.nombre)}</b> › ${esc(p.nombre)}</div>${planDetailHTML(p)}`; window.scrollTo(0,0); return; }
    }
    if(prov){
      const cards=(prov.planes||[]).map(p=>planCard(prov,p)).join('');
      cont.innerHTML=`<button class="back" onclick="irHome()">‹ Proveedores</button>
        <div class="crumb">Incentivos › <b>${esc(prov.nombre)}</b> · elegí un plan</div>
        <div class="grid">${cards}</div>`; window.scrollTo(0,0); return;
    }
    cont.innerHTML=`<div class="grid">${provs.map(provCard).join('')}</div>`;
  }

  function render(d){ DATA=d; setHeader(d); renderView(); }

  async function cargar(){
    try{
      const r = await fetch('/.netlify/functions/incentivos', { headers:{ Authorization:'Bearer '+TOKEN } });
      const d = await r.json();
      if(!r.ok) throw new Error(d.error||('Error '+r.status));
      render(d);
    }catch(e){ $('#cont').innerHTML = '<div class="empty">No se pudieron cargar los planes.<br>'+esc(e.message||e)+'</div>'; }
  }

  (async ()=>{
    hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href='index.html'; return; }
    TOKEN = session.access_token;
    try{
      const { data:u } = await hub.from('usuarios').select('nombre').eq('id',session.user.id).maybeSingle();
      if(u&&u.nombre){ $('#uName').textContent=u.nombre; $('#avSb').textContent=(u.nombre.trim()[0]||'S').toUpperCase(); }
    }catch(e){}
    const lo=$('#logout'); if(lo) lo.onclick=async()=>{ if(confirm('¿Cerrar sesión?')){ try{await hub.auth.signOut();}catch(e){} location.href='index.html'; } };
    cargar();
  })();
</script>
<script src="assets/notif.js?v=6"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
<script src="/assets/minuta-fab.js?v=3"></script>
<script src="/assets/cuenta-activa.js?v=1"></script>
</body>
</html>
