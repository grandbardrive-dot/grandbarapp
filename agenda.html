<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Agenda</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0d2230; --navy-2:#123043; --cream:#f6f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#6d7d85; --line:#e7ded0; --line-2:#ece4d6;
      --green:#2f6f5e; --green-d:#245647; --green-soft:#e8f1ea;
      --gold:#c0912f; --gold-d:#a97c22; --gold-soft:#f7efdc;
      --purple:#6b5bd0; --purple-soft:#ece9f8; --amber:#c0912f; --amber-soft:#f8efd8;
      --coral:#d0603e; --coral-soft:#fbe9e4; --danger:#c0603e;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
    .sb-nav a:hover{background:var(--navy-2);color:#fff}
    .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
    .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
    .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
    .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
    .main{flex:1;min-width:0}
    .content{padding:24px 30px 100px;max-width:900px;width:100%;margin:0 auto}
    .head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:14px}
    .head h1{font-size:25px;margin:0 0 3px;font-weight:800;display:flex;align-items:center;gap:9px}
    .head p{margin:0;color:var(--muted);font-size:14px}
    .btn-new{background:var(--green);color:#fff;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:11px 17px;border-radius:11px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
    .btn-new:hover{background:var(--green-d)}

    .sup-banner{display:none;align-items:center;gap:12px;background:var(--gold-soft);border:1px solid #e5d3a3;border-radius:13px;padding:13px 16px;margin-bottom:16px}
    .sup-banner svg{color:var(--gold-d);flex:none}
    .sup-banner .t{font-weight:700;font-size:13.5px}.sup-banner .s{font-size:12.5px;color:#7a5a12}

    .weekbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .weekbar button{background:var(--card);border:1px solid var(--line);cursor:pointer;font:inherit;font-weight:700;color:var(--ink);border-radius:10px;padding:8px 12px}
    .weekbar button:hover{border-color:var(--gold)}
    .weekbar .lbl{font-weight:700;font-size:15px}
    .weekbar .sp{flex:1}

    .strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:18px}
    .dchip{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;position:relative;transition:all .12s}
    .dchip:hover{border-color:var(--gold)}
    .dchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
    .dchip.today .dd{color:var(--gold-d)}
    .dchip.on.today .dd{color:var(--gold)}
    .dchip .dn{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;color:var(--muted)}
    .dchip.on .dn{color:#a9bcc6}
    .dchip .dd{font-size:17px;font-weight:800;margin-top:2px}
    .dchip .cnt{position:absolute;top:5px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--gold)}
    .dchip .cnt.hide{display:none}

    .daytitle{font-weight:800;font-size:16px;margin:0 0 12px;text-transform:capitalize}
    .clist{display:flex;flex-direction:column;gap:9px}
    .citem{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;border-left-width:4px}
    .citem.visita{border-left-color:var(--green)} .citem.reunion{border-left-color:var(--purple)}
    .citem.llamada{border-left-color:var(--amber)} .citem.tarea{border-left-color:var(--coral)}
    .citem.done{opacity:.62}
    .ccheck{width:26px;height:26px;border-radius:50%;border:2.5px solid #cbb98f;flex:none;display:grid;place-items:center;cursor:pointer;margin-top:1px}
    .citem.done .ccheck{background:var(--green);border-color:var(--green)}
    .ccheck svg{width:14px;height:14px;color:#fff;opacity:0}.citem.done .ccheck svg{opacity:1}
    .cbody{flex:1;min-width:0;cursor:pointer}
    .ctop{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    .chora{font-size:12.5px;font-weight:800;color:var(--navy)}
    .ctipo{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:6px}
    .ctipo.visita{background:var(--green-soft);color:var(--green-d)} .ctipo.reunion{background:var(--purple-soft);color:#3f3596}
    .ctipo.llamada{background:var(--amber-soft);color:#7d5f1a} .ctipo.tarea{background:var(--coral-soft);color:#96371f}
    .cname{font-weight:700;font-size:14.5px;margin-top:4px}
    .citem.done .cname{text-decoration:line-through}
    .cobj{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4;white-space:pre-wrap}
    .cby{font-size:11px;color:var(--muted);margin-top:6px}
    .cby b{color:var(--gold-d)}
    .empty{text-align:center;color:var(--muted);padding:34px 16px;background:var(--card);border:1px dashed var(--line);border-radius:13px}

    /* Modal */
    .ov{position:fixed;inset:0;background:rgba(13,34,48,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
    .ov.open{display:flex}
    .modal{background:var(--card);border-radius:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6)}
    .m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px}
    .m-head h3{margin:0;font-size:18px;font-weight:800}
    .m-head .x{background:none;border:0;cursor:pointer;color:var(--muted)}
    .m-body{padding:0 20px 8px}
    .fld{margin-bottom:15px}
    .fld label{display:block;font-weight:700;font-size:13.5px;margin-bottom:7px}
    .fld input,.fld textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;font-size:14.5px;background:#fdfbf7;color:var(--ink)}
    .fld textarea{min-height:70px;resize:vertical} .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
    .tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
    .tp{border:2px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center;cursor:pointer;font-size:11.5px;font-weight:700;color:var(--muted)}
    .tp.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold-d)}
    .tp .ei{font-size:17px;display:block;margin-bottom:2px}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .m-foot{padding:14px 20px 20px;display:flex;gap:10px}
    .m-foot .save{flex:1;background:var(--green);color:#fff;border:0;border-radius:11px;padding:14px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
    .m-foot .save:hover{background:var(--green-d)} .m-foot .save:disabled{opacity:.5}
    .m-foot .del{background:var(--coral-soft);color:var(--coral);border:0;border-radius:11px;padding:14px 16px;font:inherit;font-weight:700;cursor:pointer}
    .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:80}
    .toast.show{opacity:1} .toast.err{background:var(--danger)}

    .botnav{display:none}
    @media(max-width:820px){
      .sidebar{display:none} .content{padding:16px 14px 90px}
      .strip{gap:5px} .dchip{padding:8px 2px} .dchip .dd{font-size:15px}
      .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:8px 6px;justify-content:space-around;z-index:30}
      .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
      .botnav a.active{color:var(--gold)} .botnav svg{width:21px;height:21px}
    }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=1">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">V</div><div><div class="t" id="uName">Vendedor</div><div class="s">Vendedor</div></div></div>
    </div>
  </aside>

  <div class="main">
    <div class="content">
      <div class="head">
        <div>
          <h1><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg> <span id="titulo">Agenda</span></h1>
          <p id="sub">Tus visitas y compromisos del día.</p>
        </div>
        <button class="btn-new" id="btnNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg> Nuevo</button>
      </div>

      <div id="dirReuniones" style="display:none;margin-bottom:14px"></div>

      <div class="sup-banner" id="supBanner">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 6H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H6"/></svg>
        <div><div class="t" id="supBannerT">Le estás armando la agenda</div><div class="s">Los compromisos que cargues los va a ver en su celular.</div></div>
      </div>

      <div class="weekbar">
        <button id="prev">‹</button>
        <button id="hoy">Hoy</button>
        <button id="next">›</button>
        <span class="lbl" id="weeklbl"></span>
        <span class="sp"></span>
      </div>

      <div class="strip" id="strip"></div>

      <h2 class="daytitle" id="daytitle">—</h2>
      <div class="clist" id="clist"></div>
    </div>
  </div>
</div>

<!-- Modal nuevo/editar -->
<div class="ov" id="ov">
  <div class="modal">
    <div class="m-head"><h3 id="mTitle">Nuevo compromiso</h3><button class="x" id="mClose"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="m-body">
      <div class="fld"><label>¿Qué tipo es?</label>
        <div class="tipos" id="tipos">
          <div class="tp on" data-t="visita" onclick="setTipo('visita')"><span class="ei">🏪</span>Visita</div>
          <div class="tp" data-t="reunion" onclick="setTipo('reunion')"><span class="ei">👥</span>Reunión</div>
          <div class="tp" data-t="llamada" onclick="setTipo('llamada')"><span class="ei">📞</span>Llamada</div>
          <div class="tp" data-t="tarea" onclick="setTipo('tarea')"><span class="ei">✅</span>Tarea</div>
        </div>
      </div>
      <div class="fld"><label>Cliente / lugar</label><input type="text" id="fCliente" maxlength="120" placeholder="Ej: Vinoteca Aldeni" oninput="valida()" /></div>
      <div class="row2">
        <div class="fld"><label>Fecha</label><input type="date" id="fFecha" onchange="valida()" /></div>
        <div class="fld"><label>Hora <span style="font-weight:500;color:var(--muted)">(opcional)</span></label><input type="time" id="fHora" /></div>
      </div>
      <div class="fld"><label>Objetivo / nota <span style="font-weight:500;color:var(--muted)">(opcional)</span></label><textarea id="fObj" maxlength="500" placeholder="Ej: presentar la promo de vinos y revisar stock"></textarea></div>
    </div>
    <div class="m-foot">
      <button class="del" id="mDel" style="display:none" onclick="borrar()">Borrar</button>
      <button class="save" id="mSave" onclick="guardar()" disabled>Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<nav class="botnav">
  <a href="inicio.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Inicio</a>
  <a href="clientes-hub.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Clientes</a>
  <a href="agenda.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>Agenda</a>
  <a href="tareas.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v7H4V5h11"/></svg>Tareas</a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supervisor-nav.js"></script>
<script>
  const HUB = { url:"https://xqhyemccbwmzxqzkrtwa.supabase.co", key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc" };
  const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
  const DIAS_C = ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  const TIPO_EMOJI = { visita:"🏪", reunion:"👥", llamada:"📞", tarea:"✅" };
  const TIPO_LBL = { visita:"Visita", reunion:"Reunión", llamada:"Llamada", tarea:"Tarea" };

  const params = new URLSearchParams(location.search);
  const VEND_PARAM = params.get('vendedor'); // supervisor viendo a un vendedor
  let hub, TOKEN=null, PERFIL=null, PUEDE_EDITAR=true, ES_PROPIA=true;
  let COMP=[], REUN=[], MISUP=[], selDate=new Date(), weekStart=null, tipoSel='visita', editId=null;

  const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
  const ini = n => (String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'?').toUpperCase();
  function toast(m,e){ const t=document.getElementById('toast'); t.textContent=m; t.className='toast show'+(e?' err':''); setTimeout(()=>t.className='toast',2500); }
  function mondayOf(d){ const x=new Date(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); x.setHours(0,0,0,0); return x; }

  function renderWeek(){
    weekStart = mondayOf(selDate);
    const end = new Date(weekStart); end.setDate(end.getDate()+6);
    document.getElementById('weeklbl').textContent = `${weekStart.getDate()} ${MESES[weekStart.getMonth()]} – ${end.getDate()} ${MESES[end.getMonth()]}`;
    const hoyIso = iso(new Date()), selIso = iso(selDate);
    const cnt = {}; COMP.forEach(c=>{ cnt[c.fecha]=(cnt[c.fecha]||0)+1; });
    REUN.forEach(r=>{ if(r.estado!=='cancelada'&&r.estado!=='rechazada') cnt[r.fecha]=(cnt[r.fecha]||0)+1; });
    MISUP.forEach(m=>{ cnt[m.fecha]=(cnt[m.fecha]||0)+1; });
    let html='';
    for(let i=0;i<7;i++){
      const d=new Date(weekStart); d.setDate(d.getDate()+i); const di=iso(d);
      html += `<div class="dchip ${di===selIso?'on':''} ${di===hoyIso?'today':''}" onclick="selectDay('${di}')">
        <div class="dn">${DIAS_C[d.getDay()]}</div><div class="dd">${d.getDate()}</div>
        <span class="cnt ${cnt[di]?'':'hide'}"></span></div>`;
    }
    document.getElementById('strip').innerHTML = html;
  }

  function renderDay(){
    const selIso = iso(selDate);
    document.getElementById('daytitle').textContent = `${DIAS[selDate.getDay()]} ${selDate.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][selDate.getMonth()]}`;
    const list = COMP.filter(c=>c.fecha===selIso).sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
    const reunDia = REUN.filter(r=>r.fecha===selIso && r.estado!=='cancelada').sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
    const cont=document.getElementById('clist');
    const misupDia = MISUP.filter(m=>m.fecha===selIso).sort((a,b)=>String(a.hora||'99').localeCompare(String(b.hora||'99')));
    if(!list.length && !reunDia.length && !misupDia.length){ cont.innerHTML=`<div class="empty">No hay nada agendado para este día.${PUEDE_EDITAR?'<br>Tocá <b>+ Nuevo</b> para agregar.':''}</div>`; return; }
    const reunHTML = reunDia.map(reunItemHTML).join('');
    const misupHTML = misupDia.map(misupItemHTML).join('');
    cont.innerHTML = reunHTML + misupHTML + list.map(c=>{
      const hora = c.hora ? String(c.hora).slice(0,5) : 'Sin hora';
      const by = c.creado_por_rol==='supervisor' ? `<div class="cby">📌 Cargado por <b>${esc(c.creado_por||'tu supervisor')}</b></div>` : '';
      return `<div class="citem ${c.tipo} ${c.estado==='completado'?'done':''}">
        <div class="ccheck" onclick="toggle('${c.id}',event)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5L20 6"/></svg></div>
        <div class="cbody" onclick="abrirEditar('${c.id}')">
          <div class="ctop"><span class="chora">${hora}</span><span class="ctipo ${c.tipo}">${TIPO_LBL[c.tipo]||c.tipo}</span></div>
          <div class="cname">${esc(c.cliente_nombre||'(sin nombre)')}</div>
          ${c.objetivo?`<div class="cobj">${esc(c.objetivo)}</div>`:''}
          ${by}
        </div></div>`;
    }).join('');
  }

  function selectDay(di){ const [y,m,d]=di.split('-').map(Number); selDate=new Date(y,m-1,d); renderWeek(); renderDay(); }

  async function toggle(id,ev){ ev.stopPropagation();
    if(!PUEDE_EDITAR) return;
    const c=COMP.find(x=>x.id===id); if(!c) return;
    const nuevo = c.estado!=='completado' ? 'completar' : 'descompletar';
    c.estado = nuevo==='completar'?'completado':'pendiente'; renderDay();
    try{ await fetch('/.netlify/functions/compromisos',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:nuevo,id})}); }
    catch(e){ c.estado = nuevo==='completar'?'pendiente':'completado'; renderDay(); }
  }

  // Modal
  function setTipo(t){ tipoSel=t; document.querySelectorAll('.tp').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); }
  function valida(){ document.getElementById('mSave').disabled = !(document.getElementById('fCliente').value.trim() && document.getElementById('fFecha').value); }
  function abrirNuevo(){
    if(!PUEDE_EDITAR) return;
    editId=null; document.getElementById('mTitle').textContent='Nuevo compromiso';
    document.getElementById('mDel').style.display='none';
    setTipo('visita'); document.getElementById('fCliente').value='';
    document.getElementById('fFecha').value=iso(selDate); document.getElementById('fHora').value='';
    document.getElementById('fObj').value=''; valida();
    document.getElementById('ov').classList.add('open');
  }
  function abrirEditar(id){
    const c=COMP.find(x=>x.id===id); if(!c) return;
    if(!PUEDE_EDITAR) return;
    editId=id; document.getElementById('mTitle').textContent='Editar compromiso';
    document.getElementById('mDel').style.display='block';
    setTipo(c.tipo||'visita'); document.getElementById('fCliente').value=c.cliente_nombre||'';
    document.getElementById('fFecha').value=c.fecha; document.getElementById('fHora').value=c.hora?String(c.hora).slice(0,5):'';
    document.getElementById('fObj').value=c.objetivo||''; valida();
    document.getElementById('ov').classList.add('open');
  }
  function cerrar(){ document.getElementById('ov').classList.remove('open'); }

  async function guardar(){
    const btn=document.getElementById('mSave'); btn.disabled=true;
    const body={ tipo:tipoSel, cliente_nombre:document.getElementById('fCliente').value.trim(),
      fecha:document.getElementById('fFecha').value, hora:document.getElementById('fHora').value||null,
      objetivo:document.getElementById('fObj').value.trim()||null };
    body.accion = editId?'editar':'crear'; if(editId) body.id=editId; if(VEND_PARAM) body.vendedor=VEND_PARAM;
    try{
      const r=await fetch('/.netlify/functions/compromisos',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json();
      if(!r.ok){ toast(d.error||'No pude guardar',true); btn.disabled=false; return; }
      toast(editId?'Compromiso actualizado ✅':'Compromiso agendado ✅'); cerrar();
      const [y,m,dd]=body.fecha.split('-').map(Number); selDate=new Date(y,m-1,dd);
      cargar();
    }catch(e){ toast('Error de conexión',true); btn.disabled=false; }
  }
  async function borrar(){
    if(!editId||!confirm('¿Borrar este compromiso?')) return;
    try{ await fetch('/.netlify/functions/compromisos',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'borrar',id:editId})});
      toast('Compromiso borrado'); cerrar(); cargar(); }catch(e){ toast('No pude borrar',true); }
  }

  async function cargar(){
    try{
      const url = '/.netlify/functions/compromisos' + (VEND_PARAM?('?vendedor='+encodeURIComponent(VEND_PARAM)):'');
      const r=await fetch(url,{headers:{Authorization:'Bearer '+TOKEN}});
      const d=await r.json();
      if(!r.ok){ toast(d.error||'No pude cargar',true); return; }
      COMP=d.compromisos||[]; PUEDE_EDITAR=d.puede_editar!==false; ES_PROPIA=d.es_propia!==false;
      if(VEND_PARAM && !ES_PROPIA){
        document.getElementById('titulo').textContent='Agenda de '+(d.nombre_vendedor||'vendedor');
        document.getElementById('sub').textContent='Le estás armando la agenda a tu vendedor.';
        document.getElementById('supBanner').style.display='flex';
        document.getElementById('supBannerT').textContent='Le estás armando la agenda a '+(d.nombre_vendedor||'tu vendedor');
      }
      renderWeek(); renderDay();
    }catch(e){ toast('Error de conexión',true); }
  }

  document.getElementById('prev').onclick=()=>{ selDate.setDate(selDate.getDate()-7); renderWeek(); renderDay(); };
  document.getElementById('next').onclick=()=>{ selDate.setDate(selDate.getDate()+7); renderWeek(); renderDay(); };
  document.getElementById('hoy').onclick=()=>{ selDate=new Date(); renderWeek(); renderDay(); };
  document.getElementById('btnNew').onclick=abrirNuevo;
  document.getElementById('mClose').onclick=cerrar;
  document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') cerrar(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') cerrar(); });

  (async ()=>{
    hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if(!session){ location.href='index.html'; return; }
    TOKEN=session.access_token;
    const { data:u } = await hub.from('usuarios').select('nombre,es_supervisor').eq('id',session.user.id).maybeSingle();
    PERFIL=u||{};
    if(u&&u.nombre){ document.getElementById('uName').textContent=u.nombre; document.getElementById('avSb').textContent=ini(u.nombre); }
    // Cerrar sesión: lo maneja assets/hub-nav.js (menú del usuario, igual en todas las páginas).
    renderWeek(); renderDay();
    cargar();
    cargarReunionesDir();
    if(PERFIL && PERFIL.es_supervisor) cargarMiAgendaSup();
  })();

  async function cargarReunionesDir(){
    try{
      const hoy=new Date().toISOString().slice(0,10);
      const r=await fetch('/.netlify/functions/reuniones?desde='+hoy,{headers:{Authorization:'Bearer '+TOKEN}});
      if(!r.ok) return; const d=await r.json();
      REUN=(d.reuniones||[]);
      const box=document.getElementById('dirReuniones');
      const pend=REUN.filter(x=>x.estado==='programada');
      if(box){
        if(!pend.length){ box.style.display='none'; box.innerHTML=''; }
        else{
          box.style.display='block';
          const quien=(pend.find(x=>x.creado_por_nombre && !/@/.test(x.creado_por_nombre))||{}).creado_por_nombre;
          const quienN=quien?esc(String(quien).split(/\s+/)[0]):'Dirección';
          box.innerHTML='<div style="background:linear-gradient(120deg,#12303f,#1a2f5a);color:#fff;border-radius:14px;padding:13px 15px">'
            +'<div style="font-weight:800;font-size:13.5px;margin-bottom:8px">📌 '+quienN+' te programó '+(pend.length>1?pend.length+' reuniones':'una reunión')+'</div>'
            +pend.slice(0,6).map(x=>{
              const f=new Date(x.fecha+'T00:00').toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});
              return '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)">'
                +'<div style="text-align:center;min-width:52px"><div style="font-weight:800;font-size:12px">'+f+'</div><div style="font-size:10px;color:#b9c7d0">'+(x.hora?esc(x.hora.slice(0,5))+' hs':'')+'</div></div>'
                +'<div style="flex:1;min-width:150px"><div style="font-weight:700;font-size:13px">'+esc(x.titulo)+'</div><div style="font-size:11px;color:#b9c7d0">'+esc(x.tipo)+(x.lugar?' · '+esc(x.lugar):'')+(x.detalle?' · '+esc(x.detalle):'')+'</div></div>'
                +'<div style="display:flex;gap:6px"><button onclick="confirmarReu(\''+x.id+'\')" style="background:var(--gold);color:#241a06;border:0;border-radius:8px;padding:7px 12px;font:inherit;font-weight:800;font-size:11.5px;cursor:pointer">Confirmar</button>'
                +'<button onclick="rechazarReu(\''+x.id+'\')" style="background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:7px 12px;font:inherit;font-weight:700;font-size:11.5px;cursor:pointer">No puedo</button></div>'
                +'</div>';
            }).join('')+'</div>';
        }
      }
      renderWeek(); renderDay();
    }catch(e){}
  }

  function reunItemHTML(x){
    const hora = x.hora ? String(x.hora).slice(0,5) : 'Sin hora';
    const quienN = (x.creado_por_nombre && !/@/.test(x.creado_por_nombre)) ? esc(String(x.creado_por_nombre).split(/\s+/)[0]) : 'Dirección';
    const badge = (x.estado==='confirmada'||x.estado==='realizada') ? '<span style="color:#2f8f6e;font-weight:800;font-size:11.5px;margin-left:auto">✓ Confirmada</span>'
      : x.estado==='rechazada' ? '<span style="color:#c0603e;font-weight:800;font-size:11.5px;margin-left:auto">No asistís</span>' : '';
    const acc = x.estado==='programada'
      ? `<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
           <button onclick="confirmarReu('${x.id}')" style="background:#2f8f6e;color:#fff;border:0;border-radius:8px;padding:7px 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer">Confirmar asistencia</button>
           <button onclick="rechazarReu('${x.id}')" style="background:#fff;color:#c0603e;border:1px solid #e7cfc6;border-radius:8px;padding:7px 13px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer">No puedo asistir</button>
         </div>` : '';
    const motivo = (x.estado==='rechazada' && x.respuesta) ? `<div class="cobj" style="color:#c0603e">No asistís — ${esc(x.respuesta)}</div>` : '';
    return `<div class="citem" style="border-left:4px solid #c0912f;background:#fbf7ee">
      <div class="ccheck" style="visibility:hidden"></div>
      <div class="cbody">
        <div class="ctop"><span class="chora">${hora}</span><span class="ctipo" style="background:#f0e6c9;color:#8a6d15">📌 Reunión · ${quienN}</span>${badge}</div>
        <div class="cname">${esc(x.titulo)}</div>
        ${(x.lugar||x.detalle)?`<div class="cobj">${[x.lugar,x.detalle].filter(Boolean).map(esc).join(' · ')}</div>`:''}
        ${motivo}${acc}
      </div></div>`;
  }

  async function confirmarReu(id){ await reuEstado(id,'confirmada'); }
  async function rechazarReu(id){
    const motivo = prompt('¿Por qué no podés asistir? (se le avisa a Dirección)');
    if(motivo===null) return;
    if(!motivo.trim()){ toast('Poné un motivo',true); return; }
    await reuEstado(id,'rechazada',motivo.trim());
  }
  async function reuEstado(id,estado,motivo){
    try{
      const body={accion:'estado',id,estado}; if(motivo!==undefined) body.motivo=motivo;
      const r=await fetch('/.netlify/functions/reuniones',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d=await r.json(); if(!r.ok){ toast(d.error||'Error',true); return; }
      toast(estado==='confirmada'?'Reunión confirmada ✅':'Aviso enviado a Dirección');
      await cargarReunionesDir();
    }catch(e){ toast('Error de conexión',true); }
  }

  // ----- Agenda privada del supervisor (seguimiento) -----
  function misupItemHTML(x){
    const hora = x.hora ? String(x.hora).slice(0,5) : 'Seguimiento';
    return `<div class="citem" style="border-left:4px solid #3f6f9c;background:#eef3f7">
      <div class="ccheck" style="visibility:hidden"></div>
      <div class="cbody">
        <div class="ctop"><span class="chora">${hora}</span><span class="ctipo" style="background:#dbe7f0;color:#2c5a80">🔎 Seguimiento (privado)</span><button onclick="quitarMiSup('${x.id}')" style="margin-left:auto;background:none;border:0;color:#c0603e;font-size:11px;cursor:pointer">Quitar</button></div>
        <div class="cname">${esc(x.cliente_nombre||'(cliente)')}</div>
        ${x.vendedor_nombre?`<div class="cobj">Vendedor: ${esc(x.vendedor_nombre)}</div>`:''}
      </div></div>`;
  }
  async function quitarMiSup(id){
    if(!confirm('¿Quitar esta visita de tu agenda?')) return;
    try{
      await fetch('/.netlify/functions/agenda-eficiente',{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'mi-agenda-del',id})});
      MISUP=MISUP.filter(x=>String(x.id)!==String(id)); renderWeek(); renderDay();
    }catch(e){ toast('No se pudo',true); }
  }
  async function cargarMiAgendaSup(){
    try{
      const r=await fetch('/.netlify/functions/agenda-eficiente?vista=mi-agenda',{headers:{Authorization:'Bearer '+TOKEN}});
      if(!r.ok) return; const d=await r.json(); MISUP=d.items||[]; renderWeek(); renderDay();
    }catch(e){}
  }
</script>

<script src="assets/hub-nav.js?v=2"></script>
