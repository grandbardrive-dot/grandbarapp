<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Torneo Doña Paula</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0d2238; --navy-2:#14304c; --cream:#f5f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#7a8891; --line:#e9e3d6; --line-2:#efe9dc;
      --gold:#c9a13b; --gold-d:#a9852a; --gold-soft:#f7efda;
      --green:#2f6f5e; --green-d:#245647; --green-soft:#e7f1ea;
      --coral:#d0603e;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
    .sb-nav a:hover{background:var(--navy-2);color:#fff}
    .sb-nav a.active{background:var(--gold);color:#2a2007;font-weight:600}
    .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
    .sb-foot{margin-top:auto;padding-top:16px}
    .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}

    .main{flex:1;min-width:0}
    .content{padding:26px 30px 60px;max-width:960px;margin:0 auto}
    .head h1{font-size:24px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:10px}
    .head p{margin:0 0 4px;color:var(--muted);font-size:14px}

    /* ── Torneo Doña Paula: puntos oficiales del archivo de Administración (22/09/2026) ── */
    .tp-hero{background:linear-gradient(135deg,#1f3f6e,#0d2238);color:#fff;border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0 16px}
    .tp-hero .ic{font-size:40px}
    .tp-hero .tt{font-size:20px;font-weight:800}
    .tp-hero .fx{font-size:13px;color:#b9c9d6;margin-top:3px}
    .tp-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .tp-tabs button{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
    .tp-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
    .tp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
    .tp-kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
    .tp-kpi .v{font-size:30px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
    .tp-kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
    .tp-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
    .tp-card h3{margin:0 0 10px;font-size:14px}
    .tp-cat{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
    .tp-bar{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}
    .tp-bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
    .tp-cat .p,.tp-con .p{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
    .tp-grupo{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
    .tp-con{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:13.5px}
    .tp-con.cero{color:var(--muted)}
    .tp-scroll{overflow-x:auto}
    .tp-rank{display:grid;grid-template-columns:36px minmax(140px,1fr) 78px 78px 88px 70px;gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);font-size:13.5px;min-width:520px}
    .tp-rank.cab{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
    .tp-rank.yo{background:var(--gold-soft);border-radius:9px}
    .tp-rank .r{text-align:right;font-variant-numeric:tabular-nums}
    .tp-rank .t{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
    .tp-vacio{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
    .tp-nota{font-size:12px;color:var(--muted);margin-top:4px}
    @media(max-width:820px){ .sidebar{display:none} .content{padding:16px} .tp-kpis{gap:8px} .tp-kpi{padding:12px} .tp-kpi .v{font-size:22px} .tp-kpi .l{font-size:11.5px} .tp-cat{grid-template-columns:110px 1fr 60px} }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
<script>try{if(localStorage.getItem('gb_es_sup')==='1')document.documentElement.classList.add('gb-sup')}catch(e){}</script>
<style>.gb-sup .sb-nav{visibility:hidden}</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot"><div class="sb-user"><div class="av" id="av">V</div><div><div class="t" id="uName">Vendedor</div><div class="s">Vendedor</div></div></div></div>
  </aside>

  <div class="main">
    <div class="content">
      <div class="head">
        <h1>🏆 Torneo Doña Paula</h1>
        <p>Tus puntos y el ranking de cada sucursal.</p>
      </div>

      <div class="tp-hero">
        <span class="ic">🍇</span>
        <div><div class="tt">Torneo Doña Paula</div><div class="fx">Puntos oficiales: los carga Administración y se actualizan cuando cambia su planilla.</div></div>
      </div>

      <div class="tp-tabs">
        <button class="on" data-tab="yo" id="tp-tabs-yo">Mi puntaje</button>
        <button data-tab="Mendoza">🍇 Mendoza</button>
        <button data-tab="San Luis">🏔 San Luis</button>
      </div>
      <div id="tp-cont"><div class="tp-vacio">Cargando…</div></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="assets/supervisor-nav.js"></script>
<script src="manual-vendedores/_config.js"></script>
<script src="manual-vendedores/_sucursales.js"></script>
<script>
  // Los puntos salen del CSV que carga Administración en Drive (función torneo-puntos).
  // A cada nombre del archivo se le busca su código de vendedor para saber la sucursal.
  const HUB = { url:"https://xqhyemccbwmzxqzkrtwa.supabase.co", key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc" };
  const $ = id => document.getElementById(id);
  const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initials = n => (n||"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "V";
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim();
  const fmt = n => Math.round(n).toLocaleString('es-AR');
  const CATS = ['Acciones', 'Volumen', 'Activaciones'];
  const ICO = { Acciones:'🎯', Volumen:'📦', Activaciones:'⚡' };
  let VEND = null, GENTE = [];

  // "Angela Laurito" (archivo) = "Ángeles Laurito" (sistema): mismo apellido y el
  // nombre empieza igual. Primero se busca el nombre exacto.
  function codigoDe(nombre, vendedores) {
    const n = norm(nombre);
    const exacto = vendedores.find(v => norm(v.nombre) === n);
    if (exacto) return exacto;
    const [pn, ...resto] = n.split(' '); const ap = resto.join(' ');
    return vendedores.find(v => { const [vn, ...vr] = norm(v.nombre).split(' '); return vr.join(' ') === ap && vn.slice(0, 4) === pn.slice(0, 4); }) || null;
  }

  function armar(filas, vendedores) {
    const por = {};
    filas.forEach(f => {
      const k = norm(f.vendedor);
      const p = por[k] = por[k] || { nombre: f.vendedor, total: 0, cats: {}, conceptos: [] };
      p.total += f.puntos;
      p.cats[f.categoria] = (p.cats[f.categoria] || 0) + f.puntos;
      p.conceptos.push(f);
    });
    return Object.values(por).map(p => {
      const v = codigoDe(p.nombre, vendedores);
      return { ...p, nombre: v ? v.nombre : p.nombre, codigo: v ? v.codigo : null, sucursal: getSucursal(v ? v.codigo : null) };
    });
  }

  function aviso(txt) { $('tp-cont').innerHTML = `<div class="tp-card"><div class="tp-vacio">${txt}</div></div>`; }

  function miPuntaje() {
    const yo = GENTE.find(p => VEND && p.codigo === VEND.codigo);
    if (!yo) return aviso('Todavía no tenés puntos cargados en el torneo.');
    detalle(yo, true);
  }

  // Supervisores y Dirección: tocan un vendedor del ranking y ven su detalle.
  let PUEDE_VER_TODOS = false;
  function verVendedor(sucursal, i) {
    const p = GENTE.filter(x => x.sucursal === sucursal).sort((a, b) => b.total - a.total)[i];
    if (p) detalle(p, false, sucursal);
  }
  window.verVendedor = verVendedor;

  function detalle(yo, esPropio, volverA) {
    const suc = GENTE.filter(p => p.sucursal === yo.sucursal).sort((a, b) => b.total - a.total);
    const pos = suc.findIndex(p => p === yo) + 1;
    const max = Math.max(1, ...CATS.map(c => yo.cats[c] || 0));
    const otras = Object.keys(yo.cats).filter(c => !CATS.includes(c));
    $('tp-cont').innerHTML = `
      ${esPropio ? '' : `<div class="tp-card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <button type="button" class="tp-volver" onclick="mostrar('${escH(volverA || yo.sucursal)}')" style="background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font:inherit;font-weight:700;cursor:pointer">‹ Ranking</button>
        <b style="font-size:16px">${escH(yo.nombre)}</b><span style="color:var(--muted);font-size:13px">${escH(yo.sucursal)}</span></div>`}
      <div class="tp-kpis">
        <div class="tp-kpi"><div class="v">${fmt(yo.total)}</div><div class="l">puntos totales</div></div>
        <div class="tp-kpi"><div class="v">${pos}°</div><div class="l">en ${escH(yo.sucursal)} (de ${suc.length})</div></div>
        <div class="tp-kpi"><div class="v">${pos > 1 ? fmt(suc[pos - 2].total - yo.total) : '—'}</div><div class="l">${pos > 1 ? 'puntos para pasar al ' + (pos - 1) + '°' : (esPropio ? 'vas primero 🏆' : 'va primero 🏆')}</div></div>
      </div>
      <div class="tp-card"><h3>Por categoría</h3>
        ${CATS.concat(otras).map(c => `<div class="tp-cat"><span>${ICO[c] || '•'} ${escH(c)}</span><div class="tp-bar"><i style="width:${Math.round((yo.cats[c] || 0) / max * 100)}%"></i></div><span class="p">${fmt(yo.cats[c] || 0)}</span></div>`).join('')}
      </div>
      <div class="tp-card"><h3>Detalle</h3>
        ${CATS.concat(otras).filter(c => yo.conceptos.some(x => x.categoria === c)).map(c => `
          <div class="tp-grupo">${ICO[c] || '•'} ${escH(c)}</div>
          ${yo.conceptos.filter(x => x.categoria === c).sort((a, b) => b.puntos - a.puntos)
            .map(x => `<div class="tp-con ${x.puntos ? '' : 'cero'}"><span>${escH(x.concepto)}</span><span class="p">${fmt(x.puntos)}</span></div>`).join('')}`).join('')}
      </div>`;
  }

  function ranking(sucursal) {
    const filas = GENTE.filter(p => p.sucursal === sucursal).sort((a, b) => b.total - a.total);
    if (!filas.length) return aviso('Todavía no hay puntos cargados para ' + escH(sucursal) + '.');
    const med = ['🥇','🥈','🥉'];
    $('tp-cont').innerHTML = `<div class="tp-card"><h3>Ranking ${escH(sucursal)}</h3>
      ${PUEDE_VER_TODOS ? '<div class="tp-nota" style="margin:-4px 0 8px">Tocá un vendedor para ver su detalle.</div>' : ''}<div class="tp-scroll">
      <div class="tp-rank cab"><span>#</span><span>Vendedor</span><span class="r">Acciones</span><span class="r">Volumen</span><span class="r">Activaciones</span><span class="r">Total</span></div>
      ${filas.map((p, i) => { const yo = VEND && p.codigo === VEND.codigo;
        const click = PUEDE_VER_TODOS ? ` role="button" tabindex="0" style="cursor:pointer" onclick="verVendedor('${escH(sucursal)}',${i})" onkeydown="if(event.key==='Enter')verVendedor('${escH(sucursal)}',${i})"` : '';
        return `<div class="tp-rank${yo ? ' yo' : ''}"${click}><span>${i < 3 ? med[i] : i + 1}</span><span>${escH(p.nombre)}${yo ? ' <b style="color:var(--gold-d)">· vos</b>' : ''}</span>
          <span class="r">${fmt(p.cats.Acciones || 0)}</span><span class="r">${fmt(p.cats.Volumen || 0)}</span><span class="r">${fmt(p.cats.Activaciones || 0)}</span><span class="t">${fmt(p.total)}</span></div>`; }).join('')}
    </div></div>`;
  }

  function mostrar(tab) {
    document.querySelectorAll('.tp-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    if (tab === 'yo') miPuntaje(); else ranking(tab);
  }
  window.mostrar = mostrar;

  (async function init(){
    const hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }
    const { data: perfil } = await hub.from('usuarios').select('nombre, codigo_vendedor, es_supervisor, rol').eq('id', session.user.id).maybeSingle();
    const nombre = (perfil && perfil.nombre) || session.user.email;
    $('uName').textContent = nombre; $('av').textContent = initials(nombre);
    const cod = perfil && String(perfil.codigo_vendedor || '').trim().toUpperCase();
    // Supervisores y Dirección ven el detalle de cada vendedor (22/09/2026).
    PUEDE_VER_TODOS = !!(perfil && (perfil.es_supervisor || ['direccion', 'admin', 'duenio'].includes(String(perfil.rol || '').toLowerCase())));
    try {
      const [r, rv] = await Promise.all([
        fetch('/.netlify/functions/torneo-puntos').then(x => x.json()),
        sb.from('vendedores').select('codigo, nombre'),
      ]);
      if (r.error) return aviso('No se pudieron leer los puntos del torneo: ' + escH(r.error));
      const vendedores = rv.data || [];
      VEND = cod ? (vendedores.find(v => String(v.codigo).toUpperCase() === cod) || { codigo: cod, nombre }) : null;
      GENTE = armar(r.filas || [], vendedores);
      if (!GENTE.length) return aviso('Todavía no hay puntos cargados en el torneo.');
      document.querySelectorAll('.tp-tabs button').forEach(b => b.onclick = () => mostrar(b.dataset.tab));
      // Sin puntos propios (supervisor, Dirección) arranca en el ranking de su sucursal.
      const propio = VEND && GENTE.find(p => p.codigo === VEND.codigo);
      if (!propio && PUEDE_VER_TODOS) $('tp-tabs-yo').hidden = true;
      mostrar(propio ? 'yo' : (VEND && getSucursal(VEND.codigo) === 'San Luis' ? 'San Luis' : 'Mendoza'));
    } catch (e) { aviso('No se pudieron leer los puntos del torneo.'); }
  })();
</script>
<script src="assets/hub-nav.js?v=3"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
