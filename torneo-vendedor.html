<!doctype html>
<html lang="es">
<head>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GrandBar">
<meta name="theme-color" content="#0d2230">
<link rel="manifest" href="/manifest.webmanifest">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GrandBar Hub — Torneo Doña Paula</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{
      --navy:#0d2238; --navy-2:#14304c; --cream:#f5f1e8; --card:#ffffff;
      --ink:#1b2a32; --muted:#7a8891; --line:#e9e3d6; --line-2:#efe9dc;
      --gold:#c9a13b; --gold-d:#a9852a; --gold-soft:#f7efda;
      --green:#2f6f5e; --green-d:#245647; --green-soft:#e7f1ea;
      --coral:#d0603e;
      --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    }
    *{box-sizing:border-box} html,body{margin:0;height:100%}
    body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .app{display:flex;min-height:100vh}
    .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
    .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
    .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
    .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
    .sb-nav{display:flex;flex-direction:column;gap:3px}
    .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
    .sb-nav a:hover{background:var(--navy-2);color:#fff}
    .sb-nav a.active{background:var(--gold);color:#2a2007;font-weight:600}
    .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
    .sb-foot{margin-top:auto;padding-top:16px}
    .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px}
    .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
    .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}

    .main{flex:1;min-width:0}
    .content{padding:26px 30px 60px;max-width:960px;margin:0 auto}
    .head h1{font-size:24px;margin:0 0 4px;font-weight:800;display:flex;align-items:center;gap:10px}
    .head p{margin:0 0 4px;color:var(--muted);font-size:14px}

    /* ── Torneo Doña Paula (se mudó del inicio del manual a esta pestaña, 22/09/2026) ── */
    .tp-hero{background:linear-gradient(135deg,#1f3f6e,#0d2238);color:#fff;border-radius:18px;padding:20px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:18px 0 16px}
    .tp-hero .ic{font-size:40px}
    .tp-hero .tt{font-size:20px;font-weight:800}
    .tp-hero .fx{font-size:13px;color:#b9c9d6;margin-top:3px}
    .tp-hero .sp{flex:1}
    .tp-pill{background:rgba(255,255,255,.12);border-radius:20px;padding:7px 13px;font-size:12.5px;font-weight:700;white-space:nowrap}
    .tp-pill.fin{background:#fbeae7;color:#b03a2e}
    .tp-reg{background:var(--gold);color:#241a06;border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap}
    .tp-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .tp-tabs button{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 15px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
    .tp-tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
    .tp-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
    .tp-kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
    .tp-kpi .v{font-size:30px;font-weight:800;color:var(--navy)}
    .tp-kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
    .tp-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:14px}
    .tp-card h3{margin:0 0 10px;font-size:14px}
    .tp-cat{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
    .tp-bar{height:8px;background:var(--line-2);border-radius:5px;overflow:hidden}
    .tp-bar i{display:block;height:100%;background:var(--gold);border-radius:5px}
    .tp-cat .p{text-align:right;font-weight:700}
    .tp-act{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
    .tp-act:first-of-type{border-top:0}
    .tp-act img{width:42px;height:42px;border-radius:9px;object-fit:cover;cursor:pointer;flex:none}
    .tp-act .n{font-weight:700;font-size:13.5px}
    .tp-act .m{font-size:12px;color:var(--muted)}
    .tp-act .pt{margin-left:auto;font-weight:800;color:var(--green);white-space:nowrap}
    .tp-rank{display:grid;grid-template-columns:40px 1fr 80px 70px;gap:8px;align-items:center;padding:10px 4px;border-top:1px solid var(--line-2);font-size:13.5px}
    .tp-rank.cab{border-top:0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
    .tp-rank.yo{background:var(--gold-soft);border-radius:9px}
    .tp-rank .r{text-align:right;font-weight:700}
    .tp-vacio{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
    #tp-foto{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px}
    #tp-foto.on{display:flex}
    #tp-foto img{max-width:100%;max-height:90vh;border-radius:12px}
    @media(max-width:820px){ .sidebar{display:none} .content{padding:16px} .tp-cat{grid-template-columns:110px 1fr 60px} .tp-rank{grid-template-columns:34px 1fr 64px 56px} }
  </style>
<link rel="stylesheet" href="assets/mobile.css?v=3">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot"><div class="sb-user"><div class="av" id="av">V</div><div><div class="t" id="uName">Vendedor</div><div class="s">Vendedor</div></div></div></div>
  </aside>

  <div class="main">
    <div class="content">
      <div class="head">
        <h1>🏆 Torneo Doña Paula</h1>
        <p>Tus puntos, lo que registraste y cómo vas en el ranking.</p>
      </div>

      <div class="tp-hero">
        <span class="ic">🍇</span>
        <div><div class="tt">Torneo Doña Paula</div><div class="fx" id="tp-fechas">—</div></div>
        <span class="sp"></span>
        <span class="tp-pill" id="tp-dias">—</span>
        <button class="tp-reg" id="tp-registrar" hidden>⚡ Registrar actividad</button>
      </div>

      <div class="tp-tabs">
        <button class="on" data-tab="progreso">Mi progreso</button>
        <button data-tab="on">🍷 Mendoza ON</button>
        <button data-tab="off">🛒 Mendoza OFF</button>
        <button data-tab="sl">🏔 San Luis</button>
      </div>
      <div id="tp-cont"><div class="tp-vacio">Cargando…</div></div>
    </div>
  </div>
</div>
<div id="tp-foto" onclick="this.classList.remove('on')"><img alt="Foto de la actividad"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/auth-persist.js?v=1"></script>
<script src="manual-vendedores/_config.js"></script>
<script src="manual-vendedores/_sucursales.js"></script>
<script src="manual-vendedores/_torneo.js"></script>
<script>
  // Los datos son los mismos que veía el vendedor en el manual (torneo_registros,
  // base del manual). Al vendedor se lo reconoce por su código de vendedor del Hub.
  const HUB = { url:"https://xqhyemccbwmzxqzkrtwa.supabase.co", key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc" };
  const $ = id => document.getElementById(id);
  const escH = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initials = n => (n||"").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase() || "V";
  let VEND = null, TAB = 'progreso', _todos = null;

  function aviso(txt){ $('tp-cont').innerHTML = `<div class="tp-card"><div class="tp-vacio">${txt}</div></div>`; }

  async function progreso(){
    const mes = getMesActual();
    const { data, error } = await sb.from('torneo_registros')
      .select('id, tipo, puntos, mes, detalle, foto_url, clientes(id, nombre, tipo)')
      .eq('torneo_id', TORNEO_ID).eq('vendedor_id', VEND.id)
      .order('created_at', { ascending:false });
    if (error) return aviso('No se pudieron cargar tus puntos: ' + escH(error.message));
    const regs = data || [];
    const suma = arr => arr.reduce((s, r) => s + (Number(r.puntos) || 0), 0);
    const mesPts = suma(regs.filter(r => r.mes === mes)), total = suma(regs);
    const cats = [['📦 Volumen','volumen'],['🎯 Cobertura','cobertura'],['⚡ Activaciones','activacion']].map(([n,t]) => [n, suma(regs.filter(r => r.tipo === t))]);
    const max = Math.max(1, ...cats.map(c => c[1]));
    $('tp-cont').innerHTML = `
      <div class="tp-kpis">
        <div class="tp-kpi"><div class="v">${mesPts}</div><div class="l">puntos en ${escH(nombreMes(mes).toLowerCase())}</div></div>
        <div class="tp-kpi"><div class="v">${total}</div><div class="l">puntos totales del torneo</div></div>
      </div>
      <div class="tp-card"><h3>Desglose por categoría</h3>
        ${cats.map(([n,p]) => `<div class="tp-cat"><span>${n}</span><div class="tp-bar"><i style="width:${Math.round(p/max*100)}%"></i></div><span class="p">${escH(fmtPts(p))}</span></div>`).join('')}
      </div>
      <div class="tp-card"><h3>Últimas actividades</h3>
        ${regs.length ? regs.slice(0, 15).map(r => `
          <div class="tp-act">
            ${r.foto_url ? `<img src="${escH(r.foto_url)}" alt="" data-foto="${escH(r.foto_url)}">` : ''}
            <div style="min-width:0"><div class="n">${escH(labelRegistro(r))}</div><div class="m">${escH(r.clientes?.nombre || '')} · ${escH(nombreMes(r.mes))}</div></div>
            <span class="pt">+${escH(fmtPts(r.puntos))}</span>
          </div>`).join('')
        : '<div class="tp-vacio">Todavía no registraste actividades.</div>'}
      </div>`;
    $('tp-cont').querySelectorAll('[data-foto]').forEach(i => i.onclick = () => { $('tp-foto').querySelector('img').src = i.dataset.foto; $('tp-foto').classList.add('on'); });
  }

  async function todos(){
    if (_todos) return _todos;
    const { data } = await sb.from('torneo_registros')
      .select('vendedor_id, puntos, mes, clientes(tipo), vendedores(id, nombre, codigo)')
      .eq('torneo_id', TORNEO_ID);
    return (_todos = data || []);
  }
  async function ranking(filtro, titulo){
    const mes = getMesActual(), mapa = {};
    (await todos()).forEach(r => {
      if (!filtro(r)) return;
      const m = mapa[r.vendedor_id] = mapa[r.vendedor_id] || { v: r.vendedores, mes: 0, total: 0 };
      m.total += Number(r.puntos) || 0; if (r.mes === mes) m.mes += Number(r.puntos) || 0;
    });
    const filas = Object.values(mapa).sort((a, b) => b.total - a.total);
    const med = ['🥇','🥈','🥉'];
    $('tp-cont').innerHTML = `<div class="tp-card"><h3>${escH(titulo)}</h3>
      ${filas.length ? `<div class="tp-rank cab"><span>#</span><span>Vendedor</span><span class="r">${escH(nombreMes(mes))}</span><span class="r">Total</span></div>` +
        filas.map((f, i) => { const yo = f.v && f.v.id === VEND.id;
          return `<div class="tp-rank${yo ? ' yo' : ''}"><span>${i < 3 ? med[i] : i + 1}</span><span>${escH(f.v?.nombre || '—')}${yo ? ' <b style="color:var(--gold-d)">· vos</b>' : ''}</span><span class="r">${f.mes}</span><span class="r">${f.total}</span></div>`; }).join('')
        : '<div class="tp-vacio">Sin registros todavía.</div>'}</div>`;
  }

  function mostrar(tab){
    TAB = tab;
    document.querySelectorAll('.tp-tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
    $('tp-cont').innerHTML = '<div class="tp-vacio">Cargando…</div>';
    if (tab === 'progreso') return progreso();
    if (tab === 'on')  return ranking(r => getSucursal(r.vendedores?.codigo) === 'Mendoza' && getLiga(r.clientes?.tipo) === 'ON', 'Mendoza — Liga ON (bares, restaurantes, hoteles, discos)');
    if (tab === 'off') return ranking(r => getSucursal(r.vendedores?.codigo) === 'Mendoza' && getLiga(r.clientes?.tipo) === 'OFF', 'Mendoza — Liga OFF (vinotecas y autoservicios)');
    if (tab === 'sl')  return ranking(r => getSucursal(r.vendedores?.codigo) === 'San Luis', 'San Luis');
  }

  (async function init(){
    const inicio = new Date(2026, TORNEO_MES_INICIO - 1, 1);
    const f = d => d.toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' });
    $('tp-fechas').textContent = 'Del ' + f(inicio) + ' al ' + f(TORNEO_FIN);
    const dias = diasRestantes();
    $('tp-dias').textContent = dias > 0 ? '⏱ Faltan ' + dias + ' días' : 'Terminado';
    if (dias <= 0) $('tp-dias').classList.add('fin');

    const hub = supabase.createClient(HUB.url, HUB.key);
    const { data:{ session } } = await hub.auth.getSession();
    if (!session) { location.href = 'index.html'; return; }
    const { data: perfil } = await hub.from('usuarios').select('nombre, codigo_vendedor').eq('id', session.user.id).maybeSingle();
    const nombre = (perfil && perfil.nombre) || session.user.email;
    $('uName').textContent = nombre; $('av').textContent = initials(nombre);
    const cod = perfil && String(perfil.codigo_vendedor || '').trim().toUpperCase();
    if (!cod) return aviso('Tu usuario todavía no tiene código de vendedor cargado, así que no puedo mostrar tus puntos. Avisale a Desarrollo.');
    const { data: vend } = await sb.from('vendedores').select('*').eq('codigo', cod).maybeSingle();
    if (!vend) return aviso('No encontré tu ficha de vendedor en el manual (código ' + escH(cod) + ').');
    VEND = vend;
    // El registro de actividades es la pantalla del manual: se le deja la sesión
    // armada (igual que al entrar al manual desde el Hub) y vuelve acá al terminar.
    sessionStorage.setItem('vendedor', JSON.stringify(vend));
    const reg = $('tp-registrar');
    reg.hidden = false;
    reg.onclick = () => { location.href = 'manual-vendedores/torneo-registro.html'; };
    document.querySelectorAll('.tp-tabs button').forEach(b => b.onclick = () => mostrar(b.dataset.tab));
    mostrar('progreso');
  })();
</script>
<script src="assets/hub-nav.js?v=3"></script>
<script src="assets/user-menu.js?v=1"></script>
<script src="assets/mobile-nav.js?v=1"></script>
</body>
</html>
