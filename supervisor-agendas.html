<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GrandBar Hub — Agendas del equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0d2230;--navy-2:#123043;--cream:#f6f1e8;--card:#fff;--ink:#1b2a32;--muted:#6d7d85;--line:#e7ded0;--line-2:#ece4d6;--green:#2f8f6e;--green-d:#256f54;--green-s:#e6f2ec;--gold:#c0912f;--gold-d:#a97c22;--gold-s:#f7efdc;--danger:#c0603e;--danger-s:#fbe9e4;--amber-s:#f8efd6;--blue:#3f6f9c;--font:'Inter',system-ui,sans-serif}
  *{box-sizing:border-box} html,body{margin:0}
  body{font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .app{display:flex;min-height:100vh}
  .sidebar{width:250px;flex:none;background:var(--navy);color:#dfe7ec;display:flex;flex-direction:column;padding:22px 16px;position:sticky;top:0;height:100vh}
  .sb-logo{font-family:Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.5px;line-height:1;padding:6px 10px}
  .sb-logo small{display:block;font-family:var(--font);font-size:9px;letter-spacing:.42em;color:#9db0ba;margin-top:6px;font-weight:600}
  .sb-hub{color:var(--gold);font-weight:700;font-size:16px;padding:2px 10px 20px}
  .sb-nav{display:flex;flex-direction:column;gap:3px}
  .sb-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#c4d2d9;font-size:14px;font-weight:500}
  .sb-nav a:hover{background:var(--navy-2);color:#fff} .sb-nav a.active{background:var(--gold);color:#241a06;font-weight:600}
  .sb-nav svg{width:19px;height:19px;flex:none;opacity:.9}
  .sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px;padding-top:16px}
  .sb-user{display:flex;align-items:center;gap:11px;padding:6px 4px;cursor:pointer}
  .sb-user .av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold-d));display:grid;place-items:center;font-weight:700;color:var(--navy)}
  .sb-user .t{font-size:13px;font-weight:600}.sb-user .s{font-size:11px;color:#9db0ba}
  .main{flex:1;min-width:0} .content{padding:22px 24px 80px;max-width:900px;margin:0 auto}
  .head h1{font-size:23px;margin:0 0 2px;font-weight:800} .head p{margin:0 0 16px;color:var(--muted);font-size:13px}
  .mnav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .mnav button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:16px}
  .mnav .lbl{font-weight:800;font-size:15px;text-transform:capitalize}
  .vcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-bottom:12px}
  .vtop{display:flex;align-items:center;gap:11px;margin-bottom:10px}
  .vav{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
  .vn{font-weight:800;font-size:15px} .vs{font-size:11.5px;color:var(--muted)}
  .badge{font-size:11px;font-weight:800;padding:4px 11px;border-radius:20px;margin-left:auto}
  .b-bor{background:#eef1f3;color:#5a6b73} .b-env{background:var(--amber-s);color:var(--gold-d)} .b-apr{background:var(--green-s);color:var(--green-d)} .b-cam{background:var(--danger-s);color:var(--danger)}
  .prog{height:8px;background:#eee7d8;border-radius:5px;overflow:hidden;margin:8px 0}
  .prog>i{display:block;height:100%;background:var(--green)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{border:0;border-radius:9px;padding:9px 14px;font:inherit;font-weight:700;font-size:12.5px;cursor:pointer}
  .btn.green{background:var(--green);color:#fff} .btn.amber{background:#fff;color:var(--gold-d);border:1px solid #e7d3a1} .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:14px}
  .ov{display:none;position:fixed;inset:0;background:rgba(13,34,48,.5);z-index:40;align-items:center;justify-content:center;padding:16px}
  .ov.open{display:flex}
  .sheet{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:84vh;overflow:auto;padding:18px}
  .daygrp{margin-bottom:12px} .daygrp .dh{font-weight:800;font-size:13px;margin-bottom:5px;text-transform:capitalize}
  .cli{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .cli .dot{width:8px;height:8px;border-radius:50%;background:#cbb98f;flex:none} .cli.ok .dot{background:var(--green)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:12px}
  .cal .h{font-size:10px;color:var(--muted);font-weight:700;text-align:center}
  .cday{aspect-ratio:1;border:1px solid var(--line);border-radius:9px;padding:4px;display:flex;flex-direction:column;cursor:pointer;background:#fff}
  .cday.mut{background:#faf7f0;border-color:transparent;cursor:default} .cday.tiene{border-color:var(--green)} .cday.sel{background:var(--gold-s);border-color:var(--gold)}
  .cday .n{font-size:11px;font-weight:700} .cday .cnt{margin-top:auto;font-size:9px;font-weight:800;color:#fff;background:var(--green);border-radius:20px;padding:0 5px;align-self:flex-start}
  .addb{border:1px solid var(--green);background:#fff;color:var(--green-d);border-radius:8px;padding:5px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;margin-left:auto;white-space:nowrap}
  .addb.done{background:var(--green);color:#fff;border-color:var(--green);cursor:default}
  .botnav{display:none}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:11px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
  .toast.show{opacity:1}.toast.err{background:var(--danger)}
  @media(max-width:820px){ .sidebar{display:none} .content{padding:16px 14px 80px}
    .botnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--navy);padding:8px 6px;justify-content:space-around;z-index:30}
    .botnav a{display:flex;flex-direction:column;align-items:center;gap:3px;color:#9db0ba;font-size:10px;font-weight:600;flex:1}
    .botnav a.active{color:var(--gold)} .botnav svg{width:21px;height:21px} }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="sb-logo">Grand<span style="color:var(--gold)">Bar</span><small>Distribuciones</small></div>
    <div class="sb-hub">Hub</div>
    <nav class="sb-nav"></nav>
    <div class="sb-foot"><div class="sb-user" id="logout" title="Cerrar sesión"><div class="av" id="avSb">S</div><div><div class="t" id="uName">Supervisor</div><div class="s">Supervisor</div></div></div></div>
  </aside>
  <div class="main"><div class="content">
    <div class="head"><h1>Agendas del equipo 🗓️</h1><p>Validá y hacé seguimiento de la Agenda Eficiente de cada vendedor.</p></div>
    <div class="mnav"><button id="mPrev">‹</button><div class="lbl" id="mLbl">—</div><button id="mNext">›</button></div>
    <div id="lista"><div class="empty">Cargando…</div></div>
  </div></div>
  <nav class="botnav"></nav>
</div>

<div class="ov" id="ov"><div class="sheet"><div style="display:flex;align-items:center;margin-bottom:10px"><b id="ovTit" style="font-size:16px;flex:1"></b><button onclick="document.getElementById('ov').classList.remove('open')" style="background:none;border:0;font-size:20px;cursor:pointer;color:#6d7d85">×</button></div><div id="ovBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supervisor-nav.js"></script>
<script>
const HUB={url:"https://xqhyemccbwmzxqzkrtwa.supabase.co",key:"sb_publishable_OOHT_QlNmec_NabERLw5YQ_DexGMwvc"};
const FN='/.netlify/functions/agenda-eficiente';
let hub, TOKEN, MES=new Date().toISOString().slice(0,7);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ini=n=>(String(n||'S').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('')||'S').toUpperCase();
function toast(m,e){const t=$('toast');t.textContent=m;t.className='toast show'+(e?' err':'');setTimeout(()=>t.className='toast',2400);}
const bmap={borrador:['b-bor','Borrador'],enviada:['b-env','Para revisar'],aprobada:['b-apr','Aprobada'],cambios:['b-cam','Cambios pedidos']};

async function cargar(){
  const [y,m]=MES.split('-').map(Number); $('mLbl').textContent=MESES[m-1]+' '+y;
  try{
    const r=await fetch(FN+'?vista=equipo&mes='+MES,{headers:{Authorization:'Bearer '+TOKEN}});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||'Error');
    const eq=d.equipo||[];
    if(!eq.length){ $('lista').innerHTML='<div class="empty">No hay vendedores en tu equipo.</div>'; return; }
    $('lista').innerHTML=eq.map(v=>{
      const b=bmap[v.estado]||bmap.borrador;
      const pct=v.visitas?Math.round((v.visitadas/v.visitas)*100):0;
      return `<div class="vcard">
        <div class="vtop"><span class="vav">${ini(v.nombre)}</span><div><div class="vn">${esc(v.nombre)}</div><div class="vs">Cód ${esc(v.codigo)} · ${v.visitas} visitas planificadas</div></div><span class="badge ${b[0]}">${b[1]}</span></div>
        ${v.visitas?`<div class="prog"><i style="width:${pct}%"></i></div><div class="vs">${v.visitadas} de ${v.visitas} visitas realizadas (${pct}%)${v.no_visitadas?` · <span style="color:var(--danger)">${v.no_visitadas} no realizadas</span>`:''}</div>`:'<div class="vs">Todavía no cargó visitas este mes.</div>'}
        <div class="acts">
          <button class="btn ghost" data-ver="${esc(v.codigo)}" data-nom="${esc(v.nombre)}">Ver agenda</button>
          <button class="btn green" data-apr="${esc(v.codigo)}">✓ Aprobar</button>
          <button class="btn amber" data-cam="${esc(v.codigo)}">Pedir cambios</button>
        </div>
        ${v.nota?`<div class="vs" style="margin-top:8px;color:var(--danger)">Nota que le dejaste: ${esc(v.nota)}</div>`:''}
      </div>`;
    }).join('');
    $('lista').querySelectorAll('[data-apr]').forEach(b=>b.onclick=()=>revisar(b.dataset.apr,'aprobada'));
    $('lista').querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>revisar(b.dataset.cam,'cambios'));
    $('lista').querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verAgenda(b.dataset.ver,b.dataset.nom));
  }catch(e){ $('lista').innerHTML='<div class="empty">'+esc(e.message)+'</div>'; }
}
async function revisar(vend,estado){
  let nota=null;
  if(estado==='cambios'){ nota=prompt('¿Qué cambios necesita? (se lo avisamos al vendedor)'); if(nota===null) return; }
  try{
    await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'revisar',vendedor:vend,mes:MES,estado,nota})});
    toast(estado==='aprobada'?'Agenda aprobada ✓':'Le pediste cambios'); cargar();
  }catch(e){ toast('No se pudo',true); }
}
let VER={cod:'',nom:'',plan:[],byF:{},mi:new Set(),sel:null};
async function verAgenda(vend,nom){
  VER={cod:vend,nom,plan:[],byF:{},mi:new Set(),sel:null};
  $('ovTit').textContent='Agenda de '+nom; $('ovBody').innerHTML='<div class="empty">Cargando…</div>'; $('ov').classList.add('open');
  try{
    const [y,m]=MES.split('-').map(Number);
    const ini=MES+'-01', fin=MES+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');
    const [rp,rm]=await Promise.all([
      fetch(FN+'?vista=plan&vendedor='+encodeURIComponent(vend)+'&mes='+MES,{headers:{Authorization:'Bearer '+TOKEN}}),
      fetch(FN+'?vista=mi-agenda&desde='+ini+'&hasta='+fin,{headers:{Authorization:'Bearer '+TOKEN}})
    ]);
    const dp=await rp.json(); VER.plan=dp.plan||[];
    VER.plan.forEach(p=>{(VER.byF[p.fecha]=VER.byF[p.fecha]||[]).push(p);});
    const dm=await rm.json(); (dm.items||[]).forEach(it=>VER.mi.add(miKey(it.fecha,it.cliente_codigo,it.vendedor)));
    if(!VER.plan.length){ $('ovBody').innerHTML='<div class="empty">Sin visitas cargadas este mes.</div>'; return; }
    pintaVer();
  }catch(e){ $('ovBody').innerHTML='<div class="empty">Error</div>'; }
}
const miKey=(f,c,v)=>f+'|'+(c||'')+'|'+(v||'');
function pintaVer(){
  const [y,m]=MES.split('-').map(Number);
  const first=new Date(y,m-1,1), off=(first.getDay()+6)%7, dias=new Date(y,m,0).getDate();
  let cal='<div class="cal">'+['L','M','M','J','V','S','D'].map(d=>`<div class="h">${d}</div>`).join('')+'</div><div class="cal">';
  for(let i=0;i<off;i++) cal+='<div class="cday mut"></div>';
  for(let d=1;d<=dias;d++){ const iso=MES+'-'+String(d).padStart(2,'0'); const n=(VER.byF[iso]||[]).length;
    cal+=`<div class="cday ${n?'tiene':''} ${VER.sel===iso?'sel':''}" data-f="${iso}"><div class="n">${d}</div>${n?`<span class="cnt">${n}</span>`:''}</div>`; }
  cal+='</div>';
  let det='';
  if(VER.sel){
    const [yy,mm,dd]=VER.sel.split('-').map(Number);
    const list=VER.byF[VER.sel]||[];
    det='<div style="font-weight:800;font-size:14px;margin:6px 0 8px">'+dd+' de '+MESES[mm-1]+'</div>';
    det+= list.length? list.map(p=>{
      const key=miKey(p.fecha,p.cliente_codigo,VER.cod); const added=VER.mi.has(key);
      const estHtml = p.estado==='visitado' ? ' <span style="font-size:11px;color:var(--green-d)">✓'+(p.duracion_min!=null?' '+p.duracion_min+'m':'')+'</span>'
        : p.estado==='no_visitada' ? ' <span style="font-size:11px;color:var(--danger)">✕ no realizada</span>' : '';
      const motivo = (p.estado==='no_visitada'&&p.motivo)?`<div style="font-size:11px;color:var(--danger);margin-top:2px">Motivo: ${esc(p.motivo)}</div>`:'';
      return `<div class="cli ${p.estado==='visitado'?'ok':''}"><span class="dot" style="${p.estado==='no_visitada'?'background:var(--danger)':''}"></span><div style="flex:1"><div>${esc(p.cliente_nombre||('Cliente '+p.cliente_codigo))}${estHtml}</div>${motivo}</div>`
        + (added?`<button class="addb done">✓ En mi agenda</button>`:`<button class="addb" data-add="${esc(p.cliente_codigo)}" data-nom="${esc(p.cliente_nombre||'')}" data-f="${p.fecha}">+ Mi agenda</button>`)
        + `</div>`;
    }).join('') : '<div class="empty">Sin visitas ese día.</div>';
  } else {
    det='<div class="empty" style="padding:14px">Tocá un día para ver las visitas y sumarlas a tu agenda.</div>';
  }
  $('ovBody').innerHTML=cal+det;
  $('ovBody').querySelectorAll('.cday[data-f]').forEach(el=>el.onclick=()=>{ VER.sel=el.dataset.f; pintaVer(); });
  $('ovBody').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>agregarMi(b.dataset.f,b.dataset.add,b.dataset.nom));
}
async function agregarMi(fecha,cod,nom){
  try{
    await fetch(FN,{method:'POST',headers:{Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({accion:'mi-agenda-add',fecha,cliente_codigo:cod,cliente_nombre:nom,vendedor:VER.cod,vendedor_nombre:VER.nom})});
    VER.mi.add(miKey(fecha,cod,VER.cod)); pintaVer(); toast('Agregada a tu agenda (privado) ✓');
  }catch(e){ toast('No se pudo',true); }
}
$('ov').onclick=e=>{ if(e.target.id==='ov') $('ov').classList.remove('open'); };
$('mPrev').onclick=()=>{ let[y,m]=MES.split('-').map(Number); m--; if(m<1){m=12;y--;} MES=y+'-'+String(m).padStart(2,'0'); cargar(); };
$('mNext').onclick=()=>{ let[y,m]=MES.split('-').map(Number); m++; if(m>12){m=1;y++;} MES=y+'-'+String(m).padStart(2,'0'); cargar(); };

(async()=>{
  hub=supabase.createClient(HUB.url,HUB.key);
  const {data:{session}}=await hub.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  TOKEN=session.access_token;
  const {data:u}=await hub.from('usuarios').select('nombre,es_supervisor').eq('id',session.user.id).maybeSingle();
  if(u&&!u.es_supervisor){ location.href='inicio.html'; return; }
  if(u&&u.nombre){ $('uName').textContent=u.nombre; $('avSb').textContent=ini(u.nombre); }
  $('logout').onclick=async()=>{ if(confirm('¿Cerrar sesión?')){ try{await hub.auth.signOut();}catch(e){} location.href='index.html'; } };
  cargar();
})();
</script>
<script src="assets/notif.js"></script>
</body>
</html>
